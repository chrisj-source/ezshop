<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform — Easy Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#131c2e;--surf:#1c2740;--text:#e7eaf2;--muted:#aab3c4;--dim:#7f8ca4;
          --line:#2c3a55;--whisper:rgba(231,234,242,.08);--acc:#d9a441;--acc2:#e5bf68;
          --move:#7f9dc4;--stopped:#d07e6f;--done:#6fae8c;--font:'Inter',system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
         display:flex;flex-direction:column;overflow:hidden; }
  a { color:var(--acc2);text-decoration:none; } a:hover { color:var(--acc); }
  button { font-family:var(--font);cursor:pointer; }
  :focus-visible { outline:2px solid var(--acc);outline-offset:2px; }
  .bar { display:flex;align-items:center;gap:16px;height:52px;padding:0 18px;background:var(--surf);flex:none; }
  .mark { width:22px;height:22px;border:1px solid var(--acc);border-radius:4px;display:grid;
          place-items:center;font:600 9.5px var(--font);color:var(--acc); }
  .word { font:600 13px var(--font);letter-spacing:.13em;text-transform:uppercase; }
  .vr { width:1px;height:18px;background:var(--line); }
  .tag { font:500 12px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--acc2); }
  .main { flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr; }
  .list { border-right:1px solid var(--whisper);overflow-y:auto; }
  .item { display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;
          border-bottom:1px solid var(--whisper);border-left:2px solid transparent; }
  .item:hover { background:var(--whisper); }
  .item.sel { background:var(--whisper);border-left-color:var(--acc); }
  .dot { width:8px;height:8px;border-radius:50%;flex:none; }
  .nm { font:500 12.5px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .sb { font:400 10px var(--font);color:var(--dim);margin-top:2px; }
  .pane { overflow-y:auto;padding:0 0 30px; }
  .sec { font:600 8.5px var(--font);letter-spacing:.13em;text-transform:uppercase;
         color:var(--acc2);padding:20px 18px 9px; }
  .fhead { display:flex;align-items:center;gap:12px;padding:16px 18px 14px;
           border-bottom:1px solid var(--whisper); }
  .pill { font:500 8.5px var(--font);letter-spacing:.09em;text-transform:uppercase;
          padding:3px 7px;border-radius:3px;white-space:nowrap; }
  .btn { font:500 11.5px var(--font);border-radius:4px;padding:7px 12px;background:transparent; }
  .frow { display:grid;grid-template-columns:3px 1fr 96px;gap:12px;align-items:center;
          padding:11px 13px;border-bottom:1px solid var(--whisper); }
  .edge { width:3px;height:22px;border-radius:1px; }
  .ft { font:500 12px var(--font); }
  .fd { font:400 10.5px var(--font);color:var(--dim);margin-top:2px;line-height:1.45; }
  .toggle { font:500 10px var(--font);text-align:center;padding:4px 0;border-radius:3px;
            border:1px solid var(--line);color:var(--dim);background:transparent;width:100%; }
  .toggle.on { border-color:var(--acc);color:var(--text); }
  .toggle:disabled { border-style:dashed;cursor:default;opacity:.6; }
  .empty { padding:60px 20px;text-align:center;color:var(--dim);font:400 13px var(--font); }
  .msg { font:400 11.5px var(--font);padding:9px 12px;border-radius:4px;margin:12px 18px;display:none; }
  .msg.err { display:block;color:var(--stopped);border:1px solid var(--stopped); }
</style>
</head>
<body>

<div class="bar">
  <div style="display:flex;align-items:center;gap:9px"><div class="mark">ES</div><div class="word">Easy Shop</div></div>
  <div class="vr"></div>
  <div class="tag">Platform</div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:12px">
    <a href="/board.html" style="font:400 11px var(--font);color:var(--dim)">My shop</a>
    <div id="who" style="font:400 11px var(--font);color:var(--dim)">—</div>
    <button class="btn" id="signout" style="border:1px solid var(--line);color:var(--dim);padding:5px 10px">Sign out</button>
  </div>
</div>

<div id="rootbar" hidden style="background:rgba(208,126,111,.16);border-bottom:1px solid rgba(208,126,111,.5);
  padding:9px 16px;font:500 11.5px var(--font);color:#f0bdb2;display:flex;align-items:center;gap:10px">
  <span>Signed in as <strong>root</strong> — the break-glass account. Every sign-in is in the platform log.</span>
  <span style="margin-left:auto;color:#f0bdb2;opacity:.8">Set ROOT_ENABLED=0 and restart when you are done.</span>
</div>

<div class="main">
  <div class="list" id="list">
    <div style="padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="newShop" style="border:1px solid var(--acc);color:var(--acc);padding:5px 10px">New shop</button>
      <button class="btn" id="demoBtn" style="border:1px solid var(--line);color:var(--dim);padding:5px 10px">Demo</button>
      <button class="btn" id="peopleBtn" hidden style="border:1px solid var(--line);color:var(--dim);padding:5px 10px">Platform people</button>
    </div>
    <div id="listrows"></div>
  </div>
  <div class="pane" id="pane"><div class="empty">Loading…</div></div>
</div>

<script>
(function () {
  var COS = [], SEL = null;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function api(p, o) {
    return fetch(p, Object.assign({ headers: { 'content-type': 'application/json' } }, o || {}))
      .then(function (r) {
        if (r.status === 401) { location.href = '/'; throw new Error('out'); }
        return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); return j; });
      });
  }
  var TONE = { active: 'var(--done)', trial: 'var(--move)', suspended: 'var(--stopped)' };

  var PLAT = null;

  api('/api/me').then(function (me) {
    if (!me.isPlatformOwner) { location.href = '/board.html'; return; }
    $('who').textContent = me.user.name + ' · platform';
    return api('/api/platform/me');
  }).then(function (p) {
    if (!p) return;
    PLAT = p;
    /* Root is the account nobody uses until something has gone wrong, so it
       says so on every screen for as long as the session lasts. */
    $('rootbar').hidden = p.role !== 'root';
    $('peopleBtn').hidden = p.role !== 'root';
    $('who').textContent = $('who').textContent.replace('platform', p.role === 'root' ? 'ROOT' : 'platform admin');
    return api('/api/platform/companies');
  }).then(function (d) {
    if (!d) return;
    COS = d.companies;
    renderList();
    if (COS.length) select(COS[0].id);
    else $('pane').innerHTML = '<div class="empty">No companies yet.</div>';
  }).catch(function (e) { if (e.message !== 'out') console.error(e); });

  /* ---------------------------------------------------------------- panels
     Three things that are not a company: making one, the demo shop, and who
     else holds the platform. Each takes over the right-hand pane rather than
     opening a dialog — there is nothing to lose by leaving one. */

  function paneMsg(t, bad) {
    var el = $('paneMsg');
    if (!el) return;
    el.innerHTML = esc(t);
    el.style.color = bad ? 'var(--stopped)' : 'var(--done)';
  }

  function field(id, label, extra) {
    return '<label style="display:block;margin-bottom:10px">' +
      '<span style="display:block;font:400 10.5px var(--font);color:var(--dim);margin-bottom:4px">' +
      esc(label) + '</span>' +
      '<input id="' + id + '" ' + (extra || '') +
      ' style="width:100%;padding:7px 9px;font:400 12.5px var(--font);color:var(--text);' +
      'background:var(--surf);border:1px solid var(--line);border-radius:4px"></label>';
  }

  function newShopPane() {
    SEL = null;
    renderList();
    $('pane').innerHTML =
      '<div style="padding:18px;max-width:520px">' +
      '<div style="font:500 15px var(--font);margin-bottom:4px">New shop</div>' +
      '<div style="font:400 11.5px/1.6 var(--font);color:var(--dim);margin-bottom:16px">' +
      'Provisions a database, seeds the board from the shop type, and creates the owner. ' +
      'The owner\u2019s first password is shown once here and must be changed at first sign-in.</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">' +
        field('nsName', 'Shop name') +
        field('nsSlug', 'Slug \u2014 lowercase, becomes the database name') +
        field('nsCity', 'City') +
        field('nsState', 'State', 'maxlength="2"') +
        '<label style="display:block;margin-bottom:10px">' +
          '<span style="display:block;font:400 10.5px var(--font);color:var(--dim);margin-bottom:4px">Shop type</span>' +
          '<select id="nsType" style="width:100%;padding:7px 9px;font:400 12.5px var(--font);color:var(--text);background:var(--surf);border:1px solid var(--line);border-radius:4px">' +
          '<option value="both">Collision and PDR</option><option value="collision">Collision</option>' +
          '<option value="pdr">PDR and hail</option><option value="detail">Detail only</option></select></label>' +
        field('nsSeats', 'Seats', 'type="number" value="10"') +
        field('nsOwner', 'Owner name') +
        field('nsEmail', 'Owner email', 'type="email"') +
      '</div>' +
      '<div style="display:flex;gap:9px;align-items:center;margin-top:10px">' +
        '<button class="btn" id="nsGo" style="border:1px solid var(--acc);color:var(--acc);padding:7px 12px">Create the shop</button>' +
        '<div id="paneMsg" style="font:400 11.5px var(--font)"></div>' +
      '</div></div>';

    $('nsGo').addEventListener('click', function () {
      var btn = this;
      btn.disabled = true;
      api('/api/platform/companies', {
        method: 'POST',
        body: JSON.stringify({
          name: $('nsName').value.trim(),
          slug: $('nsSlug').value.trim().toLowerCase(),
          city: $('nsCity').value.trim(),
          state: $('nsState').value.trim().toUpperCase(),
          shopType: $('nsType').value,
          seats: Number($('nsSeats').value) || 10,
          ownerName: $('nsOwner').value.trim(),
          ownerEmail: $('nsEmail').value.trim()
        })
      }).then(function (r) {
        btn.disabled = false;
        paneMsg('Created. ' + (r.tempPassword
          ? 'Owner password: ' + r.tempPassword + ' \u2014 shown once.'
          : '') + ' ' + r.statusCount + ' statuses seeded.');
        return api('/api/platform/companies').then(function (d) {
          COS = d.companies; renderList();
        });
      }).catch(function (e) { btn.disabled = false; paneMsg(e.message, true); });
    });
  }

  function demoPane() {
    SEL = null;
    renderList();
    var d = PLAT && PLAT.demo;
    $('pane').innerHTML =
      '<div style="padding:18px;max-width:560px">' +
      '<div style="font:500 15px var(--font);margin-bottom:4px">The demo shop</div>' +
      '<div style="font:400 11.5px/1.6 var(--font);color:var(--dim);margin-bottom:16px">' +
      (d
        ? esc(d.name) + ' \u2014 a real shop on this box, seeded with work at every stage. ' +
          'It goes back to the seed at 2am Central every night, and whenever you press ' +
          'Reset now. Anything a visitor did to it goes with the reset.' +
          (d.resetAt ? ' Last reset ' + esc(String(d.resetAt).replace('T', ' ').slice(0, 16)) + '.' : '')
        : 'There is no demo shop on this box yet. Reset now will build it \u2014 ' +
          'Bob\u2019s Body Barn, Testingville, Texas.') +
      '</div>' +
      '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px">' +
        '<button class="btn" id="dmReset" style="border:1px solid var(--acc);color:var(--acc);padding:7px 12px">Reset now</button>' +
        '<button class="btn" id="dmPw" style="border:1px solid var(--line);color:var(--dim);padding:7px 12px">New Tester password</button>' +
      '</div>' +
      '<div style="font:400 11px/1.6 var(--font);color:var(--dim)">The shared login is ' +
      '<strong style="color:var(--text)">tester@bobsbodybarn.demo</strong>. Change its password ' +
      'before each demo \u2014 the new one is shown once, here.</div>' +
      '<div id="paneMsg" style="font:400 12px var(--font);margin-top:12px"></div></div>';

    $('dmReset').addEventListener('click', function () {
      if (!confirm('Put the demo shop back to its seed? Anything anyone did to it is lost.')) return;
      var btn = this;
      btn.disabled = true;
      paneMsg('Working\u2026');
      api('/api/platform/demo/reset', { method: 'POST' }).then(function (r) {
        btn.disabled = false;
        paneMsg(r.note + (r.testerPassword
          ? ' Tester password: ' + r.testerPassword + ' \u2014 shown once.' : ''));
      }).catch(function (e) { btn.disabled = false; paneMsg(e.message, true); });
    });

    $('dmPw').addEventListener('click', function () {
      var btn = this;
      btn.disabled = true;
      api('/api/platform/demo/tester-password', { method: 'POST', body: JSON.stringify({}) })
        .then(function (r) {
          btn.disabled = false;
          paneMsg('Tester password is now ' + r.password + ' \u2014 write it down, it is shown once.');
        }).catch(function (e) { btn.disabled = false; paneMsg(e.message, true); });
    });
  }

  function peoplePane() {
    SEL = null;
    renderList();
    $('pane').innerHTML = '<div class="empty">Loading\u2026</div>';
    api('/api/platform/people').then(function (d) {
      $('pane').innerHTML =
        '<div style="padding:18px;max-width:620px">' +
        '<div style="font:500 15px var(--font);margin-bottom:4px">Platform people</div>' +
        '<div style="font:400 11.5px/1.6 var(--font);color:var(--dim);margin-bottom:16px">' +
        'Admins run the platform day to day. They cannot see this screen, and they cannot ' +
        'delete a shop \u2014 only suspend one. Root cannot be removed or demoted, by anyone, ' +
        'including itself.</div>' +
        d.people.map(function (p) {
          return '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--whisper)">' +
            '<div style="flex:1;min-width:0">' +
              '<div style="font:500 12.5px var(--font)">' + esc(p.name) +
              (p.role === 'root'
                ? ' <span style="font:500 9px var(--font);letter-spacing:.08em;text-transform:uppercase;color:#f0bdb2;border:1px solid rgba(208,126,111,.5);border-radius:3px;padding:1px 5px">root</span>'
                : '') + '</div>' +
              '<div style="font:400 11px var(--font);color:var(--dim)">' + esc(p.email || 'no email') +
              (p.lastLogin ? ' \u00b7 last in ' + esc(String(p.lastLogin).replace('T', ' ').slice(0, 16)) : ' \u00b7 never signed in') +
              '</div></div>' +
            '<button class="btn" data-pw="' + p.id + '" style="border:1px solid var(--line);color:var(--dim);padding:4px 9px;font-size:10.5px">New password</button>' +
            (p.locked ? '' :
              '<button class="btn" data-rm="' + p.id + '" style="border:1px solid var(--stopped);color:var(--stopped);padding:4px 9px;font-size:10.5px">Remove</button>') +
          '</div>';
        }).join('') +
        '<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">' +
        '<div style="font:500 12.5px var(--font);margin-bottom:10px">Add a platform admin</div>' +
        field('paName', 'Name') + field('paEmail', 'Email', 'type="email"') +
        '<div style="display:flex;gap:9px;align-items:center">' +
        '<button class="btn" id="paGo" style="border:1px solid var(--acc);color:var(--acc);padding:7px 12px">Add</button>' +
        '<div id="paneMsg" style="font:400 11.5px var(--font)"></div></div></div></div>';

      $('paGo').addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        api('/api/platform/people', {
          method: 'POST',
          body: JSON.stringify({ name: $('paName').value.trim(), email: $('paEmail').value.trim() })
        }).then(function (r) {
          btn.disabled = false;
          paneMsg(r.note + (r.tempPassword ? ' Password: ' + r.tempPassword : ''));
          setTimeout(peoplePane, 1800);
        }).catch(function (e) { btn.disabled = false; paneMsg(e.message, true); });
      });

      Array.prototype.forEach.call($('pane').querySelectorAll('[data-pw]'), function (b) {
        b.addEventListener('click', function () {
          api('/api/platform/people/' + b.dataset.pw + '/password', {
            method: 'POST', body: JSON.stringify({})
          }).then(function (r) { paneMsg('New password: ' + r.password + ' \u2014 ' + r.note); })
            .catch(function (e) { paneMsg(e.message, true); });
        });
      });

      Array.prototype.forEach.call($('pane').querySelectorAll('[data-rm]'), function (b) {
        b.addEventListener('click', function () {
          if (!confirm('Take the platform off this person? They are signed out immediately. ' +
            'Any shop access they have is untouched.')) return;
          api('/api/platform/people/' + b.dataset.rm, { method: 'DELETE' })
            .then(function (r) { paneMsg(r.note); setTimeout(peoplePane, 1200); })
            .catch(function (e) { paneMsg(e.message, true); });
        });
      });
    }).catch(function (e) {
      $('pane').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }

  $('newShop').addEventListener('click', newShopPane);
  $('demoBtn').addEventListener('click', demoPane);
  $('peopleBtn').addEventListener('click', peoplePane);

  function renderList() {
    $('listrows').innerHTML = COS.map(function (c) {
      return '<div class="item' + (c.id === SEL ? ' sel' : '') + '" data-id="' + c.id + '">' +
        '<div class="dot" style="background:' + (TONE[c.status] || 'var(--dim)') + '"></div>' +
        '<div style="min-width:0;flex:1"><div class="nm">' + esc(c.name) + '</div>' +
        '<div class="sb">' + esc([c.city, c.plan_code, c.shop_type].filter(Boolean).join(' · ')) + '</div></div>' +
        '</div>';
    }).join('');
    Array.prototype.forEach.call($('list').children, function (el) {
      el.addEventListener('click', function () { select(Number(el.dataset.id)); });
    });
  }

  function select(id) {
    SEL = id;
    renderList();
    $('pane').innerHTML = '<div class="empty">Loading…</div>';
    api('/api/platform/companies/' + id).then(renderPane);
  }

  function renderPane(d) {
    var c = d.company, h = [];
    var suspended = c.status === 'suspended';

    h.push('<div class="fhead"><div style="min-width:0">' +
      '<div style="display:flex;align-items:baseline;gap:9px">' +
      '<div style="font:500 16px var(--font)">' + esc(c.name) + '</div>' +
      '<span class="pill" style="color:' + TONE[c.status] + ';border:1px solid ' + TONE[c.status] + '">' + esc(c.status) + '</span>' +
      '</div><div class="sb">' + esc([c.city, c.db_name, c.owner_email].filter(Boolean).join(' · ')) + '</div>' +
      '</div><div style="margin-left:auto;display:flex;gap:8px">' +
      '<button class="btn" id="enter" style="border:1px solid var(--line);color:var(--muted)">Open this company</button>' +
      '<button class="btn" id="susp" style="border:1px solid ' + (suspended ? 'var(--done);color:var(--done)' : 'var(--stopped);color:var(--stopped)') + '">' +
      (suspended ? 'Switch back on' : 'Switch off') + '</button></div></div>');

    h.push('<div class="msg" id="pmsg"></div>');

    h.push('<div class="sec">Account</div>');
    h.push('<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 18px">' +
      kv('Plan', c.plan_code) + kv('Shop type', c.shop_type) + kv('Seats', c.seats) +
      kv('Users', d.users.length) + '</div>');

    var onCount = d.features.filter(function (f) { return f.is_core || (f.is_available && f.enabled); }).length;
    h.push('<div class="sec">Features <span style="color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0">' +
      onCount + ' of ' + d.features.length + ' on</span></div>');
    h.push('<div style="margin:0 18px;border:1px solid var(--line);border-radius:6px;overflow:hidden">');
    d.features.forEach(function (f) {
      var dep = f.requires_key ? d.features.filter(function (x) { return x.feature_key === f.requires_key; })[0] : null;
      var depOff = dep && !(dep.is_core || (dep.is_available && dep.enabled));
      var on = f.is_core ? true : (f.is_available && f.enabled === 1 && !depOff);
      var label = f.is_core ? 'Always on' : !f.is_available ? 'Not yet' : on ? 'On' : 'Off';
      var note = !f.is_available ? f.description + ' Not available yet.'
               : depOff ? f.description + ' Off because ' + dep.label + ' is off.' : f.description;
      h.push('<div class="frow"' + (!f.is_available || depOff ? ' style="opacity:.55"' : '') + '>' +
        '<div class="edge" style="background:' + (on ? 'var(--done)' : 'var(--line)') + '"></div>' +
        '<div><div class="ft">' + esc(f.label) + '</div><div class="fd">' + esc(note) + '</div></div>' +
        '<button class="toggle' + (on ? ' on' : '') + '" data-key="' + esc(f.feature_key) + '" data-on="' + (f.enabled ? 1 : 0) + '"' +
        (f.is_core || !f.is_available ? ' disabled' : '') + '>' + label + '</button></div>');
    });
    h.push('</div>');

    h.push('<div class="sec">People</div><div style="padding:0 18px">');
    d.users.forEach(function (u) {
      h.push('<div style="padding:8px 0;border-top:1px solid var(--whisper)">' +
        '<div style="font:400 12px var(--font)">' + esc(u.name) + ' <span style="color:var(--dim)">· ' + esc(u.role) + '</span></div>' +
        '<div class="sb">' + esc(u.email || 'no email') + (u.last_login_at ? ' · last in ' + new Date(u.last_login_at).toLocaleDateString() : ' · never signed in') + '</div></div>');
    });
    h.push('</div>');

    $('pane').innerHTML = h.join('');

    $('enter').addEventListener('click', function () {
      api('/api/platform/companies/' + c.id + '/enter', { method: 'POST' })
        .then(function () { location.href = '/board.html'; });
    });

    $('susp').addEventListener('click', function () {
      var next = suspended ? 'active' : 'suspended';
      if (!suspended && !confirm('Switch off ' + c.name + '? Everyone there is signed out immediately. No data is deleted.')) return;
      api('/api/platform/companies/' + c.id + '/status', {
        method: 'POST', body: JSON.stringify({ status: next })
      }).then(function () {
        return api('/api/platform/companies').then(function (d2) { COS = d2.companies; select(c.id); });
      }).catch(showErr);
    });

    Array.prototype.forEach.call($('pane').querySelectorAll('.toggle:not([disabled])'), function (b) {
      b.addEventListener('click', function () {
        api('/api/platform/companies/' + c.id + '/features/' + b.dataset.key, {
          method: 'POST', body: JSON.stringify({ enabled: b.dataset.on !== '1' })
        }).then(function () { select(c.id); }).catch(showErr);
      });
    });
  }

  function kv(k, v) {
    return '<div><div style="font:600 8.5px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--acc2)">' +
      esc(k) + '</div><div style="font:400 13px var(--font);margin-top:5px">' + esc(v) + '</div></div>';
  }

  function showErr(e) {
    var m = $('pmsg'); if (!m) return alert(e.message);
    m.textContent = e.message; m.className = 'msg err';
  }

  $('signout').addEventListener('click', function () {
    api('/api/auth/logout', { method: 'POST' }).then(function () { location.href = '/'; });
  });
})();
</script>
</body>
</html>
