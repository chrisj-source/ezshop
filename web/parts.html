<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2740">
<title>Parts — Easy Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=8">
<style>
  .legend { display:flex; align-items:center; gap:14px; margin-left:8px; }
  .legitem { display:flex; align-items:center; gap:6px; font:400 10.5px var(--font); color:var(--dim); }
  .legswatch { width:14px; height:6px; border-radius:1px; }

  /* RO-level grid, then part lines nested under it. */
  .pgrid {
    display:grid;
    grid-template-columns:16px 116px minmax(180px,236px) minmax(200px,1fr) 92px 84px 108px 104px 112px;
    gap:12px; align-items:center; padding:0 18px; min-width:1100px;
  }
  main { overflow-x:auto; }
  .phead { height:32px; position:sticky; top:0; z-index:2; background:var(--surf); }
  .phead > div {
    font:600 8.5px var(--font); letter-spacing:.12em; text-transform:uppercase; color:var(--acc2);
  }
  .prow { height:56px; border-bottom:1px solid var(--whisper); cursor:pointer; }
  .prow:hover { background:var(--surf); }
  .caret { font:400 9px var(--font); color:var(--dim); transition:transform .12s ease; }
  .caret.open { transform:rotate(90deg); color:var(--acc); }

  .grouphead {
    display:flex; align-items:center; gap:9px; padding:8px 18px; background:var(--surf);
    border-top:1px solid var(--whisper); border-bottom:1px solid var(--whisper);
  }
  .gdot { width:8px; height:8px; border-radius:50%; flex:none; }
  .gname { font:500 12px var(--font); letter-spacing:.06em; text-transform:uppercase; }

  .segs { display:flex; gap:3px; flex:1; max-width:170px; }
  .segbar { height:6px; border-radius:1px; }

  /* Nested part lines. */
  .lines {
    background:rgba(231,234,242,.03); border-bottom:1px solid var(--whisper);
    overflow-x:auto;
  }
  .lgrid {
    display:grid;
    grid-template-columns:26px minmax(160px,1fr) 108px 72px 58px 132px 92px 104px 168px;
    gap:12px; align-items:center; padding:0 18px 0 34px; height:44px;
    border-bottom:1px solid var(--whisper); min-width:1080px;
  }
  .lgrid:last-child { border-bottom:none; }
  .lhead > div {
    font:600 8px var(--font); letter-spacing:.11em; text-transform:uppercase; color:var(--dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lhead { height:30px; }
  .lstate {
    justify-self:start; font:500 8.5px var(--font); letter-spacing:.08em; text-transform:uppercase;
    padding:3px 7px; border-radius:3px; white-space:nowrap;
  }
  .linebtn {
    font:400 10px var(--font); padding:4px 8px; border-radius:3px; background:transparent;
    border:1px solid var(--line); color:var(--muted); white-space:nowrap; flex:none;
  }
  .linebtn:hover { border-color:var(--acc); color:var(--acc); }
  /* The RO number is a way into the file — the desk is often one field short. */
  .rolink { color:var(--acc); text-decoration:none; border-bottom:1px dashed var(--acc); }
  .rolink:hover { color:var(--text); border-bottom-color:var(--text); }
  .locked { padding:64px 18px; display:flex; flex-direction:column; align-items:center; gap:8px; }

  @media (max-width:1100px) {
    .pgrid {
      grid-template-columns:16px 108px minmax(140px,1fr) 92px 84px 104px;
      min-width:0;
    }
    .pgrid > .hide-md, .prow > .hide-md { display:none; }
    /* Six visible cells into six tracks: .hide-md removes three of the nine. */
    .lgrid {
      grid-template-columns:22px minmax(130px,1fr) 52px 92px 74px 88px 150px;
      padding-left:24px; min-width:0;
    }
    .lgrid > .hide-md { display:none; }
    main { overflow-x:visible; }
    .lines { overflow-x:visible; }
  }

  /* ------------------------------------------------------------ phone
     Below 760 the nine-column table has no honest form. Each file becomes a
     card and each part line a stacked card; no sideways scroll anywhere. */
  @media (max-width:760px) {
    .phead { display:none; }
    .pgrid { padding:0; gap:0; }
    .grouphead { padding:8px 14px; }
    .grouphead .sub:last-child { display:none; }

    .prow[data-ro] {
      display:grid; height:auto; padding:11px 14px 12px; gap:5px 10px;
      grid-template-columns:14px minmax(0,1fr) auto; align-items:start;
      grid-template-areas:
        "car ro    days"
        "car veh   money"
        "car stat  stat";
    }
    .prow[data-ro] > div:nth-child(1) { grid-area:car; align-self:center; }
    .prow[data-ro] > div:nth-child(2) { grid-area:ro; }
    .prow[data-ro] > div:nth-child(3) { grid-area:veh; }
    .prow[data-ro] > div:nth-child(4) { grid-area:stat; }
    .prow[data-ro] > div:nth-child(6) { grid-area:days; }
    .prow[data-ro] > div:nth-child(6) > div { justify-content:flex-end; }
    .prow[data-ro] > div:nth-child(8) { grid-area:money; align-self:end; }
    .prow[data-ro] > div:nth-child(4) > div:first-child { flex-wrap:wrap; }
    .prow[data-ro] .segs { max-width:none; min-width:80px; }

    /* Part lines: description, then a meta run, then the actions on their own
       row at a thumb-sized target. Part number and type come back — the parts
       desk needs them more on a phone than at a screen. */
    .lhead { display:none; }
    .lines { padding:0 0 4px; }
    .lines > .row { padding:8px 14px 10px; }
    .lgrid {
      display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px;
      height:auto; padding:10px 14px 11px; min-width:0;
    }
    .lgrid > .hide-md { display:block; }
    .lgrid > div:nth-child(1) { flex:none; min-width:14px; }
    .lgrid > div:nth-child(2) { flex:1 1 auto; min-width:0; white-space:normal; }
    .lgrid > div:nth-child(8) { margin-left:auto; }
    .lgrid > div:nth-child(9) { flex:1 1 100%; flex-wrap:wrap; margin-top:2px; }
    .lgrid .linebtn { min-height:44px; padding:0 14px; font-size:11.5px; }
  }

  /* ------------------------------------------------------------------ one file
     A file's parts lines, as a modal over the list. It replaced an expansion
     under the row: seventeen lines pushed every other file off the screen, and
     what the desk came to read arrived flat and undifferentiated. */
  /* The costs drawer is opened from inside the file modal, so it has to sit
     above it — the shared chrome puts a drawer at 21, which is under the modal's
     70 and left Costs rendering behind the thing that opened it. Raised here
     rather than in shell.css: this is the only screen with a full-screen modal
     that opens a drawer. */
  .scrim.open { z-index:80; }
  .drawer { z-index:81; }

  .fmscrim { position:fixed; inset:0; background:rgba(6,10,18,.66); z-index:70; }
  .fmscrim[hidden], .fmodal[hidden] { display:none; }
  .fmodal {
    position:fixed; z-index:71; inset:26px; display:flex; flex-direction:column;
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 24px 64px rgba(0,0,0,.5); overflow:hidden;
  }
  .fmhead {
    display:flex; align-items:flex-start; gap:16px; padding:16px 20px 15px;
    border-bottom:1px solid var(--line); flex:none;
  }
  .fmacts { margin-left:auto; display:flex; align-items:center; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
  .fmacts .btn { white-space:nowrap; }
  .fmmain { flex:1; min-height:0; display:flex; }
  .fmrail {
    width:214px; flex:none; border-right:1px solid var(--line); background:var(--surf);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .fmstage {
    padding:13px 16px; cursor:pointer; border-bottom:1px solid var(--whisper);
    border-left:3px solid transparent; background:transparent; text-align:left; width:100%;
  }
  .fmstage:hover { background:var(--chip); }
  .fmstage.sel { background:var(--chip); }
  .fmstage .t { display:flex; align-items:center; gap:8px; }
  .fmstage .dot { width:7px; height:7px; border-radius:2px; opacity:.65; flex:none; }
  .fmstage.sel .dot { opacity:1; }
  .fmstage .n { font:500 12px var(--font); letter-spacing:.06em; text-transform:uppercase; color:var(--text); }
  .fmstage .c { margin-left:auto; font:500 12px var(--font); font-variant-numeric:tabular-nums; color:var(--muted); }
  .fmstage .v { font:400 11px var(--font); font-variant-numeric:tabular-nums; color:var(--muted); margin-top:6px; }
  .fmstage .m { font:400 10.5px var(--font); color:var(--dim); margin-top:3px; }
  .fmsums { margin-top:auto; padding:14px 16px; border-top:1px solid var(--whisper); }
  .fmsum { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:11px; }
  .fmsum .k { font:600 8.5px var(--font); letter-spacing:.13em; text-transform:uppercase; color:var(--acc2); }
  .fmsum .v { font:500 13px var(--font); font-variant-numeric:tabular-nums; color:var(--text); }
  .fmsums .note { font:400 10px/1.45 var(--font); color:var(--dim); }

  .fmpane { flex:1; min-width:0; display:flex; flex-direction:column; }
  .fmpanehead {
    display:flex; align-items:center; gap:12px; padding:11px 20px; flex:none;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .fmpanehead .t { font:500 13px var(--font); letter-spacing:.06em; text-transform:uppercase; }
  .fmpanehead .m { font:400 11.5px var(--font); color:var(--dim); }
  .fmrows { flex:1; min-height:0; overflow:auto; }
  .fmgrid {
    display:grid;
    grid-template-columns:24px minmax(150px,1fr) 104px 126px 46px 116px 108px 80px 78px 80px 78px 42px 26px;
    gap:10px; align-items:center; padding:0 20px;
  }
  .fmghead {
    height:28px; position:sticky; top:0; z-index:3; background:var(--bg);
    border-bottom:1px solid var(--whisper);
  }
  .fmghead > div { font:600 8.5px var(--font); letter-spacing:.12em; text-transform:uppercase; color:var(--acc2); }
  .fmghead .num { text-align:right; }
  .fmrow { height:36px; border-bottom:1px solid var(--whisper); }
  .fmrow:hover { background:var(--surf); }
  .fmrow.sel { background:var(--chip); }
  .fmrow .d { font:400 12.5px var(--font); color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fmrow .s { font:400 11px var(--font); font-variant-numeric:tabular-nums; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fmrow .sd { font:400 11px var(--font); color:var(--dim); }
  .fmrow .num { font:400 12px var(--font); font-variant-numeric:tabular-nums; text-align:right; color:var(--text); }
  .fmrow .num.q { color:var(--muted); }
  .fmrow .num.pending { font-size:10.5px; color:var(--dim); }
  .fmrow .num.pp { font-size:11px; color:var(--dim); }
  .fmtick {
    width:14px; height:14px; border-radius:3px; border:1px solid var(--line); background:transparent;
    color:transparent; font:600 9px var(--font); display:grid; place-items:center; padding:0; cursor:pointer;
  }
  .fmtick.on { background:var(--acc); border-color:var(--acc); color:var(--bg); }
  .fmdel {
    width:18px; height:18px; border-radius:4px; border:1px solid transparent; background:transparent;
    color:var(--dim); font:400 13px var(--font); line-height:1; display:grid; place-items:center;
    padding:0; cursor:pointer;
  }
  .fmrow:hover .fmdel, .fmdel:focus-visible { color:var(--muted); border-color:var(--line); }
  .fmdel:hover { color:var(--stopped); border-color:var(--stopped); }
  .fmstatus {
    display:inline-flex; align-items:center; font:500 9.5px var(--font); letter-spacing:.07em;
    text-transform:uppercase; border-radius:3px; padding:4px 7px; background:transparent;
    cursor:pointer; white-space:nowrap;
  }
  .fmstatus:disabled { cursor:default; }
  .fmtype {
    background:transparent; border:1px dashed var(--line); border-radius:3px; color:var(--muted);
    font:400 11px var(--font); padding:2px 4px; max-width:74px;
  }
  .fmtype:hover { border-color:var(--acc); color:var(--text); }
  .fmtype.swapped { color:var(--text); }
  .fmest { font:400 9.5px var(--font); color:var(--acc2); white-space:nowrap; }
  .fmbatch {
    display:flex; align-items:center; gap:10px; padding:11px 20px; flex:none;
    border-top:1px solid var(--line); flex-wrap:wrap;
  }
  .fmbatch.on { background:var(--chip); }
  .fmbatch .hint { font:400 10.5px var(--font); color:var(--dim); }
  .fmbatch .n { font:500 11.5px var(--font); color:var(--text); }

  @media (max-width:900px) {
    .fmodal { inset:0; border-radius:0; border:0; }
    .fmmain { flex-direction:column; }
    .fmrail { width:auto; flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); }
    .fmstage { min-width:150px; border-bottom:0; border-left:0; border-top:3px solid transparent; }
    .fmsums { display:none; }
    .fmrows { overflow-x:auto; }
    .fmgrid { min-width:966px; }
  }
  @media (pointer:coarse) {
    .fmrow { height:44px; }
    .fmtick { width:20px; height:20px; }
    .fmdel { width:32px; height:32px; font-size:16px; }
  }

  /* ------------------------------------------------------- pull sheet */
  .pmodal[hidden], .pmscrim[hidden] { display:none; }
  .pmscrim { position:fixed; inset:0; background:rgba(9,13,20,.72); z-index:60; }
  .pmodal {
    position:fixed; z-index:61; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(680px,calc(100vw - 24px)); max-height:min(84vh,900px);
    display:flex; flex-direction:column;
    background:var(--bg); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .pmhead { padding:14px 16px 12px; box-shadow:inset 0 -1px 0 var(--line); }
  .pmbody { flex:1; overflow-y:auto; padding:4px 16px 12px; }
  .pmfoot {
    display:flex; align-items:center; gap:10px; padding:12px 16px;
    box-shadow:inset 0 1px 0 var(--line);
  }
  .pmveh {
    display:flex; align-items:center; gap:9px; padding:11px 0 9px;
    border-bottom:1px solid var(--whisper); margin-top:6px;
  }
  .pmline {
    display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:4px 10px;
    align-items:start; padding:8px 0; border-bottom:1px solid var(--whisper);
  }
  .pmodal input[type=checkbox] { width:16px; height:16px; accent-color:var(--acc); margin:2px 0 0; }

  #printroot { display:none; }
  .short { color:#a11; font-weight:600; }
  .sheetsign {
    display:grid; grid-template-columns:1fr 200px; gap:34px; margin-top:44px;
    font:400 9pt var(--font); color:#444;
  }
  .sheetsign > div { border-top:1px solid #111; padding-top:4px; }

  @media print {
    html, body {
      display:block; overflow:visible; height:auto;
      background:#fff; color:#111;
    }
    body > *:not(#printroot) { display:none !important; }
    #printroot { display:block; }

    @page { size:letter portrait; margin:.5in; }

    .sheetpage { break-after:page; page-break-after:always; }
    .sheetpage:last-child { break-after:auto; page-break-after:auto; }
    .sheettop {
      display:flex; align-items:baseline; justify-content:space-between;
      border-bottom:1.5px solid #111; padding-bottom:6px;
    }
    .sheetco { font:600 11pt var(--font); letter-spacing:.02em; }
    .sheetkind { font:600 8.5pt var(--font); letter-spacing:.14em; text-transform:uppercase; }
    .sheetro { font:600 17pt var(--font); margin:12px 0 2px; }
    .sheetveh { font:400 12pt var(--font); }
    .sheetvin { font:400 9.5pt var(--font); letter-spacing:.06em; margin-top:3px; color:#333; }
    .sheettbl { width:100%; border-collapse:collapse; margin-top:14px; }
    .sheettbl thead { display:table-header-group; }
    .sheettbl th {
      font:600 7.5pt var(--font); letter-spacing:.11em; text-transform:uppercase;
      text-align:left; padding:0 6px 5px; border-bottom:1px solid #111; color:#111;
    }
    .sheettbl td {
      font:400 10pt var(--font); padding:7px 6px; border-bottom:1px solid #ccc;
      vertical-align:top; color:#111;
    }
    .sheettbl tr { break-inside:avoid; page-break-inside:avoid; }
    .sheettbl .n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .sheettbl tfoot td {
      font-weight:600; border-top:1.5px solid #111; border-bottom:none; padding-top:8px;
    }
    .sheetfoot { font:400 8.5pt var(--font); color:#444; margin-top:10px; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><div class="mark">ES</div><div class="word">Easy Shop</div></div>
  <div class="vr"></div>
  <div class="co" id="coName">—</div>
  <div id="nav"></div>
  <div class="spacer"></div>
  <div id="bell"></div>
  <div class="who" id="who">—</div>
  <button class="ghostbtn" id="signout">Sign out</button>
</div>
<div class="hairline"></div>

<div class="filters">
  <input type="search" id="fSearch" placeholder="Search RO #, part #, vendor, colour…">
  <select id="fVendor"><option value="">Vendor: All</option></select>
  <select id="fState"><option value="">Type: All</option></select>
  <div class="legend" id="legend"></div>
  <div class="spacer"></div>
  <button class="btn btn-ghost" id="vendorsBtn">Vendors</button>
  <a class="btn btn-ghost" href="/clients.html">Wholesale clients</a>
  <button class="btn btn-ghost" id="printBtn">Print pull sheet</button>
</div>

<div class="kpis" id="kpis"></div>

<main>
  <div id="body"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead">
    <div style="min-width:0;flex:1">
      <div style="font:500 16px var(--font)" id="dTitle">Vendors</div>
      <div class="sub" id="dSub">Who you order from</div>
    </div>
    <button class="close" id="dClose" aria-label="Close">&times;</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

<div class="pmscrim" id="pmScrim" hidden></div>
<div class="pmodal" id="pmodal" hidden role="dialog" aria-modal="true" aria-label="Print pull sheet">
  <div class="pmhead">
    <div style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1;min-width:0">
        <div style="font:500 15px var(--font)">Print pull sheet</div>
        <div class="sub" id="pmScope">—</div>
      </div>
      <button class="close" id="pmClose" aria-label="Close">&times;</button>
    </div>
    <div class="segctl" id="pmMode" style="margin-top:11px;width:max-content">
      <button data-mode="order" class="sel">To order</button>
      <button data-mode="ordered">On order</button>
      <button data-mode="received">Received</button>
    </div>
  </div>
  <div class="pmbody" id="pmBody"></div>
  <div class="pmfoot">
    <button class="btn btn-solid" id="pmPrint">Print</button>
    <button class="btn btn-ghost" id="pmCancel">Cancel</button>
    <span class="sub" id="pmCount" style="margin:0 0 0 auto"></span>
  </div>
</div>

<div id="printroot"></div>

<div class="fmscrim" id="fmScrim" hidden></div>
<div class="fmodal" id="fmodal" hidden role="dialog" aria-modal="true" aria-labelledby="fmTitle">
  <div class="fmhead">
    <div style="min-width:0">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <div id="fmTitle" style="font:500 17px var(--font)">—</div>
        <a class="rolink" id="fmRo" href="#">—</a>
      </div>
      <div class="sub" id="fmSub">—</div>
    </div>
    <div class="fmacts" id="fmActs"></div>
    <button class="close" id="fmClose" aria-label="Close">&times;</button>
  </div>
  <div class="fmmain">
    <div class="fmrail" id="fmRail"></div>
    <div class="fmpane">
      <div class="fmpanehead" id="fmPaneHead"></div>
      <div class="fmrows" id="fmRows"></div>
      <div class="fmbatch" id="fmBatch"></div>
    </div>
  </div>
</div>

<script src="/shell.js?v=9"></script>
<script>
(function () {
  var api = Shell.api, esc = Shell.esc;
  var ME = null, PARTS = [], VENDORS = [], RETURNS = [];
  /* The file whose lines are open, which stage of them, and what is ticked.
     One file at a time, over the list — not expanded under it. */
  var FILE = null, FSTAGE = 'need', FSEL = {};
  /* Ticked lines waiting on the "remove these?" confirm in the batch bar. */
  var FDEL = false;
  /* A parts line under this margin reads thin. The server sends its own value. */
  var THIN_PCT = 20;

  /* One tone per part state, used by the legend, the segments and the chips. */
  var TONE = {
    need: 'var(--dim)', ordered: 'var(--move)', partial: 'var(--blocked)',
    received: 'var(--done)', backordered: 'var(--stopped)',
    returned: 'var(--dim)', not_needed: 'var(--line)'
  };
  var LABEL = {
    need: 'Needed', ordered: 'Ordered', partial: 'Partial', received: 'Received',
    backordered: 'Backordered', returned: 'Returned', not_needed: 'Not needed'
  };

  /* RO-level rollup — how the shop actually talks about a file's parts. */
  var GROUPS = [
    { k: 'backordered', t: 'Backordered', tone: 'var(--stopped)',
      note: 'a part is not coming when it was promised' },
    { k: 'late', t: 'Past ETA', tone: 'var(--stopped)', note: 'ordered, ETA gone by' },
    { k: 'need', t: 'To order', tone: 'var(--dim)', note: 'nothing ordered yet' },
    { k: 'ordered', t: 'On order', tone: 'var(--move)', note: 'waiting on delivery' },
    { k: 'received', t: 'All in', tone: 'var(--done)', note: 'every gating part is here' }
  ];

  function $(id) { return document.getElementById(id); }
  function money(c) {
    if (c == null) return '—';
    return '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function money0(c) { return c == null ? '—' : '$' + Math.round(c / 100).toLocaleString('en-US'); }
  function shopDate(v) {
    if (!v) return '';
    var d = new Date(v);
    var p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + String(d.getFullYear()).slice(2);
  }

  api('/api/me').then(function (me) {
    ME = me;
    if (!me.company) { location.href = '/'; return null; }
    if (me.features.indexOf('parts') < 0) {
      document.body.innerHTML = '<div class="empty">Parts tracking is not switched on for this shop.</div>';
      return null;
    }
    Shell.mount({ me: me, active: 'parts' });

    if (!me.caps.manageParts) {
      $('body').innerHTML = '<div class="locked">' +
        '<div style="font:500 14px var(--font)">Parts ordering is restricted</div>' +
        '<div style="font:400 12px var(--font);color:var(--dim)">' +
        'The parts desk, estimating, production and the owner order parts. ' +
        'You can still see what a file is waiting on from its repair order.</div></div>';
      document.querySelector('.filters').hidden = true;
      return null;
    }

    $('legend').innerHTML = ['need', 'ordered', 'backordered', 'received'].map(function (k) {
      return '<div class="legitem"><div class="legswatch" style="background:' + TONE[k] + '"></div>' +
        esc(LABEL[k]) + '</div>';
    }).join('');

    $('fState').innerHTML = '<option value="">Type: All</option>' +
      ['need', 'ordered', 'partial', 'backordered', 'received'].map(function (k) {
        return '<option value="' + k + '">' + esc(LABEL[k]) + '</option>';
      }).join('');

    return load().then(function () {
      /* Coming back from a repair order opened off a parts line: the same file is
         still expanded, where the desk left it. */
      var back = new URLSearchParams(location.search).get('open');
      if (back) {
        openFile(Number(back));
        history.replaceState(null, '', '/parts.html');
      }
    });
  }).catch(function (e) { if (e.message !== 'signed out') console.error(e); });

  function load() {
    return Promise.all([
      api('/api/parts'),
      api('/api/parts/returns').catch(function () { return { returns: [] }; })
    ]).then(function (res) {
      var d = res[0];
      RETURNS = res[1].returns || [];
      PARTS = d.parts;
      VENDORS = d.vendors;
      if (d.thinMarginPct) THIN_PCT = Number(d.thinMarginPct);
      $('fVendor').innerHTML = '<option value="">Vendor: All</option>' +
        VENDORS.map(function (v) { return '<option value="' + v.id + '">' + esc(v.name) + '</option>'; }).join('');
      renderKpis(d.summary);
      render();
      /* A file open on screen follows the data — ordering, receiving and costs
         all reload, and the modal should show the result rather than what was
         true before the write. */
      if (FILE) renderFile();
    });
  }

  function renderKpis(s) {
    var files = byRo();
    var cells = [
      { v: files.length, k: 'Files waiting' },
      { v: s.needed, k: 'To order' },
      { v: s.ordered, k: 'On order' },
      { v: s.backordered, k: 'Back ordered', tone: s.backordered ? 'var(--stopped)' : '' },
      { v: s.late, k: 'Past ETA', tone: s.late ? 'var(--stopped)' : '' }
    ];

    if (ME.caps.money && s.listCents != null) {
      var pp = s.marginPct != null
        ? s.marginPct
        : (s.listCents ? Math.round(((s.listCents - s.costCents) / s.listCents) * 100) : 0);
      cells.push(
        { v: money0(s.listCents), k: 'List' },
        { v: money0(s.costCents), k: 'Cost' },
        { v: pp + '%', k: 'Parts profit', tone: pp < THIN_PCT ? 'var(--stopped)' : '' }
      );
    }

    $('kpis').innerHTML = cells.map(function (i) {
      return '<div><div class="kpi-v"' + (i.tone ? ' style="color:' + i.tone + '"' : '') + '>' +
        esc(i.v) + '</div><div class="kpi-k">' + esc(i.k) + '</div></div>';
    }).join('') + '<div class="kpi-tail"></div>';
  }

  /* -------------------------------------------------------- grouping */

  function filteredLines() {
    var q = $('fSearch').value.trim().toLowerCase();
    var vend = $('fVendor').value;
    var st = $('fState').value;

    return PARTS.filter(function (p) {
      if (st && p.state !== st) return false;
      if (vend && String(p.vendor_id) !== vend) return false;
      if (q && [p.ro_number, p.description, p.part_number, p.vendor_name, p.customer_name,
                p.vehicle, p.color, p.vin]
        .filter(Boolean).join(' ').toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  /** Collapse the part lines into one entry per repair order. */
  function byRo() {
    var map = {};
    filteredLines().forEach(function (p) {
      var key = p.ro_id;
      if (!map[key]) {
        map[key] = {
          roId: p.ro_id, ro: p.ro_number, vehicle: p.vehicle, color: p.color, vin: p.vin,
          customer: p.customer_name, status: p.status_label,
          openedAt: p.opened_at, daysInShop: p.days_in_shop, targetDays: p.target_days,
          lines: []
        };
      }
      map[key].lines.push(p);
    });

    return Object.keys(map).map(function (k) {
      var f = map[k];
      var gating = f.lines.filter(function (l) { return Number(l.gating) === 1; });
      var counts = {};
      f.lines.forEach(function (l) { counts[l.state] = (counts[l.state] || 0) + 1; });

      var late = f.lines.filter(function (l) {
        return Number(l.days_late) > 0 && l.state !== 'received';
      });
      var etas = f.lines.map(function (l) { return l.eta; }).filter(Boolean).sort();
      var ordered = f.lines.map(function (l) { return l.days_since_ordered; })
        .filter(function (v) { return v != null; });

      f.counts = counts;
      f.gatingOpen = gating.filter(function (l) {
        return ['need', 'ordered', 'partial', 'backordered'].indexOf(l.state) >= 0;
      }).length;
      f.late = late.length;
      f.worstEta = etas.length ? etas[etas.length - 1] : null;
      f.sinceOrdered = ordered.length ? Math.max.apply(null, ordered) : null;
      f.listCents = f.lines.reduce(function (a, l) {
        return a + Number(l.price_cents || 0) * Number(l.qty || 1);
      }, 0);
      f.costCents = f.lines.reduce(function (a, l) {
        return a + Number(l.cost_cents || 0) * Number(l.qty || 1);
      }, 0);
      f.received = f.lines.filter(function (l) { return l.state === 'received'; }).length;
      /* Parts profit is margin on list, over the lines still owed. */
      var openLines = f.lines.filter(function (l) {
        return ['need', 'ordered', 'partial', 'backordered'].indexOf(l.state) >= 0;
      });
      var oList = openLines.reduce(function (a, l) {
        return a + Number(l.price_cents || 0) * Number(l.qty || 1);
      }, 0);
      var oCost = openLines.reduce(function (a, l) {
        return a + Number(l.cost_cents || 0) * Number(l.qty || 1);
      }, 0);
      f.marginPct = oList ? Math.round(((oList - oCost) / oList) * 100) : null;
      f.thinLines = openLines.filter(function (l) {
        var lp = Number(l.price_cents || 0);
        return lp > 0 && ((lp - Number(l.cost_cents || 0)) / lp) * 100 < THIN_PCT;
      }).length;

      f.group = counts.backordered ? 'backordered'
        : late.length ? 'late'
        : counts.need ? 'need'
        : (counts.ordered || counts.partial) ? 'ordered'
        : 'received';

      return f;
    }).sort(function (a, b) {
      return Number(b.daysInShop || 0) - Number(a.daysInShop || 0);
    });
  }

  function segsFor(f) {
    var total = f.lines.length || 1;
    var order = ['received', 'partial', 'ordered', 'backordered', 'need'];
    return order.filter(function (k) { return f.counts[k]; }).map(function (k) {
      return '<div class="segbar" style="flex:' + f.counts[k] + ';background:' + TONE[k] + '" ' +
        'title="' + f.counts[k] + ' ' + esc(LABEL[k].toLowerCase()) + '"></div>';
    }).join('');
  }

  function summaryFor(f) {
    var bits = [];
    if (f.counts.need) bits.push(f.counts.need + ' to order');
    if (f.counts.ordered) bits.push(f.counts.ordered + ' on order');
    if (f.counts.partial) bits.push(f.counts.partial + ' partial');
    if (f.counts.backordered) bits.push(f.counts.backordered + ' backordered');
    if (!bits.length) bits.push('all ' + f.lines.length + ' in');
    return bits.join(' · ');
  }

  /* ---------------------------------------------------------- render */

  /**
   * Parts bought against a file that was later voided. Money on a shelf: it
   * stays here until somebody says the part went back or is being kept.
   */
  function returnsHtml() {
    if (!RETURNS.length) return '';
    return '<div class="grouphead" style="margin-top:0">' +
      '<div class="gdot" style="background:var(--stopped)"></div>' +
      '<div class="gname">To return</div>' +
      '<div class="sub">' + RETURNS.length + '</div>' +
      '<div class="sub" style="margin-left:auto">ordered against a file that was voided</div></div>' +
      RETURNS.map(function (l) {
        return '<div class="pgrid prow" style="grid-template-columns:1fr">' +
          '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">' +
          '<div style="min-width:0;flex:1">' +
          '<div class="cellmain">' + esc(l.description) +
          (l.part_number ? ' <span class="cellsub" style="display:inline">' + esc(l.part_number) + '</span>' : '') +
          '</div><div class="cellsub">RO ' + esc(l.ro_number || '') +
          ' · ' + esc(l.void_reason || 'voided') +
          (l.vendor_name ? ' · ' + esc(l.vendor_name) : '') +
          (l.po_number ? ' · PO ' + esc(l.po_number) : '') +
          (ME.caps.money && l.cost_cents ? ' · ' + money(l.cost_cents) : '') + '</div></div>' +
          (ME.caps.manageParts
            ? '<button class="linebtn" data-retok="' + l.id + '">Returned</button>' +
              '<button class="linebtn" data-retkeep="' + l.id + '">Keeping it</button>'
            : '') + '</div></div>';
      }).join('');
  }

  function render() {
    var files = byRo();
    var ret = returnsHtml();

    if (!files.length) {
      $('body').innerHTML = ret + '<div class="empty">' +
        (PARTS.length ? 'Nothing matches those filters.'
          : 'No parts on any open file yet.<br>Add them from a repair order, or accept an estimate ' +
            'on the Import screen — the lines come across with it.') + '</div>';
      wireLines();
      return;
    }

    var head = '<div class="pgrid phead"><div></div>' +
      '<div>RO #</div><div>Vehicle</div><div>Parts status</div>' +
      '<div class="hide-md">Back order</div><div>In shop</div>' +
      '<div class="hide-md">Since ordered</div>' +
      (ME.caps.money ? '<div style="text-align:right">List</div>' : '<div></div>') +
      (ME.caps.money ? '<div class="hide-md" style="text-align:right">Cost</div>'
        : '<div class="hide-md" style="text-align:right">Received</div>') + '</div>';

    var html = ret + head;

    GROUPS.forEach(function (g) {
      var mine = files.filter(function (f) { return f.group === g.k; });
      if (!mine.length) return;

      html += '<div><div class="grouphead">' +
        '<div class="gdot" style="background:' + g.tone + '"></div>' +
        '<div class="gname">' + esc(g.t) + '</div>' +
        '<div class="sub">' + mine.length + '</div>' +
        '<div class="sub" style="margin-left:auto">' + esc(g.note) + '</div></div>';

      mine.forEach(function (f) {
        var over = f.targetDays != null && f.daysInShop > f.targetDays;

        html += '<div class="pgrid prow" data-ro="' + f.roId + '">' +
          '<div class="caret">▶</div>' +

          '<div><div style="font:500 12px var(--font);font-variant-numeric:tabular-nums">' +
          '<a class="rolink" href="/board.html?ro=' + f.roId + '&back=parts" ' +
          'title="Open the repair order — the file without leaving the parts list">' +
          esc(f.ro) + '</a></div><div class="cellsub">in ' + shopDate(f.openedAt) + '</div></div>' +

          '<div style="min-width:0"><div class="cellmain" title="' + esc(f.vehicle || '') + '">' +
          esc(f.vehicle || '—') + (f.color ? ' · ' + esc(f.color) : '') + '</div><div class="cellsub">' +
          esc(f.customer || '—') + (f.vin ? ' · …' + esc(String(f.vin).slice(-8)) : '') + '</div></div>' +

          '<div style="min-width:0"><div style="display:flex;align-items:center;gap:8px">' +
          '<div style="font:400 11.5px var(--font);white-space:nowrap">' + esc(summaryFor(f)) + '</div>' +
          '<div class="segs">' + segsFor(f) + '</div></div>' +
          '<div class="cellsub">' + esc(f.status || '') + '</div></div>' +

          '<div class="hide-md">' + (f.counts.backordered
            ? '<div style="font:500 11.5px var(--font);color:var(--stopped)">' +
              f.counts.backordered + ' line' + (f.counts.backordered === 1 ? '' : 's') + '</div>'
            : f.late
              ? '<div style="font:500 11.5px var(--font);color:var(--stopped)">' + f.late + ' past ETA</div>'
              : '<div class="cellsub" style="margin:0">—</div>') +
          '<div class="cellsub">' + (f.worstEta ? 'ETA ' + shopDate(f.worstEta) : '') + '</div></div>' +

          '<div><div style="display:flex;align-items:baseline;gap:4px">' +
          '<span style="font:500 15px/1 var(--font);font-variant-numeric:tabular-nums;color:' +
          (over ? 'var(--stopped)' : 'var(--text)') + '">' + f.daysInShop + '</span>' +
          '<span class="cellsub" style="margin:0">' + (f.targetDays ? 'of ' + f.targetDays : '') +
          '</span></div></div>' +

          '<div class="hide-md">' + (f.sinceOrdered == null
            ? '<div class="cellsub" style="margin:0">nothing ordered</div>'
            : '<div style="font:500 12px var(--font);font-variant-numeric:tabular-nums">' +
              f.sinceOrdered + 'd</div>') + '</div>' +

          (ME.caps.money
            ? '<div class="cellnum">' + money(f.listCents) + '</div>'
            : '<div></div>') +

          (ME.caps.money
            ? '<div class="hide-md"><div class="cellnum">' + money(f.costCents) + '</div>' +
              '<div class="cellsub" style="text-align:right' +
              (f.marginPct != null && f.marginPct < THIN_PCT ? ';color:var(--stopped)' : '') + '" ' +
              'title="Parts profit — margin on list">' +
              (f.marginPct != null ? f.marginPct + '% PP'
                : f.received + ' of ' + f.lines.length) + '</div></div>'
            : '<div class="hide-md cellnum">' + f.received + ' of ' + f.lines.length + '</div>') +
          '</div>';
      });

      html += '</div>';
    });

    $('body').innerHTML = html;

    Array.prototype.forEach.call($('body').querySelectorAll('[data-ro]'), function (el) {
      el.addEventListener('click', function () {
        openFile(Number(el.dataset.ro));
      });
    });

    wireLines();
  }

  /* ------------------------------------------------------------- one file

     Four stages down the left, one stage's lines at a time on the right. The
     grouping is the point: a flat list of seventeen lines says nothing about
     what is waiting on whom.

     Every column the desk asked to keep is on the row at 36px — the complaint
     was never the column count, it was the flat list, cost and price stacked in
     one cell, and the rhythm. */

  var STAGES = [
    { k: 'need', t: 'To order', states: ['need'], tone: 'var(--acc)', btn: 'Order these' },
    { k: 'ordered', t: 'On order', states: ['ordered', 'partial'], tone: 'var(--move)', btn: 'Receive these' },
    { k: 'backordered', t: 'Back order', states: ['backordered'], tone: 'var(--stopped)', btn: 'Receive these' },
    { k: 'received', t: 'Received', states: ['received', 'returned'], tone: 'var(--done)', btn: '' }
  ];

  /* The ordered type is what the shop is buying. part_type_estimated is what the
     estimate called for, and the two differ often enough to matter: OEM on the
     estimate, aftermarket in the van. */
  var TYPES = [
    ['oem', 'OEM new', 'oem'],
    ['aftermarket', 'Aftermarket', 'a/m'],
    ['used', 'Used / LKQ', 'used'],
    ['recycled', 'Recycled', 'recy'],
    ['reconditioned', 'Reconditioned', 'recon']
  ];
  function typeShort(v) {
    var t = TYPES.filter(function (x) { return x[0] === v; })[0];
    return t ? t[2] : (v || '\u2014');
  }
  function typeLong(v) {
    var t = TYPES.filter(function (x) { return x[0] === v; })[0];
    return t ? t[1] : (v || 'not typed');
  }

  function stageOf(state) {
    var s = STAGES.filter(function (x) { return x.states.indexOf(state) >= 0; })[0];
    return s ? s.k : 'need';
  }

  function openFile(roId) {
    FILE = roId;
    FSEL = {};
    FDEL = false;
    var f = fileOf();
    if (f) {
      /* Open on the stage with work in it rather than always on To order: a
         file with everything ordered should not open on an empty pane. */
      var first = STAGES.filter(function (s) {
        return f.lines.some(function (l) { return s.states.indexOf(l.state) >= 0; });
      })[0];
      FSTAGE = first ? first.k : 'need';
    }
    $('fmScrim').hidden = false;
    $('fmodal').hidden = false;
    renderFile();
    $('fmClose').focus();
  }

  function closeFile() {
    FILE = null;
    FSEL = {};
    FDEL = false;
    $('fmScrim').hidden = true;
    $('fmodal').hidden = true;
  }

  function fileOf() {
    return byRo().filter(function (x) { return x.roId === FILE; })[0] || null;
  }

  /** What a line costs, and the two honest ways of not knowing yet. */
  function costText(l) {
    var c = Number(l.cost_cents || 0);
    if (c) return { t: money(c), cls: '' };
    if (l.state === 'need') return { t: 'at order', cls: ' pending' };
    return { t: 'cost pending', cls: ' pending' };
  }

  function renderFile() {
    var f = fileOf();
    if (!f) { closeFile(); return; }

    $('fmTitle').textContent = f.vehicle || 'File';
    var ro = $('fmRo');
    ro.textContent = 'RO ' + f.ro;
    ro.href = '/board.html?ro=' + f.roId + '&back=parts';
    $('fmSub').textContent = [
      f.color, f.customer,
      f.vin ? 'VIN \u2026' + String(f.vin).slice(-8) : null,
      'in ' + shopDate(f.openedAt),
      f.status
    ].filter(Boolean).join(' \u00b7 ');

    var toOrder = f.lines.filter(function (l) { return l.state === 'need'; });

    /* Header actions. Add part, Costs, the pull sheet, the two VIN copies and
       one order for everything still to order. */
    $('fmActs').innerHTML = (ME.caps.manageParts
      ? '<button class="btn btn-ghost" data-fm="addpart">Add part</button>' +
        (ME.caps.money ? '<button class="btn btn-ghost" data-fm="costs">Costs</button>' : '')
      : '') +
      '<button class="btn btn-ghost" data-fm="pull">Print pull sheet</button>' +
      (f.vin
        ? '<button class="btn btn-ghost" data-fm="vin8">Copy VIN</button>' +
          '<button class="btn btn-ghost" data-fm="vin17">Copy all 17</button>'
        : '') +
      (ME.caps.manageParts && toOrder.length
        ? '<button class="btn" data-fm="orderall">Order all ' + toOrder.length + '</button>'
        : '');

    /* The rail: a stage, its count, its list total, and the one thing worth
       knowing about that stage. */
    var priced = f.lines.filter(function (l) { return Number(l.cost_cents || 0) > 0; });
    var pricedList = priced.reduce(function (a, l) {
      return a + Number(l.price_cents || 0) * Number(l.qty || 1);
    }, 0);
    var pricedCost = priced.reduce(function (a, l) {
      return a + Number(l.cost_cents || 0) * Number(l.qty || 1);
    }, 0);
    var notOrdered = toOrder.length;
    var pending = f.lines.filter(function (l) {
      return !Number(l.cost_cents || 0) && l.state !== 'need';
    }).length;

    $('fmRail').innerHTML = STAGES.map(function (s) {
      var rows = f.lines.filter(function (l) { return s.states.indexOf(l.state) >= 0; });
      var list = rows.reduce(function (a, l) {
        return a + Number(l.price_cents || 0) * Number(l.qty || 1);
      }, 0);
      var etas = rows.map(function (l) { return l.eta; }).filter(Boolean).sort();
      var late = rows.filter(function (l) { return Number(l.days_late) > 0; });

      var meta = !rows.length ? ''
        : s.k === 'need' ? 'cost not known yet'
        : late.length ? late.length + ' past ETA'
        : etas.length ? (s.k === 'received' ? 'last arrival ' : 'oldest ETA ') +
            shopDate(s.k === 'received' ? etas[etas.length - 1] : etas[0])
        : '';

      return '<button class="fmstage' + (FSTAGE === s.k ? ' sel' : '') + '" data-stage="' + s.k + '"' +
        (FSTAGE === s.k ? ' style="border-left-color:' + s.tone + ';border-top-color:' + s.tone + '"' : '') + '>' +
        '<div class="t"><div class="dot" style="background:' + s.tone + '"></div>' +
        '<div class="n">' + esc(s.t) + '</div><div class="c">' + rows.length + '</div></div>' +
        '<div class="v">' + (rows.length ? money(list) + ' list' : 'nothing here') + '</div>' +
        (meta ? '<div class="m">' + esc(meta) + '</div>' : '') +
        '</button>';
    }).join('') +
      '<div class="fmsums">' +
      [['List', money(f.listCents)],
       ['Cost so far', ME.caps.money ? money(pricedCost) : '\u00b7'],
       ['Parts profit', ME.caps.money
         ? (pricedList ? Math.round(((pricedList - pricedCost) / pricedList) * 100) + '%' : '\u2014')
         : '\u00b7'],
       ['Received', f.received + ' of ' + f.lines.length]
      ].map(function (r) {
        return '<div class="fmsum"><div class="k">' + esc(r[0]) + '</div>' +
          '<div class="v">' + esc(r[1]) + '</div></div>';
      }).join('') +
      '<div class="note">' + esc(
        (notOrdered || pending)
          ? 'Profit is on the ' + priced.length + ' priced line' + (priced.length === 1 ? '' : 's') + '. ' +
            [notOrdered ? notOrdered + ' not ordered yet' : '',
             pending ? pending + ' ordered with no cost entered' : ''].filter(Boolean).join(', ') + '.'
          : 'Every line has a cost.'
      ) + '</div></div>';

    /* The pane. */
    var stage = STAGES.filter(function (s) { return s.k === FSTAGE; })[0] || STAGES[0];
    var rows = f.lines.filter(function (l) { return stage.states.indexOf(l.state) >= 0; });
    var stageList = rows.reduce(function (a, l) {
      return a + Number(l.price_cents || 0) * Number(l.qty || 1);
    }, 0);

    $('fmPaneHead').innerHTML = '<div class="t">' + esc(stage.t) + '</div>' +
      '<div class="m">' + (rows.length
        ? rows.length + (rows.length === 1 ? ' line \u00b7 ' : ' lines \u00b7 ') + money(stageList) + ' list' +
          (FSTAGE === 'need' ? ' \u00b7 vendor and cost set at order' : '')
        : 'no lines in this stage') + '</div>' +
      (stage.btn && rows.length && ME.caps.manageParts
        ? '<button class="btn btn-ghost" data-fm="selstage" style="margin-left:auto">' +
          esc(stage.btn) + '</button>'
        : '');

    var HEADS = [['Part', ''], ['Part #', ''],
      ['Type', 'What is being bought. The estimate\u2019s type shows beside it when they differ'],
      ['Qty', 'Received of ordered'], ['Vendor', ''],
      ['Status', 'Click a line\u2019s status to move it on'], ['Order #', ''], ['ETA', ''],
      ['List', ''], ['Cost', 'Entered when the order goes in'], ['PP', 'Margin on list']];

    var allOn = rows.length > 0 && rows.every(function (l) { return FSEL[l.id]; });

    var h = '<div class="fmgrid fmghead">' +
      '<div><button class="fmtick' + (allOn ? ' on' : '') + '" data-fmall="1" ' +
      'aria-label="Tick every line in this stage">\u2713</button></div>' +
      HEADS.map(function (x, i) {
        return '<div class="' + (i >= 8 ? 'num' : '') + '" title="' + esc(x[1]) + '">' +
          esc(x[0]) + '</div>';
      }).join('') + '<div></div></div>';

    if (!rows.length) {
      h += '<div style="padding:26px 20px;font:400 12px var(--font);color:var(--dim)">' +
        'Nothing in this stage.</div>';
    }

    rows.forEach(function (l) {
      var on = !!FSEL[l.id];
      var tone = TONE[l.state] || 'var(--dim)';
      var late = Number(l.days_late) > 0 && l.state !== 'received';
      var swapped = l.part_type && l.part_type_estimated && l.part_type !== l.part_type_estimated;
      var c = costText(l);
      var pp = Number(l.price_cents || 0) && Number(l.cost_cents || 0)
        ? Math.round(((Number(l.price_cents) - Number(l.cost_cents)) / Number(l.price_cents)) * 100) + '%'
        : '\u2014';
      var short = Number(l.qty_received || 0) > 0 && Number(l.qty_received) < Number(l.qty);

      h += '<div class="fmgrid fmrow' + (on ? ' sel' : '') + '">' +
        '<div><button class="fmtick' + (on ? ' on' : '') + '" data-fmsel="' + l.id + '" ' +
        'aria-label="Select ' + esc(l.description) + '">\u2713</button></div>' +

        '<div class="d" title="' + esc(l.description) + '">' + esc(l.description) + '</div>' +
        '<div class="s">' + esc(l.part_number || '\u2014') + '</div>' +

        '<div style="display:flex;align-items:center;gap:6px;min-width:0">' +
        (ME.caps.manageParts
          ? '<select class="fmtype' + (swapped ? ' swapped' : '') + '" data-fmtype="' + l.id + '" ' +
            'aria-label="Type ordered for ' + esc(l.description) + '" ' +
            'title="' + esc('Ordering ' + typeLong(l.part_type) +
              (l.part_type_estimated ? '. Estimate: ' + typeLong(l.part_type_estimated) : '')) + '">' +
            '<option value="">\u2014</option>' +
            TYPES.map(function (t) {
              return '<option value="' + t[0] + '"' + (t[0] === l.part_type ? ' selected' : '') + '>' +
                esc(t[2]) + '</option>';
            }).join('') + '</select>'
          : '<span class="sd">' + esc(typeShort(l.part_type)) + '</span>') +
        (swapped
          ? '<span class="fmest" title="' + esc('The estimate calls for ' +
              typeLong(l.part_type_estimated)) + '">est ' + esc(typeShort(l.part_type_estimated)) + '</span>'
          : '') +
        '</div>' +

        '<div class="num q">' + l.qty_received + '/' + l.qty + '</div>' +
        '<div class="s" title="' + esc(l.vendor_name || '') + '">' +
        (l.vendor_name ? esc(l.vendor_name) : '<span class="sd">not chosen</span>') + '</div>' +

        '<div>' + (ME.caps.manageParts
          ? '<button class="fmstatus" data-fmadv="' + l.id + '" ' +
            'style="color:' + tone + ';border:1px solid ' + tone + '"' +
            (l.state === 'received' || l.state === 'returned' ? ' disabled' : '') + ' ' +
            'title="' + esc(l.state === 'need'
              ? 'Order this line \u2014 vendor and cost go in there'
              : l.state === 'received' ? 'Received' : 'Mark received') + '">' +
            esc(LABEL[l.state] || l.state) + '</button>'
          : '<span class="fmstatus" style="color:' + tone + ';border:1px solid ' + tone + '">' +
            esc(LABEL[l.state] || l.state) + '</span>') +
        (short
          ? ' <span class="fmest" style="color:var(--stopped)">' +
            (Number(l.qty) - Number(l.qty_received)) + ' short</span>'
          : '') +
        '</div>' +

        '<div class="s">' + esc(l.po_number || '\u2014') + '</div>' +
        '<div class="s"' + (late ? ' style="color:var(--stopped)"' : '') + '>' +
        (l.eta ? shopDate(l.eta) : '\u2014') + '</div>' +

        (ME.caps.money
          ? '<div class="num">' + money(l.price_cents) + '</div>' +
            '<div class="num' + c.cls + '">' + esc(c.t) + '</div>' +
            '<div class="num pp">' + esc(pp) + '</div>'
          : '<div class="num">' + money(l.price_cents) + '</div><div></div><div></div>') +
        '<div>' + (ME.caps.manageParts
          ? '<button class="fmdel" data-fmdel="' + l.id + '" title="' +
            esc('Remove ' + l.description + ' from this file') + '" ' +
            'aria-label="Remove ' + esc(l.description) + '">\u00d7</button>'
          : '') + '</div></div>';
    });

    $('fmRows').innerHTML = h;

    /* The batch bar. Per-line is the status cell; this is the same move over a
       selection, which is how a real order of six lines gets placed. */
    var sel = f.lines.filter(function (l) { return FSEL[l.id]; });
    var ordering = sel.length > 0 && sel.every(function (l) { return l.state === 'need'; });
    /* A line already ordered or received is money that left the building, so
       removing one says so rather than asking the same bland question twice.
       The usual case — an EMS import that landed twice — is neither. */
    var spent = sel.filter(function (l) { return l.state !== 'need'; });
    var bar = $('fmBatch');
    bar.className = 'fmbatch' + (sel.length ? ' on' : '');
    bar.innerHTML = sel.length && FDEL
      ? '<div class="n">Remove ' + sel.length + (sel.length === 1 ? ' line' : ' lines') + '?</div>' +
        '<div class="hint">' + (spent.length
          ? spent.length + (spent.length === 1 ? ' line has' : ' lines have') +
            ' already been ordered \u2014 removing drops its cost off the file'
          : 'this cannot be undone; the removal is written to the audit log') + '</div>' +
        '<button class="btn btn-ghost" data-fm="delno" style="margin-left:auto">Cancel</button>' +
        '<button class="btn btn-solid" data-fm="delyes" ' +
        'style="background:var(--stopped);border-color:var(--stopped)">Remove</button>'
      : sel.length
      ? '<div class="n">' + sel.length + (sel.length === 1 ? ' line' : ' lines') + ' selected</div>' +
        '<div class="hint">' + (ordering
          ? 'vendor, order number and cost go in on the next screen'
          : 'marks them received with the quantity ordered') + '</div>' +
        '<button class="btn btn-ghost" data-fm="clearsel" style="margin-left:auto">Clear</button>' +
        (ME.caps.manageParts
          ? '<button class="btn btn-ghost" data-fm="delask">Remove\u2026</button>'
          : '') +
        '<button class="btn btn-solid" data-fm="batch">' +
        (ordering ? 'Order these\u2026' : 'Mark received') + '</button>'
      : '<div class="hint">Tick lines to order or receive several at once, or click a line\u2019s ' +
        'status to move it on its own. Cost is entered when the order goes in. ' +
        '\u00d7 removes a line \u2014 duplicates off an estimate import go that way.</div>';

    wireFile();
  }

  function wireFile() {
    var m = $('fmodal');

    Array.prototype.forEach.call(m.querySelectorAll('[data-stage]'), function (b) {
      b.addEventListener('click', function () {
        FSTAGE = b.dataset.stage;
        FSEL = {};
        FDEL = false;
        renderFile();
      });
    });

    /* The row \u00d7 ticks just that line and puts the bar into its confirm, so one
       line and six lines are removed the same way and the question is asked in
       one place. */
    Array.prototype.forEach.call(m.querySelectorAll('[data-fmdel]'), function (b) {
      b.addEventListener('click', function () {
        FSEL = {};
        FSEL[b.dataset.fmdel] = true;
        FDEL = true;
        renderFile();
      });
    });

    Array.prototype.forEach.call(m.querySelectorAll('[data-fmsel]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.dataset.fmsel;
        FDEL = false;
        if (FSEL[id]) delete FSEL[id]; else FSEL[id] = true;
        renderFile();
      });
    });

    var all = m.querySelector('[data-fmall]');
    if (all) all.addEventListener('click', function () {
      var f = fileOf();
      var stage = STAGES.filter(function (s) { return s.k === FSTAGE; })[0];
      var rows = f.lines.filter(function (l) { return stage.states.indexOf(l.state) >= 0; });
      var on = rows.some(function (l) { return !FSEL[l.id]; });
      FSEL = {};
      FDEL = false;
      if (on) rows.forEach(function (l) { FSEL[l.id] = true; });
      renderFile();
    });

    /* The status cell IS the per-line action. Needed opens the order screen,
       because ordering without a vendor and a cost is not a state worth having;
       anything on order marks received. */
    Array.prototype.forEach.call(m.querySelectorAll('[data-fmadv]'), function (b) {
      b.addEventListener('click', function () {
        var f = fileOf();
        var l = f.lines.filter(function (x) { return String(x.id) === b.dataset.fmadv; })[0];
        if (!l) return;
        if (l.state === 'need') return openOrder(f, [l.id]);
        api('/api/parts/' + l.id, { method: 'PATCH', body: JSON.stringify({ state: 'received' }) })
          .then(load).then(function () { Shell.refreshCount(); });
      });
    });

    Array.prototype.forEach.call(m.querySelectorAll('[data-fmtype]'), function (s) {
      s.addEventListener('change', function () {
        api('/api/parts/' + s.dataset.fmtype, {
          method: 'PATCH', body: JSON.stringify({ partType: s.value || null })
        }).then(load).catch(function () { renderFile(); });
      });
    });

    Array.prototype.forEach.call(m.querySelectorAll('[data-fm]'), function (b) {
      b.addEventListener('click', function () {
        var f = fileOf();
        if (!f) return;
        var what = b.dataset.fm;

        if (what === 'addpart') return openAddPart(f);
        if (what === 'costs') return openCosts(f, null);
        if (what === 'pull') return openPrint();
        if (what === 'orderall') {
          return openOrder(f, f.lines.filter(function (l) { return l.state === 'need'; })
            .map(function (l) { return l.id; }));
        }
        if (what === 'clearsel') { FSEL = {}; FDEL = false; return renderFile(); }
        if (what === 'delask') { FDEL = true; return renderFile(); }
        if (what === 'delno') { FDEL = false; return renderFile(); }
        if (what === 'delyes') {
          var gone = f.lines.filter(function (l) { return FSEL[l.id]; });
          if (!gone.length) { FDEL = false; return renderFile(); }
          b.disabled = true;
          return Promise.all(gone.map(function (l) {
            return api('/api/parts/' + l.id, { method: 'DELETE' });
          })).then(function () {
            FSEL = {};
            FDEL = false;
            return load();
          }).then(function () {
            Shell.refreshCount();
            Shell.announce(gone.length + (gone.length === 1 ? ' line' : ' lines') + ' removed.');
          }).catch(function () { b.disabled = false; });
        }
        if (what === 'selstage') {
          var stage = STAGES.filter(function (s) { return s.k === FSTAGE; })[0];
          FSEL = {};
          f.lines.filter(function (l) { return stage.states.indexOf(l.state) >= 0; })
            .forEach(function (l) { FSEL[l.id] = true; });
          return renderFile();
        }
        if (what === 'batch') {
          var sel = f.lines.filter(function (l) { return FSEL[l.id]; });
          if (!sel.length) return;
          if (sel.every(function (l) { return l.state === 'need'; })) {
            return openOrder(f, sel.map(function (l) { return l.id; }));
          }
          /* Receiving several goes through the receive screen, which is where
             short counts and the invoice number are recorded. One line on its
             own is the status cell, and that stays a single click. */
          return openReceive(f, sel.filter(function (l) { return l.state !== 'received'; })
            .map(function (l) { return l.id; }));
        }
        /* Most dealers want the last 8 over the phone; the full 17 goes on the
           clipboard when the parts system asks for it. */
        if (what === 'vin8' || what === 'vin17') {
          var text = what === 'vin17' ? String(f.vin) : String(f.vin).slice(-8);
          if (navigator.clipboard) navigator.clipboard.writeText(text);
          var was = b.textContent;
          b.textContent = 'copied';
          setTimeout(function () { b.textContent = was; }, 1600);
        }
      });
    });
  }

  function wireLines() {
    Array.prototype.forEach.call($('body').querySelectorAll('[data-retok]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        api('/api/parts/' + b.dataset.retok + '/return-cleared', {
          method: 'POST', body: JSON.stringify({ outcome: 'returned' })
        }).then(load);
      });
    });

    Array.prototype.forEach.call($('body').querySelectorAll('[data-retkeep]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        api('/api/parts/' + b.dataset.retkeep + '/return-cleared', {
          method: 'POST', body: JSON.stringify({ outcome: 'kept' })
        }).then(load);
      });
    });
    Array.prototype.forEach.call($('body').querySelectorAll('[data-recv]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        api('/api/parts/' + b.dataset.recv, {
          method: 'PATCH', body: JSON.stringify({ state: 'received' })
        }).then(load).then(function () { Shell.refreshCount(); });
      });
    });

    Array.prototype.forEach.call($('body').querySelectorAll('[data-orderfile]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var f = byRo().filter(function (x) { return String(x.roId) === b.dataset.orderfile; })[0];
        if (f) openOrder(f);
      });
    });

    Array.prototype.forEach.call($('body').querySelectorAll('[data-recvfile]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var f = byRo().filter(function (x) { return String(x.roId) === b.dataset.recvfile; })[0];
        if (f) openReceive(f);
      });
    });

    Array.prototype.forEach.call($('body').querySelectorAll('[data-costs]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var f = byRo().filter(function (x) { return String(x.roId) === b.dataset.costs; })[0];
        if (f) openCosts(f, b.dataset.costline ? Number(b.dataset.costline) : null);
      });
    });

    Array.prototype.forEach.call($('body').querySelectorAll('[data-addpart]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var f = byRo().filter(function (x) { return String(x.roId) === b.dataset.addpart; })[0];
        if (f) openAddPart(f);
      });
    });

    /* Most dealers want the last 8 over the phone; the full 17 goes on the clipboard. */
    Array.prototype.forEach.call($('body').querySelectorAll('[data-vin]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.vin);
        b.textContent = 'copied';
        setTimeout(function () { b.textContent = 'copy all 17'; }, 1600);
      });
    });

    Array.prototype.forEach.call($('body').querySelectorAll('a.rolink'), function (a) {
      a.addEventListener('click', function (e) { e.stopPropagation(); });
    });
  }

  /* ------------------------------------------------- order and receive */

  /**
   * The invoice usually turns up after the part does, and often disagrees with
   * what was quoted. Every line on the file is editable here, received or not,
   * so a stack of invoices is worked through in one pass rather than a file at a
   * time through the drawer. Blank leaves a line alone.
   */
  function openCosts(f, focusId) {
    $('dTitle').textContent = 'Costs — ' + f.ro;
    $('dSub').textContent = (f.vehicle || '') + (f.vin ? ' · …' + String(f.vin).slice(-8) : '');
    $('scrim').classList.add('open');
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');

    var h = ['<div class="sec">Off the invoice</div>',
      '<div class="row"><input id="cInv" placeholder="Vendor invoice number — optional" ' +
      'style="flex:1;min-width:160px"></div>',
      '<div class="sec">' + f.lines.length + ' line' + (f.lines.length === 1 ? '' : 's') +
      ' — type what it actually cost</div>'];

    f.lines.forEach(function (l) {
      var cost = Number(l.cost_cents || 0);
      h.push('<div class="log" style="display:flex;gap:10px;align-items:flex-start">' +
        '<div style="min-width:0;flex:1">' +
        '<div class="log-b">' + esc(l.description) + '</div>' +
        '<div class="log-m">' + esc([LABEL[l.state] || l.state, l.vendor_name || 'no vendor',
          l.po_number ? 'order ' + l.po_number : '', 'qty ' + l.qty].filter(Boolean).join(' · ')) +
        ' · ' + money(l.price_cents) + ' list</div></div>' +
        '<div style="display:flex;gap:8px;align-items:flex-start;text-align:right">' +
        '<div><div class="sub" style="margin:0">list</div>' +
        '<input class="c-price" data-for="' + l.id + '" type="number" min="0" step="0.01" ' +
        'value="' + (Number(l.price_cents) ? (Number(l.price_cents) / 100).toFixed(2) : '') + '" ' +
        'style="width:84px;text-align:right"></div>' +
        '<div><div class="sub" style="margin:0">cost</div>' +
        '<input class="c-cost" data-for="' + l.id + '" type="number" min="0" step="0.01" ' +
        'value="' + (cost ? (cost / 100).toFixed(2) : '') + '" ' +
        'placeholder="0.00" style="width:84px;text-align:right"></div></div></div>');
    });

    h.push('<div class="msg" id="cMsg"></div>',
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn btn-solid" id="cSave">Save costs</button>' +
      '<span class="sub">Only what you changed is written, and each change is logged.</span></div>');

    $('dBody').innerHTML = h.join('');

    if (focusId) {
      var target = $('dBody').querySelector('.c-cost[data-for="' + focusId + '"]');
      if (target) { target.focus(); target.select(); }
    }

    $('cSave').addEventListener('click', function () {
      var inv = $('cInv').value.trim();
      var writes = [];

      f.lines.forEach(function (l) {
        var costEl = $('dBody').querySelector('.c-cost[data-for="' + l.id + '"]');
        var priceEl = $('dBody').querySelector('.c-price[data-for="' + l.id + '"]');
        var body = {};
        if (costEl && costEl.value !== '') {
          var c = Math.round(Number(costEl.value) * 100);
          if (c !== Number(l.cost_cents || 0)) body.costCents = c;
        }
        if (priceEl && priceEl.value !== '') {
          var p = Math.round(Number(priceEl.value) * 100);
          if (p !== Number(l.price_cents || 0)) body.priceCents = p;
        }
        if (inv) body.invoiceNo = inv;
        if (Object.keys(body).length && !(Object.keys(body).length === 1 && body.invoiceNo)) {
          writes.push(api('/api/parts/' + l.id, { method: 'PATCH', body: JSON.stringify(body) }));
        }
      });

      if (!writes.length) return dMsg('cMsg', 'Nothing changed.', 'err');
      Promise.all(writes)
        .then(function () { closeDrawer(); return load(); })
        .then(function () { Shell.refreshCount(); })
        .catch(function (e) { dMsg('cMsg', e.message, 'err'); });
    });
  }

  /**
   * A line the estimate never had. The desk adds it here rather than going back
   * to the file: it lands in the same place, needed and not yet ordered, so the
   * next order picks it up with everything else.
   */
  function openAddPart(f) {
    $('dTitle').textContent = 'Add a part — ' + f.ro;
    $('dSub').textContent = (f.vehicle || '') + (f.vin ? ' · …' + String(f.vin).slice(-8) : '');
    $('scrim').classList.add('open');
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');

    $('dBody').innerHTML = [
      '<div class="sec">What it is</div>',
      '<div class="row"><input id="aDesc" placeholder="Part — as you would say it on the phone" ' +
      'style="flex:1;min-width:200px"></div>',
      '<div class="row" style="margin-top:10px">' +
      '<input id="aNum" placeholder="Part number — optional" style="flex:1;min-width:140px">' +
      '<select id="aType"><option value="">Type</option><option value="OEM">OEM</option>' +
      '<option value="Aftermarket">Aftermarket</option><option value="Recycled">Recycled</option>' +
      '<option value="Glass">Glass</option><option value="Other">Other</option></select>' +
      '<input id="aQty" type="number" min="1" step="1" value="1" style="width:70px" title="Quantity"></div>',
      (ME.caps.money
        ? '<div class="sec">Money</div>' +
          '<div class="row"><input id="aPrice" type="number" min="0" step="0.01" ' +
          'placeholder="List price" style="width:120px">' +
          '<input id="aCost" type="number" min="0" step="0.01" placeholder="Cost — if you know it" ' +
          'style="width:150px">' +
          '<span class="sub">Cost can wait until the part is in your hands.</span></div>'
        : ''),
      '<div class="sec">Where it is coming from — optional</div>',
      '<div class="row"><select id="aVendor" style="flex:1;min-width:150px">' +
      '<option value="">No vendor yet</option>' +
      VENDORS.map(function (v) {
        return '<option value="' + v.id + '">' + esc(v.name) + (v.kind ? ' · ' + esc(v.kind) : '') + '</option>';
      }).join('') + '</select>' +
      '<input id="aEta" type="date" style="width:150px" title="ETA, if the vendor has given one"></div>',
      '<div class="row" style="margin-top:10px">' +
      '<label class="sub" style="display:flex;align-items:center;gap:7px">' +
      '<input type="checkbox" id="aGating" checked> The car cannot go without it</label></div>',
      '<div class="msg" id="aMsg"></div>',
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn btn-solid" id="aSave">Add the line</button>' +
      '<span class="sub">Lands as needed, not ordered.</span></div>'
    ].join('');

    $('aSave').addEventListener('click', function () {
      var desc = $('aDesc').value.trim();
      if (!desc) return dMsg('aMsg', 'What is the part?', 'err');
      api('/api/ro/' + f.roId + '/parts', {
        method: 'POST',
        body: JSON.stringify({
          description: desc,
          partNumber: $('aNum').value.trim() || undefined,
          partType: $('aType').value || undefined,
          qty: Number($('aQty').value || 1) || 1,
          priceCents: $('aPrice') && $('aPrice').value ? Math.round(Number($('aPrice').value) * 100) : undefined,
          costCents: $('aCost') && $('aCost').value ? Math.round(Number($('aCost').value) * 100) : undefined,
          vendorId: $('aVendor').value ? Number($('aVendor').value) : undefined,
          eta: $('aEta').value || undefined,
          gating: $('aGating').checked
        })
      }).then(function () { closeDrawer(); return load(); })
        .then(function () { Shell.refreshCount(); })
        .catch(function (e) { dMsg('aMsg', e.message, 'err'); });
    });
  }

  /**
   * Ordering is not a flag. One order goes to one vendor with an order number
   * and an ETA, covering as many lines as the desk ticks — which is how a single
   * order to a supplier actually happens.
   */
  function openOrder(f, ids) {
    var lines = f.lines.filter(function (l) {
      return l.state === 'need' && (!ids || ids.indexOf(l.id) >= 0);
    });
    if (!lines.length) return;

    $('dTitle').textContent = 'Order ' + lines.length +
      (lines.length === 1 ? ' line' : ' lines') + ' — ' + f.ro;
    $('dSub').textContent = (f.vehicle || '') + (f.vin ? ' · …' + String(f.vin).slice(-8) : '') +
      ' · one vendor, one order number';
    $('scrim').classList.add('open');
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');

    var h = ['<div class="sec">Who it is going to</div>',
      '<div class="row"><select id="oVendor" style="flex:1;min-width:150px">' +
      '<option value="">Pick a vendor</option>' +
      VENDORS.map(function (v) {
        return '<option value="' + v.id + '"' +
          (f.lines.some(function (l) { return String(l.vendor_id) === String(v.id); }) ? ' selected' : '') +
          '>' + esc(v.name) + (v.kind ? ' · ' + esc(v.kind) : '') + '</option>';
      }).join('') + '</select>' +
      '<button class="btn btn-ghost" id="oVendors">Edit list</button></div>',
      '<div class="row" style="margin-top:10px">' +
      '<input id="oPo" placeholder="Order or invoice number" style="flex:1;min-width:150px">' +
      '<input id="oEta" type="date" style="width:150px" title="When the vendor says it lands"></div>',
      '<div class="sub" style="margin-top:7px">Ordering from a second vendor? Order those lines ' +
      'separately — the order number has to reconcile against one invoice.</div>',
      '<div class="sec">Lines — untick anything not on this order</div>'];

    lines.forEach(function (l) {
      var swapped = l.part_type && l.part_type_estimated && l.part_type !== l.part_type_estimated;
      h.push('<div class="log" style="display:flex;gap:10px;align-items:flex-start">' +
        '<input type="checkbox" class="o-line" data-id="' + l.id + '" checked style="margin-top:3px">' +
        '<div style="min-width:0;flex:1">' +
        '<div class="log-b">' + esc(l.description) + '</div>' +
        '<div class="log-m">' +
        esc([l.part_number, 'qty ' + l.qty].filter(Boolean).join(' · ')) +
        (ME.caps.money ? ' · ' + money(l.price_cents) + ' list' : '') +
        (l.part_type_estimated
          ? ' · estimate says ' + esc(typeLong(l.part_type_estimated))
          : ' · not on the estimate') +
        '</div>' +

        /* What is actually being bought, and what it costs. Neither is known
           until the order is placed, which is why they are asked for here and
           not on the line. */
        '<div class="row" style="margin-top:7px;gap:7px;align-items:center;flex-wrap:wrap">' +
        '<select class="o-type" data-id="' + l.id + '" ' +
        'aria-label="Type ordered for ' + esc(l.description) + '" style="width:150px">' +
        '<option value="">Type ordered</option>' +
        TYPES.map(function (t) {
          return '<option value="' + t[0] + '"' +
            (t[0] === (l.part_type || l.part_type_estimated) ? ' selected' : '') + '>' +
            esc(t[1]) + (t[0] === l.part_type_estimated ? ' — on the estimate' : '') + '</option>';
        }).join('') + '</select>' +
        (ME.caps.money
          ? '<input class="o-cost" data-id="' + l.id + '" type="number" min="0" step="0.01" ' +
            'placeholder="Cost each" style="width:120px" ' +
            'aria-label="Cost each for ' + esc(l.description) + '">' +
            '<span class="sub o-pp" data-id="' + l.id + '">—</span>'
          : '') +
        (swapped ? '<span class="sub" style="color:var(--acc2)">differs from the estimate</span>' : '') +
        '</div></div></div>');
    });

    h.push('<div class="sec">This order</div>',
      '<div class="row" id="oTotals" style="gap:22px;flex-wrap:wrap"></div>',
      '<div class="msg" id="oMsg"></div>',
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn btn-solid" id="oSend">Mark ordered</button>' +
      '<span class="sub" id="oHint">Ordered date is stamped today.</span></div>');

    $('dBody').innerHTML = h.join('');
    $('oVendors').addEventListener('click', openVendors);

    /* Totals and the gate on the confirm, recomputed as the desk types. The
       order cannot go in with a line whose cost nobody has entered — a blank
       there is how a file ends up with parts profit nobody can explain. */
    function ticked() {
      return Array.prototype.filter.call($('dBody').querySelectorAll('.o-line'), function (c) {
        return c.checked;
      }).map(function (c) { return Number(c.dataset.id); });
    }
    function costOf(id) {
      var el = $('dBody').querySelector('.o-cost[data-id="' + id + '"]');
      if (!el || el.value === '') return null;
      return Math.round(Number(el.value) * 100);
    }
    function refreshTotals() {
      var ids = ticked();
      var list = 0, cost = 0, missing = 0;
      ids.forEach(function (id) {
        var l = lines.filter(function (x) { return x.id === id; })[0];
        if (!l) return;
        var qty = Number(l.qty || 1);
        list += Number(l.price_cents || 0) * qty;
        var c = costOf(id);
        if (c === null) { if (ME.caps.money) missing++; } else cost += c * qty;

        var pp = $('dBody').querySelector('.o-pp[data-id="' + id + '"]');
        if (pp) {
          pp.textContent = (c !== null && Number(l.price_cents || 0))
            ? Math.round(((Number(l.price_cents) - c) / Number(l.price_cents)) * 100) + '% PP'
            : '—';
        }
      });

      $('oTotals').innerHTML = [
        ['Lines', String(ids.length)],
        ['List', money(list)],
        ME.caps.money ? ['Cost', money(cost)] : null,
        ME.caps.money
          ? ['Parts profit', (!missing && list) ? Math.round(((list - cost) / list) * 100) + '%' : '—']
          : null
      ].filter(Boolean).map(function (r) {
        return '<div><div class="sub" style="letter-spacing:.13em;text-transform:uppercase;' +
          'color:var(--acc2);font-size:8.5px">' + esc(r[0]) + '</div>' +
          '<div style="font:500 14px var(--font);font-variant-numeric:tabular-nums">' +
          esc(r[1]) + '</div></div>';
      }).join('');

      var ok = ids.length > 0 && missing === 0;
      $('oSend').disabled = !ok;
      $('oSend').style.opacity = ok ? '' : '.55';
      $('oHint').textContent = !ids.length ? 'Nothing ticked.'
        : missing ? missing + ' line' + (missing === 1 ? '' : 's') + ' still need a cost.'
        : 'Ordered date is stamped today.';
    }

    $('dBody').addEventListener('input', refreshTotals);
    $('dBody').addEventListener('change', refreshTotals);
    refreshTotals();

    $('oSend').addEventListener('click', function () {
      var ids = ticked();
      if (!ids.length) { return dMsg('oMsg', 'Nothing ticked.', 'err'); }
      if (!$('oVendor').value) { return dMsg('oMsg', 'Pick the vendor this is going to.', 'err'); }

      var perLine = ids.map(function (id) {
        var sel = $('dBody').querySelector('.o-type[data-id="' + id + '"]');
        return { id: id, costCents: costOf(id), partType: sel && sel.value ? sel.value : null };
      });
      if (ME.caps.money && perLine.some(function (l) { return l.costCents === null; })) {
        return dMsg('oMsg', 'Every line needs a cost before the order goes in.', 'err');
      }

      api('/api/parts/bulk-order', {
        method: 'POST',
        body: JSON.stringify({
          ids: ids,
          lines: perLine,
          vendorId: Number($('oVendor').value),
          poNumber: $('oPo').value.trim() || undefined,
          eta: $('oEta').value || undefined
        })
      }).then(function () { closeDrawer(); FSEL = {}; return load(); })
        .then(function () { Shell.refreshCount(); })
        .catch(function (e) { dMsg('oMsg', e.message, 'err'); });
    });
  }

  /**
   * Receiving stays quick, but records the date and what came short: a line with
   * anything owed stays on order for the remainder.
   */
  function openReceive(f, ids) {
    var lines = f.lines.filter(function (l) {
      return ['ordered', 'partial', 'backordered'].indexOf(l.state) >= 0 &&
        (!ids || ids.indexOf(l.id) >= 0);
    });
    if (!lines.length) return;

    $('dTitle').textContent = 'Receive parts — ' + f.ro;
    $('dSub').textContent = (f.vehicle || '') + (f.vin ? ' · …' + String(f.vin).slice(-8) : '');
    $('scrim').classList.add('open');
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');

    var h = ['<div class="sec">What arrived</div>',
      '<div class="row"><input id="rInv" placeholder="Vendor invoice number — optional" ' +
      'style="flex:1;min-width:160px">' +
      '<input id="rDate" type="date" style="width:150px" title="Received date — today unless you change it"></div>'];

    lines.forEach(function (l) {
      var owed = Number(l.qty) - Number(l.qty_received || 0);
      h.push('<div class="log" style="display:flex;gap:10px;align-items:flex-start">' +
        '<input type="checkbox" class="r-line" data-id="' + l.id + '" data-qty="' + l.qty + '" checked ' +
        'style="margin-top:3px">' +
        '<div style="min-width:0;flex:1">' +
        '<div class="log-b">' + esc(l.description) + '</div>' +
        '<div class="log-m">' + esc([l.vendor_name || 'no vendor',
          l.po_number ? 'order ' + l.po_number : '',
          l.eta ? 'ETA ' + shopDate(l.eta) : ''].filter(Boolean).join(' · ')) + '</div></div>' +
        '<div style="text-align:right;display:flex;gap:8px;align-items:flex-start">' +
        (ME.caps.money
          ? '<div><div class="sub" style="margin:0">cost each</div>' +
            '<input class="r-cost" data-for="' + l.id + '" type="number" min="0" step="0.01" ' +
            'placeholder="' + (Number(l.cost_cents) ? (Number(l.cost_cents) / 100).toFixed(2) : '0.00') + '" ' +
            'style="width:84px;text-align:right"></div>'
          : '') +
        '<div><div class="sub" style="margin:0">short of ' + owed + '</div>' +
        '<input class="r-short" data-for="' + l.id + '" type="number" min="0" max="' + owed + '" ' +
        'value="0" style="width:64px;text-align:right"></div></div></div>');
    });

    h.push('<div class="msg" id="rMsg"></div>',
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn btn-solid" id="rSend">Mark received</button>' +
      '<span class="sub">Anything short stays on order for the rest.' +
      (ME.caps.money ? ' A cost typed here replaces what the line was carrying.' : '') +
      '</span></div>');

    $('dBody').innerHTML = h.join('');

    $('rSend').addEventListener('click', function () {
      var picked = Array.prototype.filter.call($('dBody').querySelectorAll('.r-line'), function (c) {
        return c.checked;
      }).map(function (c) {
        var shortEl = $('dBody').querySelector('.r-short[data-for="' + c.dataset.id + '"]');
        var costEl = $('dBody').querySelector('.r-cost[data-for="' + c.dataset.id + '"]');
        var out = { id: Number(c.dataset.id), short: shortEl ? Number(shortEl.value || 0) : 0 };
        if (costEl && costEl.value !== '') out.costCents = Math.round(Number(costEl.value) * 100);
        return out;
      });
      if (!picked.length) return dMsg('rMsg', 'Nothing ticked.', 'err');
      api('/api/parts/bulk-receive', {
        method: 'POST',
        body: JSON.stringify({
          lines: picked,
          receivedAt: $('rDate').value || undefined,
          invoiceNo: $('rInv').value.trim() || undefined
        })
      }).then(function () { closeDrawer(); return load(); })
        .then(function () { Shell.refreshCount(); })
        .catch(function (e) { dMsg('rMsg', e.message, 'err'); });
    });
  }

  function dMsg(id, text, kind) {
    var el = $(id);
    if (!el) return;
