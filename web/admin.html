<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2740">
<title>Admin — Easy Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=8">
<style>
  /* Tabs underline, as in the mockup — not pills. */
  .adminbar {
    display:flex; align-items:center; gap:18px; padding:12px 18px 0; flex:none;
  }
  .atab {
    font:500 11.5px var(--font); padding:0 0 9px; background:none; border:none;
    color:var(--dim); border-bottom:2px solid transparent;
  }
  .atab:hover { color:var(--muted); }
  .atab.sel { color:var(--text); border-bottom-color:var(--acc); }
  .abarline { height:1px; background:var(--line); flex:none; }

  /* Three panes: rail, list, detail. */
  .three { flex:1; min-height:0; display:grid; grid-template-columns:196px 1fr 316px; }
  .rail { border-right:1px solid var(--whisper); padding:14px 0; overflow-y:auto; }
  .railtitle {
    font:600 8.5px var(--font); letter-spacing:.12em; text-transform:uppercase;
    color:var(--acc2); padding:0 16px 9px;
  }
  .railitem {
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:7px 16px; background:none; border:none; color:var(--muted);
    font:400 11.5px var(--font); border-left:2px solid transparent;
  }
  .railitem:hover { background:var(--whisper); color:var(--text); }
  .railitem.sel { background:var(--whisper); color:var(--text); border-left-color:var(--acc); }
  .railitem .c {
    margin-left:auto; font:400 10px var(--font); font-variant-numeric:tabular-nums; color:var(--dim);
  }

  .mid { overflow-y:auto; padding-bottom:26px; }
  .detail {
    border-left:1px solid var(--whisper); background:var(--surf);
    overflow-y:auto; padding:15px 16px;
  }

  /* Status rows. */
  .srow, .shead {
    display:grid; grid-template-columns:3px 1fr 166px 84px 122px 78px 68px 60px;
    gap:13px; align-items:center; padding:0 16px;
  }
  .shead { padding-top:6px; padding-bottom:6px; border-top:1px solid var(--line);
    border-bottom:1px solid var(--line); }
  .shead > div {
    font:600 8.5px var(--font); letter-spacing:.11em; text-transform:uppercase; color:var(--acc2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .srow { height:44px; border-bottom:1px solid var(--whisper); cursor:pointer; }
  .srow:hover { background:var(--whisper); }
  .srow.sel { background:var(--whisper); }
  .sedge { width:3px; height:22px; border-radius:1px; }
  .slabel {
    font:500 12px var(--font); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ssub, .sslot {
    font:400 10px var(--font); color:var(--dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .sslot { font-variant-numeric:tabular-nums; }
  .schip {
    display:inline-block; font:600 8.5px var(--font); letter-spacing:.07em; text-transform:uppercase;
    padding:2px 6px; border-radius:3px; white-space:nowrap;
  }
  .scell { font:400 11px var(--font); color:var(--muted); white-space:nowrap; }
  .scell.num { font-variant-numeric:tabular-nums; }
  .visbtn {
    font:400 10px var(--font); padding:3px 7px; border-radius:3px; background:transparent;
    border:1px solid var(--line); color:var(--dim); white-space:nowrap;
  }
  .visbtn:hover { border-color:var(--acc); color:var(--acc); }
  .visbtn.on { color:var(--done); border-color:var(--done); }

  /* A role and a trade are both sets: several chips, tap to hold or drop one. */
  .chipset { display:flex; flex-wrap:wrap; gap:4px; }
  .setchip {
    font:400 10px var(--font); padding:3px 6px; border-radius:3px; background:transparent;
    border:1px solid var(--line); color:var(--dim); white-space:nowrap; cursor:pointer;
  }
  .setchip:hover { border-color:var(--acc); color:var(--muted); }
  .setchip.on { color:var(--bg); background:var(--acc); border-color:var(--acc); }
  .setchip.primary::after { content:' \2022'; }

  .sechead {
    display:flex; align-items:baseline; gap:10px; padding:13px 16px 9px;
    position:sticky; top:0; background:var(--bg); z-index:1;
  }
  .secn { font:600 9px var(--font); letter-spacing:.1em; color:var(--acc); }
  .secname { font:500 12.5px var(--font); }

  /* Detail pane. */
  .dlbl {
    font:600 8.5px var(--font); letter-spacing:.12em; text-transform:uppercase;
    color:var(--acc2); margin-bottom:6px;
  }
  .dinput, .dsel {
    width:100%; box-sizing:border-box; background:transparent; border:1px solid var(--line);
    border-radius:4px; color:var(--text); font:400 11.5px var(--font); padding:7px 9px;
  }
  .dsel { appearance:none; cursor:pointer; }
  .drow {
    display:grid; grid-template-columns:118px 1fr; gap:10px; align-items:baseline;
    padding:6px 0; border-bottom:1px solid var(--whisper);
  }
  .dk { font:400 10px var(--font); letter-spacing:.04em; color:var(--dim); }
  .dv { font:400 11px/1.4 var(--font); }

  /* Lanes, tracks, people, groups all share the flat card look. */
  .card2 { border:1px solid var(--line); border-radius:6px; margin:0 16px 12px; overflow:hidden; }
  .card2row { display:grid; gap:14px; align-items:center; padding:11px 13px; }
  .card2row + .card2row { border-top:1px solid var(--whisper); }
  .pchip {
    font:400 10.5px var(--font); padding:4px 9px; border-radius:3px; white-space:nowrap;
    background:transparent; border:1px solid var(--line); color:var(--muted);
  }
  .pchip.on { background:var(--chip); color:var(--text); border-color:var(--acc); }
  .evrow {
    display:grid; grid-template-columns:3px 1fr 168px 148px 50px; gap:12px;
    align-items:center; min-height:44px; border-bottom:1px solid var(--whisper); padding:0 2px;
  }
  /* The people row. It used to render all eight role chips and all nine trade
     chips per person — seventeen buttons of which two were on. It now states
     what is true; everything editable is in the sheet. */
  .prow3 {
    display:grid; grid-template-columns:30px minmax(160px,1.4fr) 1.1fr 1fr 1.2fr 92px;
    gap:12px; align-items:center; min-height:50px; padding:7px 16px;
    border-bottom:1px solid var(--whisper);
  }
  .prow3:hover { background:var(--whisper); }
  @media (max-width:1000px) {
    .prow3 { grid-template-columns:30px minmax(140px,1fr) 1fr 92px; }
    .prow3 > .hide-sm { display:none; }
  }
  .pname { font:500 12.5px var(--font); }
  .pmeta { font:400 11px var(--font); color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pcell { font:400 12px var(--font); color:var(--muted); }
  .pcell .lead { color:var(--acc2); }
  .pcell .num { font-variant-numeric:tabular-nums; }
  .pfilters { display:flex; gap:7px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .pfilter {
    padding:4px 10px; font:400 11.5px var(--font); color:var(--muted); background:transparent;
    border:1px solid var(--line); border-radius:99px; cursor:pointer; min-height:28px;
  }
  .pfilter.on { background:var(--acc); border-color:var(--acc); color:var(--bg); font-weight:500; }

  /* The person sheet: one person, three tabs, everything editable in one place. */
  .sheet2 {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:40;
    width:min(560px, calc(100vw - 28px)); max-height:calc(100vh - 40px); overflow:auto;
    background:var(--bg); border:1px solid var(--line); border-radius:7px;
    box-shadow:0 18px 44px rgba(0,0,0,.5);
  }
  .sheet2[hidden] { display:none; }
  .shscrim {
    position:fixed; inset:0; background:rgba(8,12,20,.55); z-index:39;
  }
  .shscrim[hidden] { display:none; }
  .sh-head { padding:14px 17px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:11px; }
  .sh-tabs { display:flex; gap:2px; padding:0 17px; border-bottom:1px solid var(--line); }
  .sh-tab {
    padding:10px 12px; font:500 12px var(--font); color:var(--dim); background:transparent;
    border:0; border-bottom:2px solid transparent; cursor:pointer; min-height:40px;
  }
  .sh-tab.on { color:var(--acc2); border-bottom-color:var(--acc); }
  .sh-body { padding:16px 17px; display:flex; flex-direction:column; gap:14px; }
  .sh-foot {
    padding:13px 17px; border-top:1px solid var(--line); background:var(--surf);
    display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  }
  .sh-f { display:flex; flex-direction:column; gap:5px; }
  .sh-f .k { font:400 11px var(--font); color:var(--dim); }
  .sh-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .payblock { display:flex; flex-direction:column; gap:9px; }
  .payblock + .payblock { border-top:1px solid var(--whisper); padding-top:13px; }
  .payhead { display:flex; align-items:baseline; gap:8px; }
  .payhead .t { font:500 11px var(--font); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .payhead .n { font:400 11px var(--font); color:var(--dim); }
  .payseg { display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; width:280px; max-width:100%; }
  .payseg button {
    flex:1; padding:7px 0; font:500 11.5px var(--font); color:var(--muted);
    background:transparent; border:0; cursor:pointer; min-height:34px;
  }
  .payseg button.on { background:var(--acc); color:var(--bg); }

  .prow2 {
    display:grid; grid-template-columns:26px minmax(150px,1fr) 190px 168px 82px 148px;
    gap:12px; align-items:center; min-height:46px; padding:6px 16px;
    border-bottom:1px solid var(--whisper);
  }
  .prow2 .row { flex-wrap:nowrap; }
  @media (max-width:1000px) {
    .prow2 { grid-template-columns:26px minmax(140px,1fr) 130px 148px; }
    .prow2 > .hide-sm { display:none; }
  }
  .avatar2 {
    width:22px; height:22px; flex:none; border-radius:50%; display:grid; place-items:center;
    font:500 8.5px var(--font); color:var(--acc); border:1px solid var(--line);
  }
  .pad { padding:14px 16px; }

  @media (max-width:1200px) {
    .three { grid-template-columns:170px 1fr; }
    .detail { display:none; }
    .srow, .shead { grid-template-columns:3px 1fr 120px 84px 110px 68px; }
    .srow > .hide-lg, .shead > .hide-lg { display:none; }
  }
  @media (max-width:820px) {
    .three { grid-template-columns:1fr; }
    .rail { display:none; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><div class="mark">ES</div><div class="word">Easy Shop</div></div>
  <div class="vr"></div>
  <div class="co" id="coName">—</div>
  <div id="nav"></div>
  <div class="spacer"></div>
  <div id="bell"></div>
  <div class="who" id="who">—</div>
  <button class="ghostbtn" id="signout">Sign out</button>
</div>
<div class="hairline"></div>

<div class="adminbar" id="tabs"></div>
<div class="abarline"></div>

<div class="three">
  <div class="rail">
    <div class="railtitle" id="railTitle">Groups</div>
    <div id="rail"></div>
  </div>
  <div class="mid" id="mid"><div class="empty">Loading…</div></div>
  <div class="detail">
    <div class="dlbl" id="detTitle" style="border-bottom:1px solid var(--whisper);padding-bottom:9px">
      Reference
    </div>
    <div id="detBody"></div>
  </div>
</div>

<div class="shscrim" id="shScrim" hidden></div>
<div class="sheet2" id="sheet2" hidden role="dialog" aria-modal="true" aria-label="Person"></div>

<script src="/shell.js?v=9"></script>
<script>
(function () {
  var api = Shell.api, esc = Shell.esc;
  var ME = null, CFG = null, PEOPLE = null, GROUPS = null, ROLES = [], CTYPES = null;
  /* Labor rates, or null when this person may not see pay. */
  var RATES = null;
  var TAB = 'statuses', RAIL = null, SEL = null;
  /* The people screen's own state: what is typed in the search and which
     filter chip is on. Both are view state, so neither is saved anywhere. */
  var PQ = '', PFILTER = 'all', SHEET = null;

  var PFILTERS = [
    { k: 'all', t: 'Everyone', n: function (ps) { return ps.length; } },
    { k: 'tech', t: 'Technicians', n: function (ps) { return ps.filter(isTech).length; } },
    { k: 'office', t: 'Office', n: function (ps) { return ps.filter(isOffice).length; } },
    { k: 'sales', t: 'Sales', n: function (ps) { return ps.filter(isSales).length; } },
    { k: 'noplan', t: 'No pay plan', n: function (ps) { return ps.filter(hasNoPlan).length; } }
  ];

  function rolesOf(p) { return p.roles || (p.role ? [p.role] : []); }
  function tradesOf(p) {
    return (p.positionKeys && p.positionKeys.length)
      ? p.positionKeys
      : (p.position_key ? [p.position_key] : []);
  }
  function isTech(p) { return rolesOf(p).indexOf('technician') >= 0 || tradesOf(p).length > 0; }
  function isOffice(p) {
    return ['front_office', 'accounting', 'owner', 'admin'].some(function (r) {
      return rolesOf(p).indexOf(r) >= 0;
    });
  }
  function isSales(p) { return rolesOf(p).indexOf('salesperson') >= 0; }

  /** A tech with nothing set for any job type is the one worth chasing. */
  function hasNoPlan(p) {
    if (!RATES || !isTech(p)) return false;
    var row = RATES.staff.filter(function (x) { return x.userId === p.id; })[0];
    if (!row) return false;
    return !(row.plans || []).some(function (pl) {
      return pl.basis === 'pct' ? (pl.pctPaint > 0 || pl.pctNoPaint > 0) : pl.rateCents > 0;
    });
  }

  function matchesFilter(p) {
    if (PQ) {
      var hay = [p.name, p.email, p.employee_code, tradeNames(p), roleNames(p)]
        .join(' ').toLowerCase();
      if (hay.indexOf(PQ.toLowerCase()) < 0) return false;
    }
    if (PFILTER === 'tech') return isTech(p);
    if (PFILTER === 'office') return isOffice(p);
    if (PFILTER === 'sales') return isSales(p);
    if (PFILTER === 'noplan') return hasNoPlan(p);
    return true;
  }

  function roleLabel(key) {
    return (ROLES.filter(function (r) { return r.key === key; })[0] || {}).label || key;
  }
  function tradeLabel(key) {
    return (CFG.positions.filter(function (x) { return x.position_key === key; })[0] || {}).label || key;
  }
  function roleNames(p) { return rolesOf(p).map(roleLabel).join(', '); }
  function tradeNames(p) { return tradesOf(p).map(tradeLabel).join(', '); }

  /** The primary role, with the rest as a quiet second line rather than chips. */
  function roleCell(p) {
    var held = rolesOf(p);
    if (!held.length) return '<span style="color:var(--dim)">none</span>';
    var primary = p.role && held.indexOf(p.role) >= 0 ? p.role : held[0];
    var others = held.filter(function (k) { return k !== primary; });
    return '<div class="lead">' + esc(roleLabel(primary)) + '</div>' +
      (others.length
        ? '<div class="pmeta">and ' + esc(others.map(roleLabel).join(', ').toLowerCase()) + '</div>'
        : '');
  }

  /** Pay in a line: the plan where there is one, the sign-in date where pay is none of your business. */
  function payCell(p) {
    if (!RATES) return '<span class="pmeta">' +
      esc(p.last_login_at ? Shell.when(p.last_login_at) : 'never') + '</span>';
    var row = RATES.staff.filter(function (x) { return x.userId === p.id; })[0];
    if (!row) return '<span style="color:var(--dim)">not on the floor</span>';

    var plans = row.plans || [];
    var pct = plans.filter(function (pl) { return pl.basis === 'pct'; });
    var hourly = plans.filter(function (pl) { return pl.basis !== 'pct' && pl.rateCents > 0; });

    if (!pct.length && !hourly.length) {
      return '<span style="color:var(--stopped)">No pay plan</span>';
    }
    var bits = [];
    if (pct.length) {
      var one = pct[0];
      bits.push('<span class="num">' + one.pctPaint + '% / ' + one.pctNoPaint + '%</span>');
    }
    if (hourly.length) {
      bits.push('<span class="num">' + esc(money(hourly[0].rateCents)) +
        (hourly[0].basis === 'flat' ? ' a car' : ' flag') + '</span>');
    }
    return bits.join(' · ') +
      '<div class="pmeta">' + (plans.length > 1 ? 'by job type' : 'one job type set') + '</div>';
  }


  // Google sends the owner back here after they authorise; land on the tab and
  // the card they left from.
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get('tab')) TAB = q.get('tab');
    if (q.get('calendar')) RAIL = 'cal';
  })();

  var TABS = [
    { k: 'statuses', t: 'Statuses' },
    { k: 'lanes', t: 'Lanes and gates' },
    { k: 'notify', t: 'Notification groups' },
    { k: 'people', t: 'People' },
    { k: 'vendors', t: 'Vendors' },
    { k: 'webform', t: 'Web form' },
    { k: 'settings', t: 'Shop settings' },
    { k: 'storage', t: 'Storage' },
    /* Their own pages — too big to live in a pane here, but they belong to Admin,
       so the tab strip is where you reach them. */
    { k: 'payroll', t: 'Payroll', href: '/payroll.html' },
    { k: 'audit', t: 'Audit log', href: '/audit.html' },
    { k: 'roles', t: 'Roles &amp; permissions', href: '/permissions.html' },
    { k: 'pay', t: 'Sales pay', href: '/pay.html' }
  ];

  var KIND_TONE = {
    milestone: 'var(--move)', queue: 'var(--blocked)',
    active: 'var(--acc)', complete: 'var(--done)'
  };

  function $(id) { return document.getElementById(id); }
  function hours(h) { return h == null ? '—' : (h % 24 === 0 ? (h / 24) + 'd' : h + 'h'); }
  function toHours(v) {
    if (!v) return null;
    var m = /^(\d+)\s*([hd])?$/i.exec(String(v).trim());
    if (!m) return null;
    return (m[2] || 'h').toLowerCase() === 'd' ? Number(m[1]) * 24 : Number(m[1]);
  }

  api('/api/me').then(function (me) {
    ME = me;
    if (!me.company) { location.href = '/signin.html'; return null; }
    if (!me.caps.admin) {
      document.body.innerHTML = '<div class="empty">Admin is for the owner.<br>' +
        '<a href="/board.html">Back to the board</a></div>';
      return null;
    }
    Shell.mount({ me: me, active: 'admin' });
    return Promise.all([
      api('/api/config'),
      api('/api/config/people'),
      api('/api/admin/notification-groups'),
      api('/api/admin/roles'),
      /* Pay, so it is allowed to fail — an admin who is not the owner or
         accounting simply gets the page without rates. */
      api('/api/staff/rates').catch(function () { return null; })
    ]);
  }).then(function (r) {
    if (!r) return;
    CFG = r[0]; PEOPLE = r[1]; GROUPS = r[2]; ROLES = r[3].roles; RATES = r[4];
    renderTabs();
    render();
  }).catch(function (e) { if (e.message !== 'signed out') console.error(e); });

  function renderTabs() {
    $('tabs').innerHTML = TABS.map(function (t) {
      if (t.href) {
        return '<a class="atab" href="' + t.href + '">' + t.t + ' ↗</a>';
      }
      return '<button class="atab' + (t.k === TAB ? ' sel' : '') + '" data-tab="' + t.k + '">' +
        esc(t.t) + '</button>';
    }).join('');
    Array.prototype.forEach.call($('tabs').querySelectorAll('button.atab'), function (b) {
      b.addEventListener('click', function () {
        TAB = b.dataset.tab;
        RAIL = null;
        SEL = null;
        renderTabs();
        render();
      });
    });
  }

  function render() {
    ({
      statuses: renderStatuses, lanes: renderLanes, notify: renderNotify,
      people: renderPeople, vendors: renderVendors,
      settings: renderSettings, storage: renderStorage, webform: renderWebForm
    }[TAB])();
  }

  function rail(title, items) {
    $('railTitle').textContent = title;
    $('rail').innerHTML = items.map(function (i) {
      return '<button class="railitem' + (i.k === RAIL ? ' sel' : '') + '" data-rail="' + esc(i.k) + '">' +
        '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc(i.t) + '</span>' + (i.c != null ? '<span class="c">' + i.c + '</span>' : '') + '</button>';
    }).join('');
    Array.prototype.forEach.call($('rail').children, function (b) {
      b.addEventListener('click', function () {
        RAIL = RAIL === b.dataset.rail ? null : b.dataset.rail;
        render();
      });
    });
  }

  function detail(title, html) {
    $('detTitle').textContent = title;
    $('detBody').innerHTML = html;
  }

  /* ===================================================== statuses */

  function renderStatuses() {
    rail('Groups', CFG.groups.map(function (g) {
      return {
        k: g.group_id, t: g.label,
        c: CFG.statuses.filter(function (s) { return s.group_id === g.group_id; }).length
      };
    }));

    var groups = CFG.groups.filter(function (g) { return !RAIL || g.group_id === RAIL; });
    var h = [];

    groups.forEach(function (g, gi) {
      var rows = CFG.statuses.filter(function (s) { return s.group_id === g.group_id; });
      if (!rows.length) return;

      var n = CFG.groups.indexOf(g) + 1;
      h.push('<div style="margin-bottom:4px">');
      h.push('<div class="sechead"><div class="secn">' + String(n).padStart(2, '0') + '</div>' +
        '<div class="secname">' + esc(g.label) + '</div>' +
        '<div class="sub">' + rows.length + ' statuses' +
        (g.note ? ' · ' + esc(g.note) : '') + '</div></div>');

      h.push('<div class="shead"><div></div><div>Status</div>' +
        '<div class="hide-lg">Slot ID</div><div>Kind</div><div>Owner</div>' +
        '<div>Age Y / R</div><div class="hide-lg">Follow-up</div><div>Shown</div></div>');

      rows.forEach(function (s) {
        var tone = KIND_TONE[s.kind] || 'var(--dim)';
        var hidden = !s.visible;
        h.push('<div class="srow' + (SEL === s.slot_id ? ' sel' : '') + '" data-slot="' +
          esc(s.slot_id) + '"' + (hidden ? ' style="opacity:.45"' : '') + '>' +
          '<div class="sedge" style="background:' + tone + '"></div>' +
          '<div style="min-width:0"><div class="slabel"' +
          (hidden ? ' style="text-decoration:line-through"' : '') + '>' + esc(s.label) + '</div>' +
          '<div class="ssub">' + esc(s.customer_label || 'not shown to the customer') + '</div></div>' +
          '<div class="sslot hide-lg">' + esc(s.slot_id) + '</div>' +
          '<div><span class="schip" style="color:' + tone + ';border:1px solid ' + tone + '">' +
          esc(s.kind) + '</span></div>' +
          '<div class="scell">' + esc(s.owner_role) + '</div>' +
          '<div class="scell num">' + hours(s.age_yellow_hours) + ' / ' + hours(s.age_red_hours) + '</div>' +
          '<div class="scell num hide-lg">' + hours(s.follow_up_hours) + '</div>' +
          '<button class="visbtn' + (hidden ? '' : ' on') + '" data-vis="' + esc(s.slot_id) + '">' +
          (hidden ? 'Hidden' : 'Shown') + '</button></div>');
      });

      h.push('</div>');
    });

    $('mid').innerHTML = h.join('');

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-slot]'), function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.dataset.vis) return;
        SEL = el.dataset.slot;
        renderStatuses();
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-vis]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var s = CFG.statuses.filter(function (x) { return x.slot_id === b.dataset.vis; })[0];
        api('/api/config/statuses/' + encodeURIComponent(b.dataset.vis), {
          method: 'PATCH', body: JSON.stringify({ visible: s.visible ? 0 : 1 })
        }).then(reloadConfig);
      });
    });

    renderStatusDetail();
  }

  function renderStatusDetail() {
    var s = CFG.statuses.filter(function (x) { return x.slot_id === SEL; })[0];

    if (!s) {
      return detail('Reference', '<div style="font:400 11.5px/1.6 var(--font);color:var(--muted);' +
        'padding:12px 0">Pick a status to rename it, change who owns it, or retune its clocks.' +
        '<br><br>The identifier underneath each name never changes, so reports, notifications and ' +
        'automations keep working after a rename.</div>' +
        '<div class="dlbl" style="margin-top:14px">Kinds</div>' +
        [['milestone', 'a point passed, no work sits here'],
         ['queue', 'waiting for someone to pick it up'],
         ['active', 'work is happening now'],
         ['complete', 'that stage is finished']].map(function (k) {
          return '<div class="drow"><div class="dk"><span class="schip" style="color:' +
            KIND_TONE[k[0]] + ';border:1px solid ' + KIND_TONE[k[0]] + '">' + k[0] + '</span></div>' +
            '<div class="dv">' + esc(k[1]) + '</div></div>';
        }).join(''));
    }

    var group = CFG.groups.filter(function (g) { return g.group_id === s.group_id; })[0];

    detail('Status', '<div style="display:flex;flex-direction:column;gap:11px;margin-top:12px">' +
      '<div><div class="dlbl">Name in the shop</div>' +
      '<input class="dinput" id="eLabel" value="' + esc(s.label) + '"></div>' +
      '<div><div class="dlbl">Name shown to the customer</div>' +
      '<input class="dinput" id="eClabel" value="' + esc(s.customer_label || '') + '" ' +
      'placeholder="leave blank to hide it"></div>' +
      '<div><div class="dlbl">Owner role</div>' +
      '<input class="dinput" id="eOwner" value="' + esc(s.owner_role) + '"></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
      '<div><div class="dlbl">Warn at</div>' +
      '<input class="dinput" id="eYellow" value="' + (s.age_yellow_hours == null ? '' : hours(s.age_yellow_hours)) + '" placeholder="12h"></div>' +
      '<div><div class="dlbl">Red at</div>' +
      '<input class="dinput" id="eRed" value="' + (s.age_red_hours == null ? '' : hours(s.age_red_hours)) + '" placeholder="2d"></div>' +
      '</div>' +
      '<div><div class="dlbl">Follow-up every</div>' +
      '<input class="dinput" id="eFu" value="' + (s.follow_up_hours == null ? '' : hours(s.follow_up_hours)) + '" placeholder="24h"></div>' +
      '</div>' +

      '<div class="dlbl" style="margin-top:15px">Fixed</div>' +
      [['Slot ID', s.slot_id], ['Group', group ? group.label : s.group_id],
       ['Kind', s.kind], ['Lane', s.lane_key || 'not in a lane'],
       ['Counts to cycle', Number(s.counts_toward_cycle) ? 'yes' : 'no'],
       ['Terminal', Number(s.is_terminal) ? 'closes the file' : 'no'],
       ['Modules', s.module_tags || '—']].map(function (r) {
        return '<div class="drow"><div class="dk">' + esc(r[0]) + '</div>' +
          '<div class="dv">' + esc(r[1]) + '</div></div>';
      }).join('') +

      '<div class="row" style="margin-top:14px">' +
      '<button class="btn btn-solid" id="saveSlot">Save status</button>' +
      '<button class="btn btn-ghost" id="clearSlot">Cancel</button></div>' +
      '<div class="msg" id="dMsg"></div>' +
      '<div class="sub" style="margin-top:10px">Clocks accept hours or days — write ' +
      '<strong>12h</strong> or <strong>2d</strong>. Blank turns the clock off.</div>');

    $('clearSlot').addEventListener('click', function () { SEL = null; renderStatuses(); });

    $('saveSlot').addEventListener('click', function () {
      var body = {};
      if ($('eLabel').value.trim() !== s.label) body.label = $('eLabel').value.trim();
      if ($('eClabel').value.trim() !== (s.customer_label || '')) {
        body.customerLabel = $('eClabel').value.trim() || null;
      }
      if ($('eOwner').value.trim() !== s.owner_role) body.ownerRole = $('eOwner').value.trim();

      var y = toHours($('eYellow').value), rd = toHours($('eRed').value), fu = toHours($('eFu').value);
      if (y !== s.age_yellow_hours) body.ageYellowHours = y;
      if (rd !== s.age_red_hours) body.ageRedHours = rd;
      if (fu !== s.follow_up_hours) body.followUpHours = fu;

      if (!Object.keys(body).length) return say('Nothing changed.', 'ok');

      api('/api/config/statuses/' + encodeURIComponent(s.slot_id), {
        method: 'PATCH', body: JSON.stringify(body)
      }).then(reloadConfig).catch(function (e) { say(e.message, 'err'); });
    });
  }

  /* ======================================================== lanes */

  function renderLanes() {
    rail('Reference', [
      { k: 'gate-block', t: 'Block' }, { k: 'gate-warn', t: 'Warn' }, { k: 'gate-no', t: 'Ignore' }
    ]);

    var h = ['<div class="pad"><div style="font:400 11.5px/1.55 var(--font);color:var(--muted);' +
      'max-width:640px">A lane with its gate set to <strong>Block</strong> will not let a file start ' +
      'until every gating part is received. <strong>Warn</strong> lets it through with a flag. ' +
      'Switch a lane off and its statuses disappear from the board.</div></div>'];

    CFG.lanes.forEach(function (l) {
      h.push('<div class="card2"><div class="card2row" style="grid-template-columns:3px 1fr auto">' +
        '<div class="sedge" style="background:' + (l.enabled ? 'var(--acc)' : 'var(--line)') + '"></div>' +
        '<div><input class="dinput" data-lane-label="' + esc(l.lane_key) + '" value="' +
        esc(l.label) + '" style="max-width:220px"></div>' +
        '<button class="pchip' + (l.enabled ? ' on' : '') + '" data-lane-en="' + esc(l.lane_key) + '">' +

        '<div class="card2row" style="grid-template-columns:150px 1fr">' +
        '<div class="dk">Parts gate</div><div class="row">' +
        ['yes', 'warn', 'no'].map(function (g) {
          return '<button class="pchip' + (l.parts_gate === g ? ' on' : '') +
            '" data-gate="' + esc(l.lane_key) + '" data-val="' + g + '">' +
            (g === 'yes' ? 'Block' : g === 'warn' ? 'Warn' : 'Ignore') + '</button>';
        }).join('') + '</div></div>' +

        '<div class="card2row" style="grid-template-columns:150px 1fr">' +
        '<div class="dk">Owned by</div><div class="dv">' + esc(l.owner_role) +
        (l.module_tag ? ' · ' + esc(l.module_tag) : '') + '</div></div>' +

        '<div class="card2row" style="grid-template-columns:150px 1fr">' +
        '<div class="dk">Statuses</div><div class="dv">' +
        CFG.statuses.filter(function (s) { return s.lane_key === l.lane_key; }).length +
        ' in this lane</div></div></div>');
    });

    $('mid').innerHTML = h.join('');

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-gate]'), function (b) {
      b.addEventListener('click', function () {
        api('/api/config/lanes/' + b.dataset.gate, {
          method: 'PATCH', body: JSON.stringify({ partsGate: b.dataset.val })
        }).then(reloadConfig);
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-lane-en]'), function (b) {
      b.addEventListener('click', function () {
        var l = CFG.lanes.filter(function (x) { return x.lane_key === b.dataset.laneEn; })[0];
        api('/api/config/lanes/' + b.dataset.laneEn, {
          method: 'PATCH', body: JSON.stringify({ enabled: !l.enabled })
        }).then(reloadConfig);
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-lane-label]'), function (inp) {
      inp.addEventListener('change', function () {
        api('/api/config/lanes/' + inp.dataset.laneLabel, {
          method: 'PATCH', body: JSON.stringify({ label: inp.value.trim() })
        }).then(reloadConfig);
      });

    detail('Gates', '<div style="font:400 11.5px/1.6 var(--font);color:var(--muted);padding:12px 0">' +
      'The gate is the rule that stops a car moving into a lane before its parts are on the shelf. ' +
      'It is the single most useful setting on this page — set it to Block on Reassembly and a ' +
      'missing clip becomes visible on the board instead of a surprise on Friday.</div>' +
      '<div class="dlbl" style="margin-top:12px">Lanes on</div>' +
      CFG.lanes.map(function (l) {
        return '<div class="drow"><div class="dk">' + esc(l.label) + '</div>' +
          '<div class="dv">' + (l.enabled ? 'on' : 'off') + ' · gate ' +
          (l.parts_gate === 'yes' ? 'blocks' : l.parts_gate === 'warn' ? 'warns' : 'ignored') +
          '</div></div>';
      }).join(''));
  }

  /* ============================================ notification groups */

  function renderNotify() {
    rail('Groups', GROUPS.groups.map(function (g) {
      return { k: String(g.id), t: g.name, c: g.positions.length + g.users.length };
    }).concat([{ k: 'new', t: '+ New group' }]));

    if (RAIL === 'new') return renderNewGroup();

    var list = GROUPS.groups.filter(function (g) { return !RAIL || String(g.id) === RAIL; });
    var h = ['<div class="pad"><div style="font:400 11.5px/1.55 var(--font);color:var(--muted);' +
      'max-width:660px">A group is a list of recipients and the events it wants. Put positions in it, ' +
      'people in it, or both. <strong>Owned</strong> scope means the group only hears about statuses ' +
      'its positions own — that is what keeps the painter out of disassembly traffic.</div></div>'];

    list.forEach(function (g) {
      h.push('<div class="card2" data-group="' + g.id + '">');
      h.push('<div class="card2row" style="grid-template-columns:1fr auto">' +
        '<div><input class="dinput g-name" value="' + esc(g.name) + '" style="max-width:260px">' +
        '<input class="dinput g-desc" value="' + esc(g.description || '') + '" ' +
        'placeholder="What it is for" style="margin-top:7px"></div>' +
        '<button class="btn btn-danger" data-delgroup="' + g.id + '" ' +
        'style="padding:5px 10px;font-size:10.5px">Delete</button></div>');

      h.push('<div class="card2row" style="grid-template-columns:150px 1fr">' +
        '<div class="dk">Positions</div><div class="row">' +
        CFG.positions.map(function (p) {
          var on = g.positions.indexOf(p.position_key) >= 0;
          return '<button class="pchip' + (on ? ' on' : '') + '" data-pos="' + esc(p.position_key) +
            '" data-on="' + (on ? 1 : 0) + '">' + esc(p.label) + '</button>';
        }).join('') + '</div></div>');

      h.push('<div class="card2row" style="grid-template-columns:150px 1fr">' +
        '<div class="dk">Named people</div><div class="row">' +
        (GROUPS.staff.length
          ? GROUPS.staff.map(function (st) {
              var on = g.users.indexOf(st.user_id) >= 0;
              return '<button class="pchip' + (on ? ' on' : '') + '" data-usr="' + st.user_id +
                '" data-on="' + (on ? 1 : 0) + '">' + esc(st.display_name) + '</button>';
            }).join('')
          : '<span class="sub">Nobody on staff yet.</span>') + '</div></div>');

      h.push('<div class="card2row" style="grid-template-columns:1fr;padding-bottom:4px">' +
        '<div class="dlbl" style="margin:0">Events</div></div>');

      h.push('<div style="padding:0 13px 11px">');
      GROUPS.events.forEach(function (ev) {
        var sub = g.events.filter(function (x) { return x.event_key === ev.key; })[0];
        var on = sub && sub.enabled;
        h.push('<div class="evrow" data-ev="' + esc(ev.key) + '"' + (on ? '' : ' style="opacity:.5"') + '>' +
          '<div class="sedge" style="background:' + (on ? 'var(--done)' : 'var(--line)') + '"></div>' +
          '<div><div style="font:400 11.5px var(--font)">' + esc(ev.label) + '</div>' +
          (ev.key === 'sms.reply'
            ? '<div class="ssub">Needs SMS, which is not switched on.</div>' : '') + '</div>' +
          '<select class="dsel ev-scope"' + (on ? '' : ' disabled') + '>' +
          '<option value="owned"' + (sub && sub.scope === 'owned' ? ' selected' : '') + '>Owned only</option>' +
          '<option value="any"' + (sub && sub.scope === 'any' ? ' selected' : '') + '>Anything</option>' +
          '</select>' +
          '<div class="sub">' + (on ? 'in app' : 'off') + '</div>' +
          '<button class="pchip' + (on ? ' on' : '') + '" data-evon="' + (on ? 1 : 0) + '">' +
          (on ? 'On' : 'Off') + '</button></div>');
      });
      h.push('</div>');

      h.push('<div class="card2row" style="grid-template-columns:1fr">' +
        '<div class="row"><button class="btn btn-solid" data-savegroup="' + g.id + '">Save group</button>' +
        '<span class="sub" id="gmsg-' + g.id + '"></span></div></div>');
      h.push('</div>');
    });

    $('mid').innerHTML = h.join('');
    wireGroups();

    var resolved = GROUPS.groups.reduce(function (a, g) {
      return a + g.positions.length + g.users.length;
    }, 0);
    detail('Routing', '<div style="font:400 11.5px/1.6 var(--font);color:var(--muted);padding:12px 0">' +
      'Notifications are in-app only for now. Email and SMS delivery are switched off at the ' +
      'platform level until they are wired up.</div>' +
      '<div class="dlbl" style="margin-top:12px">Now</div>' +
      '<div class="drow"><div class="dk">Groups</div><div class="dv">' + GROUPS.groups.length + '</div></div>' +
      '<div class="drow"><div class="dk">Recipients</div><div class="dv">' + resolved + ' entries</div></div>' +
      '<div class="drow"><div class="dk">Events</div><div class="dv">' + GROUPS.events.length +
      ' available</div></div>' +
      '<div class="sub" style="margin-top:12px">A person on three groups that all want the same event ' +
      'still gets one notification.</div>');
  }

  function renderNewGroup() {
    $('mid').innerHTML = '<div class="pad"><div class="card2" style="margin:0">' +
      '<div class="card2row" style="grid-template-columns:1fr">' +
      '<div class="dlbl">New group</div>' +
      '<input class="dinput" id="gName" placeholder="Name, e.g. Paint bench">' +
      '<input class="dinput" id="gDesc" placeholder="What it is for" style="margin-top:8px">' +
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn btn-solid" id="addGroup">Create</button>' +
      '<button class="btn btn-ghost" id="cancelGroup">Cancel</button></div>' +
      '<div class="msg" id="dMsg"></div></div></div></div>';

    $('cancelGroup').addEventListener('click', function () { RAIL = null; render(); });
    $('addGroup').addEventListener('click', function () {
      var name = $('gName').value.trim();
      if (!name) return say('A name is required.', 'err');
      api('/api/admin/notification-groups', {
        method: 'POST', body: JSON.stringify({ name: name, description: $('gDesc').value.trim() })
      }).then(function () { RAIL = null; return reloadGroups(); }).catch(function (e) { say(e.message, 'err'); });
    });

    detail('New group', '<div style="font:400 11.5px/1.6 var(--font);color:var(--muted);padding:12px 0">' +
      'Name it after the bench or the desk, not the person — people move.</div>');
  }

  function wireGroups() {
    Array.prototype.forEach.call($('mid').querySelectorAll('.pchip[data-pos], .pchip[data-usr]'),
      function (b) {
        b.addEventListener('click', function () {
          var on = b.dataset.on !== '1';
          b.dataset.on = on ? '1' : '0';
          b.classList.toggle('on', on);
        });
      });

    Array.prototype.forEach.call($('mid').querySelectorAll('.pchip[data-evon]'), function (b) {
      b.addEventListener('click', function () {
        var on = b.dataset.evon !== '1';
        b.dataset.evon = on ? '1' : '0';
        b.classList.toggle('on', on);
        b.textContent = on ? 'On' : 'Off';
        var row = b.closest('.evrow');
        row.style.opacity = on ? '1' : '.5';
        row.querySelector('.ev-scope').disabled = !on;
        row.querySelector('.sedge').style.background = on ? 'var(--done)' : 'var(--line)';
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-savegroup]'), function (b) {
      b.addEventListener('click', function () {
        var card = b.closest('[data-group]');
        var body = {
          name: card.querySelector('.g-name').value.trim(),
          description: card.querySelector('.g-desc').value.trim(),
          positions: Array.prototype.slice.call(card.querySelectorAll('.pchip[data-pos]'))
            .filter(function (c) { return c.dataset.on === '1'; })
            .map(function (c) { return c.dataset.pos; }),
          users: Array.prototype.slice.call(card.querySelectorAll('.pchip[data-usr]'))
            .filter(function (c) { return c.dataset.on === '1'; })
            .map(function (c) { return Number(c.dataset.usr); }),
          events: Array.prototype.slice.call(card.querySelectorAll('.evrow')).map(function (row) {
            return {
              key: row.dataset.ev,
              enabled: row.querySelector('.pchip[data-evon]').dataset.evon === '1',
              scope: row.querySelector('.ev-scope').value
            };
          })
        };
        api('/api/admin/notification-groups/' + b.dataset.savegroup, {
          method: 'PUT', body: JSON.stringify(body)
        }).then(reloadGroups).catch(function (e) { alert(e.message); });
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-delgroup]'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Delete this group? Nobody in it will be notified any more.')) return;
        api('/api/admin/notification-groups/' + b.dataset.delgroup, { method: 'DELETE' })
          .then(function () { RAIL = null; return reloadGroups(); });
      });
    });
  }

        '</div>' +
        '<div class="pcell">' + roleCell(p) + '</div>' +
        '<div class="pcell hide-sm">' + esc(tradeNames(p) || '—') + '</div>' +
        '<div class="pcell hide-sm">' + payCell(p) + '</div>' +
        '<div class="row" style="gap:6px;justify-content:flex-end">' +
          '<button class="visbtn" data-edit="' + p.id + '">Edit</button>' +
          '<button class="visbtn" data-more="' + p.id + '" title="Sign-in and removal" ' +
            'aria-label="Sign-in and removal for ' + esc(p.name) + '">\u22ef</button>' +
        '</div>' +
        '<div class="row" data-morebox="' + p.id + '" hidden ' +
          'style="grid-column:1/-1;gap:6px;justify-content:flex-end;padding:0 0 8px">' +
          '<button class="visbtn" data-code="' + p.id + '">Sign-in code</button>' +
          '<button class="visbtn" data-reset="' + p.id + '">Reset password</button>' +
          (p.id === ME.user.id
            ? '<span class="ssub">this is you</span>'
            : '<button class="visbtn" data-remove="' + p.id + '" ' +
              'style="color:var(--stopped);border-color:var(--stopped)">Remove</button>') +
        '</div>' +
      '</div>');
    });

    /* Paint materials is a shop figure rather than a person's, so it stays on
       the screen; everything about one person is in that person's sheet now. */
    if (RATES && RATES.canEdit) {
      h.push('<div class="pad" style="padding-top:14px"><div class="card2">' +
        '<div class="card2row" style="grid-template-columns:1fr">' +
        '<div class="dlbl">Paint materials</div>' +
        '<div class="row" style="margin-top:6px">' +
        '<span class="sub">Per paint hour</span>' +
        '<input class="dinput" id="matRate" style="width:110px;text-align:right" value="' +
          esc(dollars(RATES.materialsRateCents)) + '">' +
        '<button class="btn" id="matSave">Save</button>' +
        '</div>' +
        '<div class="sub" style="margin-top:8px">Used when paint labor is punched in as hours. ' +
        'A car with no paint hours takes a flat figure on the close-out sheet instead.</div>' +
        '</div></div></div>');
    }

    h.push('<div id="removedBox"></div>');

    $('mid').innerHTML = h.join('');
    wirePeople();
    loadRemoved();

    detail('Access', '<div style="font:400 11.5px/1.6 var(--font);color:var(--muted);padding:12px 0">' +
      'Roles decide what someone can see and change — a person can hold several and gets the union of ' +
      'all of them. The highest-ranked one, marked •, is their primary: what they are called, and who ' +
      'notifications treat them as. Trades decide which lanes they own and which cars they are offered ' +
      'for; someone who works two trades appears in both dropdowns.</div>' +
      '<div class="dlbl" style="margin-top:12px">Roles</div>' +
      [['Owner', 'everything, including this page'],
       ['Accounting', 'money and reports, no production'],
       ['Estimator', 'files, money, supplements, imports'],
       ['Production manager', 'the board and assignments'],
       ['Parts manager', 'parts and vendors'],
       ['Front office', 'customers, scheduling, documents'],
       ['Salesperson', 'leads and the sales app'],
       ['Technician', 'only the files assigned to them']].map(function (r) {
        return '<div class="drow"><div class="dk">' + esc(r[0]) + '</div>' +
          '<div class="dv">' + esc(r[1]) + '</div></div>';
      }).join(''));
  }

  /** Chip groups are sets: the picked values, in the order the chips render. */
  function chipValues(scope, attr) {
    return Array.prototype.filter.call(scope.querySelectorAll('[data-' + attr + ']'), function (b) {
      return b.classList.contains('on');
    }).map(function (b) { return b.dataset[attr]; });
  }

  /** One delegated handler for every chip set on the page. */
  function wireChips() {
    $('mid').addEventListener('click', function (e) {
      var chip = e.target.closest && e.target.closest('.setchip');
      if (!chip) return;
      e.preventDefault();
      var set = chip.parentElement;
      var roleSet = !!chip.dataset.role;
      if (roleSet && chip.classList.contains('on') && chipValues(set, 'role').length === 1) {
        return say('Everyone needs at least one role.', 'err');
      }
      chip.classList.toggle('on');
      if (roleSet) {
        /* The primary is the highest-ranked role held, and ROLES arrives in rank
           order — so it is the first chip still on. */
        var first = true;
        Array.prototype.forEach.call(set.querySelectorAll('[data-role]'), function (b) {
          var on = b.classList.contains('on');
          b.classList.toggle('primary', on && first);
          if (on) first = false;
        });
      }
    });
  }

  function money(c) {
    return '$' + ((Number(c) || 0) / 100).toLocaleString('en-US',
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  /** Cents as a bare editable number. */
  function dollars(c) { return ((Number(c) || 0) / 100).toFixed(2); }
  function dollarsToCents(v) {
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
    return isNaN(n) ? 0 : Math.round(n * 100);
  }

  function wirePeople() {
    wireChips();

    /* Search and the filter chips are view state, so they redraw and nothing else. */
    var sq = $('pSearch');
    if (sq) {
      sq.addEventListener('input', function () {
        PQ = sq.value;
        var at = sq.selectionStart;
        render();
        var again = $('pSearch');
        if (again) { again.focus(); again.setSelectionRange(at, at); }
      });
    }

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-pf]'), function (b) {
      b.addEventListener('click', function () { PFILTER = b.dataset.pf; render(); });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-edit]'), function (b) {
      b.addEventListener('click', function () { openSheet(Number(b.dataset.edit)); });
    });

    /* Sign-in code, password and remove are rare and dangerous, so they are one
       tap behind the row rather than sitting in every one of them. */
    Array.prototype.forEach.call($('mid').querySelectorAll('[data-more]'), function (b) {
      b.addEventListener('click', function () {
        var box = $('mid').querySelector('[data-morebox="' + b.dataset.more + '"]');
        if (box) box.hidden = !box.hidden;
      });
    });

    var mr = $('matSave');
    if (mr) mr.addEventListener('click', function () {
      api('/api/shop/materials-rate', {
        method: 'PATCH', body: JSON.stringify({ cents: dollarsToCents($('matRate').value) })
      }).then(function (res) {
        RATES.materialsRateCents = res.cents;
        say('Paint materials saved.', 'ok');
      }).catch(function (e) { say(e.message, 'err'); });
    });

    var ap = $('addPerson');
    if (ap) ap.addEventListener('click', function () { openSheet(null); });



    Array.prototype.forEach.call($('mid').querySelectorAll('[data-code]'), function (b) {
      b.addEventListener('click', function () {
        api('/api/admin/people/' + b.dataset.code + '/code', { method: 'POST' })
          .then(function (r) {
            say('Sign-in code: ' + r.code + ' — write it down, it is shown once.', 'ok');
          }).catch(function (e) { say(e.message, 'err'); });
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-reset]'), function (b) {
      b.addEventListener('click', function () {
        var who = PEOPLE.people.filter(function (p) { return p.id === Number(b.dataset.reset); })[0];
        var chosen = prompt('Temporary password for ' + (who ? who.name : 'this person') +
          '.\n\nType one to hand over, or leave blank and the app will generate one.\n' +
          'Either way they must change it at first sign-in, and every session they have ends now.', '');
        if (chosen === null) return;

        api('/api/admin/people/' + b.dataset.reset + '/reset-password', {
          method: 'POST',
          body: JSON.stringify(chosen.trim() ? { password: chosen.trim() } : {})
        }).then(function (r) {
          say('Temporary password for ' + (who ? who.name : 'them') + ': ' + r.tempPassword +
            ' — they must change it at first sign-in.', 'ok');
        }).catch(function (e) { say(e.message, 'err'); });
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-remove]'), function (b) {
      b.addEventListener('click', function () {
        var who = PEOPLE.people.filter(function (p) { return p.id === Number(b.dataset.remove); })[0];
        if (!confirm('Remove ' + (who ? who.name : 'this person') + ' from the shop?\n\n' +
          'They are signed out immediately and can no longer sign in. Their name stays on the work ' +
          'they did — the history is the shop\u2019s record. You can put them back later.')) return;

        api('/api/admin/people/' + b.dataset.remove, { method: 'DELETE' })
          .then(function (r) {
            say('Removed.' +
              (r.openFiles ? ' They were on ' + r.openFiles + ' open file' +
                (r.openFiles === 1 ? '' : 's') + ' — reassign those.' : '') +
              (r.disabled ? ' The account is switched off entirely.' : ''), 'ok');
            return reloadPeople();
          }).catch(function (e) { say(e.message, 'err'); });
      });
    });
  }

  /* =====================================================================
     The person sheet. One person, three tabs: who they are, what they may do,
     and what they are paid. Add someone opens the same sheet with nothing in
     it, so there is one form rather than a panel and a row that disagree.
     ===================================================================== */

  var JOB_LABELS = [
    ['wholesale', 'Wholesale', 'dealer work, billed to the client'],
    ['insurance', 'Retail and insurance', 'anything with an estimate behind it'],
    ['cash', 'Cash quote', 'customer paying out of pocket']
  ];

  function openSheet(userId) {
    var p = userId
      ? PEOPLE.people.filter(function (x) { return x.id === userId; })[0]
      : null;
    if (userId && !p) return;

    SHEET = {
      id: userId,
      tab: 'details',
      name: p ? p.name : '',
      email: p ? (p.email || '') : '',
      code: p ? (p.employee_code || '') : '',
      password: '',
      roles: p ? rolesOf(p).slice() : ['technician'],
      trades: p ? tradesOf(p).slice() : [],
      plans: null,
      loadingPlans: false
    };
    $('shScrim').hidden = false;
    $('sheet2').hidden = false;
    drawSheet();
  }

  function closeSheet() {
    SHEET = null;
    $('sheet2').hidden = true;
    $('sheet2').innerHTML = '';
    $('shScrim').hidden = true;
  }

  function shsay(t, bad) {
    var el = $('shMsg');
    if (!el) return;
    el.textContent = t;
    el.className = 'msg ' + (bad ? 'err' : 'ok');
  }

  function drawSheet() {
    var s = SHEET;
    if (!s) return;
    var initials = String(s.name || '?').split(/\s+/).map(function (w) { return w[0]; })
      .join('').slice(0, 2).toUpperCase();

    var tabs = [['details', 'Details'], ['access', 'Access']];
    if (RATES && s.id) tabs.push(['pay', 'Pay']);

    $('sheet2').innerHTML =
      '<div class="sh-head">' +
        '<div class="avatar2" style="width:32px;height:32px;font-size:12px">' +
          esc(s.id ? initials : '+') + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font:500 14px var(--font)">' +
            esc(s.id ? (s.name || 'Unnamed') : 'Add someone') + '</div>' +
          '<div class="sub" style="text-transform:none;letter-spacing:0">' +
            (s.id
              ? esc([roleNames({ roles: s.roles }), tradeNames({ positionKeys: s.trades })]
                  .filter(Boolean).join(' · ') || 'no roles yet')
              : 'They appear in the list as soon as you save') + '</div>' +
        '</div>' +
        '<button class="ghostbtn" id="shX" aria-label="Close">×</button>' +
      '</div>' +
      '<div class="sh-tabs">' + tabs.map(function (t) {
        return '<button class="sh-tab' + (s.tab === t[0] ? ' on' : '') + '" data-shtab="' +
          t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="sh-body" id="shBody"></div>' +
      '<div class="sh-foot">' +
        '<span class="sub" id="shHint" style="text-transform:none;letter-spacing:0"></span>' +
        '<button class="ghostbtn sp" id="shCancel" style="margin-left:auto">Cancel</button>' +
        '<button class="btn btn-solid" id="shSave">Save</button>' +
      '</div>';

    var body = $('shBody');
    if (s.tab === 'details') body.innerHTML = sheetDetails();
    else if (s.tab === 'access') body.innerHTML = sheetAccess();
    else body.innerHTML = sheetPay();

    body.insertAdjacentHTML('beforeend', '<div class="msg" id="shMsg"></div>');

    $('shHint').textContent = s.tab === 'pay'
      ? 'Changes apply to files closed from here on'
      : s.id ? '' : 'Leave the email blank and they get a sign-in code instead';

    Array.prototype.forEach.call($('sheet2').querySelectorAll('[data-shtab]'), function (b) {
      b.addEventListener('click', function () {
        readSheet();
        SHEET.tab = b.dataset.shtab;
        if (SHEET.tab === 'pay' && !SHEET.plans) return loadPlans();
        drawSheet();
      });
    });
    $('shX').addEventListener('click', closeSheet);
    $('shCancel').addEventListener('click', closeSheet);
    $('shSave').addEventListener('click', saveSheet);

    wireSheetChips();
    wirePayBlocks();
  }

  function sheetDetails() {
    var s = SHEET;
    return '<div class="sh-grid">' +
        '<div class="sh-f"><div class="k">Name</div>' +
          '<input class="dinput" id="shName" value="' + esc(s.name) + '"></div>' +
        '<div class="sh-f"><div class="k">Email — optional</div>' +
          '<input class="dinput" id="shEmail" type="email" value="' + esc(s.email) + '" ' +
          'placeholder="no email — code sign-in"></div>' +
        '<div class="sh-f"><div class="k">Employee code</div>' +
          '<input class="dinput" id="shCode" value="' + esc(s.code) + '"></div>' +
        (s.id ? '' :
          '<div class="sh-f"><div class="k">Temporary password — optional</div>' +
          '<input class="dinput" id="shPass" placeholder="leave blank to generate one"></div>') +
      '</div>' +
      '<div class="sub" style="text-transform:none;letter-spacing:0">' +
        'Email is what they sign in with. Leave it blank and they get a short code instead — ' +
        'good enough for the floor. Add an email later and they set their own password.</div>';
  }

  function sheetAccess() {
    var s = SHEET;
    return '<div class="sh-f"><div class="k">Roles — tick every one they hold</div>' +
        '<div class="chipset" id="shRoles">' + ROLES.map(function (r) {
          return '<button type="button" class="setchip' +
            (s.roles.indexOf(r.key) >= 0 ? ' on' : '') + '" data-role="' + esc(r.key) + '">' +
            esc(r.label) + '</button>';
        }).join('') + '</div></div>' +
      '<div class="sh-f"><div class="k">Trades — every one they work</div>' +
        '<div class="chipset" id="shTrades">' + CFG.positions.map(function (x) {
          return '<button type="button" class="setchip' +
            (s.trades.indexOf(x.position_key) >= 0 ? ' on' : '') + '" data-trade="' +
            esc(x.position_key) + '">' + esc(x.label) + '</button>';
        }).join('') + '</div></div>' +
      '<div class="sub" style="text-transform:none;letter-spacing:0">' +
        'Someone holding several roles gets the union of all of them, and the highest-ranked ' +
        'is what they are called. Trades decide which lanes they own and which cars they are ' +
        'offered for.</div>';
  }

  /**
   * Pay, per job type, because the shop pays differently by job type. A
   * percentage carries two figures — with paint and body only — and runs off
   * the approved amount after any parts we bought come out at cost.
   */
  function sheetPay() {
    var s = SHEET;
    if (!s.plans) return '<div class="sub">Loading…</div>';
    if (!RATES.canEdit) {
      return '<div class="sub" style="text-transform:none;letter-spacing:0">' +
        'Pay plans are the owner\u2019s and accounting\u2019s.</div>';
    }

    return JOB_LABELS.map(function (j, i) {
      var pl = s.plans[i];
      return '<div class="payblock" data-pay="' + i + '">' +
        '<div class="payhead"><span class="t">' + esc(j[1]) + '</span>' +
          '<span class="n">' + esc(j[2]) + '</span></div>' +
        '<div class="payseg">' +
          '<button type="button" data-paybasis="' + i + '" data-b="pct"' +
            (pl.basis === 'pct' ? ' class="on"' : '') + ' title="Percent of billed">%</button>' +
          '<button type="button" data-paybasis="' + i + '" data-b="hours"' +
            (pl.basis === 'hours' ? ' class="on"' : '') + '>Flag hours</button>' +
          '<button type="button" data-paybasis="' + i + '" data-b="flat"' +
            (pl.basis === 'flat' ? ' class="on"' : '') + '>Flat</button>' +
        '</div>' +
        (pl.basis === 'pct'
          ? '<div class="sh-grid">' +
              '<div class="sh-f"><div class="k">If the file has paint</div>' +
                '<input class="dinput" data-paypct="' + i + '" style="text-align:right" value="' +
                esc(String(pl.pctPaint)) + '"></div>' +
              '<div class="sh-f"><div class="k">Body only</div>' +
                '<input class="dinput" data-paynopaint="' + i + '" style="text-align:right" value="' +
                esc(String(pl.pctNoPaint)) + '"></div>' +
            '</div>'
          : '<div class="sh-f" style="max-width:200px"><div class="k">' +
              (pl.basis === 'flat' ? 'Per car' : 'Flag rate, per hour') + '</div>' +
              '<input class="dinput" data-payrate="' + i + '" style="text-align:right" value="' +
              esc(dollars(pl.rateCents)) + '"></div>') +
      '</div>';
    }).join('') +
    '<div class="sub" style="text-transform:none;letter-spacing:0">' +
      'A percentage runs off the approved amount after any parts we bought come out at cost — ' +
      'a $450 car with no parts on it pays 12.5% of $450. Files already closed keep the plan ' +
      'they settled on.</div>';
  }

  function loadPlans() {
    SHEET.plans = null;
    drawSheet();
    api('/api/staff/' + SHEET.id + '/pay-plans').then(function (d) {
      if (!SHEET) return;
      SHEET.plans = d.plans;
      drawSheet();
    }).catch(function (e) {
      if (!SHEET) return;
      SHEET.tab = 'details';
      drawSheet();
      shsay(e.message, true);
    });
  }

  function wireSheetChips() {
    var scope = $('sheet2');
    Array.prototype.forEach.call(scope.querySelectorAll('#shRoles [data-role]'), function (b) {
      b.addEventListener('click', function () {
        var on = b.classList.contains('on');
        if (on && SHEET.roles.length === 1) return shsay('Everyone needs at least one role.', true);
        b.classList.toggle('on');
        SHEET.roles = on
          ? SHEET.roles.filter(function (k) { return k !== b.dataset.role; })
          : SHEET.roles.concat([b.dataset.role]);
      });
    });
    Array.prototype.forEach.call(scope.querySelectorAll('#shTrades [data-trade]'), function (b) {
      b.addEventListener('click', function () {
        var on = b.classList.contains('on');
        b.classList.toggle('on');
        SHEET.trades = on
          ? SHEET.trades.filter(function (k) { return k !== b.dataset.trade; })
          : SHEET.trades.concat([b.dataset.trade]);
      });
    });
  }

  function wirePayBlocks() {
    var scope = $('sheet2');
    Array.prototype.forEach.call(scope.querySelectorAll('[data-paybasis]'), function (b) {
      b.addEventListener('click', function () {
        readSheet();
        SHEET.plans[Number(b.dataset.paybasis)].basis = b.dataset.b;
        drawSheet();
      });
    });
  }

  /** Whatever is on screen, back into SHEET, before anything redraws or saves. */
  function readSheet() {
    if (!SHEET) return;
    if ($('shName')) SHEET.name = $('shName').value.trim();
    if ($('shEmail')) SHEET.email = $('shEmail').value.trim();
    if ($('shCode')) SHEET.code = $('shCode').value.trim();
    if ($('shPass')) SHEET.password = $('shPass').value.trim();
    if (SHEET.plans) {
      SHEET.plans.forEach(function (pl, i) {
        var pct = $('sheet2').querySelector('[data-paypct="' + i + '"]');
        var nop = $('sheet2').querySelector('[data-paynopaint="' + i + '"]');
        var rate = $('sheet2').querySelector('[data-payrate="' + i + '"]');
        if (pct) pl.pctPaint = parseFloat(pct.value) || 0;
        if (nop) pl.pctNoPaint = parseFloat(nop.value) || 0;
        if (rate) pl.rateCents = dollarsToCents(rate.value);
      });
    }
  }

  function saveSheet() {
    readSheet();
    var s = SHEET;
    if (!s.name) return shsay('A name is required.', true);
    if (!s.roles.length) return shsay('Tick at least one role.', true);

    var btn = $('shSave');
    btn.disabled = true;

    var work;
    if (!s.id) {
      work = api('/api/admin/people', {
        method: 'POST',
        body: JSON.stringify({
          name: s.name,
          email: s.email || undefined,
          useCode: !s.email && !s.password,
          password: s.password || undefined,
          roles: s.roles,
          positionKeys: s.trades,
          employeeCode: s.code || undefined
        })
      }).then(function (r) {
        var extra = (r.loginCode || r.code) ? ' Sign-in code: ' + (r.loginCode || r.code)
          : r.tempPassword ? ' Temporary password: ' + r.tempPassword +
            ' — they must change it at first sign-in.' : '';
        say('Added.' + extra, 'ok');
      });
    } else {
      var was = PEOPLE.people.filter(function (x) { return x.id === s.id; })[0] || {};
      var jobs = [];
      if (s.name !== was.name) {
        jobs.push(['/api/admin/people/' + s.id + '/name', 'PATCH', { name: s.name }]);
      }
      if (s.email !== (was.email || '')) {
        jobs.push(['/api/admin/people/' + s.id + '/email', 'PATCH', { email: s.email || null }]);
      }
      var body = {};
      if (s.roles.join(',') !== rolesOf(was).join(',')) body.roles = s.roles;
      if (s.trades.join(',') !== tradesOf(was).join(',')) body.positionKeys = s.trades;
      if (s.code !== (was.employee_code || '')) body.employeeCode = s.code;
      if (Object.keys(body).length) jobs.push(['/api/admin/people/' + s.id, 'PATCH', body]);
      if (s.plans && RATES && RATES.canEdit) {
        jobs.push(['/api/staff/' + s.id + '/pay-plans', 'PUT', { plans: s.plans }]);
      }

      /* In sequence, so a rejected email does not hide a saved role. */
      work = jobs.reduce(function (chain, j) {
        return chain.then(function () {
          return api(j[0], { method: j[1], body: JSON.stringify(j[2]) });
        });
      }, Promise.resolve()).then(function () { say('Saved.', 'ok'); });
    }

    work.then(function () {
      closeSheet();
      return reloadPeople();
    }).then(function () {
      return api('/api/staff/rates').catch(function () { return RATES; });
    }).then(function (r) {
      RATES = r;
      render();
    }).catch(function (e) {
      btn.disabled = false;
      shsay(e.message, true);
    });
  }

  /** Anyone taken off the shop, with a way back on. */
  function loadRemoved() {
    api('/api/admin/people/removed').then(function (d) {
      var box = $('removedBox');
      if (!box || !d.removed.length) return;

      box.innerHTML = '<div class="pad" style="padding-top:6px">' +
        '<div class="dlbl">Removed</div>' +
        '<div class="sub" style="margin-bottom:8px">Off the shop and unable to sign in. Their work ' +
        'history is intact.</div>' +
        d.removed.map(function (r) {
          return '<div class="prow2" style="opacity:.7">' +
            '<div class="avatar2">' +
            esc(String(r.display_name || '?').split(/\s+/).map(function (w) { return w[0]; })
              .join('').slice(0, 2).toUpperCase()) + '</div>' +
            '<div style="min-width:0"><div class="slabel">' + esc(r.display_name) + '</div>' +
            '<div class="ssub">' + esc((r.user && r.user.email) || 'no email') + '</div></div>' +
            '<select class="dsel r-role" data-for="' + r.user_id + '">' +
            ROLES.map(function (x) {
              return '<option value="' + esc(x.key) + '">' + esc(x.label) + '</option>';
            }).join('') + '</select>' +
            '<div class="ssub hide-sm">' + esc(r.position_key || 'no position') + '</div>' +
            '<div class="ssub hide-sm">removed</div>' +
            '<div><button class="visbtn" data-restore="' + r.user_id + '" ' +
            'style="color:var(--done);border-color:var(--done)">Put back</button></div></div>';
        }).join('') + '</div>';

      Array.prototype.forEach.call(box.querySelectorAll('[data-restore]'), function (b) {
        b.addEventListener('click', function () {
          var sel = box.querySelector('.r-role[data-for="' + b.dataset.restore + '"]');
          api('/api/admin/people/' + b.dataset.restore + '/restore', {
            method: 'POST',
            body: JSON.stringify({ role: sel ? sel.value : 'technician' })
          }).then(function () {
            say('Put back on the shop. Give them a password or a code.', 'ok');
            return reloadPeople();
          }).catch(function (e) { say(e.message, 'err'); });
        });
      });
    }).catch(function () { /* nothing removed, or no access */ });
  }

  /* ------------------------------------------------------- shop hours */

  var DAYS7 = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  function renderHours() {
    api('/api/config/hours').then(function (r) {
      var byDow = {};
      (r.hours || []).forEach(function (h) { byDow[Number(h.dow)] = h; });

      var rows = DAYS7.map(function (name, dow) {
        var h = byDow[dow] || { open_time: '08:00:00', close_time: '17:00:00', closed: dow === 0 || dow === 6 };
        var off = Number(h.closed) === 1;
        return '<div class="card2row" style="grid-template-columns:110px 1fr 1fr auto;' +
          'align-items:center;gap:10px;padding:6px 0">' +
          '<div style="font:500 12.5px var(--font)' + (off ? ';opacity:.55' : '') + '">' +
          name + '</div>' +
          '<div><input class="dinput" type="time" id="hopen' + dow + '" value="' +
          esc(String(h.open_time).slice(0, 5)) + '"' + (off ? ' disabled' : '') + '></div>' +
          '<div><input class="dinput" type="time" id="hclose' + dow + '" value="' +
          esc(String(h.close_time).slice(0, 5)) + '"' + (off ? ' disabled' : '') + '></div>' +
          '<button class="pchip' + (off ? '' : ' on') + '" data-hday="' + dow + '" ' +
          'data-on="' + (off ? 0 : 1) + '">' + (off ? 'Closed' : 'Open') + '</button>' +
          '</div>';
      }).join('');

      document.getElementById('hoursBody').innerHTML =
        '<div style="margin-bottom:8px">' + rows + '</div>' +
        '<div class="row" style="margin-top:10px">' +
        '<button class="btn btn-solid" id="saveHours">Save hours</button></div>' +
        '<div class="sub" style="margin-top:8px">Times are ' + esc(r.timezone || 'the shop timezone') +
        '. Closing has to be after opening \u2014 an overnight shift is not something the ' +
        'scheduler can express yet.</div>';

      Array.prototype.forEach.call(document.querySelectorAll('[data-hday]'), function (b) {
        b.addEventListener('click', function () {
          var on = b.dataset.on !== '1', dow = b.dataset.hday;
          b.dataset.on = on ? '1' : '0';
          b.classList.toggle('on', on);
          b.textContent = on ? 'Open' : 'Closed';
          document.getElementById('hopen' + dow).disabled = !on;
          document.getElementById('hclose' + dow).disabled = !on;
        });
      });

      document.getElementById('saveHours').addEventListener('click', function () {
        var hours = DAYS7.map(function (_, dow) {
          var b = document.querySelector('[data-hday="' + dow + '"]');
          return {
            dow: dow,
            open: document.getElementById('hopen' + dow).value || '08:00',
            close: document.getElementById('hclose' + dow).value || '17:00',
            closed: b.dataset.on !== '1'
          };
        });
        api('/api/config/hours', { method: 'PUT', body: JSON.stringify({ hours: hours }) })
          .then(function () { say('Shop hours saved.', 'ok'); })
          .catch(function (e) { say(e.message, 'err'); });
      });
    }).catch(function (e) {
      document.getElementById('hoursBody').textContent = e.message;
    });
  }

  /* --------------------------------------------------- holidays */

  var HOLYEAR = new Date().getFullYear();
  var MANUAL = [];

  function renderHolidays() {
    api('/api/config/closures?year=' + HOLYEAR).then(function (r) {
      MANUAL = (r.manual || []).map(function (m) {
        return { date: m.on_date, kind: m.kind,
          open: String(m.open_time || '08:00').slice(0, 5),
          close: String(m.close_time || '12:00').slice(0, 5),
          label: m.label };
      });
      paintHolidays(r.holidays || []);
    }).catch(function (e) { document.getElementById('holBody').textContent = e.message; });
  }

  function paintHolidays(hol) {
    var rows = hol.map(function (h, i) {
      var half = h.kind === 'hours';
      return '<div class="card2row" style="grid-template-columns:auto 1fr auto auto;' +
        'align-items:center;gap:10px;padding:5px 0">' +
        '<button class="pchip' + (h.observed ? ' on' : '') + '" data-hol="' + i + '" ' +
        'data-on="' + (h.observed ? 1 : 0) + '">' + (h.observed ? 'Observed' : 'Open') + '</button>' +
        '<div style="font:500 12.5px var(--font)' + (h.observed ? '' : ';opacity:.55') + '">' +
        esc(h.label) + ' <span class="sub">' + esc(h.date) + '</span></div>' +
        '<select class="dinput" data-holkind="' + i + '"' + (h.observed ? '' : ' disabled') + '>' +
        '<option value="closed"' + (half ? '' : ' selected') + '>Closed all day</option>' +
        '<option value="hours"' + (half ? ' selected' : '') + '>Half day</option></select>' +
        '<span data-holtimes="' + i + '"' + (half && h.observed ? '' : ' hidden') + '>' +
        '<input class="dinput" type="time" data-holopen="' + i + '" value="' + esc(h.open) +
        '" style="width:110px"> to ' +
        '<input class="dinput" type="time" data-holclose="' + i + '" value="' + esc(h.close) +
        '" style="width:110px"></span></div>';
    }).join('');

    var manual = MANUAL.map(function (m, i) {
      return '<div class="card2row" style="grid-template-columns:auto 1fr auto auto auto;' +
        'align-items:center;gap:10px;padding:5px 0">' +
        '<input class="dinput" type="date" data-mdate="' + i + '" value="' + esc(m.date) +
        '" style="width:150px">' +
        '<input class="dinput" data-mlabel="' + i + '" value="' + esc(m.label) +
        '" placeholder="Why">' +
        '<select class="dinput" data-mkind="' + i + '">' +
        '<option value="closed"' + (m.kind === 'hours' ? '' : ' selected') + '>Closed</option>' +
        '<option value="hours"' + (m.kind === 'hours' ? ' selected' : '') + '>Half day</option>' +
        '</select>' +
        '<span data-mtimes="' + i + '"' + (m.kind === 'hours' ? '' : ' hidden') + '>' +
        '<input class="dinput" type="time" data-mopen="' + i + '" value="' + esc(m.open) +
        '" style="width:110px"> to ' +
        '<input class="dinput" type="time" data-mclose="' + i + '" value="' + esc(m.close) +
        '" style="width:110px"></span>' +
        '<button class="pchip" data-mdel="' + i + '">Remove</button></div>';
    }).join('');

    document.getElementById('holBody').innerHTML =
      '<div class="row" style="margin-bottom:10px;gap:8px;align-items:center">' +
      '<button class="pchip" id="holPrev">&larr;</button>' +
      '<strong style="font:500 13px var(--font)">' + HOLYEAR + '</strong>' +
      '<button class="pchip" id="holNext">&rarr;</button></div>' +
      rows +
      '<div class="dlbl" style="margin:16px 0 4px">Other days you are closed</div>' +
      '<div class="sub" style="margin-bottom:8px">A funeral, a shop trip, the week between ' +
      'Christmas and New Year. These are yours and are not touched when holidays change.</div>' +
      (manual || '<div class="sub">Nothing yet.</div>') +
      '<div class="row" style="margin-top:10px;gap:8px">' +
      '<button class="btn btn-ghost" id="addClosure">Add a day</button>' +
      '<button class="btn btn-solid" id="saveHolidays">Save</button></div>';

    function readHol() {
      return hol.map(function (h, i) {
        var b = document.querySelector('[data-hol="' + i + '"]');
        var k = document.querySelector('[data-holkind="' + i + '"]');
        return { key: h.key, observed: b.dataset.on === '1', kind: k.value,
          open: document.querySelector('[data-holopen="' + i + '"]').value,
          close: document.querySelector('[data-holclose="' + i + '"]').value };
      });
    }
    function readManual() {
      return MANUAL.map(function (_, i) {
        var kind = document.querySelector('[data-mkind="' + i + '"]').value;
        return { date: document.querySelector('[data-mdate="' + i + '"]').value,
          label: document.querySelector('[data-mlabel="' + i + '"]').value || 'Closed',
          kind: kind,
          open: document.querySelector('[data-mopen="' + i + '"]').value,
          close: document.querySelector('[data-mclose="' + i + '"]').value };
      }).filter(function (m) { return m.date; });
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-hol]'), function (b) {
      b.addEventListener('click', function () {
        var i = b.dataset.hol, on = b.dataset.on !== '1';
        b.dataset.on = on ? '1' : '0';
        b.classList.toggle('on', on);
        b.textContent = on ? 'Observed' : 'Open';
        var k = document.querySelector('[data-holkind="' + i + '"]');
        k.disabled = !on;
        document.querySelector('[data-holtimes="' + i + '"]').hidden = !on || k.value !== 'hours';
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-holkind]'), function (sel) {
      sel.addEventListener('change', function () {
        document.querySelector('[data-holtimes="' + sel.dataset.holkind + '"]').hidden =
          sel.value !== 'hours';
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mkind]'), function (sel) {
      sel.addEventListener('change', function () {
        document.querySelector('[data-mtimes="' + sel.dataset.mkind + '"]').hidden =
          sel.value !== 'hours';
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mdel]'), function (b) {
      b.addEventListener('click', function () {
        MANUAL = readManual();
        MANUAL.splice(Number(b.dataset.mdel), 1);
        paintHolidays(readHol().map(function (h, i) {
          return Object.assign({}, hol[i], h);
        }));
      });
    });
    document.getElementById('addClosure').addEventListener('click', function () {
      MANUAL = readManual();
      MANUAL.push({ date: '', kind: 'closed', open: '08:00', close: '12:00', label: '' });
      paintHolidays(readHol().map(function (h, i) { return Object.assign({}, hol[i], h); }));
    });
    document.getElementById('holPrev').addEventListener('click', function () {
      HOLYEAR--; renderHolidays();
    });
    document.getElementById('holNext').addEventListener('click', function () {
      HOLYEAR++; renderHolidays();
    });
    document.getElementById('saveHolidays').addEventListener('click', function () {
      api('/api/config/closures', { method: 'PUT', body: JSON.stringify({
        year: HOLYEAR, holidays: readHol(), manual: readManual()
      }) }).then(function () { say('Saved.', 'ok'); return renderHolidays(); })
        .catch(function (e) { say(e.message, 'err'); });
    });
  }

  /* ===================================================== settings */

  function renderSettings() {
    rail('Reference', [
      { k: 'tech', t: 'Tech visibility' },
      { k: 'hours', t: 'Shop hours' },
      { k: 'holidays', t: 'Holidays & closures' },
      { k: 'caps', t: 'Day limits' },
      { k: 'leads', t: 'Lead follow-up' },
      { k: 'sales', t: 'Sales write-ups' },
      { k: 'cal', t: 'Google Calendar' }
    ]);
    var s = CFG.settings;

      (shows('hours') ? '<div class="card2" style="margin:0 0 14px" id="hoursCard">' +

        '<div class="dlbl" style="margin:0 0 4px">Shop hours</div>' +
        '<div class="sub" style="margin-bottom:10px;max-width:560px">When the doors are open, in ' +
        'the shop\'s own timezone. The scheduler uses these, and so does the sales onboarding ' +
        'clock when it is set to shop hours. A closed day keeps its times \u2014 shut Saturdays for ' +
        'the winter and you get them back in spring without retyping.</div>' +
        '<div id="hoursBody" class="sub">Loading\u2026</div>' +
        '</div></div>' : '') +

      (shows('holidays') ? '<div class="card2" style="margin:0 0 14px" id="holCard">' +
        '<div class="card2row" style="grid-template-columns:1fr">' +
        '<div class="dlbl" style="margin:0 0 4px">Holidays &amp; closures</div>' +
        '<div class="sub" style="margin-bottom:10px;max-width:560px">Tick the ones you observe. ' +
        'Each can be a full day closed or a half day \u2014 Christmas Eve until noon is the usual ' +
        'one. Dates are worked out per year, so ticking Thanksgiving once keeps it ticked next ' +

        '</div></div>' : '') +

      (shows('caps') ? '<div class="card2" style="margin:0 0 14px">' +
      '<div class="card2row" style="grid-template-columns:1fr">' +
      '<div class="dlbl" style="margin:0 0 4px">Scheduler capacity</div>' +
      '<div class="sub" style="margin-bottom:10px">How many of each per day. The owner can always ' +
      'overbook; everyone else is refused.</div>' +
      '<div class="grid3">' +
      ['drop', 'pickup', 'return', 'estimate', 'appraiser'].map(function (k) {
        return '<div><div class="dk">' + k + 's per day</div>' +
          '<input class="dinput" type="number" min="0" id="cap_' + k + '" value="' +
          esc(s['cap_' + k] || '0') + '"></div>';
      }).join('') + '</div></div></div>' : '') +

      (shows('leads') ? '<div class="card2" style="margin:0 0 14px" id="leadCard">' +
        '<div class="card2row" style="grid-template-columns:1fr">' +
        '<div class="dlbl" style="margin:0 0 4px">Lead follow-up</div>' +
