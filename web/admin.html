        '<div class="grid3">' +
        '<div><div class="dk">Hours of silence before flagging</div>' +
        '<input class="dinput" type="number" min="1" max="2160" id="lead_chase_hours" value="' +
        esc(s.lead_chase_hours || '72') + '"></div>' +
        '<div><div class="dk">A booking this far ahead counts</div>' +
        '<input class="dinput" type="number" min="1" max="365" id="lead_appointment_window_days" value="' +
        esc(s.lead_appointment_window_days || '30') + '"></div>' +
        '</div></div></div>' : '') +

      (shows('sales') ? '<div class="card2" style="margin:0 0 14px" id="salesCard">' +
        '<div class="card2row" style="grid-template-columns:1fr">' +
        '<div class="dlbl" style="margin:0 0 4px">Sales write-ups</div>' +
        '<div class="sub" style="margin-bottom:10px;max-width:560px">What the sales screen insists ' +

        '<button class="pchip' + (s.sales_require_address !== '0' ? ' on' : '') + '" id="salesAddr" ' +

        '<div class="card2row" style="grid-template-columns:1fr auto;padding:0 0 10px">' +
        '<div><div style="font:500 12.5px var(--font)">Require a drop-off day</div>' +

        'that the customer is delivering it themselves. Silence is what gets refused \u2014 ' +

        '<div><div class="dk">Hours before an un-chased sales lead goes red</div>' +
        '<input class="dinput" type="number" min="1" max="168" id="sales_onboard_red_hours" value="' +

        !shows('leads') && !shows('sales');
    }

    /* One handler for every on/off chip on this page, rather than one per
       setting: the next toggle is then a line of markup and nothing else. */

      if (!b) return;
      b.addEventListener('click', function () {
        var on = b.dataset.on !== '1';
        b.dataset.on = on ? '1' : '0';

        b.textContent = on ? 'On' : 'Off';
      });
    });

      if ($('techOwn')) body.tech_sees_own_only = $('techOwn').dataset.on === '1' ? '1' : '0';

        if ($('cap_' + k)) body['cap_' + k] = $('cap_' + k).value || '0';

      if ($('lead_chase_hours')) body.lead_chase_hours = $('lead_chase_hours').value || '72';

      '<div class="dv">' + CFG.lanes.filter(function (l) { return l.enabled; }).length +

      '<div class="sub" style="margin-top:12px">Shop type is set at the platform level, not here. ' +
      'It decides which status template the shop started from.</div>');
  }

  /** The Google Calendar card: connect, pick a calendar, disconnect. */
  function renderCalendar() {
    api('/api/calendar').then(function (c) {
      var el = $('calBody');
      if (!el) return;

      if (!c.configured) {
        el.innerHTML = 'This server has no Google credentials, so there is nothing to connect to yet. ' +
          'Add <code>GOOGLE_CLIENT_ID</code> and <code>GOOGLE_CLIENT_SECRET</code> to the server\'s ' +
          '<code>.env</code> and restart — then this card offers a sign-in button.';
        return;
      }

      if (!c.connection || c.connection.state === 'disconnected') {
        el.innerHTML = c.canConnect
          ? '<a class="btn btn-solid" href="/api/calendar/connect">Connect Google Calendar</a>'
          : 'Not connected. The owner can connect it.';
        return;
      }

      var conn = c.connection;
      el.innerHTML =
        '<div class="drow"><div class="dk">Calendar</div><div class="dv">' +
        esc(conn.calendarName || conn.calendarId || 'not picked yet') + '</div></div>' +
        '<div class="drow"><div class="dk">State</div><div class="dv" style="color:' +
        (conn.state === 'connected' ? 'var(--done)' : 'var(--stopped)') + '">' +
        esc(conn.state) + '</div></div>' +
        (conn.lastError ? '<div class="drow"><div class="dk">Last error</div><div class="dv">' +
          esc(conn.lastError) + '</div></div>' : '') +
        (conn.lastPushAt ? '<div class="drow"><div class="dk">Last sent</div><div class="dv">' +
          Shell.when(conn.lastPushAt) + '</div></div>' : '') +
        (c.canConnect
          ? '<div class="row" style="margin-top:12px">' +
            '<select id="calPick" style="min-width:220px"><option value="">Loading calendars…</option></select>' +
            '<button class="btn btn-ghost" id="calSave">Use this calendar</button>' +
            '<button class="btn btn-danger" id="calOff">Disconnect</button></div>'
          : '');

      if (!c.canConnect) return;

      api('/api/calendar/calendars').then(function (r) {
        $('calPick').innerHTML = r.calendars.map(function (x) {
          return '<option value="' + esc(x.id) + '"' +
            (x.id === conn.calendarId ? ' selected' : '') + '>' + esc(x.name) + '</option>';
        }).join('');
        // Google refusing to list calendars does not stop us writing to the
        // account's own one, so say what happened instead of showing nothing.
        if (r.note) {
          var n = document.createElement('div');
          n.className = 'sub';
          n.style.marginTop = '8px';
          n.textContent = r.note;
          $('calPick').parentNode.appendChild(n);
        }
      }).catch(function (e) {
        $('calPick').innerHTML = '<option value="">' + esc(e.message) + '</option>';
      });

      $('calSave').addEventListener('click', function () {
        var pick = $('calPick');
        var id = pick.value;
        if (!id) return say('Pick a calendar.', 'err');
        api('/api/calendar', {
          method: 'PATCH',
          body: JSON.stringify({ calendarId: id, calendarName: pick.options[pick.selectedIndex].textContent })
        }).then(function () { say('Saved.', 'ok'); renderCalendar(); })
          .catch(function (e) { say(e.message, 'err'); });
      });

      $('calOff').addEventListener('click', function () {
        if (!confirm('Disconnect Google Calendar? Appointments already sent stay on the calendar.')) return;
        api('/api/calendar', { method: 'DELETE' })
          .then(function () { say('Disconnected.', 'ok'); renderCalendar(); })
          .catch(function (e) { say(e.message, 'err'); });
      });
    }).catch(function (e) {
      if ($('calBody')) $('calBody').textContent = e.message;
    });
  }

  /* ====================================================== vendors */

  /**
   * Who the shop buys from. One list, used by the parts desk when ordering and
   * offered as suggestions when someone types a sublet vendor on a file.
   *
   * Retiring a vendor keeps every order that already names it — the name stops
   * being offered, nothing in the history changes.
   */
  function renderVendors() {
    rail('Reference', []);
    $('mid').innerHTML = '<div class="empty">Loading…</div>';

    api('/api/vendors?all=1').then(function (d) {
      var kinds = d.kinds || [];
      var live = d.vendors.filter(function (v) { return Number(v.active) === 1; });
      var gone = d.vendors.filter(function (v) { return Number(v.active) !== 1; });

      /* Sublet vendors are typed on the file rather than picked. A name that
         keeps appearing there is one worth adding to the list properly. */
      var known = {};
      d.vendors.forEach(function (v) { known[v.name.toLowerCase()] = 1; });
      var strays = (d.subletVendors || []).filter(function (s) {
        return !known[String(s.vendor).toLowerCase()];
      });

      var h = ['<div class="pad"><div class="card2" style="margin:0 0 18px">' +
        '<div class="card2row" style="grid-template-columns:1fr">' +
        '<div class="dlbl">Add a vendor</div>' +
        '<div class="grid3" style="margin-top:4px;row-gap:14px">' +
        '<div><div class="dk">Name</div><input class="dinput" id="vName"></div>' +
        '<div><div class="dk">Kind</div><select class="dsel" id="vKind">' +
        '<option value="">—</option>' +
        kinds.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + '</option>'; }).join('') +
        '</select></div>' +
        '<div><div class="dk">Phone</div><input class="dinput" id="vPhone"></div>' +
        '<div><div class="dk">Email</div><input class="dinput" id="vEmail" type="email"></div>' +
        '</div>' +
        '<div class="row" style="margin-top:12px">' +
        '<button class="btn btn-solid" id="addVendor">Add</button></div>' +
        '</div></div></div>'];

      if (strays.length) {
        h.push('<div class="pad"><div class="dlbl">Typed on a file but not on the list</div>' +
          '<div class="sub" style="margin-top:6px">' +
          strays.map(function (s) {
            return '<button class="setchip" data-adopt="' + esc(s.vendor) + '">' +
              esc(s.vendor) + ' · ' + s.n + '</button>';
          }).join(' ') + '</div>' +
          '<div class="sub" style="margin-top:6px">Tap one to add it as a sublet vendor.</div></div>');
      }

      h.push('<div class="prow2" style="border-top:1px solid var(--line);min-height:32px">' +
        '<div></div><div class="dk">Name</div><div class="dk">Kind</div>' +
        '<div class="dk hide-sm">Phone</div><div class="dk hide-sm">Used</div>' +
        '<div class="dk">On the list</div></div>');

      live.concat(gone).forEach(function (v) {
        var off = Number(v.active) !== 1;
        h.push('<div class="prow2" data-vendor="' + v.id + '"' +
          (off ? ' style="opacity:.5"' : '') + '>' +
          '<div></div>' +
          '<div><input class="dinput v-name" value="' + esc(v.name) + '"></div>' +
          '<select class="dsel v-kind"><option value="">—</option>' +
          kinds.map(function (k) {
            return '<option value="' + esc(k) + '"' + (v.kind === k ? ' selected' : '') + '>' +
              esc(k) + '</option>';
          }).join('') + '</select>' +
          '<div class="hide-sm"><input class="dinput v-phone" value="' + esc(v.phone || '') + '"></div>' +
          '<div class="scell num hide-sm" title="Part lines ever ordered from them">' +
          (Number(v.parts_lines) || 0) +
          (Number(v.on_order) ? ' · ' + v.on_order + ' out' : '') + '</div>' +
          '<button class="visbtn' + (off ? '' : ' on') + '" data-vactive="' + (off ? 0 : 1) + '">' +
          (off ? 'Retired' : 'Offered') + '</button></div>');
      });

      h.push('<div class="pad" style="padding-top:16px"><div class="row">' +
        '<button class="btn btn-solid" id="saveVendors">Save vendors</button>' +
        '<span class="sub">' + live.length + ' offered' +
        (gone.length ? ' · ' + gone.length + ' retired' : '') +
        ' · a retired vendor stays on every order that already names it</span></div></div>');

      $('mid').innerHTML = h.join('');
      detail('Vendors', '<div style="font:400 11.5px/1.6 var(--font);color:var(--muted);padding:12px 0">' +
        'One list for the whole shop. The parts desk picks from it when ordering, and it fills the ' +
        'suggestions when somebody types a sublet vendor onto a file. Kind is only a label \u2014 it groups ' +
        'the list, it does not restrict anything.</div>' +
        '<div class="sub" style="margin-top:10px">Retire rather than delete. Deleting would orphan the ' +
        'orders that name them; retiring just takes the name out of the dropdowns.</div>');

      $('addVendor').addEventListener('click', function () {
        var name = $('vName').value.trim();
        if (!name) return say('A name is required.', 'err');
        api('/api/vendors', {
          method: 'POST',
          body: JSON.stringify({
            name: name,
            kind: $('vKind').value || undefined,
            phone: $('vPhone').value.trim() || undefined,
            email: $('vEmail').value.trim() || undefined
          })
        }).then(function () {
          say('Added.', 'ok');
          renderVendors();
        }).catch(function (e) { say(e.message, 'err'); });
      });

      Array.prototype.forEach.call($('mid').querySelectorAll('[data-adopt]'), function (b) {
        b.addEventListener('click', function () {
          api('/api/vendors', {
            method: 'POST',
            body: JSON.stringify({ name: b.dataset.adopt, kind: 'Sublet' })
          }).then(renderVendors).catch(function (e) { say(e.message, 'err'); });
        });
      });

      Array.prototype.forEach.call($('mid').querySelectorAll('[data-vactive]'), function (b) {
        b.addEventListener('click', function () {
          var on = b.dataset.vactive === '1';
          b.dataset.vactive = on ? '0' : '1';
          b.classList.toggle('on', !on);
          b.textContent = on ? 'Retired' : 'Offered';
          b.closest('.prow2').style.opacity = on ? '.5' : '';
        });
      });

      $('saveVendors').addEventListener('click', function () {
        var jobs = [];
        Array.prototype.forEach.call($('mid').querySelectorAll('[data-vendor]'), function (row) {
          var id = Number(row.dataset.vendor);
          var was = d.vendors.filter(function (v) { return v.id === id; })[0];
          var body = {};
          var name = row.querySelector('.v-name').value.trim();
          var kind = row.querySelector('.v-kind').value;
          var phoneEl = row.querySelector('.v-phone');
          var phone = phoneEl ? phoneEl.value.trim() : (was.phone || '');
          var active = row.querySelector('[data-vactive]').dataset.vactive === '1';

          if (name && name !== was.name) body.name = name;
          if (kind !== (was.kind || '')) body.kind = kind || null;
          if (phone !== (was.phone || '')) body.phone = phone || null;
          if (active !== (Number(was.active) === 1)) body.active = active;
          if (Object.keys(body).length) jobs.push({ id: id, body: body });
        });

        if (!jobs.length) return say('Nothing changed.', 'ok');
        Promise.all(jobs.map(function (j) {
          return api('/api/vendors/' + j.id, { method: 'PATCH', body: JSON.stringify(j.body) });
        })).then(function () {
          say(jobs.length + (jobs.length === 1 ? ' vendor' : ' vendors') + ' saved.', 'ok');
          renderVendors();
        }).catch(function (e) { say(e.message, 'err'); });
      });
    }).catch(function (e) {
      $('mid').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }

  /* ====================================================== storage */

  function renderStorage() {
    rail('Reference', []);
    $('mid').innerHTML = '<div class="empty">Loading…</div>';

    api('/api/storage').then(function (d) {
      return api('/api/media-tools').catch(function () { return null; })
        .then(function (tools) { return { d: d, tools: tools }; });
    }).then(function (both) {
      var d = both.d, tools = both.tools;
      function bytes(n) {
        if (!n) return '0 B';
        if (n < 1048576) return Math.round(n / 1024) + ' KB';
        if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
        return (n / 1073741824).toFixed(2) + ' GB';
      }

      var max = Math.max.apply(null, d.byType.map(function (t) { return Number(t.bytes); }).concat([1]));

      $('mid').innerHTML = '<div class="kpis" style="border-top:none">' +
        '<div><div class="kpi-v">' + bytes(d.bytes) + '</div><div class="kpi-k">On disk</div></div>' +
        '<div><div class="kpi-v">' + d.files.toLocaleString('en-US') + '</div>' +
        '<div class="kpi-k">Files</div></div>' +
        '<div><div class="kpi-v">' + d.images.toLocaleString('en-US') + '</div>' +
        '<div class="kpi-k">Photos</div></div>' +
        '<div><div class="kpi-v">' + (d.files ? bytes(Math.round(d.bytes / d.files)) : '—') + '</div>' +
        '<div class="kpi-k">Average file</div></div><div class="kpi-tail"></div></div>' +

        '<div class="pad"><div class="dlbl">By kind</div>' +
        '<table style="margin-top:6px"><thead><tr><th>Kind</th><th class="num">Files</th>' +
        '<th class="num">Size</th><th></th></tr></thead><tbody>' +
        d.byType.map(function (t) {
          var pct = Math.round((Number(t.bytes) / max) * 100);
          return '<tr><td>' + esc(String(t.doc_type).replace(/_/g, ' ')) + '</td>' +
            '<td class="num">' + t.n + '</td>' +
            '<td class="num">' + bytes(Number(t.bytes)) + '</td>' +
            '<td><div style="height:6px;background:var(--whisper);border-radius:3px">' +
            '<div style="height:100%;width:' + pct + '%;background:var(--acc);border-radius:3px">' +
            '</div></div></td></tr>';
        }).join('') + '</tbody></table></div>' +

        /* Rendered PDF pages are a cache, counted apart from the records — it is
           disk you can throw away, and it reads better knowing that. */
        '<div class="pad"><div class="dlbl">Rendered PDF pages</div>' +
        '<div class="sub" style="margin-top:6px">' +
        (d.pageCache && d.pageCache.pages
          ? d.pageCache.pages.toLocaleString('en-US') + ' page' +
            (d.pageCache.pages === 1 ? '' : 's') + ' · ' + bytes(d.pageCache.bytes) +
            ' — a cache, dropped thirty days after anyone last opened them, ' +
            'and re-rendered on demand. Not part of the record.'
          : 'Nothing cached. Pages are rendered when somebody opens them.') +
        '</div></div>' +

        (d.pending || d.noThumb
          ? '<div class="pad"><div class="dlbl">Thumbnails</div><div class="sub" style="margin-top:6px">' +
            (d.pending ? d.pending + ' being made. ' : '') +
            (d.noThumb ? d.noThumb + ' could not be made — open one in the drawer to try again.' : '') +
            '</div></div>'
          : '');

      detail('Storage', '<div style="font:400 11.5px/1.6 var(--font);color:var(--muted);padding:12px 0">' +
        'Photos are shrunk before they are kept — a 2048px version and a small thumbnail — so a car ' +
        'with two hundred photos costs about 80 MB rather than 800. iPhone HEIC photos are converted ' +
        'to JPEG on upload and the HEIC is dropped, so they open anywhere later.' +
        '</div>' +
        (tools
          ? '<div class="dlbl" style="margin-top:12px">This server can make</div>' +
            '<div class="sub" style="margin-top:6px">' +
            'Photo thumbnails: ' + (tools.sharp ? 'yes' : 'no') + '<br>' +
            'iPhone HEIC: ' + (tools.heifConvert || tools.sharp ? 'yes' : 'no') + '<br>' +
            'PDF thumbnails and pages: ' + (tools.mutool ? 'yes' : 'no') + '<br>' +
            'Queue: ' + (tools.queue ? 'running' : 'not running — thumbnails are made during the upload') +
            '</div>' +
            (tools.missing && tools.missing.length
              ? '<div class="sub" style="margin-top:8px;color:var(--stopped)">Missing: ' +
                esc(tools.missing.join('; ')) + '. See INSTALL-MEDIA.md on the server.</div>'
              : '')
          : '') +
        '<div class="sub" style="margin-top:12px">Watch this against the disk on the server, not the ' +
        'database size. Photos are what grows.</div>');
    }).catch(function (e) {
      $('mid').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }

          'close the shop.' +
        '</div>' +
        '<table style="margin-top:8px"><thead><tr><th>Day</th><th>Shop hours</th>' +
          '<th>Public may book</th><th></th></tr></thead><tbody>' +
        DOW.map(function (name, dow) {
          var shop = shopByDow[dow];
          var pub = hoursByDow[dow] || {};
          var closed = !shop || Number(shop.closed) === 1;
          return '<tr><td>' + name + '</td>' +
            '<td class="sub">' + (closed ? 'closed'
              : hhmm(shop.open_time) + ' – ' + hhmm(shop.close_time)) + '</td>' +
            '<td>' + (closed ? '<span class="sub">—</span>'
              : '<input class="in" data-wfopen="' + dow + '" value="' + hhmm(pub.open_time) +
                '" placeholder="' + hhmm(shop.open_time) + '" style="width:74px"> ' +
                '<input class="in" data-wfclose="' + dow + '" value="' + hhmm(pub.close_time) +
                '" placeholder="' + hhmm(shop.close_time) + '" style="width:74px">') + '</td>' +
            '<td class="num">' + (closed ? ''
              : '<label class="sub"><input type="checkbox" data-wfblock="' + dow + '"' +
                (Number(pub.blocked) === 1 ? ' checked' : '') + '> blocked</label>') + '</td></tr>';
        }).join('') +
        '</tbody></table>' +
        '<div style="margin-top:9px"><button class="btn" id="wfHours">Save the week</button></div>' +

        '<div class="dlbl" style="margin-top:18px">Dated exceptions</div>' +
        '<table style="margin-top:6px"><tbody>' +
        d.shopClosures.map(function (c) {
          return '<tr><td>' + esc(c.on_date) + '</td><td class="sub">' + esc(c.label) + '</td>' +
            '<td class="num sub">' + esc(c.source === 'holiday' ? 'holiday' : 'shop closure') +
            '</td><td></td></tr>';
        }).join('') +
        d.publicBlocks.map(function (b) {
          return '<tr><td>' + esc(b.on_date) + '</td><td class="sub">' + esc(b.label) + '</td>' +
            '<td class="num sub" style="color:var(--acc)">public only</td>' +
            '<td class="num"><button class="linkbtn" data-wfblkx="' + esc(b.on_date) +
            '">Remove</button></td></tr>';
        }).join('') +
        '</tbody></table>' +
        '<div class="sub" style="margin-top:8px;max-width:620px">' +
          'Closures and holidays come from the shop calendar and are shown here, not set here — ' +
          'un-ticking a holiday is not something this screen should be able to undo. A date closed ' +
          'to the public only is set below.' +
        '</div>' +
        '<div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">' +
          '<input class="in" id="wfBlkDate" type="date" style="width:150px">' +
          '<input class="in" id="wfBlkLabel" placeholder="No public booking" style="width:200px">' +
          '<button class="btn" id="wfBlkAdd">Block that date</button>' +
        '</div>' +
      '</div>' +

      '<div class="pad"><div class="dlbl">What the form asks</div>' +
        '<table style="margin-top:6px"><thead><tr><th>Question</th><th>Shown on</th>' +
          '<th class="num">On the form</th></tr></thead><tbody>' +
        d.fields.map(function (f) {
          var locked = ['name', 'phone', 'email'].indexOf(f.key) >= 0;
          return '<tr><td>' + esc(f.label) +
            (f.kind === 'builtin' ? '' : ' <span class="sub">· your question</span>') + '</td>' +
            '<td class="sub">' + (f.purpose === 'both' ? 'both' :
              f.purpose === 'drop' ? 'drop-offs only' : 'estimates only') + '</td>' +
            '<td class="num">' + (locked
              ? '<span class="sub">always</span>'
              : '<label class="sub"><input type="checkbox" data-wffield="' + esc(f.key) + '"' +
                (f.enabled ? ' checked' : '') + '> shown</label>') + '</td></tr>';
        }).join('') +
        '</tbody></table>' +
        '<div class="sub" style="margin-top:8px;max-width:620px">' +
          'Name, phone and email stay — without them a submission is not a lead. Your own questions ' +
          'are always optional: a form with six required questions is a form nobody finishes.' +
        '</div>' +
        '<div style="margin-top:9px"><button class="btn" id="wfFields">Save</button> ' +
          '<button class="ghostbtn" id="wfAddQ">Add a question of your own</button></div>' +
      '</div>';

    var warn = d.contrast.warnings;
    detail('Web form',
      '<div class="dlbl">Colours</div>' +
      '<div class="sub" style="margin:6px 0 9px">The form takes your website’s fonts and text ' +
      'colour on its own. These two are the button, the selected day and time, and the outline ' +
      'somebody sees when they tab through it with a keyboard.</div>' +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
        '<label class="sub">Accent <input type="color" id="wfAccent" value="' + esc(s.accent) +
          '" style="vertical-align:middle"></label>' +
        '<label class="sub">Text on it <input type="color" id="wfInk" value="' + esc(s.accentInk) +
          '" style="vertical-align:middle"></label>' +
      '</div>' +
      '<div class="sub" style="margin-top:8px">Button text ' + d.contrast.onButton +
        ':1 · outline on white ' + d.contrast.onPaper + ':1</div>' +
      (warn.length
        ? '<div class="sub" style="margin-top:8px;color:var(--stopped)">' +
          warn.map(esc).join('<br><br>') + '</div>'
        : '') +
      (s.contrastAckAt
        ? '<div class="sub" style="margin-top:8px">These colours were accepted as they are.</div>'
        : '') +
      '<div style="margin-top:9px"><button class="btn" id="wfColour">Save the colours</button></div>' +

      '<div class="dlbl" style="margin-top:18px">Your address, for the emails</div>' +
      '<input class="in" id="wfAddr" value="' + esc(d.shopAddress) +
        '" placeholder="1420 Avenue K, Plano" style="width:100%;margin-top:6px">' +
      '<input class="in" id="wfTel" value="' + esc(d.shopPhone) +
        '" placeholder="(972) 555-0100" style="width:100%;margin-top:6px">' +
      '<input class="in" id="wfReply" value="' + esc(s.replyTo || '') +
        '" placeholder="Where a reply should go" style="width:100%;margin-top:6px">' +
      '<div style="margin-top:8px"><button class="btn" id="wfAddrSave">Save</button></div>' +

      '<div class="dlbl" style="margin-top:18px">What the customer is sent</div>' +
      '<div class="sub" style="margin:6px 0 9px">Your words, not ours. Anything in square ' +
      'brackets is filled in when it sends. It arrives as “' + esc(ME.company.name) +
      ' via Easy Shop” and a reply comes to you.</div>' +
      d.letters.map(function (l) {
        return '<div style="margin-bottom:12px">' +
          '<div class="sub" style="font-weight:600">' + esc(wfLetterName(l.event_key)) + '</div>' +
          '<input class="in" data-wfsub="' + esc(l.event_key) + '" value="' + esc(l.subject) +
            '" style="width:100%;margin-top:4px">' +
          '<textarea class="in" data-wfbody="' + esc(l.event_key) +
            '" style="width:100%;min-height:90px;margin-top:4px">' + esc(l.body) + '</textarea>' +
          '<button class="ghostbtn" data-wfletter="' + esc(l.event_key) +
            '" style="margin-top:4px">Save</button></div>';
      }).join('') +
      '<div class="sub">Tokens: ' + d.tokens.map(function (t) {
        return '[ ' + esc(t.token) + ' ]';
      }).join(' · ') + '</div>');

    wireWebForm();
  }

  function wfRow(name, note, on, key) {
    return '<tr><td>' + name + '</td><td class="sub">' + note + '</td>' +
      '<td class="num"><label class="sub"><input type="checkbox" data-wfoffer="' + key + '"' +
      (on ? ' checked' : '') + '> offered</label></td></tr>';
  }

  function wfLetterName(k) {
    return { estimate_booked: 'When an estimate is booked',
      drop_requested: 'When a drop-off is requested',
      drop_confirmed: 'When you confirm a drop-off' }[k] || k;
  }

  /* Written to be pasted into an email to somebody who has never heard of us. */
  function wfInstructions(d) {
    return 'Please add our booking form to the website.\n\n' +
      'Paste these two lines where the form should appear — a page, a section, ' +
      'or a custom-code block:\n\n' + d.snippet + '\n\n' +
      'Notes:\n' +
      '· It draws into the div, so it takes the page’s own fonts and colours.\n' +
      '· Nothing needs enabling on the hosting. It is a script tag, not PHP.\n' +
      '· It works in WordPress and HighLevel as-is; no plugin.\n' +
      '· Change data-campaign to tell one landing page from another.\n' +
      '· The page it runs on has to be one of: ' +
        (d.domains.length ? d.domains.map(function (x) { return x.host; }).join(', ')
          : '(nothing named yet — tell the shop which address to allow)') + '\n';
  }

  function wireWebForm() {
    var on = function (id, fn) { var n = $(id); if (n) n.onclick = fn; };

    on('wfToggle', function () {
      api('/api/web-form', { method: 'PATCH',
        body: JSON.stringify({ enabled: !WF.settings.enabled }) })
        .then(renderWebForm)
        .catch(function (e) {
          /* The consent gate. Not overridable: a form collecting phone numbers
             against no disclosure is the gap that raised this in the first
             place. */
          say(e.consent
            ? e.error + ' ' + (e.missing || []).join(' ')
            : e.message, 'bad');
        });
    });

    on('wfCSave', function () {
      api('/api/web-form/consent', { method: 'PUT', body: JSON.stringify({
        label: $('wfCLabel').value,
        body: $('wfCBody').value,
        privacyUrl: $('wfCPriv').value,
        termsUrl: $('wfCTerms').value
      }) })
        .then(function () { say('Saved. The form may go live.', 'ok'); return renderWebForm(); })
        .catch(function (e) {
          say(e.missing && e.missing.length ? e.missing.join(' ') : e.message, 'bad');
        });
    });

    on('wfCopy', function () {
      var t = wfInstructions(WF);
      if (navigator.clipboard) navigator.clipboard.writeText(t);
      say('Copied — paste it into an email to your web person.', 'ok');
    });

    on('wfRotate', function () {
      if (!confirm('The old key stops working at once. Any page still using it will refuse ' +
        'submissions until the new snippet is pasted in. Rotate it?')) return;
      api('/api/web-form/key', { method: 'POST' }).then(renderWebForm);
    });

    on('wfDomAdd', function () {
      var v = $('wfDom').value.trim();
      if (!v) return;
      api('/api/web-form/domain', { method: 'POST', body: JSON.stringify({ host: v }) })
        .then(function (r) {
          if (r.suggest) {
            say('Added. Your site may also answer on ' + r.suggest +
              ' — add that too if it does, or the form will refuse it.', 'ok');
          }
          renderWebForm();
        }).catch(function (e) { say(e.message, 'bad'); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-wfdomx]'), function (b) {
      b.onclick = function () {
        api('/api/web-form/domain/' + encodeURIComponent(b.dataset.wfdomx), { method: 'DELETE' })
          .then(renderWebForm);
      };
    });

    on('wfNums', function () {
      var body = { holdHours: Number($('wfHold').value), noticeHours: Number($('wfNotice').value) };
      Array.prototype.forEach.call(document.querySelectorAll('[data-wfoffer]'), function (c) {
        body[c.dataset.wfoffer] = c.checked;
      });
      wfSave(body).then(function () { say('Saved.', 'ok'); });
    });

    on('wfHours', function () {
      var days = [];
      for (var dow = 0; dow < 7; dow++) {
        var o = document.querySelector('[data-wfopen="' + dow + '"]');
        if (!o) continue;
        var c = document.querySelector('[data-wfclose="' + dow + '"]');
        var b = document.querySelector('[data-wfblock="' + dow + '"]');
        days.push({ dow: dow, open: o.value, close: c.value, blocked: b && b.checked });
      }
      api('/api/web-form/hours', { method: 'PUT', body: JSON.stringify({ days: days }) })
        .then(function () { say('Saved.', 'ok'); return renderWebForm(); });
    });

    on('wfBlkAdd', function () {
      var date = $('wfBlkDate').value;
      if (!date) return say('Pick a date.', 'bad');
      api('/api/web-form/block', { method: 'POST',
        body: JSON.stringify({ date: date, label: $('wfBlkLabel').value }) }).then(renderWebForm);
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-wfblkx]'), function (b) {
      b.onclick = function () {
        api('/api/web-form/block/' + b.dataset.wfblkx, { method: 'DELETE' }).then(renderWebForm);
      };
    });

    on('wfFields', function () {
      var fields = WF.fields.map(function (f) {
        var c = document.querySelector('[data-wffield="' + f.key + '"]');
        return { key: f.key, label: f.label, purpose: f.purpose, sortOrder: f.sortOrder,
          enabled: c ? c.checked : true };
      });
      api('/api/web-form/fields', { method: 'PUT', body: JSON.stringify({ fields: fields }) })
        .then(function () { say('Saved.', 'ok'); return renderWebForm(); });
    });

    on('wfAddQ', function () {
      var label = prompt('What should the question say?');
      if (!label) return;
      var kind = confirm('OK for a yes/no question, Cancel for a short written answer.')
        ? 'yesno' : 'text';
      var purpose = prompt('Shown on: both, estimate, or drop?', 'both') || 'both';
      api('/api/web-form/fields', { method: 'POST',
        body: JSON.stringify({ label: label, kind: kind, purpose: purpose.trim() }) })
        .then(renderWebForm).catch(function (e) { say(e.message, 'bad'); });
    });

    on('wfColour', function () {
      var body = { accent: $('wfAccent').value, accentInk: $('wfInk').value };
      api('/api/web-form', { method: 'PATCH', body: JSON.stringify(body) })
        .then(renderWebForm)
        .catch(function (e) {
          if (!e.contrast) return say(e.message, 'bad');
          /* Warn and allow. What breaks is named, because a warning nobody can
             act on is decoration — and the two failures have different fixes.
             Accepting is recorded for our own records and mentioned nowhere
             else: not to the customer, not on the form, and not as a banner
             here afterwards. */
          if (!confirm(e.warnings.join('\n\n') + '\n\nUse these colours anyway?')) return;
          body.acceptContrast = true;
          api('/api/web-form', { method: 'PATCH', body: JSON.stringify(body) })
            .then(renderWebForm);
        });
    });

    on('wfAddrSave', function () {
      wfSave({ shopAddress: $('wfAddr').value, shopPhone: $('wfTel').value,
        replyTo: $('wfReply').value }).then(function () { say('Saved.', 'ok'); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-wfletter]'), function (b) {
      b.onclick = function () {
        var k = b.dataset.wfletter;
        api('/api/web-form/letter/' + encodeURIComponent(k), { method: 'PUT',
          body: JSON.stringify({
            subject: document.querySelector('[data-wfsub="' + k + '"]').value,
            body: document.querySelector('[data-wfbody="' + k + '"]').value
          }) })
          .then(function (r) { say('Saved. It will read: ' + r.preview, 'ok'); })
          .catch(function (e) { say(e.message, 'bad'); });
      };
    });
  }

  /* ===================================================== plumbing */

  function say(t, k) {
    var m = $('dMsg');
    if (!m) return alert(t);
    m.textContent = t;
    m.className = 'msg ' + k;
  }
  function reloadConfig() { return api('/api/config').then(function (c) { CFG = c; render(); }); }
  function reloadPeople() { return api('/api/config/people').then(function (p) { PEOPLE = p; render(); }); }
  function reloadGroups() {
    return api('/api/admin/notification-groups').then(function (g) { GROUPS = g; render(); });
  }
})();
</script>
</body>
</html>
