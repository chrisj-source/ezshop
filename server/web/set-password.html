<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Shop — set a password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#131c2e; --text:#e7eaf2; --dim:#7f8ca4; --line:#2c3a55;
    --acc:#d9a441; --acc2:#e5bf68; --bad:#d07e6f; --good:#6fae8c;
    --font:'Inter',system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0;min-height:100vh;background:var(--bg);color:var(--text);
         font-family:var(--font);display:grid;place-items:center;padding:24px; }
  .card { width:100%;max-width:380px; }
  h1 { font:500 21px var(--font);margin:0 0 6px; }
  .sub { font:400 12.5px var(--font);color:var(--dim);margin-bottom:26px;line-height:1.5; }
  label { display:block;font:600 8.5px var(--font);letter-spacing:.13em;text-transform:uppercase;
          color:var(--acc2);margin-bottom:6px; }
  input { width:100%;background:transparent;border:1px solid var(--line);border-radius:4px;
          color:var(--text);font:400 13px var(--font);padding:10px 11px;margin-bottom:16px; }
  input:focus-visible { outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc); }
  button { width:100%;font:500 12.5px var(--font);color:var(--bg);background:var(--acc);
           border:1px solid var(--acc);border-radius:4px;padding:11px;cursor:pointer; }
  button:hover { background:var(--acc2);border-color:var(--acc2); }
  .msg { font:400 11.5px var(--font);line-height:1.5;padding:10px 12px;border-radius:4px;
         margin-bottom:18px;display:none; }
  .msg.err { display:block;color:var(--bad);border:1px solid var(--bad); }
  .msg.ok { display:block;color:var(--good);border:1px solid var(--good); }
</style>
</head>
<body>
<div class="card">
  <h1>Set a password</h1>
  <div class="sub">At least ten characters. This replaces the temporary one and signs out every other device.</div>
  <div class="msg" id="msg"></div>
  <form id="form">
    <label for="next">New password</label>
    <input id="next" type="password" autocomplete="new-password" required>
    <label for="again">Confirm</label>
    <input id="again" type="password" autocomplete="new-password" required>
    <button type="submit">Save and continue</button>
  </form>
</div>
<script>
(function () {
  var msg = document.getElementById('msg');
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var a = document.getElementById('next').value, b = document.getElementById('again').value;
    if (a !== b) { msg.textContent = 'Those do not match.'; msg.className = 'msg err'; return; }

    fetch('/api/auth/change-password', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ next: a })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { msg.textContent = res.j.error; msg.className = 'msg err'; return; }
        msg.textContent = 'Saved.'; msg.className = 'msg ok';
        setTimeout(function () { location.href = '/'; }, 600);
      });
  });
})();
</script>
</body>
</html>
