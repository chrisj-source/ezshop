<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2740">
<title>Board — Easy Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css">
<style>
  .ro { font-weight:500; font-variant-numeric:tabular-nums; }
  .wrap { padding:0 18px 24px; }
  .dropzone {
    border:1px dashed var(--line); border-radius:6px; padding:16px; text-align:center;
    font:400 11.5px var(--font); color:var(--dim); cursor:pointer;
  }
  .dropzone.hot { border-color:var(--acc); color:var(--acc); background:rgba(217,164,65,.06); }
  .docrow { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--whisper); }
  .partrow { display:grid; grid-template-columns:1fr auto; gap:10px; padding:9px 0; border-top:1px solid var(--whisper); }
  @media (max-width:760px) { .wrap { padding:0 0 24px; } }
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><div class="mark">ES</div><div class="word">Easy Shop</div></div>
  <div class="vr"></div>
  <div class="co" id="coName">—</div>
  <div id="nav"></div>
  <div class="spacer"></div>
  <a href="/platform.html" id="platformLink" hidden style="font:400 11px var(--font);color:var(--dim)">Platform</a>
  <div id="bell"></div>
  <div class="who" id="who">—</div>
  <button class="ghostbtn" id="signout">Sign out</button>
</div>
<div class="hairline"></div>

<div class="head">
  <h1>Repair orders</h1>
  <div class="headmeta" id="headmeta">Loading…</div>
</div>

<div class="kpis" id="kpis"></div>

<div class="filters">
  <select id="fGroup"><option value="">All stages</option></select>
  <select id="fStatus"><option value="">All statuses</option></select>
  <select id="fSort">
    <option value="days">Longest in shop</option>
    <option value="recent">Most recent</option>
    <option value="ro">RO number</option>
    <option value="status">Status</option>
  </select>
  <input type="search" id="fSearch" placeholder="RO, customer, VIN">
  <label class="row" style="font:400 11.5px var(--font);color:var(--dim);gap:5px">
    <input type="checkbox" id="fClosed"> Closed
  </label>
  <button class="btn btn-ghost" id="refresh">Refresh</button>
  <button class="btn" id="newRo">New RO</button>
</div>

<main>
  <div class="wrap">
    <table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead">
    <div style="min-width:0;flex:1">
      <div style="font:500 16px var(--font)" id="dRo">—</div>
      <div class="sub" id="dSub">—</div>
    </div>
    <button class="close" id="dClose" aria-label="Close">&times;</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

<script src="/shell.js"></script>
<script>
(function () {
  var api = Shell.api, esc = Shell.esc;
  var ME = null, CFG = null, FILES = [], STATUSES = [], GROUPS = [], DOCTYPES = [], OPEN = null;

  function $(id) { return document.getElementById(id); }
  function money(c) {
    if (c == null) return '—';
    return '$' + (c / 100).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }
  function when(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
           d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }
  function shortDate(v) {
    return v ? new Date(v).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';
  }
  var AGE = { ok: 'var(--done)', yellow: 'var(--blocked)', red: 'var(--stopped)' };
  var KIND = { milestone: 'var(--move)', queue: 'var(--blocked)', active: 'var(--acc)', complete: 'var(--done)' };

  api('/api/me').then(function (me) {
    ME = me;
    if (!me.company) {
      if (me.isPlatformOwner) { location.href = '/platform.html'; return null; }
      document.body.innerHTML = '<div class="empty">Your account is not attached to a shop.</div>';
      return null;
    }
    Shell.mount({ me: me, active: 'board' });
    return Promise.all([api('/api/config'), api('/api/doc-types').catch(function () { return { types: [] }; })]);
  }).then(function (r) {
    if (!r) return;
    CFG = r[0]; STATUSES = CFG.statuses; GROUPS = CFG.groups; DOCTYPES = r[1].types;

    CFG.groups.forEach(function (g) {
      var o = document.createElement('option');
      o.value = g.group_id; o.textContent = g.label;
      $('fGroup').appendChild(o);
    });
    fillStatusFilter('');
    buildHead();
    return load();
  }).then(function () {
    var deep = new URLSearchParams(location.search).get('ro');
    if (deep) openRo(Number(deep));
  }).catch(function (e) { if (e.message !== 'signed out') console.error(e); });

  function fillStatusFilter(groupId) {
    var s = $('fStatus');
    s.innerHTML = '<option value="">All statuses</option>';
    STATUSES.filter(function (st) { return !groupId || st.group_id === groupId; })
      .forEach(function (st) {
        var o = document.createElement('option');
        o.value = st.slot_id; o.textContent = st.label; s.appendChild(o);
      });
  }

  function columns() {
    var c = [
      { k: 'ro', t: 'RO' }, { k: 'customer', t: 'Customer' }, { k: 'vehicle', t: 'Vehicle' },
      { k: 'status', t: 'Status' }, { k: 'assigned', t: 'Assigned' },
      { k: 'days', t: 'Days', num: true }, { k: 'promised', t: 'Promised' }
    ];
    if (ME.caps.money) c.push({ k: 'amount', t: 'Amount', num: true });
    return c;
  }
  function buildHead() {
    $('thead').innerHTML = columns().map(function (c) {
      return '<th' + (c.num ? ' class="num"' : '') + '>' + esc(c.t) + '</th>';
    }).join('');
  }

  function load() {
    var closed = $('fClosed').checked ? '?closed=1' : '';
    return Promise.all([api('/api/board' + closed), api('/api/board/summary')])
      .then(function (r) { FILES = r[0].files; renderKpis(r[1]); render(); });
  }

  function renderKpis(s) {
    $('kpis').innerHTML = [
      { v: s.inList, k: 'in list' },
      { v: s.laborHours.toFixed(1), k: 'labour hours' },
      { v: s.avgDays, k: 'avg days' },
      { v: s.onHold, k: 'on hold' },
      { v: s.pastTarget, k: 'past target' },
      { v: s.stalled, k: 'stalled' }
    ].map(function (i) {
      return '<div><div class="kpi-v">' + esc(i.v) + '</div><div class="kpi-k">' + esc(i.k) + '</div></div>';
    }).join('');
  }

  function filtered() {
    var g = $('fGroup').value, st = $('fStatus').value, q = $('fSearch').value.trim().toLowerCase();
    var out = FILES.filter(function (f) {
      if (g && f.group !== g) return false;
      if (st && f.statusSlot !== st) return false;
      if (q && [f.ro, f.customer, f.vehicle, f.vin, f.insurer].join(' ').toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var sort = $('fSort').value;
    out.sort(function (a, b) {
      if (sort === 'days') return b.daysInShop - a.daysInShop;
      if (sort === 'ro') return String(a.ro).localeCompare(String(b.ro));
      if (sort === 'status') return String(a.status || '').localeCompare(String(b.status || ''));
      return new Date(b.openedAt) - new Date(a.openedAt);
    });
    return out;
  }

  function render() {
    var rows = filtered();
    $('headmeta').textContent = rows.length + ' of ' + FILES.length + ' files · ' +
      ($('fClosed').checked ? 'closed, last 90 days' : 'open');

    if (!rows.length) {
      $('tbody').innerHTML = '';
      $('empty').hidden = false;
      $('empty').innerHTML = FILES.length ? 'Nothing matches those filters.'
        : 'No repair orders yet.<br>Use <strong>New RO</strong> or <strong>Check-in</strong> to write the first one.';
      return;
    }
    $('empty').hidden = true;

    $('tbody').innerHTML = rows.map(function (f) {
      var assigned = Object.keys(f.assigned || {}).map(function (k) { return f.assigned[k]; })
        .filter(Boolean).join(', ');
      var flags = '';
      if (f.onHold) flags += '<span class="flag" style="color:var(--stopped);border:1px solid var(--stopped)">Hold</span>';
      if (f.partsWaiting) flags += '<span class="flag" style="color:var(--blocked);border:1px solid var(--blocked)">Parts</span>';
      if (f.supplementsOpen) flags += '<span class="flag" style="color:var(--move);border:1px solid var(--move)">Supp</span>';

      var cells = [
        '<td><div class="ro">' + esc(f.ro) + '</div><div class="sub">' + esc(f.groupLabel || '') + '</div></td>',
        '<td>' + esc(f.customer || '—') + '<div class="sub">' + esc(f.insurer || '') + '</div></td>',
        '<td>' + esc(f.vehicle || '—') + '<div class="sub">' + esc(f.color || '') + '</div></td>',
        '<td><span class="pill"><span class="dot" style="background:' + (KIND[f.kind] || 'var(--dim)') +
          '"></span>' + esc(f.status || 'No status') + '</span>' + flags + '</td>',
        '<td>' + esc(assigned || '—') + '</td>',
        '<td class="num" style="color:' + AGE[f.age] + '">' + f.daysInShop + '</td>',
        '<td>' + shortDate(f.promisedAt) + '</td>'
      ];
      if (ME.caps.money) cells.push('<td class="num">' + money(f.amount_cents) + '</td>');
      return '<tr class="clickable" data-id="' + f.id + '">' + cells.join('') + '</tr>';
    }).join('');

    Array.prototype.forEach.call($('tbody').querySelectorAll('tr'), function (tr) {
      tr.addEventListener('click', function () { openRo(Number(tr.dataset.id)); });
    });
  }

  /* ------------------------------------------------------------- drawer */

  function openRo(id) {
    OPEN = id;
    $('scrim').classList.add('open');
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
    $('dBody').innerHTML = '<div class="empty">Loading…</div>';

    api('/api/ro/' + id).then(function (d) {
      var r = d.ro;
      $('dRo').textContent = r.ro_number;
      $('dSub').textContent = [r.year, r.make, r.model].filter(Boolean).join(' ') +
        (r.customer_name ? ' · ' + r.customer_name : '');
      renderDrawer(d);
    }).catch(function (e) {
      $('dBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }

  function closeRo() {
    OPEN = null;
    $('scrim').classList.remove('open');
    $('drawer').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'true');
    if (new URLSearchParams(location.search).get('ro')) history.replaceState(null, '', '/board.html');
  }

  function field(l, v) {
    return '<div><div class="f-l">' + esc(l) + '</div><div class="f-v">' +
      esc(v == null || v === '' ? '—' : v) + '</div></div>';
  }

  function renderDrawer(d) {
    var r = d.ro, h = [];

    h.push('<div class="sec">Status</div>');
    h.push('<div class="row" style="margin-bottom:10px"><span class="pill"><span class="dot" style="background:' +
      (KIND[r.status_kind] || 'var(--dim)') + '"></span>' + esc(r.status_label || 'No status') + '</span>' +
      '<span class="sub">' + esc(r.group_label || '') + '</span>' +
      (r.on_hold ? '<span class="flag" style="color:var(--stopped);border:1px solid var(--stopped)">On hold</span>' : '') +
      '</div>');

    h.push('<div class="stack"><select id="newStatus"><option value="">Select a new status…</option>' +
      GROUPS.map(function (g) {
        var o = STATUSES.filter(function (s) { return s.group_id === g.group_id; })
          .map(function (s) { return '<option value="' + esc(s.slot_id) + '">' + esc(s.label) + '</option>'; }).join('');
        return o ? '<optgroup label="' + esc(g.label) + '">' + o + '</optgroup>' : '';
      }).join('') + '</select>' +
      '<textarea id="newNote" placeholder="Add a note (optional)"></textarea>' +
      '<div class="row"><button class="btn btn-solid" id="saveStatus">Save</button></div></div>');
    h.push('<div class="msg" id="dMsg"></div>');

    h.push('<div class="sec">File</div><div class="grid2">');
    h.push(field('Customer', r.customer_name), field('Phone', r.customer_phone));
    h.push(field('Insurer', r.insurer_name), field('Claim', r.claim_number));
    h.push(field('VIN', r.vin), field('Plate', r.plate));
    h.push(field('Opened', when(r.opened_at)), field('Promised', r.promised_at ? shortDate(r.promised_at) : null));
    h.push(field('Repair path', r.repair_path), field('Labour hours', r.labor_hours));
    if (ME.caps.money) h.push(field('Amount', money(r.amount_cents)), field('Deductible', money(r.deductible_cents)));
    h.push('</div>');

    var ak = Object.keys(d.assigned || {});
    if (ak.length) {
      h.push('<div class="sec">Assigned</div><div class="grid2">');
      ak.forEach(function (k) { h.push(field(k, d.assigned[k].name)); });
      h.push('</div>');
    }

    if (ME.features.indexOf('parts') >= 0) {
      h.push('<div class="sec">Parts</div>');
      if (!d.parts.length) h.push('<div class="sub">No parts on this file.</div>');
      d.parts.forEach(function (p) {
        h.push('<div class="partrow"><div><div class="log-b">' + esc(p.description) + '</div>' +
          '<div class="log-m">' + esc(p.state) + ' · qty ' + p.qty +
          (p.vendor_name ? ' · ' + esc(p.vendor_name) : '') +
          (p.eta ? ' · ETA ' + shortDate(p.eta) : '') + '</div></div>' +
          (ME.caps.manageParts && p.state !== 'received'
            ? '<button class="btn btn-ghost" data-recv="' + p.id + '" style="padding:5px 9px;font-size:10.5px">Received</button>'
            : '') + '</div>');
      });
      if (ME.caps.manageParts) {
        h.push('<div class="row" style="margin-top:10px">' +
          '<input type="text" id="pDesc" placeholder="Part description" style="flex:1;min-width:160px">' +
          '<input type="number" id="pQty" value="1" min="1" style="width:64px">' +
          '<button class="btn btn-ghost" id="addPart">Add</button></div>');
      }
    }

    if (d.supplements && d.supplements.length) {
      h.push('<div class="sec">Supplements</div>');
      d.supplements.forEach(function (s) {
        h.push('<div class="log"><div class="log-b">Supplement ' + s.seq + ' · ' + esc(s.state) + '</div>' +
          '<div class="log-m">' + (ME.caps.money
            ? 'requested ' + money(s.requested_cents) + ' · approved ' + money(s.approved_cents) + ' · ' : '') +
          (s.sent_at ? 'sent ' + shortDate(s.sent_at) : 'not sent') +
          (s.decided_at ? ' · decided ' + shortDate(s.decided_at) : '') + '</div></div>');
      });
    }

    if (d.sublets && d.sublets.length) {
      h.push('<div class="sec">Sublet</div>');
      d.sublets.forEach(function (s) {
        h.push('<div class="log"><div class="log-b">' + esc(s.service) +
          (s.vendor ? ' — ' + esc(s.vendor) : '') + '</div>' +
          '<div class="log-m">' + esc(s.state) +
          (s.out_at ? ' · out ' + shortDate(s.out_at) : '') +
          (s.back_at ? ' · back ' + shortDate(s.back_at) : '') +
          (ME.caps.money && s.cost_cents ? ' · ' + money(s.cost_cents) : '') + '</div></div>');
      });
    }

    if (ME.features.indexOf('docs') >= 0) {
      h.push('<div class="sec">Documents</div>');
      h.push('<div class="row" style="margin-bottom:10px">' +
        '<select id="docType" style="flex:1;min-width:150px">' +
        DOCTYPES.map(function (t) { return '<option value="' + esc(t.key) + '">' + esc(t.label) + '</option>'; }).join('') +
        '</select></div>');
      h.push('<div class="dropzone" id="drop">Drop files here, or tap to choose' +
        '<input type="file" id="fileInput" multiple hidden></div>');
      h.push('<div id="docList">');
      if (!d.documents.length) h.push('<div class="sub" style="margin-top:10px">Nothing filed yet.</div>');
      d.documents.forEach(function (doc) {
        h.push('<div class="docrow"><div style="flex:1;min-width:0">' +
          '<a href="/api/documents/' + doc.id + '?inline=1" target="_blank" class="log-b" style="display:block">' +
          esc(doc.label) + '</a>' +
          '<div class="log-m">' + esc(doc.doc_type) + ' · ' + Math.round(doc.size_bytes / 1024) + ' KB · ' +
          esc(doc.uploaded_name || '') + ' · ' + when(doc.created_at) + '</div></div>' +
          (ME.caps.deleteDocuments
            ? '<button class="btn btn-danger" data-del="' + doc.id + '" style="padding:4px 8px;font-size:10px">Delete</button>'
            : '') + '</div>');
      });
      h.push('</div>');
    }

    h.push('<div class="sec">Notes and history</div>');
    if (!d.notes.length) h.push('<div class="sub">Nothing recorded yet.</div>');
    d.notes.forEach(function (n) {
      h.push('<div class="log"><div class="log-b"' + (n.kind === 'auto' ? ' style="color:var(--muted)"' : '') + '>' +
        esc(n.body) + '</div><div class="log-m">' + esc(n.user_name || 'system') + ' · ' + when(n.created_at) +
        '</div></div>');
    });

    $('dBody').innerHTML = h.join('');
    wireDrawer();
  }

  function wireDrawer() {
    var msg = $('dMsg');
    function say(t, k) { msg.textContent = t; msg.className = 'msg ' + k; }

    $('saveStatus').addEventListener('click', function () {
      var slot = $('newStatus').value, note = $('newNote').value.trim();
      if (!slot && !note) return say('Pick a status or write a note.', 'err');
      api('/api/ro/' + OPEN + '/status', {
        method: 'POST', body: JSON.stringify({ slot: slot || undefined, note: note || undefined })
      }).then(function () {
        return load().then(function () { openRo(OPEN); Shell.refreshCount(); });
      }).catch(function (e) { say(e.message, 'err'); });
    });

    var add = $('addPart');
    if (add) add.addEventListener('click', function () {
      var desc = $('pDesc').value.trim();
      if (!desc) return say('Part needs a description.', 'err');
      api('/api/ro/' + OPEN + '/parts', {
        method: 'POST',
        body: JSON.stringify({ description: desc, qty: Number($('pQty').value) || 1 })
      }).then(function () { openRo(OPEN); }).catch(function (e) { say(e.message, 'err'); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-recv]'), function (b) {
      b.addEventListener('click', function () {
        api('/api/parts/' + b.dataset.recv, {
          method: 'PATCH', body: JSON.stringify({ state: 'received' })
        }).then(function () { openRo(OPEN); Shell.refreshCount(); })
          .catch(function (e) { say(e.message, 'err'); });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Delete this document?')) return;
        api('/api/documents/' + b.dataset.del, { method: 'DELETE' })
          .then(function () { openRo(OPEN); }).catch(function (e) { say(e.message, 'err'); });
      });
    });

    var drop = $('drop'), input = $('fileInput');
    if (drop) {
      drop.addEventListener('click', function () { input.click(); });
      input.addEventListener('change', function () { upload(input.files); });
      ['dragenter', 'dragover'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('hot'); });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('hot'); });
      });
      drop.addEventListener('drop', function (e) {
        if (e.dataTransfer && e.dataTransfer.files.length) upload(e.dataTransfer.files);
      });
    }

    function upload(files) {
      if (!files || !files.length) return;
      var fd = new FormData();
      fd.append('docType', $('docType').value);
      for (var i = 0; i < files.length; i++) fd.append('file' + i, files[i]);
      drop.textContent = 'Uploading ' + files.length + ' file' + (files.length === 1 ? '' : 's') + '…';

      fetch('/api/ro/' + OPEN + '/documents', { method: 'POST', body: fd })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) { say(res.j.error, 'err'); drop.textContent = 'Drop files here, or tap to choose'; return; }
          openRo(OPEN);
        })
        .catch(function () { say('Upload failed.', 'err'); });
    }
  }

  $('fGroup').addEventListener('change', function () { fillStatusFilter(this.value); render(); });
  $('fStatus').addEventListener('change', render);
  $('fSort').addEventListener('change', render);
  $('fSearch').addEventListener('input', render);
  $('fClosed').addEventListener('change', function () { load(); });
  $('refresh').addEventListener('click', function () { load(); });
  $('scrim').addEventListener('click', closeRo);
  $('dClose').addEventListener('click', closeRo);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeRo(); });
  $('newRo').addEventListener('click', function () { location.href = '/new-ro.html'; });
})();
</script>
</body>
</html>
