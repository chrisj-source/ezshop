        }).join('') + '</div>');
      }
      others.forEach(function (doc) {
        L.push('<div class="docrow">' +
          '<span class="flag" style="color:var(--acc2);border:1px solid var(--line)">' +
          esc(String(doc.doc_type).replace(/_/g, ' ')) + '</span>' +
          '<div style="flex:1;min-width:0"><div class="log-b">' + esc(doc.label) + '</div>' +
          '<div class="log-m">' + esc(doc.uploaded_name || '') + ' · ' + when(doc.created_at) +
          ' · ' + Photos.bytes(doc.size_bytes) + '</div></div>' +
          '<a class="btn btn-ghost" href="/api/documents/' + doc.id + '?download=1" ' +
          'style="padding:4px 9px;font-size:10px">Download</a>' +
          (ME.caps.deleteDocuments
            ? '<button class="btn btn-danger" data-del="' + doc.id +
              '" style="padding:4px 8px;font-size:10px">×</button>'
            : '') + '</div>');
      });
      L.push('<div class="row" style="margin:12px 0 8px">' +
        '<select id="docType" style="flex:1;min-width:150px">' +
        DOCTYPES.map(function (t) {
          return '<option value="' + esc(t.key) + '">' + esc(t.label) + '</option>';
        }).join('') + '</select></div>');
      L.push('<div class="dropzone" id="drop">Drop files here, or choose a file — estimate, ' +
        'supplement, invoice, proof of payment<input type="file" id="fileInput" multiple hidden></div>');
    }

    $('dLeft').innerHTML = L.join('');

    /* ---- right column: what you do to the file ---- */
    var R = [];

    R.push('<div class="sec">Update this RO</div>');
    R.push('<div class="stack"><select id="newStatus" style="width:100%">' +
      '<option value="">Select a new status…</option>' + statusOptions(null) + '</select>' +
      '<textarea id="newNote" placeholder="Add a note — call with the adjuster, customer, parts vendor…"></textarea>' +
      '<div class="row"><button class="btn btn-solid" id="saveStatus">Add a note or pick a status</button>' +
      '<span class="sub" style="flex:1;min-width:120px">Notifies whoever owns the status it lands in.</span>' +
      '</div></div>');
    R.push('<div class="msg" id="dMsg"></div>');
    if (ME.caps.editRepairOrders) {
      R.push('<div class="savehint">Details, dates, money and assignments on the left are saved when ' +
        'you close this file — you are asked first, and told what changed.</div>');
    }

    var LAST = [];

    if (r.voided_at && d.canVoid) {
      LAST.push('<div class="sec">Bring it back</div>');
      LAST.push('<div class="stack">' +
        '<input type="text" id="vNumber" placeholder="New RO number — blank takes the next in sequence" ' +
        'style="width:100%">' +
        '<select id="vSlot" style="width:100%">' + statusOptions(r.status_slot) + '</select>' +
        '<label class="row" style="gap:7px;align-items:center">' +
        '<input type="checkbox" id="vParts" checked>' +
        '<span class="sub" style="text-transform:none;letter-spacing:0">Bring the cancelled parts lines back as needed</span>' +
        '</label>' +
        '<div class="row"><button class="btn btn-solid" id="doReopen">Reopen this file</button>' +
        '<span class="sub" style="flex:1;min-width:120px">Same file, new number. Documents, notes, ' +
        'history, dates and money all come with it.</span></div></div>');
    } else if (!r.voided_at && d.canVoid) {
      // Last thing in the modal, hard against the right edge: voiding a file is
      // the end of the road, not something to meet on the way in.
      LAST.push('<div class="sec">Void this file</div>');
      LAST.push('<div class="stack">' +
        '<span class="sub" style="text-transform:none;letter-spacing:0">Cancels the parts, flags ' +
        'anything already ordered for return, frees the number and takes it off the board. ' +
        'Nobody is notified — it is in the log.</span>' +
        '<select id="vReason" style="width:100%">' +
        VOID_REASONS.map(function (x) {
          return '<option value="' + esc(x) + '">' + esc(x) + '</option>';
        }).join('') + '<option value="other">Something else — say why below</option></select>' +
        '<input type="text" id="vNote" placeholder="Anything worth recording" style="width:100%">' +
        '<div class="row" style="justify-content:flex-end">' +
        '<button class="btn btn-danger" id="doVoid">Void RO ' + esc(r.ro_number) +
        '</button></div></div>');
    }

    R.push('<div class="sec">Notes and history</div>');
    if (!d.notes.length) R.push('<div class="sub">Nothing recorded yet.</div>');
    d.notes.forEach(function (n) {
      R.push('<div class="log"><div class="row" style="gap:7px;align-items:baseline">' +
        '<span class="flag" style="color:' +
        (n.kind === 'auto' ? 'var(--dim)' : 'var(--acc2)') + ';border:1px solid var(--line)">' +
        esc(n.kind === 'auto' ? 'auto' : 'note') + '</span>' +
        '<span style="font:400 11px var(--font);color:var(--muted)">' +
        esc(n.user_name || 'System') + '</span>' +
        '<span class="log-m" style="margin:0 0 0 auto">' + when(n.created_at) + '</span></div>' +
        '<div class="log-b" style="margin-top:4px' +
        (n.kind === 'auto' ? ';color:var(--muted)' : '') + '">' + esc(n.body) + '</div></div>');
    });

    if (LAST.length) {
      R.push('<div style="margin-top:22px;padding-top:4px;border-top:1px solid var(--whisper)"></div>');
      R.push(LAST.join(''));
    }

    $('dRight').innerHTML = R.join('');
    fold($('dLeft'));
    fold($('dRight'));
    wireDrawer();
  }

  /**
   * Fact blocks fold away. Everything is open the first time; what someone
   * shuts stays shut on the next file and the next session — the state is per
   * section, not per RO. Folding never disables editing: the fields are still
   * there, still saved on close, they are just out of the way.
   */
  var FOLDS = 'es_drawer_folds';

  function foldState() {
    try { return JSON.parse(localStorage.getItem(FOLDS) || '{}') || {}; } catch (e) { return {}; }
  }
  function setFold(key, shut) {
    var s = foldState();
    if (shut) s[key] = 1; else delete s[key];
    try { localStorage.setItem(FOLDS, JSON.stringify(s)); } catch (e) { /* private mode */ }
  }

  function fold(col) {
    if (!col) return;
    var state = foldState();
    var secs = Array.prototype.slice.call(col.children).filter(function (el) {
      return el.classList && el.classList.contains('sec');
    });

    secs.forEach(function (sec) {
      var key = (sec.textContent || '').trim().toLowerCase().split(/\s{2,}|\s·\s/)[0].slice(0, 40);
      if (!key) return;

      var body = document.createElement('div');
      body.className = 'foldbody';
      var node = sec.nextSibling;
      while (node && !(node.classList && node.classList.contains('sec'))) {
        var next = node.nextSibling;
        body.appendChild(node);
        node = next;
      }
      sec.parentNode.insertBefore(body, sec.nextSibling);

      var cue = document.createElement('span');
      cue.className = 'foldcue';
      sec.appendChild(cue);
      sec.classList.add('fold');

      function paint(shut) {
        body.hidden = shut;
        sec.classList.toggle('shut', shut);
        cue.innerHTML = (shut ? 'show' : 'hide') + ' <span class="chev">&#9662;</span>';
      }
      paint(!!state[key]);

      sec.addEventListener('click', function () {
        var shut = !body.hidden;
        paint(shut);
        setFold(key, shut);
      });
    });
  }

  function daysIn(r) {
    var days = Math.floor((Date.now() - new Date(r.opened_at).getTime()) / 86400000);
    return Math.max(days - (Number(r.voided_days) || 0), 0);
  }

  function wireDrawer() {
    var msg = $('dMsg');
    function say(t, k) {
      if (!msg) return;
      msg.textContent = t;
      msg.className = 'msg ' + k;
    }
    function reopen() { return load().then(function () { openRo(OPEN); Shell.refreshCount(); }); }

    var ss = $('saveStatus');
    if (ss) ss.addEventListener('click', function () {
      var slot = $('newStatus').value, note = $('newNote').value.trim();
      if (!slot && !note) return say('Pick a status or write a note.', 'err');
      api('/api/ro/' + OPEN + '/status', {
        method: 'POST', body: JSON.stringify({ slot: slot || undefined, note: note || undefined })
      }).then(reopen).catch(function (e) { say(e.message, 'err'); });
    });

    var dv = $('doVoid');
    if (dv) dv.addEventListener('click', function () {
      var pick = $('vReason').value;
      var note = $('vNote').value.trim();
      var reason = pick === 'other' ? note : pick;
      if (!reason) return say('Say why it is being voided.', 'err');
      if (!confirm('Void this file? Parts already ordered get flagged for return, the number goes ' +
        'back in the pool, and it comes off the board.')) return;

      api('/api/ro/' + OPEN + '/void', {
        method: 'POST', body: JSON.stringify({ reason: reason, note: note || undefined })
      }).then(function (res) {
        closeRo();
        return load().then(function () {
          Shell.refreshCount();
          if (res.partsFlagged) {
            alert(res.partsFlagged + ' ordered part line' + (res.partsFlagged === 1 ? '' : 's') +
              ' flagged for return. They are on the returns list on the parts screen.');
          }
        });
      }).catch(function (e) { say(e.message, 'err'); });
    });

    var dr = $('doReopen');
    if (dr) dr.addEventListener('click', function () {
      api('/api/ro/' + OPEN + '/reopen', {
        method: 'POST',
        body: JSON.stringify({
          slot: $('vSlot').value,
          roNumber: $('vNumber').value.trim() || undefined,
          restoreParts: $('vParts').checked
        })
      }).then(reopen).catch(function (e) { say(e.message, 'err'); });
    });

    var ap = $('addPromise');    if (ap) ap.addEventListener('click', function () {
      var body = $('promiseText').value.trim();
      if (!body) return say('Write what was promised.', 'err');
      api('/api/ro/' + OPEN + '/promises', { method: 'POST', body: JSON.stringify({ body: body }) })
        .then(reopen).catch(function (e) { say(e.message, 'err'); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-promise]'), function (cb) {
      cb.addEventListener('change', function () {
        api('/api/promises/' + cb.dataset.promise, {
          method: 'PATCH', body: JSON.stringify({ done: cb.checked })
        }).then(reopen).catch(function (e) { say(e.message, 'err'); });
      });
    });

    var an = $('addNote');
    if (an) an.addEventListener('click', function () {
      var body = $('quickNote').value.trim();
      if (!body) return say('The note is empty.', 'err');
      api('/api/ro/' + OPEN + '/notes', { method: 'POST', body: JSON.stringify({ body: body }) })
        .then(reopen).catch(function (e) { say(e.message, 'err'); });
    });

    var add = $('addPart');
    if (add) add.addEventListener('click', function () {
      var desc = $('pDesc').value.trim();
      if (!desc) return say('Part needs a description.', 'err');
      var body = { description: desc, qty: Number($('pQty').value) || 1 };
      if ($('pPrice') && $('pPrice').value) body.priceCents = Math.round(Number($('pPrice').value) * 100);
      if ($('pCost') && $('pCost').value) body.costCents = Math.round(Number($('pCost').value) * 100);

      api('/api/ro/' + OPEN + '/parts', { method: 'POST', body: JSON.stringify(body) })
        .then(reopen).catch(function (e) { say(e.message, 'err'); });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-recv]'), function (b) {
      b.addEventListener('click', function () {
        api('/api/parts/' + b.dataset.recv, { method: 'PATCH', body: JSON.stringify({ state: 'received' }) })
          .then(reopen).catch(function (e) { say(e.message, 'err'); });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Delete this document?')) return;
        api('/api/documents/' + b.dataset.del, { method: 'DELETE' })
          .then(reopen).catch(function (e) { say(e.message, 'err'); });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-photo]'), function (el) {
      el.addEventListener('click', function () { showPhoto(Number(el.dataset.photo)); });
    });

    var drop = $('drop'), input = $('fileInput');
    if (drop) {
      drop.addEventListener('click', function () { input.click(); });
      input.addEventListener('change', function () { upload(input.files); });
      ['dragenter', 'dragover'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('hot'); });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('hot'); });
      });
      drop.addEventListener('drop', function (e) {
        if (e.dataTransfer && e.dataTransfer.files.length) upload(e.dataTransfer.files);
      });
    }

    function upload(files) {
      if (!files || !files.length) return;
      var n = files.length;
      drop.textContent = 'Preparing ' + n + ' file' + (n === 1 ? '' : 's') + '…';

      Photos.prepareAll(files).then(function (items) {
        var fd = new FormData();
        fd.append('docType', $('docType').value);
        var before = 0, after = 0;
        items.forEach(function (it, i) {
          Photos.appendTo(fd, i, it.file, it.prepared);
          if (!it.prepared.passthrough) {
            before += it.prepared.originalBytes || 0;
            after += it.prepared.bytes || 0;
          }
        });
        drop.textContent = 'Uploading' + (before
          ? ' · ' + Photos.bytes(before) + ' → ' + Photos.bytes(after) : '') + '…';

        return fetch('/api/ro/' + OPEN + '/documents', { method: 'POST', body: fd })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            if (!res.ok) {
              say(res.j.error, 'err');
              drop.textContent = 'Drop files here, or tap to choose';
              return;
            }
            openRo(OPEN);
          });
      }).catch(function () {
        say('Upload failed.', 'err');
        drop.textContent = 'Drop files here, or tap to choose';
      });
    }
  }

  /* -------------------------------------------------------------- lightbox */

  function showPhoto(i) {
    if (!PHOTOSET.length) return;
    LBAT = (i + PHOTOSET.length) % PHOTOSET.length;
    var p = PHOTOSET[LBAT];
    $('lbImg').src = '/api/documents/' + p.id;
    $('lbMeta').textContent = (LBAT + 1) + ' of ' + PHOTOSET.length + ' · ' + p.label +
      (p.width ? ' · ' + p.width + '×' + p.height : '') + ' · ' + Photos.bytes(p.size_bytes);
    $('lbDownload').href = '/api/documents/' + p.id + '?download=1';
    $('lbDownload').setAttribute('download', p.label || 'photo.jpg');
    $('lightbox').hidden = false;
  }
  function hidePhoto() { $('lightbox').hidden = true; $('lbImg').removeAttribute('src'); }

  $('lbClose').addEventListener('click', hidePhoto);
  $('lbPrev').addEventListener('click', function () { showPhoto(LBAT - 1); });
  $('lbNext').addEventListener('click', function () { showPhoto(LBAT + 1); });
  $('lightbox').addEventListener('click', function (e) { if (e.target.id === 'lightbox') hidePhoto(); });

  /* ---------------------------------------------------------------- wiring */

  $('vTable').addEventListener('click', function () { VIEW = 'table'; saveCols(); syncView(); render(); });
  $('vCycle').addEventListener('click', function () { VIEW = 'cycle'; saveCols(); syncView(); render(); });

  $('colBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    $('colPanel').hidden = !$('colPanel').hidden;
  });
  document.addEventListener('click', function (e) {
    var p = $('colPanel');
    if (!p.hidden && !p.contains(e.target) && e.target.id !== 'colBtn') p.hidden = true;
  });

  function on(id, ev, fn) {
    var el = $(id);
    if (el) el.addEventListener(ev, fn);
  }

  on('fGroup', 'change', function () { fillStatusFilter(this.value); render(); });
  on('fStatus', 'change', render);
  on('fSearch', 'input', render);
  on('fTech', 'change', render);
  on('fDone', 'change', render);
  on('fClosed', 'change', function () { load(); });
  on('fPrint', 'click', function () { window.print(); });
  on('refresh', 'click', function () { load(); });
  on('scrim', 'click', tryCloseRo);
  on('dClose', 'click', tryCloseRo);

  on('gKeep', 'click', function () { $('guard').hidden = true; });
  on('gDiscard', 'click', closeRo);
  on('gSave', 'click', function () {
    var btn = $('gSave');
    btn.disabled = true;
    $('gMsg').textContent = 'Saving…';
    $('gMsg').className = 'msg ok';

    saveAll().then(function () {
      btn.disabled = false;
      closeRo();
      return load().then(function () { Shell.refreshCount(); });
    }).catch(function (e) {
      btn.disabled = false;
      $('gMsg').textContent = e.message + ' — nothing after that point was saved.';
      $('gMsg').className = 'msg err';
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!$('lightbox').hidden) hidePhoto();
      else if ($('colPanel') && !$('colPanel').hidden) $('colPanel').hidden = true;
      else if (!$('guard').hidden) $('guard').hidden = true;
      else tryCloseRo();
    }
    if (!$('lightbox').hidden) {
      if (e.key === 'ArrowLeft') showPhoto(LBAT - 1);
      if (e.key === 'ArrowRight') showPhoto(LBAT + 1);
    }
  });
  on('newRo', 'click', function () { location.href = '/new-ro.html'; });
  on('dDocs', 'click', function () {
    var drop = $('drop');
    if (!drop) return;
    // The block may be folded away; open it before scrolling to it.
    var body = drop.closest('.foldbody');
    if (body && body.hidden) {
      var sec = body.previousElementSibling;
      if (sec && sec.classList.contains('sec')) sec.click();
    }
    $('dLeft').scrollTop = drop.offsetTop - 60;
  });
})();
</script>
</body>
</html>
