<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2740">
<title>Board — Easy Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=7">
<style>
  /* ---- shared ---- */
  .ro { font-weight:500; font-variant-numeric:tabular-nums; }
  .seg { display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .seg button {
    font:500 10.5px var(--font); padding:6px 11px; background:transparent;
    border:none; color:var(--dim); min-height:30px;
  }
  .seg button.sel { background:var(--acc); color:var(--bg); }
  .colpanel {
    position:absolute; left:0; top:calc(100% + 6px); z-index:30; width:222px; background:var(--surf);
    border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow-md,0 16px 40px rgba(0,0,0,.45));
    padding:6px 0;
  }
  .colpanel[hidden] { display:none; }
  .colrow {
    display:flex; align-items:center; gap:9px; padding:7px 12px;
    font:400 11.5px var(--font); cursor:pointer;
  }
  .colrow:hover { background:var(--whisper); }
  .colrow.locked { opacity:.45; cursor:default; }
  .colhead {
    font:600 8.5px var(--font); letter-spacing:.13em; text-transform:uppercase;
    color:var(--acc2); padding:9px 12px 6px;
  }

  /* ---- printing ---- */
  /* The sheet is the view already on screen: same rows, same filter, chrome
     stripped. Landscape letter, because nine columns need the width. */
  .printhead { display:none; }
  .writein { display:none; }

  @page { size: letter landscape; margin: 12mm 10mm; }

  @media print {
    :root { --text:#111; --muted:#333; --dim:#555; --line:#999; --whisper:#ddd; }
    html, body { background:#fff !important; color:#111 !important; height:auto; }
    body { display:block; }

    .bar, .hairline, .filters, .kpis, .scrim, .modal, .guard, .lightbox,
    .tabbar, .sheet, .colpanel, .impbanner, .legend, .cardsum, .tailrow { display:none !important; }

    main { display:block; overflow:visible; }
    .tablewrap, .cyclewrap { padding:0; overflow:visible; }

    .printhead {
      display:flex; align-items:baseline; gap:14px;
      border-bottom:1.5px solid #111; padding-bottom:6px; margin-bottom:10px;
    }
    .phshop { font:600 13pt 'Inter',sans-serif; color:#111; }
    .phwhat { font:400 9.5pt 'Inter',sans-serif; color:#333; }

    .gridhead, .cyclehead {
      background:#fff !important; color:#111 !important; border-bottom:1px solid #111;
      position:static; height:auto; padding:0 0 4px;
    }
    .lanehead {
      background:#fff !important; position:static; border:none; border-bottom:1px solid #111;
      padding:9pt 0 3pt; break-after:avoid; page-break-after:avoid;
    }
    .lanename { color:#111 !important; }

    .gridrow, .cyclerow {
      break-inside:avoid; page-break-inside:avoid;
      border-bottom:1px solid #ccc; padding:5pt 0; min-height:0;
      color:#111 !important; cursor:default;
    }
    .gridrow *, .cyclerow *, .lanehead * { color:#111 !important; }
    .cellsub, .sub, .log-m { color:#555 !important; }
    .edge, .track, .pip { display:none !important; }
    .flag, .pill { border-color:#999 !important; }

    /* The progression bars survive: they are the point of the cycle sheet. */
    .pseg { print-color-adjust:exact; -webkit-print-color-adjust:exact; }

    /* A ruled column to write in. The grid gets one more track: rows carry the
       widened template in --printcols so an inline style cannot win. */
    .writein { display:block; border-bottom:1px solid #999; height:1.4em; align-self:end; }
    .gridhead, .gridrow { grid-template-columns:var(--printcols) !important; }
    .cyclehead, .cyclerow { grid-template-columns:210px 240px 1fr 70px 60px 1.7in !important; }

    .cards, .empty { display:none !important; }
    a[href]::after { content:none !important; }
  }

  /* ---- table view ---- */
  .tablewrap { padding:0 0 24px; }

  /* ---- cycle view ---- */
  .cyclewrap { padding:0 0 24px; }
  .legend { display:flex; align-items:center; gap:14px; padding:10px 18px; border-bottom:1px solid var(--whisper); flex-wrap:wrap; }
  .legitem { display:flex; align-items:center; gap:6px; font:400 10.5px var(--font); color:var(--dim); }
  .legswatch { width:14px; height:6px; border-radius:1px; }
  .cyclehead {
    display:grid; grid-template-columns:250px 286px 1fr 96px 88px; gap:14px; align-items:center;
    padding:0 18px; height:32px; position:sticky; top:0; z-index:2; background:var(--surf);
    font:600 8.5px var(--font); letter-spacing:.12em; text-transform:uppercase; color:var(--acc2);
  }
  .lanehead {
    display:flex; align-items:center; gap:9px; padding:8px 18px; background:var(--surf);
    position:sticky; top:0; z-index:2;
    border-top:1px solid var(--whisper); border-bottom:1px solid var(--whisper);
  }
  .lanen { font:500 9.5px var(--font); font-variant-numeric:tabular-nums; color:var(--acc); }
  .lanename { font:500 12px var(--font); letter-spacing:.06em; text-transform:uppercase; }
  .cyclerow {
    display:grid; grid-template-columns:250px 286px 1fr 96px 88px; gap:14px; align-items:center;
    padding:7px 18px; min-height:52px; border-bottom:1px solid var(--whisper); cursor:pointer;
  }
  /* A CCC vehicle line runs to fifty characters. Two lines, then an ellipsis —
     the full text is on the row's title attribute and in the drawer. */
  .cyclerow .cell {
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; line-height:1.3;
  }
  .cyclerow .sub { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cyclerow:hover { background:var(--surf); }
  .progress { display:flex; gap:3px; align-items:center; }
  .pseg { height:6px; flex:1; border-radius:1px; min-width:4px; }
  .track { height:2px; border-radius:1px; background:var(--whisper); margin-top:5px; }
  .trackfill { height:100%; border-radius:1px; }

  /* ---- unsaved-changes guard ---- */
  .guard {
    position:fixed; inset:0; z-index:70; background:rgba(9,13,20,.72);
    display:grid; place-items:center; padding:24px;
  }
  .guard[hidden] { display:none; }
  .guardcard {
    width:min(440px,100%); background:var(--bg); border:1px solid var(--acc);
    border-radius:8px; padding:18px 20px 16px; box-shadow:0 24px 60px rgba(0,0,0,.55);
  }
  .guardtitle { font:500 14px var(--font); }
  .guardbody {
    font:400 11.5px/1.6 var(--font); color:var(--muted); margin:9px 0 15px;
  }
  .guardbody ul { margin:6px 0 0; padding-left:17px; }
  .guardbody li { margin:2px 0; }
  .guardrow { display:flex; gap:9px; flex-wrap:wrap; }

  /* ---- modal: centred, wide, two columns like the mockup ---- */
  .modal {
    position:fixed; inset:24px; z-index:30; display:none;
    background:var(--bg); border:1px solid var(--line); border-radius:8px;
    box-shadow:0 30px 80px rgba(0,0,0,.55); overflow:hidden;
    grid-template-rows:auto 1fr;
  }
  .modal.open { display:grid; }
  .mhead {
    display:flex; align-items:center; gap:10px; padding:0 14px; height:56px;
    background:var(--surf); box-shadow:inset 0 -1px 0 var(--line); flex-wrap:nowrap;
  }
  .mhead .spacer { margin-left:auto; }
  .mbody { display:grid; grid-template-columns:1fr 392px; min-height:0; }
  .mcol { overflow-y:auto; padding:0 18px 26px; }
  .mright { border-left:1px solid var(--whisper); background:rgba(231,234,242,.02); }

  /* Field blocks: label above the value, three to a row. */
  .fieldset { display:grid; grid-template-columns:repeat(3,1fr); gap:14px 18px; }
  .fieldset.two { grid-template-columns:repeat(2,1fr); }
  .fl2 {
    font:600 8px var(--font); letter-spacing:.11em; text-transform:uppercase;
    color:var(--acc2); margin-bottom:4px;
  }
  .fv2 { font:400 12.5px var(--font); }
  .fv2.num { font-variant-numeric:tabular-nums; }
  .secline { border-bottom:1px solid var(--whisper); margin-bottom:12px; padding-bottom:9px; }

  /* ---- collapsible fact blocks ---- */
  .sec.fold { cursor:pointer; user-select:none; display:flex; align-items:center; gap:8px; }
  .sec.fold:hover .foldcue { color:var(--acc); }
  .foldcue {
    font:400 10px var(--font); color:var(--dim); margin-left:auto; letter-spacing:0;
    text-transform:none; display:flex; align-items:center; gap:5px;
  }
  .foldcue .chev { display:inline-block; transition:transform .12s ease; }
  .sec.fold.shut .foldcue .chev { transform:rotate(-90deg); }
  .foldbody[hidden] { display:none; }
  .savehint {
    font:400 11px var(--font); color:var(--dim); margin:9px 0 2px;
  }

  @media (max-width:1100px) {
    .mbody { grid-template-columns:1fr; }
    .mright { border-left:none; border-top:1px solid var(--line); }
    .fieldset { grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:820px) {
    .modal { inset:0; border-radius:0; border:none; }
    .fieldset { grid-template-columns:1fr 1fr; }
  }

  /* ---- drawer extras ---- */
  .promise { display:flex; align-items:flex-start; gap:9px; padding:8px 0; border-top:1px solid var(--whisper); }
  .promise input[type=checkbox] { margin-top:3px; }
  .promise.done .ptext { color:var(--dim); text-decoration:line-through; }
  .ptext { font:400 12px var(--font); line-height:1.45; flex:1; }
  .assigngrid { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
  .dropzone {
    border:1px dashed var(--line); border-radius:6px; padding:16px; text-align:center;
    font:400 11.5px var(--font); color:var(--dim); cursor:pointer;
  }
  .dropzone.hot { border-color:var(--acc); color:var(--acc); background:rgba(217,164,65,.06); }
  .docrow { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--whisper); }
  .partrow { display:grid; grid-template-columns:1fr auto; gap:10px; padding:9px 0; border-top:1px solid var(--whisper); }
  .photogrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:6px; margin-top:10px; }
  .photocell {
    position:relative; aspect-ratio:1; border-radius:4px; overflow:hidden;
    background:var(--surf); border:none; padding:0; cursor:pointer;
  }
  .photocell img { width:100%; height:100%; object-fit:cover; display:block; }
  .photocell:hover { outline:2px solid var(--acc); outline-offset:-2px; }
  .lightbox {
    position:fixed; inset:0; z-index:60; background:rgba(9,13,20,.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  }
  .lightbox[hidden] { display:none; }
  .lightbox img { max-width:94vw; max-height:76vh; border-radius:6px; }
  .lbbar { display:flex; gap:9px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .lbmeta { font:400 11px var(--font); color:var(--dim); text-align:center; }

  /* ---- mobile: cards instead of a table ---- */
  .cards { display:none; }
  .cardsum { display:none; }
  @media (max-width:820px) {
    .gridhead, .gridrow, .tailrow, .cyclehead, .cyclerow { display:none; }
    .cards { display:block; }
    .tablewrap { padding:0 0 24px; }
    .card {
      display:block; width:100%; text-align:left; background:transparent; color:var(--text);
      border:none; border-bottom:1px solid var(--whisper); padding:13px 14px;
    }
    .card:active { background:var(--whisper); }
    .cardtop { display:flex; align-items:baseline; gap:8px; }
    .cardro { font:600 15px var(--font); font-variant-numeric:tabular-nums; }
    .carddays { margin-left:auto; font:500 12px var(--font); font-variant-numeric:tabular-nums; }
    .cardveh { font:400 13px var(--font); color:var(--muted); margin-top:3px; }
    .cardline { display:flex; align-items:center; gap:7px; margin-top:8px; flex-wrap:wrap; }
    .lanehead { padding:8px 14px; }
    .assigngrid { grid-template-columns:1fr; }

    /* The modal header is a single desktop row; squeezed onto a phone every
       item wrapped to one word per line and the row ran off the side. Two
       rows instead: the file on top, its status and actions scrolling under. */
    .mhead {
      display:grid; grid-template-columns:auto auto 1fr auto; grid-auto-rows:min-content;
      align-items:center; gap:4px 9px; height:auto; padding:9px 12px;
    }
    .mhead > * { min-width:0; }
    #dVeh, #dSub {
      grid-column:1 / -1; margin-left:0;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    #dStatus, #dParts, #dDocs {
      grid-row:3; white-space:nowrap;
    }
    #dStatus { grid-column:1 / span 2; }
    #dParts { grid-column:3; justify-self:start; }
    #dDocs { grid-column:4; }
    .mhead .close { grid-row:1; grid-column:4; }
    .mhead .spacer { display:none; }
    #dParts, #dDocs {
      overflow:hidden; text-overflow:ellipsis; font-size:11px; padding:7px 9px;
    }
    .cardsum {
      position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px;
      padding:7px 14px; background:var(--surf);
      border-top:1px solid var(--whisper); border-bottom:1px solid var(--whisper);
      font:400 11px var(--font); color:var(--dim); white-space:nowrap;
      overflow-x:auto; scrollbar-width:none;
    }
    .cardsum::-webkit-scrollbar { display:none; }
    #fPrint { display:none; }
    .cardsum b { font:500 12px var(--font); font-variant-numeric:tabular-nums; color:var(--text); }
  }
</style>
</head>
<body>

<div class="lightbox" id="lightbox" hidden>
  <img id="lbImg" alt="">
  <div class="lbmeta" id="lbMeta"></div>
  <div class="lbbar">
    <button class="btn btn-ghost" id="lbPrev">Previous</button>
    <a class="btn" id="lbDownload" download>Download</a>
    <button class="btn btn-ghost" id="lbNext">Next</button>
    <button class="btn btn-ghost" id="lbClose">Close</button>
  </div>
</div>

<div class="bar">
  <div class="brand"><div class="mark">ES</div><div class="word">Easy Shop</div></div>
  <div class="vr"></div>
  <div class="co" id="coName">—</div>
  <div id="nav"></div>
  <div class="spacer"></div>
  <a href="/platform.html" id="platformLink" hidden style="font:400 11px var(--font);color:var(--dim)">Platform</a>
  <div id="bell"></div>
  <div class="who" id="who">—</div>
  <button class="ghostbtn" id="signout">Sign out</button>
</div>
<div class="hairline"></div>

<div class="filters">
  <div class="segctl">
    <button id="vTable" class="sel">Table</button>
    <button id="vCycle">Cycle</button>
  </div>
  <input type="search" id="fSearch" placeholder="Search RO #, VIN, plate, name…">
  <select id="fStatus"></select>
  <select id="fGroup"><option value="">All stages</option></select>
  <select id="fTech"><option value="">Everyone</option></select>
  <label class="row" style="font:400 11.5px var(--font);color:var(--muted);gap:5px">
    <input type="checkbox" id="fDone"> Complete
  </label>
  <label class="row" style="font:400 11.5px var(--font);color:var(--muted);gap:5px">
    <input type="checkbox" id="fClosed"> Closed
  </label>
  <div style="position:relative">
    <button class="btn btn-ghost" id="colBtn">Columns ▾</button>
    <div class="colpanel" id="colPanel" hidden></div>
  </div>
  <div class="spacer"></div>
  <button class="btn btn-ghost" id="fPrint">Print list</button>
  <a class="btn btn-ghost" href="/import.html" id="importLink" hidden>Import EMS</a>
  <button class="btn" id="newRo">+ New RO</button>
</div>

<div class="printhead" id="printHead" aria-hidden="true">
  <div class="phshop" id="phShop">—</div>
  <div class="phwhat" id="phWhat">—</div>
</div>

<div class="kpis" id="kpis"></div>

<main>
  <div class="tablewrap" id="tableView">
    <div class="gridhead" id="gridHead"></div>
    <div id="gridBody"></div>
    <div class="cards" id="cards"></div>
    <div class="empty" id="empty" hidden></div>
  </div>
  <div class="cyclewrap" id="cycleView" hidden>
    <div class="legend" id="legend"></div>
    <div class="cyclehead">
      <div>Vehicle</div><div>Current status</div><div id="progHead">Progression</div>
      <div>Days</div><div style="text-align:right">Variance</div><div class="writein"></div>
    </div>
    <div id="cycleBody"></div>
  </div>
</main>

<div class="scrim" id="scrim"></div>

<div class="guard" id="guard" hidden>
  <div class="guardcard">
    <div class="guardtitle">You have unsaved changes on this file</div>
    <div class="guardbody" id="guardList"></div>
    <div class="guardrow">
      <button class="btn btn-solid" id="gSave">Save and close</button>
      <button class="btn btn-ghost" id="gKeep">Keep editing</button>
      <button class="btn btn-danger" id="gDiscard">Discard changes</button>
    </div>
    <div class="msg" id="gMsg"></div>
  </div>
</div>

<div class="modal" id="drawer" aria-hidden="true" role="dialog">
  <div class="mhead">
    <div class="pip" id="dPip" style="background:var(--acc);color:var(--bg)">00</div>
    <div style="font:500 15px var(--font);font-variant-numeric:tabular-nums" id="dRo">—</div>
    <div style="font:400 13px var(--font);color:var(--muted)" id="dVeh"></div>
    <div id="dStatus"></div>
    <div class="sub" id="dSub" style="margin-left:14px"></div>
    <div class="spacer"></div>
    <a class="btn" id="dParts" href="/parts.html">Open parts for this RO</a>
    <button class="btn btn-ghost" id="dDocs">Documents</button>
    <button class="close" id="dClose" aria-label="Close">&times;</button>
  </div>
  <div class="mbody">
    <div class="mcol" id="dLeft"></div>
    <div class="mcol mright" id="dRight"></div>
  </div>
</div>

<script src="/photos.js?v=5"></script>
<script src="/shell.js?v=7"></script>
<script>
(function () {
  var api = Shell.api, esc = Shell.esc;
  var ME = null, CFG = null, FILES = [], STATUSES = [], GROUPS = [], LANES = [], STAFF = [];
  var DOCTYPES = [], OPEN = null, VIEW = 'table', PHOTOSET = [], LBAT = 0;
  var SORT = { key: 'days', dir: 'desc' };

  var STORE = 'es_board_cols';

  /* Columns: `on` is the default, `lock` cannot be hidden, `money` needs access. */
  var COLUMNS = [
    { k: 'ro',       t: 'RO #',                w: 104, on: true, lock: true },
    { k: 'vehicle',  t: 'Vehicle',             w: 232, on: true, lock: true },
    { k: 'owner',    t: 'Owner',               w: 158, on: true },
    { k: 'insurance',t: 'Insurance',           w: 172, on: true },
    { k: 'desk',     t: 'Desk',                w: 52,  on: true },
    { k: 'assigned', t: 'Assigned',            w: 140, on: false },
    { k: 'lane',     t: 'Lane',                w: 104, on: false },
    { k: 'vin',      t: 'VIN',                 w: 158, on: false },
    { k: 'parts',    t: 'Parts',               w: 66,  on: false, num: true },
    { k: 'hours',    t: 'Hours',               w: 76,  on: true, num: true },
    { k: 'amount',   t: 'Amount',              w: 108, on: true, num: true, money: true },
    { k: 'days',     t: 'Days',                w: 96,  on: true },
    { k: 'promised', t: 'Promised',            w: 88,  on: false },
    { k: 'status',   t: 'Status / last update', w: 260, on: true, lock: true, flex: true }
  ];

  /**
   * Which lanes each position owns — the same map the server enforces with, in
   * permissions.ts. It decides what a technician's pipeline is: pick a painter
   * and the list is prep, paint and buff, not the whole shop.
   */
  var POSITION_LANES = {
    pdr: ['pdr'],
    body: ['body'],
    paint: ['prep', 'paint', 'buff'],
    ri: ['reassembly'],
    detail: ['detail']
  };

  /** A car nobody can start. PDR alone is a complete file — a hail car pulled by
      one tech needs nobody else. Once body or paint is on it, the car wants both:
      body and PDR still needs a painter, PDR and paint still needs a body tech. */
  var TRADE_LANES = ['pdr', 'body', 'paint', 'ri'];
  function needsTech(f) {
    var a = f.assigned || {};
    if (!TRADE_LANES.some(function (k) { return !!a[k]; })) return true;
    if (!a.body && !a.paint) return false;
    return !a.body || !a.paint;
  }

  function $(id) { return document.getElementById(id); }
  function money(c) {
    if (c == null) return '—';
    return '$' + (c / 100).toLocaleString('en-US',
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function money0(c) {
    if (c == null) return '—';
    return '$' + Math.round(c / 100).toLocaleString('en-US');
  }
  function when(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
           d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }
  function shortDate(v) {
    return v ? new Date(v).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';
  }
  var AGE = { ok: 'var(--done)', yellow: 'var(--blocked)', red: 'var(--stopped)' };
  var KIND = { milestone: 'var(--move)', queue: 'var(--blocked)', active: 'var(--acc)', complete: 'var(--done)' };

  /* --------------------------------------------------------------- column state */

  function loadCols() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { saved = null; }
    COLUMNS.forEach(function (c) {
      if (saved && saved[c.k]) {
        if (typeof saved[c.k].on === 'boolean') c.on = saved[c.k].on;
        if (saved[c.k].w > 40) c.w = saved[c.k].w;
      }
      if (c.lock) c.on = true;
    });
    if (saved && saved.__sort) SORT = saved.__sort;
    if (saved && saved.__view) VIEW = saved.__view;
  }

  function saveCols() {
    var out = { __sort: SORT, __view: VIEW };
    COLUMNS.forEach(function (c) { out[c.k] = { on: c.on, w: c.w }; });
    try { localStorage.setItem(STORE, JSON.stringify(out)); } catch (e) { /* private mode */ }
  }

  function activeCols() {
    return COLUMNS.filter(function (c) {
      if (c.money && !ME.caps.money) return false;
      return c.on;
    });
  }

  /* ------------------------------------------------------------------- boot */

  api('/api/me').then(function (me) {
    ME = me;
    if (!me.company) {
      if (me.isPlatformOwner) { location.href = '/platform.html'; return null; }
      document.body.innerHTML = '<div class="empty">Your account is not attached to a shop.</div>';
      return null;
    }
    loadCols();
    Shell.mount({ me: me, active: 'board' });
    if (me.features.indexOf('ems') >= 0 && me.caps.acceptImports) $('importLink').hidden = false;
    return Promise.all([
      api('/api/config'),
      api('/api/doc-types').catch(function () { return { types: [] }; })
    ]);
  }).then(function (r) {
    if (!r) return;
    CFG = r[0]; STATUSES = CFG.statuses; GROUPS = CFG.groups; LANES = CFG.lanes;
    STAFF = CFG.staff || []; DOCTYPES = r[1].types;

    CFG.groups.forEach(function (g) {
      var o = document.createElement('option');
      o.value = g.group_id; o.textContent = g.label;
      $('fGroup').appendChild(o);
    });
    $('fStatus').innerHTML = '';
    fillStatusFilter('');
    fillTechFilter();
    renderColPanel();
    syncView();
    return load();
  }).then(function () {
    var deep = new URLSearchParams(location.search).get('ro');
    if (deep) openRo(Number(deep));
  }).catch(function (e) {
    if (e.message === 'signed out') return;
    console.error(e);
    // A blank board and a broken board look the same, so say which it is.
    var em = $('empty');
    if (em) {
      em.innerHTML = 'The board could not load.<br>' +
        '<span class="sub">' + esc(e.message) + '</span><br><br>' +
        'If this is right after a deploy, the database is probably a migration behind — ' +
        'run <code>npm run build &amp;&amp; npm run migrate</code> on the server.';
      em.hidden = false;
    }
  });

  /**
   * Everyone, one technician, or the files that still need one. Grouped by
   * position so the list reads as the shop is organised.
   */
  /** Every trade a person works. staff_positions is the truth; the old single
      column is the fallback for a database that has not migrated yet. */
  function tradesOf(st) {
    if (st.position_keys && st.position_keys.length) return st.position_keys;
    return st.position_key ? [st.position_key] : [];
  }

  function fillTechFilter() {
    var s = $('fTech');
    var byPos = {};
    STAFF.forEach(function (st) {
      tradesOf(st).forEach(function (k) {
        if (!POSITION_LANES[k]) return;
        (byPos[k] = byPos[k] || []).push(st);
      });
    });

    var labels = { pdr: 'PDR', body: 'Body', paint: 'Paint', ri: 'R&I', detail: 'Detail' };

    s.innerHTML = '<option value="">Everyone</option>' +
      '<option value="none">Needs a tech</option>' +
      Object.keys(POSITION_LANES).filter(function (k) { return byPos[k]; }).map(function (k) {
        return '<optgroup label="' + esc(labels[k] || k) + '">' +
          byPos[k].map(function (st) {
            return '<option value="u' + st.user_id + ':' + k + '">' + esc(st.display_name) + '</option>';
          }).join('') + '</optgroup>';
      }).join('');

    // A technician's own board opens on their own work — their listed trade.
    var myTrades = (ME.positionKeys && ME.positionKeys.length)
      ? ME.positionKeys
      : (ME.positionKey ? [ME.positionKey] : []);
    var myLane = myTrades.filter(function (k) { return POSITION_LANES[k]; })[0];
    if (myLane) {
      var mine = 'u' + ME.user.id + ':' + myLane;
      if (s.querySelector('option[value="' + mine + '"]')) s.value = mine;
    }
  }

  /** The picked technician, as { userId, position, lanes } — or null. */
  function pickedTech() {
    var v = $('fTech').value;
    if (!v || v === 'none') return null;
    var bits = v.slice(1).split(':');
    return { userId: Number(bits[0]), position: bits[1], lanes: POSITION_LANES[bits[1]] || [] };
  }

  /** Statuses at Vehicle Ready or past it. */
  function completeSlots() {
    var ready = STATUSES.filter(function (s) { return /vehicle ready/i.test(s.label || ''); })[0];
    var from = ready ? Number(ready.sort_order) : null;
    return STATUSES.filter(function (s) {
      return from == null ? s.kind === 'complete' : Number(s.sort_order) >= from;
    }).map(function (s) { return s.slot_id; });
  }

  function fillStatusFilter(groupId) {
    var s = $('fStatus');
    s.innerHTML = '<option value="">All statuses (' + STATUSES.length + ')</option>';
    STATUSES.filter(function (st) { return !groupId || st.group_id === groupId; })
      .forEach(function (st) {
        var o = document.createElement('option');
        o.value = st.slot_id; o.textContent = st.label;
        s.appendChild(o);
      });
  }

  function load() {
    var closed = $('fClosed').checked ? '?closed=1' : '';
    return Promise.all([api('/api/board' + closed), api('/api/board/summary')])
      .then(function (r) { FILES = r[0].files; renderKpis(r[1]); render(); });
  }

  var SUMMARY = null;

  function renderKpis(s) {
    SUMMARY = s;
    var cells = [{ v: s.inList, k: 'In list' }];
    if (s.severityCents != null) cells.push({ v: money0(s.severityCents), k: 'Severity' });
    cells.push(
      { v: s.laborHours.toFixed(1), k: 'Labour hrs' },
      { v: s.avgDays + 'd', k: 'Avg days' },
      { v: s.onHold, k: 'On hold', tone: s.onHold ? 'var(--stopped)' : '' },
      { v: s.stalled, k: 'Stalled > 4d', tone: s.stalled ? 'var(--blocked)' : '' },
      { v: s.pastTarget, k: 'Past target', tone: s.pastTarget ? 'var(--stopped)' : '' }
    );

    $('kpis').innerHTML = cells.map(function (i) {
      return '<div><div class="kpi-v"' + (i.tone ? ' style="color:' + i.tone + '"' : '') + '>' +
        esc(i.v) + '</div><div class="kpi-k">' + esc(i.k) + '</div></div>';
    }).join('') +
    '<div class="kpi-tail"><div class="sub" id="sortNote"></div>' +
    '<button class="btn" id="flipSort">Flip order</button></div>';

    $('sortNote').textContent = sortNote();
    $('flipSort').addEventListener('click', function () {
      SORT.dir = SORT.dir === 'asc' ? 'desc' : 'asc';
      saveCols();
      render();
      $('sortNote').textContent = sortNote();
    });
  }

  function sortNote() {
    var col = COLUMNS.filter(function (c) { return c.k === SORT.key; })[0];
    var name = col ? col.t.toLowerCase() : SORT.key;
    if (SORT.key === 'days') {
      return SORT.dir === 'desc'
        ? 'Longest in shop first · newest at the bottom'
        : 'Newest first · longest in shop at the bottom';
    }
    return name + ' · ' + (SORT.dir === 'asc' ? 'ascending' : 'descending');
  }

  /* ---------------------------------------------------------------- filtering */

  function filtered() {
    var g = $('fGroup').value, st = $('fStatus').value, q = $('fSearch').value.trim().toLowerCase();
    var tech = pickedTech();
    var wantNone = $('fTech').value === 'none';
    var done = $('fDone').checked ? completeSlots() : null;

    var out = FILES.filter(function (f) {
      if (g && f.group !== g) return false;
      if (st && f.statusSlot !== st) return false;
      if (done && done.indexOf(f.statusSlot) < 0) return false;
      if (wantNone && !needsTech(f)) return false;
      if (tech) {
        var ids = f.assignedIds || {};
        var mine = Object.keys(ids).some(function (k) {
          return String(ids[k]) === String(tech.userId);
        });
        if (!mine) return false;
      }
      if (q && [f.ro, f.customer, f.vehicle, f.vin, f.insurer].join(' ').toLowerCase().indexOf(q) < 0) return false;
      return true;
    });

    var dir = SORT.dir === 'asc' ? 1 : -1;
    var key = SORT.key;
    out.sort(function (a, b) {
      var av, bv;
      switch (key) {
        case 'ro': av = String(a.ro); bv = String(b.ro); break;
        case 'customer': av = a.customer || ''; bv = b.customer || ''; break;
        case 'vehicle': av = a.vehicle || ''; bv = b.vehicle || ''; break;
        case 'status': av = a.status || ''; bv = b.status || ''; break;
        case 'lane': av = a.lane || ''; bv = b.lane || ''; break;
        case 'insurer': av = a.insurer || ''; bv = b.insurer || ''; break;
        case 'promised': av = a.promisedAt || '9999'; bv = b.promisedAt || '9999'; break;
        case 'opened': av = a.openedAt; bv = b.openedAt; break;
        case 'amount': return (Number(a.amount_cents || 0) - Number(b.amount_cents || 0)) * dir;
        case 'hours': return (a.laborHours - b.laborHours) * dir;
        case 'parts': return (a.partsWaiting - b.partsWaiting) * dir;
        case 'target': return ((a.targetDays || 0) - (b.targetDays || 0)) * dir;
        default: return (a.daysInShop - b.daysInShop) * dir;
      }
      return String(av).localeCompare(String(bv)) * dir;
    });
    return out;
  }

  /* -------------------------------------------------------------- table view */

  function gridTemplate() {
    var cols = activeCols();
    return '2px ' + cols.map(function (c) {
      return c.flex ? 'minmax(170px,1fr)' : c.w + 'px';
    }).join(' ') + (cols.some(function (c) { return c.flex; }) ? '' : ' 1fr');
  }

  function buildHead() {
    var head = $('gridHead');
    head.style.gridTemplateColumns = gridTemplate();
    head.style.setProperty('--printcols', gridTemplate() + ' 1.7in');
    head.innerHTML = '<div></div>' + activeCols().map(function (c) {
      var arrow = SORT.key === c.k
        ? '<span class="harrow">' + (SORT.dir === 'asc' ? '\u2191' : '\u2193') + '</span>' : '';
      return '<div' + (c.num ? ' style="text-align:right"' : '') + '>' +
        '<span class="hlabel" data-sort="' + c.k + '">' + esc(c.t) + arrow + '</span>' +
        '<span class="hgrip" data-grip="' + c.k + '"></span></div>';
    }).join('') + '<div class="writein"></div>';

    Array.prototype.forEach.call(head.querySelectorAll('[data-sort]'), function (el) {
      el.addEventListener('click', function () {
        var k = el.dataset.sort;
        if (SORT.key === k) SORT.dir = SORT.dir === 'asc' ? 'desc' : 'asc';
        else { SORT.key = k; SORT.dir = (k === 'days' || k === 'amount' || k === 'hours') ? 'desc' : 'asc'; }
        saveCols();
        render();
      });
    });

    Array.prototype.forEach.call(head.querySelectorAll('[data-grip]'), function (grip) {
      grip.addEventListener('mousedown', function (e) { startResize(e, grip.dataset.grip, e.clientX); });
      grip.addEventListener('touchstart', function (e) {
        startResize(e, grip.dataset.grip, e.touches[0].clientX);
      }, { passive: false });
    });
  }

  function startResize(e, key, startX) {
    e.preventDefault();
    e.stopPropagation();
    var col = COLUMNS.filter(function (c) { return c.k === key; })[0];
    var startW = col.w;

    function move(ev) {
      var x = ev.touches ? ev.touches[0].clientX : ev.clientX;
      col.w = Math.max(52, Math.round(startW + (x - startX)));
      var t = gridTemplate();
      $('gridHead').style.gridTemplateColumns = t;
      Array.prototype.forEach.call(document.querySelectorAll('.gridrow'), function (r) {
        r.style.gridTemplateColumns = t;
      });
    }
    function up() {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', up);
      saveCols();
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', up);
  }

  /** MM-DD-YY, the way the shop writes dates on a file. */
  function shopDate(v) {
    if (!v) return '';
    var d = new Date(v);
    var p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + String(d.getFullYear()).slice(2);
  }

  function initials(name) {
    if (!name) return '';
    return String(name).split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
  }

  /** The sequence pip: which status group the file is in, 01-nn. */
  /** The row's colour: its status kind, or red once it is stalled or held. */
  function tone(f) {
    if (f.onHold) return 'var(--stopped)';
    return KIND[f.kind] || 'var(--acc)';
  }

  function groupNumber(f) {
    var i = GROUPS.map(function (g) { return g.group_id; }).indexOf(f.group);
    return i < 0 ? '—' : String(i + 1).padStart(2, '0');
  }

  function flagsFor(f) {
    var out = '';
    if (f.onHold) out += '<span class="flag" style="color:var(--stopped);border:1px solid var(--stopped)" ' +
      'title="' + esc(f.holdReason || 'On hold') + '">Hold</span>';
    if (f.partsWaiting) out += '<span class="flag" style="color:var(--blocked);border:1px solid var(--blocked)" ' +
      'title="' + f.partsWaiting + ' gating part' + (f.partsWaiting === 1 ? '' : 's') + ' outstanding">Parts</span>';
    if (f.supplementsOpen) out += '<span class="flag" style="color:var(--move);border:1px solid var(--move)" ' +
      'title="Supplement open">Supp</span>';
    if (f.roType === 'wholesale') out += '<span class="flag" style="color:var(--dim);border:1px solid var(--line)">WS</span>';
    if (needsTech(f)) out += '<span class="flag" style="color:var(--acc);border:1px solid var(--acc)" ' +
      'title="Nobody is on this file, or it has body or paint work with the other trade missing">Needs tech</span>';

    // A file that has not moved in days says so, in its own right.
    var days = Math.floor(Number(f.hoursInStatus || 0) / 24);
    if (days > 4 && !f.partsWaiting) {
      var tone = days > 9 ? 'var(--stopped)' : 'var(--blocked)';
      out += '<span class="flag" style="color:' + tone + ';border:1px solid ' + tone +
        '" title="No status change in ' + days + ' days">' + days + 'd in status</span>';
    }
    return out;
  }

  function laneLabel(key) {
    if (!key) return '';
    var l = LANES.filter(function (x) { return x.lane_key === key; })[0];
    return l ? l.label : key;
  }

  function daysCell(f) {
    var over = f.targetDays != null && f.daysInShop > f.targetDays;
    var pct = f.targetDays ? Math.min(100, Math.round((f.daysInShop / f.targetDays) * 100)) : 0;
    return '<div><div style="display:flex;align-items:baseline;gap:4px">' +
      '<span style="font:500 15px/1 var(--font);font-variant-numeric:tabular-nums;color:' +
      (over ? 'var(--stopped)' : 'var(--text)') + '">' + f.daysInShop + '</span>' +
      '<span class="cellsub" style="margin:0">' + (f.targetDays ? 'of ' + f.targetDays : '') + '</span></div>' +
      '<div class="track"><div class="trackfill" style="width:' + pct + '%;background:' +
      (over ? 'var(--stopped)' : 'var(--acc)') + '"></div></div></div>';
  }

  function cellFor(c, f) {
    switch (c.k) {
      case 'ro':
        return '<div><div style="display:flex;align-items:center;gap:6px">' +
          '<span class="pip" style="color:var(--bg);background:' + tone(f) + '">' + groupNumber(f) + '</span>' +
          '<span style="font:500 12px var(--font);font-variant-numeric:tabular-nums">' + esc(f.ro) + '</span></div>' +
          '<div class="cellsub">in ' + shopDate(f.openedAt) + '</div></div>';

      case 'vehicle':
        return '<div style="min-width:0"><div class="cellmain" title="' + esc(f.vehicle || '') + '">' +
          esc(f.vehicle || '—') + '</div><div class="cellsub">' +
          esc([f.vin ? '…' + String(f.vin).slice(-8) : 'NO VIN',
               f.plate ? (f.plateState ? f.plateState + ' ' : '') + f.plate : null,
               f.color].filter(Boolean).join(' · ')) + '</div></div>';

      case 'owner':
        return '<div style="min-width:0"><div class="cellmain" style="color:var(--muted)">' +
          esc(f.customer || '—') + '</div><div class="cellsub">' +
          esc(f.phone || '—') + '</div></div>';

      case 'insurance': {
        var self = !f.insurer;
        return '<div style="min-width:0"><div class="cellmain"' +
          (self ? ' style="color:var(--dim)"' : '') + '>' +
          esc(f.insurer || 'Customer Pay') + '</div><div class="cellsub">' +
          esc(f.claimNumber || '—') + '</div></div>';
      }

      case 'desk': {
        var who = (f.assigned && (f.assigned.sales || f.assigned.est)) || f.statusBy;
        return '<div><span style="display:grid;place-items:center;width:24px;height:20px;border-radius:4px;' +
          'background:var(--chip);font:500 9.5px var(--font);color:var(--muted)">' +
          esc(initials(who) || '—') + '</span></div>';
      }

      case 'assigned': {
        var names = Object.keys(f.assigned || {}).map(function (k) { return f.assigned[k]; }).filter(Boolean);
        return '<div class="cellmain">' + esc(names.join(', ') || '—') + '</div>';
      }

      case 'lane': return '<div class="cellmain">' + esc(laneLabel(f.lane) || '—') + '</div>';

      case 'vin': return '<div class="cellsub" style="margin:0">' + esc(f.vin || '—') + '</div>';

      case 'parts': return '<div class="cellnum"' + (f.partsWaiting ? ' style="color:var(--blocked)"' : '') +
        '>' + (f.partsWaiting || '—') + '</div>';

      case 'hours': return '<div class="cellnum"' + (f.laborHours ? '' : ' style="color:var(--dim)"') +
        '>' + (f.laborHours ? f.laborHours.toFixed(1) : '·') + '</div>';

      case 'amount': return '<div class="cellnum">' +
        (f.amount_cents === undefined ? '<span style="color:var(--dim)">••••</span>' : money(f.amount_cents)) +
        '</div>';

      case 'days': return daysCell(f);

      case 'promised': return '<div class="cellmain">' + (f.promisedAt ? shopDate(f.promisedAt) : '—') + '</div>';

      case 'status':
        return '<div style="min-width:0"><div style="display:flex;align-items:center;gap:6px;min-width:0">' +
          '<span style="font:400 11.5px var(--font);color:' + tone(f) +
          ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
          esc(f.status || 'No status') + '</span>' + flagsFor(f) + '</div>' +
          '<div class="cellsub">as of ' + shopDate(f.statusSince || f.openedAt) +
          (f.statusBy ? ' · ' + esc(f.statusBy) : '') + '</div></div>';

      default: return '';
    }
  }

  function renderTable(rows) {
    var cols = activeCols();
    var t = gridTemplate();
    buildHead();

    $('gridBody').innerHTML = rows.map(function (f) {
      var edge = tone(f);
      return '<div class="gridrow" data-id="' + f.id + '" style="grid-template-columns:' + t +
        ';--printcols:' + t + ' 1.7in">' +
        '<div><div class="edge" style="background:' + edge + '"></div></div>' +
        cols.map(function (c) { return cellFor(c, f); }).join('') +
        '<div class="writein"></div></div>';
    }).join('') +
    '<div class="tailrow"><div>' + rows.length + ' of ' + FILES.length + ' files</div></div>';

    // The KPI band is off on a phone; the numbers that matter ride here, stuck
    // to the top of the list.
    var sum = SUMMARY ? '<div class="cardsum"><span><b>' + rows.length + '</b> shown</span>' +
      '<span><b>' + SUMMARY.onHold + '</b> on hold</span>' +
      '<span><b>' + SUMMARY.pastTarget + '</b> past target</span>' +
      '<span><b>' + SUMMARY.avgDays + 'd</b> average</span></div>' : '';

    $('cards').innerHTML = sum + rows.map(function (f) {
      return '<button class="card" data-id="' + f.id + '">' +
        '<div class="cardtop"><div class="cardro">' + esc(f.ro) + '</div>' +
        '<div class="carddays" style="color:' + AGE[f.age] + '">' + f.daysInShop + 'd' +
        (f.targetDays ? ' of ' + f.targetDays : '') + '</div></div>' +
        '<div class="cardveh">' + esc(f.vehicle || '—') +
        (f.color ? ' · ' + esc(f.color) : '') + '</div>' +
        '<div class="sub">' + esc([f.customer, f.insurer].filter(Boolean).join(' · ') || '') + '</div>' +
        '<div class="cardline"><span style="font:500 12px var(--font);color:' + tone(f) + '">' +
        esc(f.status || 'No status') + '</span>' +
        flagsFor(f) + '</div></button>';
    }).join('');

    bindRows();
  }

  /* -------------------------------------------------------------- cycle view */

  /**
   * The progression strip: one segment per status group, in board order.
   * Filled means the file has reached or passed that group; the current one is
   * the accent; anything past it is track. That is the whole point of the
   * cycle view — where a car is in the run, at a glance.
   */
  function progressionFor(f) {
    var order = GROUPS.map(function (g) { return g.group_id; });
    var at = order.indexOf(f.group);
    return order.map(function (gid, i) {
      var tone = i < at ? 'var(--done)' : i === at ? 'var(--acc)' : 'var(--whisper)';
      var g = GROUPS.filter(function (x) { return x.group_id === gid; })[0];
      return { tone: tone, title: (g ? g.label : gid) + (i === at ? ' — here now' : '') };
    });
  }

  function renderCycle(rows) {
    $('progHead').textContent = 'Progression 01–' + String(GROUPS.length).padStart(2, '0');

    $('legend').innerHTML = [
      { t: 'Done', c: 'var(--done)' },
      { t: 'Here now', c: 'var(--acc)' },
      { t: 'To come', c: 'var(--whisper)' },
      { t: 'Past target', c: 'var(--stopped)' }
    ].map(function (l) {
      return '<div class="legitem"><div class="legswatch" style="background:' + l.c + '"></div>' +
        esc(l.t) + '</div>';
    }).join('') + '<div class="legitem" style="margin-left:auto">' + rows.length + ' files</div>';

    // Group by lane, unlaned last, in lane order. With a technician picked the
    // lanes they own come first; their cars that have moved on sit in their own
    // group at the end rather than vanishing.
    var tech = pickedTech();
    var buckets = {};
    rows.forEach(function (f) {
      var key = f.lane || '__none';
      if (tech && f.lane && tech.lanes.indexOf(f.lane) < 0) key = '__elsewhere';
      (buckets[key] = buckets[key] || []).push(f);
    });

    var order = LANES.map(function (l) { return l.lane_key; }).filter(function (k) { return buckets[k]; });
    if (tech) {
      order.sort(function (a, c) {
        return (tech.lanes.indexOf(a) < 0 ? 1 : 0) - (tech.lanes.indexOf(c) < 0 ? 1 : 0);
      });
    }
    if (buckets.__none) order.push('__none');
    if (buckets.__elsewhere) order.push('__elsewhere');

    if (!order.length) {
      $('cycleBody').innerHTML = '<div class="empty">Nothing to show.</div>';
      return;
    }

    var n = 0;
    $('cycleBody').innerHTML = order.map(function (key) {
      var list = buckets[key];
      var label = key === '__none' ? 'Not in a production lane'
        : key === '__elsewhere' ? 'Elsewhere in the shop'
        : laneLabel(key);
      var late = list.filter(function (f) { return variance(f) > 0; }).length;
      n++;

      return '<div><div class="lanehead">' +
        '<div class="lanen">' + String(n).padStart(2, '0') + '</div>' +
        '<div class="lanename">' + esc(label) + '</div>' +
        '<div class="sub">' + list.length + '</div>' +
        '<div class="sub" style="margin-left:auto">' +
        (late ? late + ' past target' : 'all inside target') + '</div></div>' +
        list.map(cycleRow).join('') + '</div>';
    }).join('');

    bindRows();
  }

  function variance(f) {
    if (f.targetDays == null) return null;
    return f.daysInShop - f.targetDays;
  }

  function cycleRow(f) {
    var segs = progressionFor(f);
    var v = variance(f);
    var pct = f.targetDays ? Math.min(100, Math.round((f.daysInShop / f.targetDays) * 100)) : 0;
    var over = v != null && v > 0;

    return '<div class="cyclerow" data-id="' + f.id + '">' +
      '<div style="min-width:0">' +
      '<div class="cell" title="' + esc(f.vehicle || '') + '">' + esc(f.vehicle || '—') +
      (f.color ? ' <span style="color:var(--dim)">· ' + esc(f.color) + '</span>' : '') + '</div>' +
      '<div class="sub">' + esc(f.ro) + (f.customer ? ' · ' + esc(f.customer) : '') + '</div></div>' +

      '<div style="min-width:0"><div class="row" style="gap:6px">' +
      '<span class="pill"><span class="dot" style="background:' + (KIND[f.kind] || 'var(--dim)') +
      '"></span>' + esc(f.status || 'No status') + '</span>' + flagsFor(f) + '</div>' +
      '<div class="sub">' + esc([f.insurer, laneLabel(f.lane)].filter(Boolean).join(' · ') || '') + '</div></div>' +

      '<div class="progress">' + segs.map(function (s) {
        return '<div class="pseg" style="background:' + s.tone + '" title="' + esc(s.title) + '"></div>';
      }).join('') + '</div>' +

      '<div><div class="row" style="gap:4px;align-items:baseline">' +
      '<span style="font:500 13px var(--font);font-variant-numeric:tabular-nums;color:' + AGE[f.age] + '">' +
      f.daysInShop + '</span>' +
      '<span class="sub">' + (f.targetDays ? '/ ' + f.targetDays : '') + '</span></div>' +
      '<div class="track"><div class="trackfill" style="width:' + pct + '%;background:' +
      (over ? 'var(--stopped)' : 'var(--acc)') + '"></div></div></div>' +

      '<div class="num" style="font:500 12px var(--font);color:' +
      (v == null ? 'var(--dim)' : over ? 'var(--stopped)' : 'var(--done)') + '">' +
      (v == null ? '—' : (v > 0 ? '+' : '') + v + 'd') + '</div>' +
      '<div class="writein"></div></div>';
  }

  function bindRows() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-id]'), function (el) {
      if (el.dataset.bound) return;
      el.dataset.bound = '1';
      el.addEventListener('click', function () { openRo(Number(el.dataset.id)); });
    });
  }

  /* ------------------------------------------------------------------ render */

  function render() {
    var rows = filtered();

    if (!rows.length) {
      $('gridBody').innerHTML = '';
      $('cards').innerHTML = '';
      $('cycleBody').innerHTML = '';
      $('empty').hidden = false;
      syncPrintHead(0);
      $('empty').innerHTML = FILES.length ? 'Nothing matches those filters.'
        : 'No repair orders yet.<br>Use <strong>New RO</strong> or <strong>Check-in</strong>.';
      return;
    }
    $('empty').hidden = true;

    syncPrintHead(rows.length);
    if (VIEW === 'table') renderTable(rows);
    else renderCycle(rows);
  }

  /**
   * What the sheet says it is. Written on every render so printing from the
   * browser's own menu says the same thing as the button.
   */
  function describeFilter(n) {
    var bits = [];
    var st = $('fStatus');
    if (st.value) bits.push(st.options[st.selectedIndex].textContent);
    var g = $('fGroup');
    if (g.value) bits.push(g.options[g.selectedIndex].textContent);

    var t = $('fTech');
    if (t.value === 'none') bits.push('needing a tech');
    else if (t.value) bits.push('assigned to ' + t.options[t.selectedIndex].textContent);

    if ($('fDone').checked) bits.push('complete');
    if ($('fClosed').checked) bits.push('closed files');
    var q = $('fSearch').value.trim();
    if (q) bits.push('matching “' + q + '”');

    return n + ' file' + (n === 1 ? '' : 's') +
      (bits.length ? ' · ' + bits.join(' · ') : ' · everything on the board') +
      ' · ' + (VIEW === 'cycle' ? 'cycle view' : 'table view');
  }

  function syncPrintHead(n) {
    $('phShop').textContent = (ME.company ? ME.company.name : 'Easy Shop') + ' — repair orders';
    $('phWhat').textContent = describeFilter(n) + ' · printed ' +
      new Date().toLocaleDateString('en-US',
        { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) + ' ' +
      new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function syncView() {
    $('vTable').className = VIEW === 'table' ? 'sel' : '';
    $('vCycle').className = VIEW === 'cycle' ? 'sel' : '';
    $('tableView').hidden = VIEW !== 'table';
    $('cycleView').hidden = VIEW !== 'cycle';
    $('colBtn').hidden = VIEW !== 'table';
  }

  /* ------------------------------------------------------------ column panel */

  function renderColPanel() {
    var p = $('colPanel');
    p.innerHTML = '<div class="colhead">Columns</div>' +
      COLUMNS.filter(function (c) { return !c.money || ME.caps.money; }).map(function (c) {
        return '<label class="colrow' + (c.lock ? ' locked' : '') + '">' +
          '<input type="checkbox" data-col="' + c.k + '"' + (c.on ? ' checked' : '') +
          (c.lock ? ' disabled' : '') + '>' +
          '<span>' + esc(c.t) + '</span>' +
          (c.lock ? '<span class="sub" style="margin-left:auto">always</span>' : '') + '</label>';
      }).join('') +
      '<div class="colrow" style="border-top:1px solid var(--whisper);margin-top:4px">' +
      '<button class="btn btn-ghost" id="colReset" style="width:100%;padding:5px">Reset to defaults</button></div>';

    Array.prototype.forEach.call(p.querySelectorAll('[data-col]'), function (cb) {
      cb.addEventListener('change', function () {

  /* ---------------------------------------------------------------- drawer */

  function openRo(id) {
    OPEN = id;
    $('scrim').classList.add('open');
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
    $('dLeft').innerHTML = '<div class="empty">Loading…</div>';
    $('dRight').innerHTML = '';

    api('/api/ro/' + id).then(renderDrawer).catch(function (e) {
      $('dLeft').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }

  /**
   * What is unsaved in the modal right now. Returned as plain sentences so the
   * guard can tell the user what they are about to lose rather than just
   * warning them abstractly.
   */
  function pending() {
    var out = [];
    if (!OPEN) return out;

    var st = $('newStatus'), note = $('newNote');
    if (st && st.value) out.push('a status change to “' + st.options[st.selectedIndex].textContent + '”');
    if (note && note.value.trim()) out.push('a note you have typed');

    var dates = Array.prototype.slice.call(document.querySelectorAll('[data-date]'))
      .filter(function (el) { return el.value !== el.dataset.was; });
    if (dates.length) out.push(dates.length + ' date change' + (dates.length === 1 ? '' : 's'));

    var edits = Array.prototype.slice.call(document.querySelectorAll('[data-edit]'))
      .filter(function (el) { return el.value !== el.dataset.was; });
    if (edits.length) out.push(edits.length + ' edit' + (edits.length === 1 ? '' : 's') +
      ' to the customer, vehicle or insurance');

    ['m_amount', 'm_deduct', 'm_hours'].forEach(function (id) {
      var el = $(id);
      if (el && el.value !== el.dataset.was) out.push('an edit to ' +
        (id === 'm_amount' ? 'the amount' : id === 'm_deduct' ? 'the deductible' : 'labour hours'));
    });

    var assigns = Array.prototype.slice.call(document.querySelectorAll('[data-assign]'))
      .filter(function (el) { return el.value !== el.dataset.was; });
    if (assigns.length) out.push(assigns.length + ' assignment change' +
      (assigns.length === 1 ? '' : 's'));

    var promise = $('promiseText');
    if (promise && promise.value.trim()) out.push('a promise you have typed');
    var part = $('pDesc');
    if (part && part.value.trim()) out.push('a part you have typed');

    return out;
  }

  /** Run every pending save in order, so one failure stops the rest. */
  function saveAll() {
    var jobs = [];

    var st = $('newStatus'), note = $('newNote');
    if (st && (st.value || (note && note.value.trim()))) {
      jobs.push(function () {
        return api('/api/ro/' + OPEN + '/status', {
          method: 'POST',
          body: JSON.stringify({
            slot: st.value || undefined,
            note: note && note.value.trim() ? note.value.trim() : undefined
          })
        });
      });
    }

    var dateBody = {}, dateN = 0;
    Array.prototype.forEach.call(document.querySelectorAll('[data-date]'), function (el) {
      if (el.value === el.dataset.was) return;
      dateBody[el.dataset.date] = el.value || null;
      dateN++;
    });
    if (dateN) jobs.push(function () {
      return api('/api/ro/' + OPEN + '/dates', { method: 'PATCH', body: JSON.stringify(dateBody) });
    });

    var detailBody = {}, detailN = 0;
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (el) {
      if (el.value === el.dataset.was) return;
      detailBody[el.dataset.edit] = el.value.trim() === '' ? null : el.value.trim();
      detailN++;
    });
    if (detailN) jobs.push(function () {
      return api('/api/ro/' + OPEN + '/details', {
        method: 'PATCH', body: JSON.stringify(detailBody)
      });
    });

    var moneyBody = {}, moneyN = 0;
    var a = $('m_amount'), dd = $('m_deduct'), hr = $('m_hours');
    if (a && a.value !== a.dataset.was) { moneyBody.amountCents = Math.round(Number(a.value || 0) * 100); moneyN++; }
    if (dd && dd.value !== dd.dataset.was) { moneyBody.deductibleCents = Math.round(Number(dd.value || 0) * 100); moneyN++; }
    if (hr && hr.value !== hr.dataset.was) { moneyBody.laborHours = Number(hr.value || 0); moneyN++; }
    if (moneyN) jobs.push(function () {
      return api('/api/ro/' + OPEN + '/money', { method: 'PATCH', body: JSON.stringify(moneyBody) });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-assign]'), function (sel) {
      if (sel.value === sel.dataset.was) return;
      var name = sel.value ? sel.options[sel.selectedIndex].textContent : null;
      jobs.push(function () {
        return api('/api/ro/' + OPEN + '/assign/' + sel.dataset.assign, {
          method: 'PUT',
          body: JSON.stringify({ userId: sel.value ? Number(sel.value) : null, displayName: name })
        });
      });
    });

    var promise = $('promiseText');
    if (promise && promise.value.trim()) {
      jobs.push(function () {
        return api('/api/ro/' + OPEN + '/promises', {
          method: 'POST', body: JSON.stringify({ body: promise.value.trim() })
        });
      });
    }

    var part = $('pDesc');
    if (part && part.value.trim()) {
      jobs.push(function () {
        var body = { description: part.value.trim(), qty: Number($('pQty').value) || 1 };
        if ($('pPrice') && $('pPrice').value) body.priceCents = Math.round(Number($('pPrice').value) * 100);
        if ($('pCost') && $('pCost').value) body.costCents = Math.round(Number($('pCost').value) * 100);
        return api('/api/ro/' + OPEN + '/parts', { method: 'POST', body: JSON.stringify(body) });
      });
    }

    return jobs.reduce(function (chain, job) {
      return chain.then(job);
    }, Promise.resolve());
  }

  /** Closing with edits in flight asks first. */
  function tryCloseRo() {
    var list = pending();
    if (!list.length) return closeRo();

    $('guardList').innerHTML = 'Closing now loses:<ul>' +
      list.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
    $('gMsg').className = 'msg';
    $('guard').hidden = false;
  }

  function closeRo() {
    $('guard').hidden = true;
    OPEN = null;
    $('scrim').classList.remove('open');
    $('drawer').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'true');
    /* Opened off a parts line: go back to the parts list with that file still open. */
    var qs = new URLSearchParams(location.search);
    if (qs.get('back') === 'parts' && qs.get('ro')) {
      location.href = '/parts.html?open=' + qs.get('ro');
      return;
    }
    if (qs.get('ro')) history.replaceState(null, '', '/board.html');
  }

  function field(l, v) {
    return '<div><div class="f-l">' + esc(l) + '</div><div class="f-v">' +
      esc(v == null || v === '' ? '—' : v) + '</div></div>';
  }
  function dateValue(v) {
    if (!v) return '';
    var d = new Date(v);
    if (isNaN(d.getTime())) return '';
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  function dateField(key, label, value) {
    return '<div><label class="fl" for="d_' + key + '">' + esc(label) + '</label>' +
      '<input type="date" id="d_' + key + '" data-date="' + key + '" ' +
      'data-was="' + dateValue(value) + '" value="' + dateValue(value) + '" style="width:100%"></div>';
  }

  var POSITIONS = [
    { k: 'sales', t: 'Salesperson' }, { k: 'pdr', t: 'PDR tech' }, { k: 'body', t: 'Body tech' },
    { k: 'paint', t: 'Paint tech' }, { k: 'ri', t: 'R&I tech' }, { k: 'detail', t: 'Detail tech' }
  ];

  var VOID_REASONS = ['Duplicate', 'Opened by mistake', 'Customer never showed'];

  function statusOptions(sel) {
    return GROUPS.map(function (g) {
      var o = STATUSES.filter(function (st) { return st.group_id === g.group_id; })
        .map(function (st) {
          return '<option value="' + esc(st.slot_id) + '"' +
            (sel === st.slot_id ? ' selected' : '') + '>' + esc(st.label) + '</option>';
        }).join('');
      return o ? '<optgroup label="' + esc(g.label) + '">' + o + '</optgroup>' : '';
    }).join('');
  }

  function f2(label, value, num) {
    return '<div><div class="fl2">' + esc(label) + '</div>' +
      '<div class="fv2' + (num ? ' num' : '') + '">' +
      esc(value == null || value === '' ? '—' : value) + '</div></div>';
  }

  /** An editable field in one of the drawer's fact blocks. */
  function ef(key, label, value, opts) {
    opts = opts || {};
    var v = value == null ? '' : String(value);
    return '<div><label class="fl2" for="e_' + key + '">' + esc(label) + '</label>' +
      '<input type="' + (opts.type || 'text') + '" id="e_' + key + '" data-edit="' + key + '" ' +
      (opts.list ? 'list="' + opts.list + '" ' : '') +
      (opts.placeholder ? 'placeholder="' + esc(opts.placeholder) + '" ' : '') +
      'data-was="' + esc(v) + '" value="' + esc(v) + '" style="width:100%"></div>';
  }

  function esel(key, label, value, options) {
    return '<div><label class="fl2" for="e_' + key + '">' + esc(label) + '</label>' +
      '<select id="e_' + key + '" data-edit="' + key + '" data-was="' + esc(value || '') +
      '" style="width:100%">' +
      options.map(function (o) {
        return '<option value="' + esc(o[0]) + '"' + (o[0] === value ? ' selected' : '') +
          '>' + esc(o[1]) + '</option>';
      }).join('') + '</select></div>';
  }

  /**
   * Blocks used to carry their own Save. They do not any more: everything in
   * the modal is written when it closes, through the same guard that already
   * listed what was unsaved. The line each block used to explain itself with
   * stays — it is the part people actually read.
   */
  function saveRow(id, hint) {
    return '<div class="savehint">' + esc(hint) + '</div>';
  }

  function renderDrawer(d) {
    var r = d.ro;

    /* ---- header ---- */
    $('dPip').textContent = groupNumber({ group: r.group_id });
    $('dPip').style.background = KIND[r.status_kind] || 'var(--acc)';
    $('dRo').textContent = r.ro_number;

    $('dSub').textContent = daysIn(r) + ' days in shop' +

      (Number(r.voided_days) ? ' · ' + r.voided_days + ' voided' : '');

        '<div class="log-b" style="margin-top:4px;color:var(--muted)">Was RO ' +

        (v0.voided_by_name ? 'Voided by ' + esc(v0.voided_by_name) + '. ' : '') +
        (Number(v0.parts_flagged) ? v0.parts_flagged + ' ordered part line' +
          (Number(v0.parts_flagged) === 1 ? '' : 's') + ' flagged for return. ' : '') +

        f2('Name', r.customer_name) + f2('Phone', r.customer_phone, 1) +
        f2('Email', r.customer_email) + '</div>');

        ef('model', 'Model', r.model) +
        ef('color', 'Colour', r.color) +
        ef('vin', 'VIN', r.vin) +

        f2('Colour', r.color) + f2('VIN', r.vin, 1) +
        f2('Plate', r.plate ? (r.plate_state ? r.plate_state + ' ' : '') + r.plate : null, 1) +

          return '<option value="' + esc(i.name) + '"></option>';
        }).join('') + '</datalist>');
      L.push('<div class="fieldset">' +
        ef('insurer', 'Carrier', r.insurer_name, { list: 'insurerList' }) +
        ef('claimNumber', 'Claim number', r.claim_number) +
        ef('policyNumber', 'Policy number', r.policy_number) +
        ef('dateOfLoss', 'Date of loss', dateValue(r.date_of_loss), { type: 'date' }) +
        ef('adjuster', 'Adjuster', r.adjuster) +
        esel('roType', 'Type', r.ro_type, [
          ['repair', 'Repair'], ['wholesale', 'Wholesale'], ['warranty', 'Warranty']]) +

    } else {
      L.push('<div class="fieldset">' +
        f2('Carrier', r.insurer_name) + f2('Claim number', r.claim_number, 1) +

        '<div><div class="fl2">Labour hours</div>' +
        '<input type="number" step="0.1" min="0" id="m_hours" style="width:100%" value="' +

    /* Assigned */

    if (!d.promises.length) L.push('<div class="sub">Nothing promised yet.</div>');
    d.promises.forEach(function (p) {
      L.push('<div class="promise' + (p.done ? ' done' : '') + '">' +
        '<input type="checkbox" data-promise="' + p.id + '"' + (p.done ? ' checked' : '') + '>' +
        '<div class="ptext">' + esc(p.body) + '</div></div>');

    L.push('<div class="row" style="margin-top:10px">' +

      'style="flex:1;min-width:150px">' +

    /* Documents and photos */
    if (ME.features.indexOf('docs') >= 0) {

      var others = d.documents.filter(function (x) { return !x.is_image; });
      PHOTOSET = photos;

      L.push('<div class="sec">Photos and documents</div>');
      if (photos.length) {
        L.push('<div class="photogrid">' + photos.map(function (p, i) {
          return '<button class="photocell" data-photo="' + i + '" title="' + esc(p.label) + '">' +
            '<img loading="lazy" src="/api/documents/' + p.id +
