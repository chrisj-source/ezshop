<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2740">
<title>Schedule — Easy Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=6">
<style>
  .navrow { display:flex; align-items:center; gap:10px; padding:11px 18px; flex:none; }
  .arrow {
    width:26px; height:26px; display:grid; place-items:center;
    font:400 14px var(--font); color:var(--muted);
    border:1px solid var(--line); border-radius:4px; background:transparent;
  }
  .arrow:hover { border-color:var(--acc); color:var(--text); }
  .weeklabel { font:500 13px var(--font); white-space:nowrap; }
  .vdiv { width:1px; height:16px; background:var(--line); }
  .typefilter {
    font:400 11px var(--font); padding:5px 10px; border-radius:4px; background:transparent;
    border:1px solid var(--line); color:var(--muted); display:flex; align-items:center; gap:6px;
  }
  .typefilter.sel { color:var(--text); background:var(--chip); border-color:var(--acc); }
  .tdot { width:7px; height:7px; border-radius:50%; flex:none; }

  .summaryrow {
    display:flex; align-items:baseline; gap:14px; padding:0 18px 10px; flex:none;
    font:400 11px var(--font); color:var(--dim);
  }

  /* Six columns — the shop is shut one day, so the week reads as six. */
  .week {
    flex:1; min-height:0; display:grid; grid-template-columns:repeat(6,1fr);
    gap:8px; padding:0 14px 14px;
  }
  .daycol {
    display:flex; flex-direction:column; min-height:0;
    border:1px solid var(--line); border-radius:6px; overflow:hidden;
  }
  .daycol.today { background:var(--chip); }
  .dayhead { padding:9px 10px 8px; border-bottom:1px solid var(--whisper); flex:none; }
  .dayname {
    white-space:nowrap; font:600 9.5px var(--font); letter-spacing:.12em; text-transform:uppercase;
  }
  .daydate {
    white-space:nowrap; font:400 10.5px var(--font); font-variant-numeric:tabular-nums; color:var(--dim);
  }
  .todaytag {
    margin-left:auto; font:600 8px var(--font); letter-spacing:.12em;
    text-transform:uppercase; color:var(--acc);
  }
  .daycounts { display:flex; align-items:center; gap:9px; margin-top:6px; height:14px; }
  .daycount { display:flex; align-items:center; gap:4px; }
  .daycount span.n { font:400 10px var(--font); font-variant-numeric:tabular-nums; }
  .daybody {
    flex:1; min-height:0; overflow-y:auto; padding:8px;
    display:flex; flex-direction:column; gap:6px;
  }
  .appt {
    border:1px solid var(--line); border-radius:5px; padding:8px 9px;
    background:var(--surf); text-align:left; color:var(--text); width:100%;
  }
  .appt:hover { border-color:var(--acc); }
  .appt.past { opacity:.62; }
  .apptime { font:500 11px var(--font); font-variant-numeric:tabular-nums; }
  .apptype { font:500 8px var(--font); letter-spacing:.1em; text-transform:uppercase; }
  .apwho {
    font:400 11.5px var(--font); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; margin-top:4px;
  }
  .apveh {
    font:400 10.5px var(--font); color:var(--muted); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; margin-top:2px;
  }
  .aprow { display:flex; align-items:center; gap:6px; margin-top:5px; }
  .apro {
    white-space:nowrap; font:400 9.5px var(--font); font-variant-numeric:tabular-nums;
    border-radius:3px; padding:1px 5px;
  }
  .aprem { margin-left:auto; white-space:nowrap; font:400 9.5px var(--font); color:var(--dim); }
  .apx {
    background:none; border:none; color:var(--dim); font-size:13px; line-height:1;
    padding:0 2px; margin-left:auto;
  }
  .apx:hover { color:var(--text); }
  .daynone { font:400 10.5px var(--font); color:var(--dim); padding:4px 2px; }

  /* Time off is a layer over the day, not an appointment: no card, no border,
     a hatched strip that says the person is not available. */
  .offstrip {
    display:flex; align-items:center; gap:6px; padding:5px 7px; border-radius:4px;
    background:repeating-linear-gradient(135deg, var(--chip) 0 6px, transparent 6px 12px);
    border:1px dashed var(--line); font:400 10.5px var(--font); color:var(--muted);
  }
  .offstrip b { font:500 10.5px var(--font); color:var(--text); }
  .offrow {
    display:flex; align-items:center; gap:10px; padding:9px 0;
    border-bottom:1px solid var(--whisper);
  }
  .clashbox {
    border:1px solid var(--acc); border-radius:5px; padding:9px 11px; margin-top:10px;
    font:400 11.5px/1.6 var(--font); color:var(--muted);
  }
  .clashbox ul { margin:6px 0 0; padding-left:17px; }

  /* Booking form: month picker beside the fields, as the mockup lays it out. */
  .bookgrid { display:grid; grid-template-columns:246px 1fr; gap:16px; }
  .calhead { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .calnav {
    width:22px; height:22px; display:grid; place-items:center; background:transparent;
    border:1px solid var(--line); border-radius:4px; color:var(--muted); font-size:12px;
  }
  .calgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .calwd {
    font:600 8px var(--font); letter-spacing:.1em; text-transform:uppercase;
    color:var(--dim); text-align:center; padding-bottom:3px;
  }
  .calcell {
    aspect-ratio:1; display:grid; place-items:center; border-radius:4px; background:transparent;
    border:1px solid transparent; font:400 11px var(--font); font-variant-numeric:tabular-nums;
    color:var(--muted);
  }
  .calcell:hover:not(:disabled) { border-color:var(--acc); color:var(--text); }
  .calcell.sel { background:var(--acc); color:var(--bg); border-color:var(--acc); }
  .calcell.full { color:var(--stopped); }
  .calcell:disabled { color:var(--line); }
  .capline { font:400 11px/1.5 var(--font); border-radius:5px; padding:8px 10px; margin-top:12px; }
  @media (max-width:1000px) {
    .week { grid-template-columns:1fr; }
    .daycol { min-height:0; }
    .bookgrid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><div class="mark">ES</div><div class="word">Easy Shop</div></div>
  <div class="vr"></div>
  <div class="co" id="coName">—</div>
  <div id="nav"></div>
  <div class="spacer"></div>
  <div id="bell"></div>
  <div class="who" id="who">—</div>
  <button class="ghostbtn" id="signout">Sign out</button>
</div>
<div class="hairline"></div>

<div class="navrow">
  <div style="display:flex;align-items:center;gap:2px">
    <button class="arrow" id="prev">‹</button>
    <button class="arrow" id="next">›</button>
  </div>
  <div class="weeklabel" id="weekLabel">—</div>
  <button class="btn btn-ghost" id="thisWeek">This week</button>
  <div class="vdiv"></div>
  <div style="display:flex;gap:6px" id="typeFilters"></div>
  <div class="spacer"></div>
  <button class="btn btn-ghost" id="offBtn" hidden>Time off</button>
  <button class="btn btn-ghost" id="limitsBtn" hidden>Day limits</button>
  <button class="btn" id="bookBtn">Book</button>
</div>

<div class="summaryrow">
  <div id="weekSummary">Loading…</div>
  <div id="closedNote"></div>
</div>

<div class="week" id="week"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead">
    <div style="min-width:0;flex:1">
      <div style="font:500 16px var(--font)" id="dTitle">—</div>
      <div class="sub" id="dSub">—</div>
    </div>
    <button class="close" id="dClose" aria-label="Close">&times;</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

<script src="/shell.js?v=6"></script>
<script>
(function () {
  var api = Shell.api, esc = Shell.esc;
  var ME = null, META = null, DATA = null, FROM = null, TYPE = null, STAFF = [];
  var CAL_MONTH = null, PICKED = null, BOOK_KIND = null, OPENINGS = null;

  var TONE = {
    drop: 'var(--move)', pickup: 'var(--done)', return: 'var(--blocked)',
    estimate: 'var(--acc)', appraiser: 'var(--stopped)'
  };
  var DAYNAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];

  function $(id) { return document.getElementById(id); }
  function iso(d) {
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  function mondayOf(d) {
    var x = new Date(d);
    x.setHours(12, 0, 0, 0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function timeOf(v) {
    return new Date(v).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }
  function kindLabel(k) {
    return (META.kinds.filter(function (x) { return x.key === k; })[0] || {}).label || k;
  }
  function capOf(k) {
    return (META.kinds.filter(function (x) { return x.key === k; })[0] || {}).cap || 0;
  }

  api('/api/me').then(function (me) {
    ME = me;
    if (!me.company) { location.href = '/'; return null; }
    if (me.features.indexOf('sched') < 0) {
      document.body.innerHTML = '<div class="empty">The scheduler is not switched on for this shop.</div>';
      return null;
    }
    Shell.mount({ me: me, active: 'schedule' });
    if (me.caps.admin) { $('limitsBtn').hidden = false; $('offBtn').hidden = false; }
    return Promise.all([
      api('/api/schedule-meta'),
      api('/api/config').then(function (c) { STAFF = c.staff || []; }).catch(function () {})
    ]).then(function (r) { return r[0]; });
  }).then(function (m) {
    if (!m) return;
    META = m;
    renderFilters();
    FROM = iso(mondayOf(new Date()));
    return load();
  }).catch(function (e) { if (e.message !== 'signed out') console.error(e); });

  function renderFilters() {
    $('typeFilters').innerHTML = META.kinds.map(function (k) {
      return '<button class="typefilter' + (TYPE === k.key ? ' sel' : '') + '" data-type="' + k.key +
        '" title="' + (k.cap ? k.cap + ' a day' : 'no daily limit') + '">' +
        '<span class="tdot" style="background:' + TONE[k.key] + '"></span>' + esc(k.label) + '</button>';
    }).join('');

    Array.prototype.forEach.call($('typeFilters').children, function (b) {
      b.addEventListener('click', function () {
        TYPE = TYPE === b.dataset.type ? null : b.dataset.type;
        renderFilters();
        render();
      });
    });
  }

  function load() {
    return api('/api/schedule?from=' + FROM + '&days=7').then(function (d) {
      DATA = d;
      render();
    });
  }

  function render() {
    var start = new Date(FROM + 'T12:00');
    var end = new Date(start); end.setDate(end.getDate() + 6);

    $('weekLabel').textContent =
      start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' +
      end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    var shown = DATA.appointments.filter(function (a) { return !TYPE || a.kind === TYPE; });
    var counts = {};
    shown.forEach(function (a) { counts[a.kind] = (counts[a.kind] || 0) + 1; });

    $('weekSummary').textContent = shown.length + ' booked this week' +
      (TYPE ? ' · ' + kindLabel(TYPE).toLowerCase() + 's only' : ' · ' +
        META.kinds.filter(function (k) { return counts[k.key]; })
          .map(function (k) { return counts[k.key] + ' ' + k.label.toLowerCase(); }).join(', '));

    $('closedNote').textContent = META.closedDays.length
      ? 'Closed ' + META.closedDays.join(' and ') + (ME.caps.admin ? ' · you can overbook a full day' : '')
      : (ME.caps.admin ? 'You can overbook a full day' : '');

    var todayIso = iso(new Date());
    var now = Date.now();
    var html = '';

    for (var i = 0; i < 7; i++) {
      var d = new Date(start);
      d.setDate(d.getDate() + i);
      var key = iso(d);
      var weekday = DAYNAMES[d.getDay()];
      if (META.closedDays.indexOf(weekday) >= 0) continue;

      var mine = shown.filter(function (a) { return iso(new Date(a.starts_at)) === key; });
      var off = (DATA.timeOff || []).filter(function (o) {
        return iso(new Date(o.starts_on)) <= key && iso(new Date(o.ends_on)) >= key;
      });
      var used = DATA.used[key] || {};
      var isToday = key === todayIso;
      var past = new Date(key + 'T23:59') < new Date(todayIso + 'T00:00');

      var countHtml = META.kinds.filter(function (k) { return used[k.key]; }).map(function (k) {
        var full = k.cap > 0 && used[k.key] >= k.cap;
        return '<div class="daycount" title="' + used[k.key] + ' of ' +
          (k.cap || '∞') + ' ' + esc(k.label.toLowerCase()) + '">' +
          '<span class="tdot" style="background:' + TONE[k.key] + '"></span>' +
          '<span class="n" style="color:' + (full ? 'var(--stopped)' : 'var(--muted)') + '">' +
          used[k.key] + (k.cap ? '/' + k.cap : '') + '</span></div>';
      }).join('');

      html += '<div class="daycol' + (isToday ? ' today' : '') + '">' +
        '<div class="dayhead"><div style="display:flex;align-items:baseline;gap:7px">' +
        '<div class="dayname" style="color:' + (past ? 'var(--dim)' : 'var(--text)') + '">' +
        weekday.slice(0, 3).toUpperCase() + '</div>' +
        '<div class="daydate">' + (d.getMonth() + 1) + '-' + d.getDate() + '</div>' +
        (isToday ? '<div class="todaytag">Today</div>' : '') + '</div>' +
        '<div class="daycounts">' + (countHtml ||
          '<div style="font:400 10px var(--font);color:var(--dim)">nothing booked</div>') +
        '</div></div>' +

        '<div class="daybody">' +
        off.map(function (o) {
          return '<div class="offstrip" title="' + esc(o.reason || 'Off') + '">' +
            '<b>' + esc(o.display_name) + '</b> off' +
            (o.start_time ? ' ' + String(o.start_time).slice(0, 5) + '–' +
              String(o.end_time || '').slice(0, 5) : ' all day') +
            (o.reason ? ' · ' + esc(o.reason) : '') + '</div>';
        }).join('') +
        mine.map(function (a) {
          var isPast = new Date(a.starts_at).getTime() < now;
          return '<div class="appt' + (isPast ? ' past' : '') + '" data-appt="' + a.id + '" ' +
            'style="border-left:2px solid ' + TONE[a.kind] + '">' +
            '<div style="display:flex;align-items:baseline;gap:7px">' +
            '<div class="apptime">' + timeOf(a.starts_at) + '</div>' +
            '<div class="apptype" style="color:' + TONE[a.kind] + '">' + esc(kindLabel(a.kind)) + '</div>' +
            (a.lead_number
              ? '<div class="apro" style="color:var(--acc);border:1px solid var(--acc)" ' +
                'title="Raised a lead">Lead</div>' : '') +
            '<button class="apx" data-cancel="' + a.id + '" title="Cancel">×</button></div>' +
            '<div class="apwho">' + esc(a.customer_name) + '</div>' +
            '<div class="apveh">' + esc(a.vehicle_text || a.ro_vehicle || '—') + '</div>' +
            '<div class="aprow"><div class="apro" style="color:' +
            (a.ro_number ? 'var(--muted)' : 'var(--dim)') + ';border:1px ' +
            (a.ro_number ? 'solid' : 'dashed') + ' var(--line)">' +
            (a.ro_number ? 'RO ' + esc(a.ro_number) : 'No RO yet') + '</div>' +
            '<div class="aprem">' + (a.remind_1d || a.remind_12h ? 'texts on' : 'no texts') + '</div>' +
            '</div></div>';
        }).join('') +
        (mine.length ? '' : '<div class="daynone">' +
          (TYPE ? 'nothing of this type' : 'no appointments') + '</div>') +
        '<button class="btn btn-ghost" data-add="' + key + '" ' +
        'style="margin-top:auto;font-size:10.5px;padding:5px">Book</button>' +
        '</div></div>';
    }

    $('week').innerHTML = html;

    Array.prototype.forEach.call($('week').querySelectorAll('[data-appt]'), function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.dataset.cancel) return;
        openAppt(Number(el.dataset.appt));
      });
    });
    Array.prototype.forEach.call($('week').querySelectorAll('[data-cancel]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm('Cancel this appointment?')) return;
        b.disabled = true;
        api('/api/schedule/' + b.dataset.cancel, { method: 'DELETE' })
          .then(load)
          .catch(function (err) {
            b.disabled = false;
            $('weekSummary').textContent = 'Could not cancel: ' + err.message;
            $('weekSummary').style.color = 'var(--stopped)';
          });
      });
    });
    Array.prototype.forEach.call($('week').querySelectorAll('[data-add]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        openBooking(b.dataset.add);
      });
    });
  }

  /* -------------------------------------------------------------- booking */

  function openBooking(day) {
    PICKED = day || iso(new Date());
    BOOK_KIND = null;
    CAL_MONTH = new Date(PICKED + 'T12:00');
    CAL_MONTH.setDate(1);

    show('Book an appointment', 'Pick the type, then a day with room');
    $('dBody').innerHTML = '<div class="empty">Loading capacity…</div>';

    api('/api/schedule/openings?kind=drop&days=45').then(function (o) {
      OPENINGS = o;
      renderBooking();
    }).catch(function () { OPENINGS = { days: [] }; renderBooking(); });
  }

  function renderBooking() {
    var h = [];

    h.push('<div class="sec">What kind</div><div class="row">' +
      META.kinds.map(function (k) {
        return '<button class="typefilter' + (BOOK_KIND === k.key ? ' sel' : '') +
          '" data-kind="' + k.key + '"><span class="tdot" style="background:' + TONE[k.key] +
          '"></span>' + esc(k.label) + (k.cap ? ' · ' + k.cap + '/day' : '') + '</button>';
      }).join('') + '</div>');

    h.push('<div class="sec">When</div><div class="bookgrid"><div>' + calendar() + '</div><div>');

    h.push('<div class="grid2">' +
      '<div><label class="fl">Name</label><input id="bName" style="width:100%"></div>' +
      '<div><label class="fl">Phone</label><input id="bPhone" type="tel" style="width:100%"></div>' +
      '<div><label class="fl">Vehicle</label><input id="bVehicle" placeholder="2020 Silverado" style="width:100%"></div>' +
      '<div><label class="fl">Time</label><input id="bTime" type="time" value="09:00" style="width:100%"></div>' +
      '<div><label class="fl">Who is it for</label><select id="bWho" style="width:100%">' +
      '<option value="">Nobody in particular</option>' +
      STAFF.map(function (st) {
        return '<option value="' + st.user_id + '">' + esc(st.display_name) + '</option>';
      }).join('') + '</select></div>' +
      '</div>' +
      '<div style="margin-top:12px"><label class="fl">Note</label>' +
      '<textarea id="bNote" placeholder="Hail damage, wants an estimate"></textarea></div>');

    h.push('<div class="capline" id="capLine"></div>');
    h.push('</div></div>');

    h.push('<div class="row" style="margin-top:16px">' +
      '<button class="btn btn-solid" id="bSave" disabled>Pick a type and a day</button></div>' +
      '<div class="msg" id="bMsg"></div>');

    h.push('<div class="sub" style="margin-top:14px">An estimate appointment, or a drop for a car ' +
      'that is not already on the board, raises a lead automatically.</div>');

    $('dBody').innerHTML = h.join('');
    wireBooking();
  }

  function calendar() {
    var first = new Date(CAL_MONTH);
    var monthLabel = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    var lead = (first.getDay() + 6) % 7;
    var daysIn = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    var byDay = {};
    (OPENINGS.days || []).forEach(function (d) { byDay[d.day] = d; });

    var h = '<div class="calhead"><button class="calnav" data-cal="-1">‹</button>' +
      '<div style="font:500 12px var(--font);flex:1;text-align:center">' + esc(monthLabel) + '</div>' +
      '<button class="calnav" data-cal="1">›</button></div>' +
      '<div class="calgrid">' +
      ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(function (w) {
        return '<div class="calwd">' + w + '</div>';
      }).join('') + '</div><div class="calgrid">';

    for (var i = 0; i < lead; i++) h += '<div></div>';

    var todayIso = iso(new Date());
    for (var d = 1; d <= daysIn; d++) {
      var date = new Date(first.getFullYear(), first.getMonth(), d, 12);
      var key = iso(date);
      var info = byDay[key];
      var closed = META.closedDays.indexOf(DAYNAMES[date.getDay()]) >= 0;
      var isPast = key < todayIso;
      var full = info && info.cap > 0 && info.open <= 0;
      var cls = 'calcell' + (key === PICKED ? ' sel' : '') + (full && !closed ? ' full' : '');
      var title = closed ? 'Closed' : info
        ? info.used + ' of ' + (info.cap || '∞') + ' drops booked'
        : '';

      h += '<button class="' + cls + '" data-day="' + key + '"' +
        (closed || isPast ? ' disabled' : '') + ' title="' + esc(title) + '">' + d + '</button>';
    }

    return h + '</div>';
  }

  function wireBooking() {
    Array.prototype.forEach.call($('dBody').querySelectorAll('[data-kind]'), function (b) {
      b.addEventListener('click', function () {
        BOOK_KIND = b.dataset.kind;
        api('/api/schedule/openings?kind=' + BOOK_KIND + '&days=45').then(function (o) {
          OPENINGS = o;
          renderBooking();
        });
      });
    });

    Array.prototype.forEach.call($('dBody').querySelectorAll('[data-cal]'), function (b) {
      b.addEventListener('click', function () {
        CAL_MONTH.setMonth(CAL_MONTH.getMonth() + Number(b.dataset.cal));
        renderBooking();
      });
    });

    Array.prototype.forEach.call($('dBody').querySelectorAll('[data-day]'), function (b) {
      b.addEventListener('click', function () { PICKED = b.dataset.day; renderBooking(); });
    });

    syncCapLine();

    var save = $('bSave');
    save.disabled = !(BOOK_KIND && PICKED);
    if (BOOK_KIND && PICKED) {
      save.textContent = 'Book the ' + kindLabel(BOOK_KIND).toLowerCase() + ' on ' + PICKED;
    }
    save.addEventListener('click', function () { submit(false); });
  }

  function syncCapLine() {
    var el = $('capLine');
    if (!el) return;

    if (!BOOK_KIND) {
      el.textContent = 'Pick a type to see what room is left.';
      el.style.cssText = 'font:400 11px/1.5 var(--font);border-radius:5px;padding:8px 10px;' +
        'color:var(--dim);border:1px dashed var(--line);margin-top:12px';
      return;
    }

    var info = (OPENINGS.days || []).filter(function (d) { return d.day === PICKED; })[0];
    var cap = capOf(BOOK_KIND);
    var text, tone = 'var(--dim)', border = '1px dashed var(--line)';

    if (!cap) {
      text = 'No daily limit set for ' + kindLabel(BOOK_KIND).toLowerCase() + 's.';
    } else if (!info) {
      text = 'Capacity for that day is not loaded.';
    } else if (info.closed) {
      text = 'The shop is closed that day.';
      tone = 'var(--stopped)'; border = '1px solid var(--stopped)';
    } else if (info.open <= 0) {
      text = info.used + ' of ' + cap + ' already booked — that day is full.' +
        (ME.caps.admin ? ' You can overbook it.' : '');
      tone = 'var(--acc)'; border = '1px solid var(--acc)';
    } else {
      text = info.used + ' of ' + cap + ' booked · ' + info.open + ' left that day.';
    }

    el.textContent = text;
    el.style.cssText = 'font:400 11px/1.5 var(--font);border-radius:5px;padding:8px 10px;' +
      'color:' + tone + ';border:' + border + ';margin-top:12px';
  }

  function submit(override) {
    var msg = $('bMsg');
    var name = $('bName').value.trim();
    if (!name) { msg.textContent = 'A name is required.'; msg.className = 'msg err'; return; }

    api('/api/schedule', {
      method: 'POST',
      body: JSON.stringify({
        kind: BOOK_KIND,
        startsAt: PICKED + 'T' + ($('bTime').value || '09:00'),
        customerName: name,
        phone: $('bPhone').value.trim() || undefined,
        vehicleText: $('bVehicle').value.trim() || undefined,
        note: $('bNote').value.trim() || undefined,
        assignedUserId: $('bWho') && $('bWho').value ? Number($('bWho').value) : undefined,
        override: override
      })
    }).then(function (r) {
      closeDrawer();
      return load().then(function () {
        var s = $('weekSummary');
        var was = s.textContent;
        s.textContent = r.leadId ? 'Booked, and a lead was raised.' : 'Booked.';
        s.style.color = 'var(--done)';
        setTimeout(function () { s.textContent = was; s.style.color = ''; }, 3500);
      });
    }).catch(function (e) {
      msg.className = 'msg err';
      var d = e.data || {};

      // Two different warnings, both overridable rather than refusals: the day
      // is full, or the person is off or already booked at that hour.
      if (d.conflict) {
        msg.innerHTML = '<div class="clashbox"><div style="color:var(--acc)">' +
          esc(e.message) + '</div><ul>' +
          (d.clashes || []).map(function (c) { return '<li>' + esc(c.text) + '</li>'; }).join('') +
          '</ul><div class="row" style="margin-top:10px">' +
          '<button class="btn btn-solid" id="ovr">Book it anyway</button>' +
          '<span class="sub" style="flex:1;min-width:120px">The override is recorded on the ' +
          'appointment.</span></div></div>';
        $('ovr').addEventListener('click', function () { submit(true); });
      } else if (/full/i.test(e.message) && ME.caps.admin) {
        msg.innerHTML = esc(e.message) +
          ' <button class="btn btn-ghost" id="ovr" style="padding:4px 9px;font-size:10.5px;margin-left:6px">' +
          'Overbook anyway</button>';
        $('ovr').addEventListener('click', function () { submit(true); });
      } else {
        msg.textContent = e.message;
      }
    });
  }

  /* ------------------------------------------------------- one appointment */

  function openAppt(id) {
    var a = DATA.appointments.filter(function (x) { return x.id === id; })[0];
    if (!a) return;

    show(a.customer_name, kindLabel(a.kind) + ' · ' +
      new Date(a.starts_at).toLocaleDateString('en-US',
        { weekday: 'long', month: 'long', day: 'numeric' }) + ' at ' + timeOf(a.starts_at));

    var h = ['<div class="sec">Details</div><div class="grid2">'];
    var who = STAFF.filter(function (st) {
      return String(st.user_id) === String(a.assigned_user_id);
    })[0];

    [['Phone', a.phone], ['Vehicle', a.vehicle_text || a.ro_vehicle],
     ['For', who ? who.display_name : null], ['Booked over', a.override_note],
     ['Repair order', a.ro_number], ['Lead', a.lead_number],
     ['Status', a.status_label], ['Reminders', a.remind_1d || a.remind_12h ? 'on' : 'off'],
     ['Note', a.note]].forEach(function (p) {
      h.push('<div><div class="f-l">' + esc(p[0]) + '</div><div class="f-v">' +
        esc(p[1] || '—') + '</div></div>');
    });
    h.push('</div>');

    if (a.ro_id) h.push('<div class="row" style="margin-top:16px">' +
      '<a class="btn btn-ghost" href="/board.html?ro=' + a.ro_id + '">Open the file</a></div>');
    if (a.lead_id) h.push('<div class="row" style="margin-top:9px">' +
      '<a class="btn btn-ghost" href="/leads.html">Go to leads</a></div>');

    h.push('<div class="sec">Move it</div><div class="row">' +
      '<input type="date" id="mDate" value="' + iso(new Date(a.starts_at)) + '">' +
      '<input type="time" id="mTime" value="' + new Date(a.starts_at).toTimeString().slice(0, 5) + '">' +
      '<button class="btn btn-ghost" id="mSave">Save</button></div>');

    h.push('<div class="row" style="margin-top:18px">' +
      '<button class="btn btn-danger" id="cancelAppt">Cancel this appointment</button></div>' +
      '<div class="msg" id="aMsg"></div>');

    $('dBody').innerHTML = h.join('');

    $('mSave').addEventListener('click', function () {
      api('/api/schedule/' + id, {
        method: 'PATCH',
        body: JSON.stringify({ startsAt: $('mDate').value + 'T' + ($('mTime').value || '09:00') })
      }).then(function () { closeDrawer(); return load(); })
        .catch(function (e) { $('aMsg').textContent = e.message; $('aMsg').className = 'msg err'; });
    });

    $('cancelAppt').addEventListener('click', function () {
      if (!confirm('Cancel this appointment?')) return;
      var btn = $('cancelAppt');
      btn.disabled = true;
      api('/api/schedule/' + id, { method: 'DELETE' })
        .then(function () { closeDrawer(); return load(); })
        .catch(function (e) {
          btn.disabled = false;
          $('aMsg').textContent = e.message;
          $('aMsg').className = 'msg err';
        });
    });
  }

  /* -------------------------------------------------------- employee time off */

  /**
   * Blocking time out is deliberately not a booking: it is a layer over the
   * week saying someone is not available. Owner only, and a clash with work
   * already booked warns rather than refuses.
   */
  function openTimeOff() {
    show('Time off', 'Block out days or hours an employee is not available');
    $('dBody').innerHTML = '<div class="empty">Loading…</div>';

    api('/api/time-off?days=120').then(function (d) {
      var h = ['<div class="sec">Block time out</div>'];

      h.push('<div class="grid2">' +
        '<div><label class="fl">Who</label><select id="oWho" style="width:100%">' +
        STAFF.map(function (st) {
          return '<option value="' + st.user_id + '">' + esc(st.display_name) + '</option>';
        }).join('') + '</select></div>' +
        '<div><label class="fl">Reason</label>' +
        '<input id="oReason" placeholder="Vacation, appointment, training" style="width:100%"></div>' +
        '<div><label class="fl">First day</label>' +
        '<input type="date" id="oFrom" value="' + iso(new Date()) + '" style="width:100%"></div>' +
        '<div><label class="fl">Last day</label>' +
        '<input type="date" id="oTo" value="' + iso(new Date()) + '" style="width:100%"></div>' +
        '</div>');

      h.push('<label class="row" style="gap:7px;align-items:center;margin-top:12px">' +
        '<input type="checkbox" id="oPart">' +
        '<span class="sub" style="text-transform:none;letter-spacing:0">Only part of the day</span>' +
        '</label>');

      h.push('<div class="row" id="oHours" style="margin-top:9px" hidden>' +
        '<input type="time" id="oStart" value="08:00">' +
        '<span class="sub">to</span>' +
        '<input type="time" id="oEnd" value="12:00"></div>');

      h.push('<div class="row" style="margin-top:16px">' +
        '<button class="btn btn-solid" id="oSave">Block this time</button>' +
        '<span class="sub" style="flex:1;min-width:150px">A range of days, or hours within a day. ' +
        'Work already booked in the window is listed before anything is saved.</span></div>' +
        '<div class="msg" id="oMsg"></div>');

      h.push('<div class="sec">Blocked ahead</div>');
      if (!d.timeOff.length) h.push('<div class="sub">Nothing blocked in the next four months.</div>');
      d.timeOff.forEach(function (o) {
        var span = iso(new Date(o.starts_on)) === iso(new Date(o.ends_on))
          ? shortDay(o.starts_on)
          : shortDay(o.starts_on) + ' – ' + shortDay(o.ends_on);
        h.push('<div class="offrow"><div style="flex:1;min-width:0">' +
          '<div style="font:400 12px var(--font)">' + esc(o.display_name) + ' · ' + esc(span) +
          (o.start_time ? ' · ' + String(o.start_time).slice(0, 5) + '–' +
            String(o.end_time || '').slice(0, 5) : ' · all day') + '</div>' +
          '<div class="sub">' + esc(o.reason || 'No reason given') +
          (o.created_name ? ' · set by ' + esc(o.created_name) : '') + '</div></div>' +
          '<button class="btn btn-ghost" data-off="' + o.id + '" ' +
          'style="padding:4px 9px;font-size:10.5px">Remove</button></div>');
      });

      $('dBody').innerHTML = h.join('');

      $('oPart').addEventListener('change', function () {
        $('oHours').hidden = !this.checked;
      });
      $('oFrom').addEventListener('change', function () {
        if ($('oTo').value < this.value) $('oTo').value = this.value;
      });

      $('oSave').addEventListener('click', function () { saveOff(false); });

      Array.prototype.forEach.call($('dBody').querySelectorAll('[data-off]'), function (b) {
        b.addEventListener('click', function () {
          api('/api/time-off/' + b.dataset.off, { method: 'DELETE' })
            .then(function () { openTimeOff(); return load(); })
            .catch(function (e) {
              $('oMsg').textContent = e.message;
              $('oMsg').className = 'msg err';
            });
        });
      });
    }).catch(function (e) {
      $('dBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }

  function saveOff(override) {
    var part = $('oPart').checked;
    var msg = $('oMsg');

    api('/api/time-off', {
      method: 'POST',
      body: JSON.stringify({
        userId: Number($('oWho').value),
        startsOn: $('oFrom').value,
        endsOn: $('oTo').value,
        startTime: part ? $('oStart').value : null,
        endTime: part ? $('oEnd').value : null,
        reason: $('oReason').value.trim() || undefined,
        override: override
      })
    }).then(function () {
      closeDrawer();
      return load();
    }).catch(function (e) {
      var d = e.data || {};
      msg.className = 'msg err';
      if (d.conflict) {
        msg.innerHTML = '<div class="clashbox"><div style="color:var(--acc)">' + esc(e.message) +
          '</div><ul>' +
          (d.clashes || []).map(function (c) { return '<li>' + esc(c.text) + '</li>'; }).join('') +
          '</ul><div class="row" style="margin-top:10px">' +
          '<button class="btn btn-solid" id="oOvr">Block it anyway</button>' +
          '<span class="sub" style="flex:1;min-width:120px">Those appointments stay booked. ' +
          'The override is recorded.</span></div></div>';
        $('oOvr').addEventListener('click', function () { saveOff(true); });
      } else {
        msg.textContent = e.message;
      }
    });
  }

  function shortDay(v) {
    return new Date(v).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  /* ----------------------------------------------------------- day limits */

  function openLimits() {
    show('Day limits', 'How many of each the shop can take in a day');

    api('/api/config').then(function (cfg) {
      var h = ['<div class="sec">How many per day</div>'];

      META.kinds.forEach(function (k) {
        h.push('<div style="display:grid;grid-template-columns:1fr 74px 1fr;gap:12px;' +
          'align-items:center;height:38px;border-bottom:1px solid var(--whisper)">' +
          '<div style="display:flex;align-items:center;gap:7px">' +
          '<span class="tdot" style="background:' + TONE[k.key] + '"></span>' +
          '<span style="font:400 12px var(--font)">' + esc(k.label) + '</span></div>' +
          '<input type="number" min="0" id="cap_' + k.key + '" value="' +
          esc(cfg.settings['cap_' + k.key] || '0') + '" style="width:100%">' +
          '<div class="sub">' + (Number(cfg.settings['cap_' + k.key]) ? 'per day' : 'no limit') +
          '</div></div>');
      });

      h.push('<div class="sec">Closed days</div><div class="row">' +
        DAYNAMES.map(function (d) {
          var on = META.closedDays.indexOf(d) >= 0;
          return '<button class="typefilter' + (on ? ' sel' : '') + '" data-closed="' + d + '" ' +
            'data-on="' + (on ? 1 : 0) + '">' + d.slice(0, 3).toUpperCase() + '</button>';
        }).join('') + '</div>');

      h.push('<div class="row" style="margin-top:18px">' +
        '<button class="btn btn-solid" id="saveLimits">Save limits</button></div>' +
        '<div class="msg" id="lMsg"></div>');

      h.push('<div class="sub" style="margin-top:12px">The limit is enforced for everyone except the ' +
        'owner, who is offered an overbook instead of a refusal.</div>');

      $('dBody').innerHTML = h.join('');

      Array.prototype.forEach.call($('dBody').querySelectorAll('[data-closed]'), function (b) {
        b.addEventListener('click', function () {
          var on = b.dataset.on !== '1';
          b.dataset.on = on ? '1' : '0';
          b.classList.toggle('sel', on);
        });
      });

      $('saveLimits').addEventListener('click', function () {
        var body = {};
        META.kinds.forEach(function (k) { body['cap_' + k.key] = $('cap_' + k.key).value || '0'; });
        body.closed_days = Array.prototype.slice.call($('dBody').querySelectorAll('[data-closed]'))
          .filter(function (b) { return b.dataset.on === '1'; })
          .map(function (b) { return b.dataset.closed; }).join(',');

        api('/api/config/settings', { method: 'PATCH', body: JSON.stringify(body) })
          .then(function () { return api('/api/schedule-meta'); })
          .then(function (m) {
            META = m;
            closeDrawer();
            renderFilters();
            return load();
          })
          .catch(function (e) { $('lMsg').textContent = e.message; $('lMsg').className = 'msg err'; });
      });
    });
  }

  /* ------------------------------------------------------------- plumbing */

  function show(title, sub) {
    $('dTitle').textContent = title;
    $('dSub').textContent = sub;
    $('scrim').classList.add('open');
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
  }
  function closeDrawer() {
    $('scrim').classList.remove('open');
    $('drawer').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'true');
  }

  function shift(days) {
    var d = new Date(FROM + 'T12:00');
    d.setDate(d.getDate() + days);
    FROM = iso(d);
    load();
  }

  $('prev').addEventListener('click', function () { shift(-7); });
  $('next').addEventListener('click', function () { shift(7); });
  $('thisWeek').addEventListener('click', function () { FROM = iso(mondayOf(new Date())); load(); });
  $('bookBtn').addEventListener('click', function () { openBooking(iso(new Date())); });
  $('limitsBtn').addEventListener('click', openLimits);
  $('offBtn').addEventListener('click', openTimeOff);
  $('scrim').addEventListener('click', closeDrawer);
  $('dClose').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });
})();
</script>
</body>
</html>
