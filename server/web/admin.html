<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2740">
<title>Admin — Easy Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=7">
<style>
  /* Tabs underline, as in the mockup — not pills. */
  .adminbar {
    display:flex; align-items:center; gap:18px; padding:12px 18px 0; flex:none;
  }
  .atab {
    font:500 11.5px var(--font); padding:0 0 9px; background:none; border:none;
    color:var(--dim); border-bottom:2px solid transparent;
  }
  .atab:hover { color:var(--muted); }
  .atab.sel { color:var(--text); border-bottom-color:var(--acc); }
  .abarline { height:1px; background:var(--line); flex:none; }

  /* Three panes: rail, list, detail. */
  .three { flex:1; min-height:0; display:grid; grid-template-columns:196px 1fr 316px; }
  .rail { border-right:1px solid var(--whisper); padding:14px 0; overflow-y:auto; }
  .railtitle {
    font:600 8.5px var(--font); letter-spacing:.12em; text-transform:uppercase;
    color:var(--acc2); padding:0 16px 9px;
  }
  .railitem {
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:7px 16px; background:none; border:none; color:var(--muted);
    font:400 11.5px var(--font); border-left:2px solid transparent;
  }
  .railitem:hover { background:var(--whisper); color:var(--text); }
  .railitem.sel { background:var(--whisper); color:var(--text); border-left-color:var(--acc); }
  .railitem .c {
    margin-left:auto; font:400 10px var(--font); font-variant-numeric:tabular-nums; color:var(--dim);
  }

  .mid { overflow-y:auto; padding-bottom:26px; }
  .detail {
    border-left:1px solid var(--whisper); background:var(--surf);
    overflow-y:auto; padding:15px 16px;
  }

  /* Status rows. */
  .srow, .shead {
    display:grid; grid-template-columns:3px 1fr 166px 84px 122px 78px 68px 60px;
    gap:13px; align-items:center; padding:0 16px;
  }
  .shead { padding-top:6px; padding-bottom:6px; border-top:1px solid var(--line);
    border-bottom:1px solid var(--line); }
  .shead > div {
    font:600 8.5px var(--font); letter-spacing:.11em; text-transform:uppercase; color:var(--acc2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .srow { height:44px; border-bottom:1px solid var(--whisper); cursor:pointer; }
  .srow:hover { background:var(--whisper); }
  .srow.sel { background:var(--whisper); }
  .sedge { width:3px; height:22px; border-radius:1px; }
  .slabel {
    font:500 12px var(--font); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ssub, .sslot {
    font:400 10px var(--font); color:var(--dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .sslot { font-variant-numeric:tabular-nums; }
  .schip {
    display:inline-block; font:600 8.5px var(--font); letter-spacing:.07em; text-transform:uppercase;
    padding:2px 6px; border-radius:3px; white-space:nowrap;
  }
  .scell { font:400 11px var(--font); color:var(--muted); white-space:nowrap; }
  .scell.num { font-variant-numeric:tabular-nums; }
  .visbtn {
    font:400 10px var(--font); padding:3px 7px; border-radius:3px; background:transparent;
    border:1px solid var(--line); color:var(--dim); white-space:nowrap;
  }
  .visbtn:hover { border-color:var(--acc); color:var(--acc); }
  .visbtn.on { color:var(--done); border-color:var(--done); }

  /* A role and a trade are both sets: several chips, tap to hold or drop one. */
  .chipset { display:flex; flex-wrap:wrap; gap:4px; }
  .setchip {
    font:400 10px var(--font); padding:3px 6px; border-radius:3px; background:transparent;
    border:1px solid var(--line); color:var(--dim); white-space:nowrap; cursor:pointer;
  }
  .setchip:hover { border-color:var(--acc); color:var(--muted); }
  .setchip.on { color:var(--bg); background:var(--acc); border-color:var(--acc); }
  .setchip.primary::after { content:' \2022'; }

  .sechead {
    display:flex; align-items:baseline; gap:10px; padding:13px 16px 9px;
    position:sticky; top:0; background:var(--bg); z-index:1;
  }
  .secn { font:600 9px var(--font); letter-spacing:.1em; color:var(--acc); }
  .secname { font:500 12.5px var(--font); }

  /* Detail pane. */
  .dlbl {
    font:600 8.5px var(--font); letter-spacing:.12em; text-transform:uppercase;
    color:var(--acc2); margin-bottom:6px;
  }
  .dinput, .dsel {
    width:100%; box-sizing:border-box; background:transparent; border:1px solid var(--line);
    border-radius:4px; color:var(--text); font:400 11.5px var(--font); padding:7px 9px;
  }
  .dsel { appearance:none; cursor:pointer; }
  .drow {
    display:grid; grid-template-columns:118px 1fr; gap:10px; align-items:baseline;
    padding:6px 0; border-bottom:1px solid var(--whisper);
  }
  .dk { font:400 10px var(--font); letter-spacing:.04em; color:var(--dim); }
  .dv { font:400 11px/1.4 var(--font); }

  /* Lanes, tracks, people, groups all share the flat card look. */
  .card2 { border:1px solid var(--line); border-radius:6px; margin:0 16px 12px; overflow:hidden; }
  .card2row { display:grid; gap:14px; align-items:center; padding:11px 13px; }
  .card2row + .card2row { border-top:1px solid var(--whisper); }
  .pchip {
    font:400 10.5px var(--font); padding:4px 9px; border-radius:3px; white-space:nowrap;
    background:transparent; border:1px solid var(--line); color:var(--muted);
  }
  .pchip.on { background:var(--chip); color:var(--text); border-color:var(--acc); }
  .evrow {
    display:grid; grid-template-columns:3px 1fr 168px 148px 50px; gap:12px;
    align-items:center; min-height:44px; border-bottom:1px solid var(--whisper); padding:0 2px;
  }
  .prow2 {
    display:grid; grid-template-columns:26px minmax(150px,1fr) 190px 168px 82px 148px;
    gap:12px; align-items:center; min-height:46px; padding:6px 16px;
    border-bottom:1px solid var(--whisper);
  }
  .prow2 .row { flex-wrap:nowrap; }
  @media (max-width:1000px) {
    .prow2 { grid-template-columns:26px minmax(140px,1fr) 130px 148px; }
    .prow2 > .hide-sm { display:none; }
  }
  .avatar2 {
    width:22px; height:22px; flex:none; border-radius:50%; display:grid; place-items:center;
    font:500 8.5px var(--font); color:var(--acc); border:1px solid var(--line);
  }
  .pad { padding:14px 16px; }

  @media (max-width:1200px) {
    .three { grid-template-columns:170px 1fr; }
    .detail { display:none; }
    .srow, .shead { grid-template-columns:3px 1fr 120px 84px 110px 68px; }
    .srow > .hide-lg, .shead > .hide-lg { display:none; }
  }
  @media (max-width:820px) {
    .three { grid-template-columns:1fr; }
    .rail { display:none; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><div class="mark">ES</div><div class="word">Easy Shop</div></div>
  <div class="vr"></div>
  <div class="co" id="coName">—</div>
  <div id="nav"></div>
  <div class="spacer"></div>
  <div id="bell"></div>
  <div class="who" id="who">—</div>
  <button class="ghostbtn" id="signout">Sign out</button>
</div>
<div class="hairline"></div>

<div class="adminbar" id="tabs"></div>
<div class="abarline"></div>

<div class="three">
  <div class="rail">
    <div class="railtitle" id="railTitle">Groups</div>
    <div id="rail"></div>
  </div>
  <div class="mid" id="mid"><div class="empty">Loading…</div></div>
  <div class="detail">
    <div class="dlbl" id="detTitle" style="border-bottom:1px solid var(--whisper);padding-bottom:9px">
      Reference
    </div>
    <div id="detBody"></div>
  </div>
</div>

<script src="/shell.js?v=8"></script>
<script>
(function () {
  var api = Shell.api, esc = Shell.esc;
  var ME = null, CFG = null, PEOPLE = null, GROUPS = null, ROLES = [], CTYPES = null;
  /* Labour rates, or null when this person may not see pay. */
  var RATES = null;
  var TAB = 'statuses', RAIL = null, SEL = null;

  // Google sends the owner back here after they authorise; land on the tab and
  // the card they left from.
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get('tab')) TAB = q.get('tab');
    if (q.get('calendar')) RAIL = 'cal';
  })();

  var TABS = [
    { k: 'statuses', t: 'Statuses' },
    { k: 'lanes', t: 'Lanes and gates' },
    { k: 'notify', t: 'Notification groups' },
    { k: 'people', t: 'People' },
    { k: 'vendors', t: 'Vendors' },
    { k: 'settings', t: 'Shop settings' },
    { k: 'storage', t: 'Storage' },
    /* Their own pages — too big to live in a pane here, but they belong to Admin,
       so the tab strip is where you reach them. */
    { k: 'payroll', t: 'Payroll', href: '/payroll.html' },
    { k: 'audit', t: 'Audit log', href: '/audit.html' },
    { k: 'roles', t: 'Roles &amp; permissions', href: '/permissions.html' },
    { k: 'pay', t: 'Sales pay', href: '/pay.html' }
  ];

  var KIND_TONE = {
    milestone: 'var(--move)', queue: 'var(--blocked)',
    active: 'var(--acc)', complete: 'var(--done)'
  };

  function $(id) { return document.getElementById(id); }
  function hours(h) { return h == null ? '—' : (h % 24 === 0 ? (h / 24) + 'd' : h + 'h'); }
  function toHours(v) {
    if (!v) return null;
    var m = /^(\d+)\s*([hd])?$/i.exec(String(v).trim());
    if (!m) return null;
    return (m[2] || 'h').toLowerCase() === 'd' ? Number(m[1]) * 24 : Number(m[1]);
  }

  api('/api/me').then(function (me) {
    ME = me;
    if (!me.company) { location.href = '/'; return null; }
    if (!me.caps.admin) {
      document.body.innerHTML = '<div class="empty">Admin is for the owner.<br>' +
        '<a href="/board.html">Back to the board</a></div>';
      return null;
    }
    Shell.mount({ me: me, active: 'admin' });
    return Promise.all([
      api('/api/config'),
      api('/api/config/people'),
      api('/api/admin/notification-groups'),
      api('/api/admin/roles'),
      /* Pay, so it is allowed to fail — an admin who is not the owner or
         accounting simply gets the page without rates. */
      api('/api/staff/rates').catch(function () { return null; })
    ]);
  }).then(function (r) {
    if (!r) return;
    CFG = r[0]; PEOPLE = r[1]; GROUPS = r[2]; ROLES = r[3].roles; RATES = r[4];
    renderTabs();
    render();
  }).catch(function (e) { if (e.message !== 'signed out') console.error(e); });

  function renderTabs() {
    $('tabs').innerHTML = TABS.map(function (t) {
      if (t.href) {
        return '<a class="atab" href="' + t.href + '">' + t.t + ' ↗</a>';
      }
      return '<button class="atab' + (t.k === TAB ? ' sel' : '') + '" data-tab="' + t.k + '">' +
        esc(t.t) + '</button>';
    }).join('');
    Array.prototype.forEach.call($('tabs').querySelectorAll('button.atab'), function (b) {
      b.addEventListener('click', function () {
        TAB = b.dataset.tab;
        RAIL = null;
        SEL = null;
        renderTabs();
        render();
      });
    });
  }

  function render() {
    ({
      statuses: renderStatuses, lanes: renderLanes, notify: renderNotify,
      people: renderPeople, vendors: renderVendors,
      settings: renderSettings, storage: renderStorage
    }[TAB])();
  }

  function rail(title, items) {
    $('railTitle').textContent = title;
    $('rail').innerHTML = items.map(function (i) {
      return '<button class="railitem' + (i.k === RAIL ? ' sel' : '') + '" data-rail="' + esc(i.k) + '">' +
        '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc(i.t) + '</span>' + (i.c != null ? '<span class="c">' + i.c + '</span>' : '') + '</button>';
    }).join('');
    Array.prototype.forEach.call($('rail').children, function (b) {
      b.addEventListener('click', function () {
        RAIL = RAIL === b.dataset.rail ? null : b.dataset.rail;
        render();
      });
    });
  }

  function detail(title, html) {
    $('detTitle').textContent = title;
    $('detBody').innerHTML = html;
  }

  /* ===================================================== statuses */

  function renderStatuses() {
    rail('Groups', CFG.groups.map(function (g) {
      return {
        k: g.group_id, t: g.label,
        c: CFG.statuses.filter(function (s) { return s.group_id === g.group_id; }).length
      };
    }));

    var groups = CFG.groups.filter(function (g) { return !RAIL || g.group_id === RAIL; });
    var h = [];

    groups.forEach(function (g, gi) {
      var rows = CFG.statuses.filter(function (s) { return s.group_id === g.group_id; });
      if (!rows.length) return;

      var n = CFG.groups.indexOf(g) + 1;
      h.push('<div style="margin-bottom:4px">');
      h.push('<div class="sechead"><div class="secn">' + String(n).padStart(2, '0') + '</div>' +
        '<div class="secname">' + esc(g.label) + '</div>' +
        '<div class="sub">' + rows.length + ' statuses' +
        (g.note ? ' · ' + esc(g.note) : '') + '</div></div>');

      h.push('<div class="shead"><div></div><div>Status</div>' +
        '<div class="hide-lg">Slot ID</div><div>Kind</div><div>Owner</div>' +
        '<div>Age Y / R</div><div class="hide-lg">Follow-up</div><div>Shown</div></div>');

      rows.forEach(function (s) {
        var tone = KIND_TONE[s.kind] || 'var(--dim)';
        var hidden = !s.visible;
        h.push('<div class="srow' + (SEL === s.slot_id ? ' sel' : '') + '" data-slot="' +
          esc(s.slot_id) + '"' + (hidden ? ' style="opacity:.45"' : '') + '>' +
          '<div class="sedge" style="background:' + tone + '"></div>' +
          '<div style="min-width:0"><div class="slabel"' +
          (hidden ? ' style="text-decoration:line-through"' : '') + '>' + esc(s.label) + '</div>' +
          '<div class="ssub">' + esc(s.customer_label || 'not shown to the customer') + '</div></div>' +
          '<div class="sslot hide-lg">' + esc(s.slot_id) + '</div>' +
          '<div><span class="schip" style="color:' + tone + ';border:1px solid ' + tone + '">' +
          esc(s.kind) + '</span></div>' +
          '<div class="scell">' + esc(s.owner_role) + '</div>' +
          '<div class="scell num">' + hours(s.age_yellow_hours) + ' / ' + hours(s.age_red_hours) + '</div>' +
          '<div class="scell num hide-lg">' + hours(s.follow_up_hours) + '</div>' +
          '<button class="visbtn' + (hidden ? '' : ' on') + '" data-vis="' + esc(s.slot_id) + '">' +
          (hidden ? 'Hidden' : 'Shown') + '</button></div>');
      });

      h.push('</div>');
    });

    $('mid').innerHTML = h.join('');

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-slot]'), function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.dataset.vis) return;
        SEL = el.dataset.slot;
        renderStatuses();
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-vis]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var s = CFG.statuses.filter(function (x) { return x.slot_id === b.dataset.vis; })[0];
        api('/api/config/statuses/' + encodeURIComponent(b.dataset.vis), {
          method: 'PATCH', body: JSON.stringify({ visible: s.visible ? 0 : 1 })
        }).then(reloadConfig);
      });
    });

    renderStatusDetail();
  }

  function renderStatusDetail() {
    var s = CFG.statuses.filter(function (x) { return x.slot_id === SEL; })[0];

    if (!s) {
      return detail('Reference', '<div style="font:400 11.5px/1.6 var(--font);color:var(--muted);' +
        'padding:12px 0">Pick a status to rename it, change who owns it, or retune its clocks.' +
        '<br><br>The identifier underneath each name never changes, so reports, notifications and ' +
        'automations keep working after a rename.</div>' +
        '<div class="dlbl" style="margin-top:14px">Kinds</div>' +
        [['milestone', 'a point passed, no work sits here'],
         ['queue', 'waiting for someone to pick it up'],
         ['active', 'work is happening now'],
         ['complete', 'that stage is finished']].map(function (k) {
          return '<div class="drow"><div class="dk"><span class="schip" style="color:' +
            KIND_TONE[k[0]] + ';border:1px solid ' + KIND_TONE[k[0]] + '">' + k[0] + '</span></div>' +
            '<div class="dv">' + esc(k[1]) + '</div></div>';
        }).join(''));
    }

    var group = CFG.groups.filter(function (g) { return g.group_id === s.group_id; })[0];

    detail('Status', '<div style="display:flex;flex-direction:column;gap:11px;margin-top:12px">' +
      '<div><div class="dlbl">Name in the shop</div>' +
      '<input class="dinput" id="eLabel" value="' + esc(s.label) + '"></div>' +
      '<div><div class="dlbl">Name shown to the customer</div>' +
      '<input class="dinput" id="eClabel" value="' + esc(s.customer_label || '') + '" ' +
      'placeholder="leave blank to hide it"></div>' +
      '<div><div class="dlbl">Owner role</div>' +
      '<input class="dinput" id="eOwner" value="' + esc(s.owner_role) + '"></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
      '<div><div class="dlbl">Warn at</div>' +
      '<input class="dinput" id="eYellow" value="' + (s.age_yellow_hours == null ? '' : hours(s.age_yellow_hours)) + '" placeholder="12h"></div>' +
      '<div><div class="dlbl">Red at</div>' +
      '<input class="dinput" id="eRed" value="' + (s.age_red_hours == null ? '' : hours(s.age_red_hours)) + '" placeholder="2d"></div>' +
      '</div>' +
      '<div><div class="dlbl">Follow-up every</div>' +
      '<input class="dinput" id="eFu" value="' + (s.follow_up_hours == null ? '' : hours(s.follow_up_hours)) + '" placeholder="24h"></div>' +
      '</div>' +

      '<div class="dlbl" style="margin-top:15px">Fixed</div>' +
      [['Slot ID', s.slot_id], ['Group', group ? group.label : s.group_id],
       ['Kind', s.kind], ['Lane', s.lane_key || 'not in a lane'],
       ['Counts to cycle', Number(s.counts_toward_cycle) ? 'yes' : 'no'],
       ['Terminal', Number(s.is_terminal) ? 'closes the file' : 'no'],
       ['Modules', s.module_tags || '—']].map(function (r) {
        return '<div class="drow"><div class="dk">' + esc(r[0]) + '</div>' +
          '<div class="dv">' + esc(r[1]) + '</div></div>';
      }).join('') +

      '<div class="row" style="margin-top:14px">' +
      '<button class="btn btn-solid" id="saveSlot">Save status</button>' +
      '<button class="btn btn-ghost" id="clearSlot">Cancel</button></div>' +
      '<div class="msg" id="dMsg"></div>' +
      '<div class="sub" style="margin-top:10px">Clocks accept hours or days — write ' +
      '<strong>12h</strong> or <strong>2d</strong>. Blank turns the clock off.</div>');

    $('clearSlot').addEventListener('click', function () { SEL = null; renderStatuses(); });

    $('saveSlot').addEventListener('click', function () {
      var body = {};
      if ($('eLabel').value.trim() !== s.label) body.label = $('eLabel').value.trim();
      if ($('eClabel').value.trim() !== (s.customer_label || '')) {
        body.customerLabel = $('eClabel').value.trim() || null;
      }
      if ($('eOwner').value.trim() !== s.owner_role) body.ownerRole = $('eOwner').value.trim();

      var y = toHours($('eYellow').value), rd = toHours($('eRed').value), fu = toHours($('eFu').value);
      if (y !== s.age_yellow_hours) body.ageYellowHours = y;
      if (rd !== s.age_red_hours) body.ageRedHours = rd;
      if (fu !== s.follow_up_hours) body.followUpHours = fu;

      if (!Object.keys(body).length) return say('Nothing changed.', 'ok');

      api('/api/config/statuses/' + encodeURIComponent(s.slot_id), {
        method: 'PATCH', body: JSON.stringify(body)
      }).then(reloadConfig).catch(function (e) { say(e.message, 'err'); });
    });
  }

  /* ======================================================== lanes */

  function renderLanes() {
    rail('Reference', [
      { k: 'gate-block', t: 'Block' }, { k: 'gate-warn', t: 'Warn' }, { k: 'gate-no', t: 'Ignore' }
    ]);

    var h = ['<div class="pad"><div style="font:400 11.5px/1.55 var(--font);color:var(--muted);' +
      'max-width:640px">A lane with its gate set to <strong>Block</strong> will not let a file start ' +
      'until every gating part is received. <strong>Warn</strong> lets it through with a flag. ' +
      'Switch a lane off and its statuses disappear from the board.</div></div>'];

    CFG.lanes.forEach(function (l) {
      h.push('<div class="card2"><div class="card2row" style="grid-template-columns:3px 1fr auto">' +
        '<div class="sedge" style="background:' + (l.enabled ? 'var(--acc)' : 'var(--line)') + '"></div>' +
        '<div><input class="dinput" data-lane-label="' + esc(l.lane_key) + '" value="' +
        esc(l.label) + '" style="max-width:220px"></div>' +
        '<button class="pchip' + (l.enabled ? ' on' : '') + '" data-lane-en="' + esc(l.lane_key) + '">' +
        (l.enabled ? 'On' : 'Off') + '</button></div>' +

        '<div class="card2row" style="grid-template-columns:150px 1fr">' +
        '<div class="dk">Parts gate</div><div class="row">' +
        ['yes', 'warn', 'no'].map(function (g) {
          return '<button class="pchip' + (l.parts_gate === g ? ' on' : '') +
            '" data-gate="' + esc(l.lane_key) + '" data-val="' + g + '">' +
            (g === 'yes' ? 'Block' : g === 'warn' ? 'Warn' : 'Ignore') + '</button>';
        }).join('') + '</div></div>' +

        '<div class="card2row" style="grid-template-columns:150px 1fr">' +
        '<div class="dk">Owned by</div><div class="dv">' + esc(l.owner_role) +
        (l.module_tag ? ' · ' + esc(l.module_tag) : '') + '</div></div>' +

        '<div class="card2row" style="grid-template-columns:150px 1fr">' +

  function wireGroups() {
    Array.prototype.forEach.call($('mid').querySelectorAll('.pchip[data-pos], .pchip[data-usr]'),
      function (b) {
        b.addEventListener('click', function () {
          var on = b.dataset.on !== '1';
          b.dataset.on = on ? '1' : '0';
          b.classList.toggle('on', on);
        });
      });

    Array.prototype.forEach.call($('mid').querySelectorAll('.pchip[data-evon]'), function (b) {
      b.addEventListener('click', function () {
        var on = b.dataset.evon !== '1';
        b.dataset.evon = on ? '1' : '0';
        b.classList.toggle('on', on);
        b.textContent = on ? 'On' : 'Off';
        var row = b.closest('.evrow');
        row.style.opacity = on ? '1' : '.5';
        row.querySelector('.ev-scope').disabled = !on;
        row.querySelector('.sedge').style.background = on ? 'var(--done)' : 'var(--line)';
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-savegroup]'), function (b) {
      b.addEventListener('click', function () {
        var card = b.closest('[data-group]');
        var body = {
          name: card.querySelector('.g-name').value.trim(),
          description: card.querySelector('.g-desc').value.trim(),
          positions: Array.prototype.slice.call(card.querySelectorAll('.pchip[data-pos]'))
            .filter(function (c) { return c.dataset.on === '1'; })
            .map(function (c) { return c.dataset.pos; }),
          users: Array.prototype.slice.call(card.querySelectorAll('.pchip[data-usr]'))
            .filter(function (c) { return c.dataset.on === '1'; })
            .map(function (c) { return Number(c.dataset.usr); }),
          events: Array.prototype.slice.call(card.querySelectorAll('.evrow')).map(function (row) {
            return {
              key: row.dataset.ev,
              enabled: row.querySelector('.pchip[data-evon]').dataset.evon === '1',
              scope: row.querySelector('.ev-scope').value
            };
          })
        };
        api('/api/admin/notification-groups/' + b.dataset.savegroup, {
          method: 'PUT', body: JSON.stringify(body)
        }).then(reloadGroups).catch(function (e) { alert(e.message); });
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-delgroup]'), function (b) {
      b.addEventListener('click', function () {
        if (!confirm('Delete this group? Nobody in it will be notified any more.')) return;
        api('/api/admin/notification-groups/' + b.dataset.delgroup, { method: 'DELETE' })
          .then(function () { RAIL = null; return reloadGroups(); });
      });
    });
  }

  /** Chip groups are sets: the picked values, in the order the chips render. */
  function chipValues(scope, attr) {
    return Array.prototype.filter.call(scope.querySelectorAll('[data-' + attr + ']'), function (b) {
      return b.classList.contains('on');
    }).map(function (b) { return b.dataset[attr]; });
  }

  /** One delegated handler for every chip set on the page. */
  function wireChips() {
    $('mid').addEventListener('click', function (e) {
      var chip = e.target.closest && e.target.closest('.setchip');
      if (!chip) return;
      e.preventDefault();
      var set = chip.parentElement;
      var roleSet = !!chip.dataset.role;
      if (roleSet && chip.classList.contains('on') && chipValues(set, 'role').length === 1) {
        return say('Everyone needs at least one role.', 'err');
      }
      chip.classList.toggle('on');
      if (roleSet) {
        /* The primary is the highest-ranked role held, and ROLES arrives in rank
           order — so it is the first chip still on. */
        var first = true;
        Array.prototype.forEach.call(set.querySelectorAll('[data-role]'), function (b) {
          var on = b.classList.contains('on');
          b.classList.toggle('primary', on && first);
          if (on) first = false;
        });
      }
    });
  }

  /**
   * The labour-rate cell. A tech is paid by the hour, a flat rate per car, or —
   * PDR only — a share of the job. Nobody else's business, so it falls back to
   * the sign-in date when this person may not see pay.
   */
  function rateCell(p) {
    if (!RATES) return p.last_login_at ? Shell.when(p.last_login_at) : 'never';
    var row = RATES.staff.filter(function (s) { return s.userId === p.id; })[0];
    if (!row) return '<span style="color:var(--dim)">not on the floor</span>';
    if (!RATES.canEdit) {
      return row.basis === 'pct'
        ? row.ratePct + '% share'
        : money(row.rateCents) + (row.basis === 'flat' ? ' per car' : ' per hour');
    }
    var pct = row.basis === 'pct';
    return '<div class="row" style="gap:6px;flex-wrap:nowrap">' +
      '<div class="chipset" style="gap:2px">' +
      '<button type="button" class="setchip' + (row.basis === 'hourly' ? ' on' : '') + '" ' +
        'data-basis="hourly" data-u="' + p.id + '" title="Per hour">Hr</button>' +
      '<button type="button" class="setchip' + (row.basis === 'flat' ? ' on' : '') + '" ' +
        'data-basis="flat" data-u="' + p.id + '" title="Flat per car">Flat</button>' +
      (row.canPct
        ? '<button type="button" class="setchip' + (pct ? ' on' : '') + '" ' +
          'data-basis="pct" data-u="' + p.id + '" title="A share of the job — PDR only">%</button>'
        : '') +
      '</div>' +
      '<input class="dinput" data-rate="' + p.id + '" value="' +
        esc(pct ? String(row.ratePct) : dollars(row.rateCents)) + '" ' +
        'style="width:66px;text-align:right;font:500 11.5px var(--font);padding:3px 6px">' +
      '<span style="color:var(--dim);white-space:nowrap">' +
        (pct ? '%' : (row.basis === 'flat' ? '/car' : '/hr')) + '</span>' +
      '</div>';
  }

  function money(c) {
    return '$' + ((Number(c) || 0) / 100).toLocaleString('en-US',
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  /** Cents as a bare editable number. */
  function dollars(c) { return ((Number(c) || 0) / 100).toFixed(2); }
  function dollarsToCents(v) {
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
    return isNaN(n) ? 0 : Math.round(n * 100);
  }

  function wirePeople() {
    wireChips();

    /* A tech's labour rate, saved on its own rather than with the roles button —
       it is pay, and the person editing it may not be the person editing roles. */
    Array.prototype.forEach.call($('mid').querySelectorAll('[data-rate]'), function (inp) {
      inp.addEventListener('change', function () {
        var uid = Number(inp.dataset.rate);
        var row = RATES.staff.filter(function (s) { return s.userId === uid; })[0];
        if (!row) return;
        var body = row.basis === 'pct'
          ? { basis: 'pct', ratePct: parseFloat(inp.value) || 0, rateCents: 0 }
          : { basis: row.basis, rateCents: dollarsToCents(inp.value), ratePct: 0 };
        api('/api/staff/' + uid + '/rate', { method: 'PATCH', body: JSON.stringify(body) })
          .then(function (res) {
            row.rateCents = body.rateCents; row.ratePct = body.ratePct;
            say(res.note, 'ok');
          })
          .catch(function (e) { say(e.message, 'err'); });
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-basis]'), function (b) {
      b.addEventListener('click', function () {
        var uid = Number(b.dataset.u);
        var row = RATES.staff.filter(function (s) { return s.userId === uid; })[0];
        if (!row) return;
        row.basis = b.dataset.basis;
        api('/api/staff/' + uid + '/rate', {
          method: 'PATCH',
          body: JSON.stringify({ basis: row.basis, rateCents: row.rateCents, ratePct: row.ratePct })
        }).then(function () { render(); })
          .catch(function (e) { say(e.message, 'err'); render(); });
      });
    });

    var mr = $('matSave');
    if (mr) mr.addEventListener('click', function () {
      api('/api/shop/materials-rate', {
        method: 'PATCH', body: JSON.stringify({ cents: dollarsToCents($('matRate').value) })
      }).then(function (res) {
        RATES.materialsRateCents = res.cents;
        say('Paint materials saved.', 'ok');
      }).catch(function (e) { say(e.message, 'err'); });
    });

    $('addPerson').addEventListener('click', function () {
      var name = $('nName').value.trim();
      if (!name) return say('A name is required.', 'err');
      var roles = chipValues($('nRoles'), 'role');
      if (!roles.length) return say('Tick at least one role.', 'err');
      api('/api/admin/people', {
        method: 'POST',
        body: JSON.stringify({
          name: name,
          email: $('nEmail').value.trim() || undefined,
          useCode: !$('nEmail').value.trim() && !$('nPass').value.trim(),
          password: $('nPass').value.trim() || undefined,
          roles: roles,
          positionKeys: chipValues($('nTrades'), 'trade'),
          employeeCode: $('nCode').value.trim() || undefined
        })
      }).then(function (r) {
        var extra = (r.loginCode || r.code) ? ' Sign-in code: ' + (r.loginCode || r.code)
          : r.tempPassword ? ' Temporary password: ' + r.tempPassword +
            ' — they must change it at first sign-in.' : '';
        say('Added.' + extra, 'ok');
        ['nName', 'nEmail', 'nCode', 'nPass'].forEach(function (id) { $(id).value = ''; });
        return reloadPeople();
      }).catch(function (e) { say(e.message, 'err'); });
    });

    $('savePeople').addEventListener('click', function () {
      var jobs = [];
      Array.prototype.forEach.call($('mid').querySelectorAll('[data-user]'), function (row) {
        var id = Number(row.dataset.user);
        var was = PEOPLE.people.filter(function (p) { return p.id === id; })[0];
        var rolesEl = row.querySelector('.p-roles');
        var tradesEl = row.querySelector('.p-trades');
        var roles = rolesEl ? chipValues(rolesEl, 'role') : null;
        var trades = tradesEl ? chipValues(tradesEl, 'trade') : null;
        var wasRoles = (was.roles || [was.role]).join(',');
        var wasTrades = (was.positionKeys && was.positionKeys.length
          ? was.positionKeys
          : (was.position_key ? [was.position_key] : [])).join(',');
        var body = {};
        if (roles && roles.join(',') !== wasRoles) body.roles = roles;
        if (trades && trades.join(',') !== wasTrades) body.positionKeys = trades;
        if (Object.keys(body).length) jobs.push({ id: id, body: body });

        var nameEl = row.querySelector('.p-name');
        if (nameEl && nameEl.value.trim() && nameEl.value.trim() !== was.name) {
          jobs.push({ id: id, name: nameEl.value.trim() });
        }

        var emailEl = row.querySelector('.p-email');
        if (emailEl && emailEl.value.trim() !== (was.email || '')) {
          jobs.push({ id: id, email: emailEl.value.trim() || null });
        }
      });
      if (!jobs.length) return say('Nothing changed.', 'ok');
      // Run in sequence so a rejected email does not hide a saved role.
      jobs.reduce(function (chain, j) {
        return chain.then(function () {
          if (j.name !== undefined) {
            return api('/api/admin/people/' + j.id + '/name', {
              method: 'PATCH', body: JSON.stringify({ name: j.name })
            });
          }
          if (j.email !== undefined) {
            return api('/api/admin/people/' + j.id + '/email', {
              method: 'PATCH', body: JSON.stringify({ email: j.email })
            });
          }
          return api('/api/admin/people/' + j.id, {
            method: 'PATCH', body: JSON.stringify(j.body)
          });
        });
      }, Promise.resolve())
        .then(function () { say('Saved.', 'ok'); return reloadPeople(); })
        .catch(function (e) { say(e.message + ' — anything before it was saved.', 'err'); });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-code]'), function (b) {
      b.addEventListener('click', function () {
        api('/api/admin/people/' + b.dataset.code + '/code', { method: 'POST' })
          .then(function (r) {
            say('Sign-in code: ' + r.code + ' — write it down, it is shown once.', 'ok');
          }).catch(function (e) { say(e.message, 'err'); });
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-reset]'), function (b) {
      b.addEventListener('click', function () {
        var who = PEOPLE.people.filter(function (p) { return p.id === Number(b.dataset.reset); })[0];
        var chosen = prompt('Temporary password for ' + (who ? who.name : 'this person') +
          '.\n\nType one to hand over, or leave blank and the app will generate one.\n' +
          'Either way they must change it at first sign-in, and every session they have ends now.', '');
        if (chosen === null) return;

        api('/api/admin/people/' + b.dataset.reset + '/reset-password', {
          method: 'POST',
          body: JSON.stringify(chosen.trim() ? { password: chosen.trim() } : {})
        }).then(function (r) {
          say('Temporary password for ' + (who ? who.name : 'them') + ': ' + r.tempPassword +
            ' — they must change it at first sign-in.', 'ok');
        }).catch(function (e) { say(e.message, 'err'); });
      });
    });

    Array.prototype.forEach.call($('mid').querySelectorAll('[data-remove]'), function (b) {
      b.addEventListener('click', function () {
        var who = PEOPLE.people.filter(function (p) { return p.id === Number(b.dataset.remove); })[0];
        if (!confirm('Remove ' + (who ? who.name : 'this person') + ' from the shop?\n\n' +
          'They are signed out immediately and can no longer sign in. Their name stays on the work ' +
          'they did — the history is the shop\u2019s record. You can put them back later.')) return;

        api('/api/admin/people/' + b.dataset.remove, { method: 'DELETE' })
          .then(function (r) {
            say('Removed.' +
              (r.openFiles ? ' They were on ' + r.openFiles + ' open file' +
                (r.openFiles === 1 ? '' : 's') + ' — reassign those.' : '') +
              (r.disabled ? ' The account is switched off entirely.' : ''), 'ok');
            return reloadPeople();
          }).catch(function (e) { say(e.message, 'err'); });
      });
    });
  }

  /** Anyone taken off the shop, with a way back on. */
  function loadRemoved() {
    api('/api/admin/people/removed').then(function (d) {
      var box = $('removedBox');
      if (!box || !d.removed.length) return;

      box.innerHTML = '<div class="pad" style="padding-top:6px">' +
        '<div class="dlbl">Removed</div>' +
        '<div class="sub" style="margin-bottom:8px">Off the shop and unable to sign in. Their work ' +
        'history is intact.</div>' +
        d.removed.map(function (r) {
          return '<div class="prow2" style="opacity:.7">' +
            '<div class="avatar2">' +
            esc(String(r.display_name || '?').split(/\s+/).map(function (w) { return w[0]; })
              .join('').slice(0, 2).toUpperCase()) + '</div>' +
            '<div style="min-width:0"><div class="slabel">' + esc(r.display_name) + '</div>' +
            '<div class="ssub">' + esc((r.user && r.user.email) || 'no email') + '</div></div>' +
            '<select class="dsel r-role" data-for="' + r.user_id + '">' +
            ROLES.map(function (x) {
              return '<option value="' + esc(x.key) + '">' + esc(x.label) + '</option>';
            }).join('') + '</select>' +
            '<div class="ssub hide-sm">' + esc(r.position_key || 'no position') + '</div>' +
            '<div class="ssub hide-sm">removed</div>' +
            '<div><button class="visbtn" data-restore="' + r.user_id + '" ' +

        }).join('') + '</div>';

      Array.prototype.forEach.call(box.querySelectorAll('[data-restore]'), function (b) {
        b.addEventListener('click', function () {
          var sel = box.querySelector('.r-role[data-for="' + b.dataset.restore + '"]');
          api('/api/admin/people/' + b.dataset.restore + '/restore', {
            method: 'POST',
            body: JSON.stringify({ role: sel ? sel.value : 'technician' })
          }).then(function () {
            say('Put back on the shop. Give them a password or a code.', 'ok');
            return reloadPeople();
          }).catch(function (e) { say(e.message, 'err'); });
        });
      });
    }).catch(function () { /* nothing removed, or no access */ });
  }

  /* ===================================================== settings */

      { k: 'tech', t: 'Tech visibility' },
      { k: 'caps', t: 'Day limits' },
      { k: 'leads', t: 'Lead follow-up' },
      { k: 'cal', t: 'Google Calendar' }
    ]);
    var s = CFG.settings;

    // The rail picks which card is on screen, the same way it filters statuses
    // and lanes. Nothing selected shows them all.
    function shows(k) { return !RAIL || RAIL === k; }

    $('mid').innerHTML = '<div class="pad">' +
      (shows('tech') ? '<div class="card2" style="margin:0 0 14px">' +
      '<div class="card2row" style="grid-template-columns:1fr auto">' +
      '<div><div style="font:500 12.5px var(--font)">Technicians see only their own files</div>' +
      '<div class="sub" style="margin-top:4px;max-width:520px">On: a tech sees only cars assigned ' +
      'to them. Off: every tech sees the whole board. Estimating, production, front office, ' +
      'accounting and the owner always see everything.</div></div>' +
      '<button class="pchip' + (s.tech_sees_own_only !== '0' ? ' on' : '') + '" id="techOwn" ' +
      'data-on="' + (s.tech_sees_own_only !== '0' ? 1 : 0) + '">' +
      (s.tech_sees_own_only !== '0' ? 'On' : 'Off') + '</button></div></div>' : '') +

      (shows('caps') ? '<div class="card2" style="margin:0 0 14px">' +
      '<div class="card2row" style="grid-template-columns:1fr">' +
      '<div class="dlbl" style="margin:0 0 4px">Scheduler capacity</div>' +
      '<div class="sub" style="margin-bottom:10px">How many of each per day. The owner can always ' +
      'overbook; everyone else is refused.</div>' +
      '<div class="grid3">' +
      ['drop', 'pickup', 'return', 'estimate', 'appraiser'].map(function (k) {
        return '<div><div class="dk">' + k + 's per day</div>' +
          '<input class="dinput" type="number" min="0" id="cap_' + k + '" value="' +
          esc(s['cap_' + k] || '0') + '"></div>';
      }).join('') + '</div></div></div>' : '') +

      (shows('leads') ? '<div class="card2" style="margin:0 0 14px" id="leadCard">' +
        '<div class="card2row" style="grid-template-columns:1fr">' +
        '<div class="dlbl" style="margin:0 0 4px">Lead follow-up</div>' +
        '<div class="sub" style="margin-bottom:10px;max-width:560px">A lead nobody has touched gets ' +
        'flagged for a chase. A lead with something on the calendar does not — being booked ' +
        '<em>is</em> the follow-up. Marking one chased holds it for the same number of days again.</div>' +
        '<div class="grid3">' +
        '<div><div class="dk">Days of silence before flagging</div>' +
        '<input class="dinput" type="number" min="1" max="90" id="lead_followup_days" value="' +
        esc(s.lead_followup_days || '3') + '"></div>' +
        '<div><div class="dk">A booking this far ahead counts</div>' +
        '<input class="dinput" type="number" min="1" max="365" id="lead_appointment_window_days" value="' +
        esc(s.lead_appointment_window_days || '30') + '"></div>' +
        '</div></div></div>' : '') +

      (shows('cal') ? '<div class="card2" style="margin:0 0 14px" id="calCard">' +
        '<div class="card2row" style="grid-template-columns:1fr">' +
        '<div class="dlbl" style="margin:0 0 4px">Google Calendar</div>' +
        '<div class="sub" style="margin-bottom:10px;max-width:560px">Appointments booked here appear ' +
        'on the shop calendar. Push only: nothing on Google changes this scheduler, and time off is ' +
        'still entered on the schedule screen. You sign in once with the shop account — there is no ' +
        'password to share, and staff never see credentials.</div>' +
        '<div id="calBody" class="sub">Loading…</div></div></div>' : '') +

      '<div class="row"><button class="btn btn-solid" id="saveSettings">Save settings</button></div>' +

    if (shows('cal')) renderCalendar();

      $('saveSettings').hidden = !shows('tech') && !shows('caps');

    if ($('techOwn')) $('techOwn').addEventListener('click', function () {

      '<div class="sub" style="margin-top:12px">Shop type is set at the platform level, not here. ' +
      'It decides which status template the shop started from.</div>');

  /** The Google Calendar card: connect, pick a calendar, disconnect. */
  function renderCalendar() {
    api('/api/calendar').then(function (c) {
      var el = $('calBody');
      if (!el) return;

      if (!c.configured) {
        el.innerHTML = 'This server has no Google credentials, so there is nothing to connect to yet. ' +
          'Add <code>GOOGLE_CLIENT_ID</code> and <code>GOOGLE_CLIENT_SECRET</code> to the server\'s ' +
          '<code>.env</code> and restart — then this card offers a sign-in button.';
        return;
      }

      if (!c.connection || c.connection.state === 'disconnected') {
        el.innerHTML = c.canConnect
          ? '<a class="btn btn-solid" href="/api/calendar/connect">Connect Google Calendar</a>'
          : 'Not connected. The owner can connect it.';
        return;
      }

      var conn = c.connection;
      el.innerHTML =
        '<div class="drow"><div class="dk">Calendar</div><div class="dv">' +
        esc(conn.calendarName || conn.calendarId || 'not picked yet') + '</div></div>' +
        '<div class="drow"><div class="dk">State</div><div class="dv" style="color:' +
        (conn.state === 'connected' ? 'var(--done)' : 'var(--stopped)') + '">' +
        esc(conn.state) + '</div></div>' +
        (conn.lastError ? '<div class="drow"><div class="dk">Last error</div><div class="dv">' +
          esc(conn.lastError) + '</div></div>' : '') +
        (conn.lastPushAt ? '<div class="drow"><div class="dk">Last sent</div><div class="dv">' +
          Shell.when(conn.lastPushAt) + '</div></div>' : '') +
        (c.canConnect
          ? '<div class="row" style="margin-top:12px">' +
            '<select id="calPick" style="min-width:220px"><option value="">Loading calendars…</option></select>' +
            '<button class="btn btn-ghost" id="calSave">Use this calendar</button>' +
            '<button class="btn btn-danger" id="calOff">Disconnect</button></div>'
          : '');

      if (!c.canConnect) return;

      api('/api/calendar/calendars').then(function (r) {
        $('calPick').innerHTML = r.calendars.map(function (x) {
          return '<option value="' + esc(x.id) + '"' +
            (x.id === conn.calendarId ? ' selected' : '') + '>' + esc(x.name) + '</option>';
        }).join('');
        // Google refusing to list calendars does not stop us writing to the
        // account's own one, so say what happened instead of showing nothing.
        if (r.note) {
          var n = document.createElement('div');
          n.className = 'sub';
          n.style.marginTop = '8px';
          n.textContent = r.note;
          $('calPick').parentNode.appendChild(n);
        }
      }).catch(function (e) {
        $('calPick').innerHTML = '<option value="">' + esc(e.message) + '</option>';
      });

      $('calSave').addEventListener('click', function () {
        var pick = $('calPick');
        var id = pick.value;
        if (!id) return say('Pick a calendar.', 'err');
        api('/api/calendar', {
          method: 'PATCH',
          body: JSON.stringify({ calendarId: id, calendarName: pick.options[pick.selectedIndex].textContent })
        }).then(function () { say('Saved.', 'ok'); renderCalendar(); })
          .catch(function (e) { say(e.message, 'err'); });
      });

      $('calOff').addEventListener('click', function () {
        if (!confirm('Disconnect Google Calendar? Appointments already sent stay on the calendar.')) return;
        api('/api/calendar', { method: 'DELETE' })
          .then(function () { say('Disconnected.', 'ok'); renderCalendar(); })
          .catch(function (e) { say(e.message, 'err'); });
      });
    }).catch(function (e) {
      if ($('calBody')) $('calBody').textContent = e.message;
    });
  }

  /* ====================================================== vendors */

  /**
   * Who the shop buys from. One list, used by the parts desk when ordering and
   * offered as suggestions when someone types a sublet vendor on a file.
   *
   * Retiring a vendor keeps every order that already names it — the name stops
   * being offered, nothing in the history changes.
   */
  function renderVendors() {
    rail('Reference', []);
    $('mid').innerHTML = '<div class="empty">Loading…</div>';

    api('/api/vendors?all=1').then(function (d) {
      var kinds = d.kinds || [];
      var live = d.vendors.filter(function (v) { return Number(v.active) === 1; });
      var gone = d.vendors.filter(function (v) { return Number(v.active) !== 1; });

      /* Sublet vendors are typed on the file rather than picked. A name that
         keeps appearing there is one worth adding to the list properly. */
      var known = {};
      d.vendors.forEach(function (v) { known[v.name.toLowerCase()] = 1; });
      var strays = (d.subletVendors || []).filter(function (s) {
        return !known[String(s.vendor).toLowerCase()];
      });

      var h = ['<div class="pad"><div class="card2" style="margin:0 0 18px">' +
        '<div class="card2row" style="grid-template-columns:1fr">' +
        '<div class="dlbl">Add a vendor</div>' +
        '<div class="grid3" style="margin-top:4px;row-gap:14px">' +
        '<div><div class="dk">Name</div><input class="dinput" id="vName"></div>' +
        '<div><div class="dk">Kind</div><select class="dsel" id="vKind">' +
        '<option value="">—</option>' +
        kinds.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + '</option>'; }).join('') +
        '</select></div>' +
        '<div><div class="dk">Phone</div><input class="dinput" id="vPhone"></div>' +
        '<div><div class="dk">Email</div><input class="dinput" id="vEmail" type="email"></div>' +
        '</div>' +
        '<div class="row" style="margin-top:12px">' +
        '<button class="btn btn-solid" id="addVendor">Add</button></div>' +
        '</div></div></div>'];

      if (strays.length) {
        h.push('<div class="pad"><div class="dlbl">Typed on a file but not on the list</div>' +
          '<div class="sub" style="margin-top:6px">' +
          strays.map(function (s) {
            return '<button class="setchip" data-adopt="' + esc(s.vendor) + '">' +
              esc(s.vendor) + ' · ' + s.n + '</button>';
          }).join(' ') + '</div>' +
          '<div class="sub" style="margin-top:6px">Tap one to add it as a sublet vendor.</div></div>');
      }

      h.push('<div class="prow2" style="border-top:1px solid var(--line);min-height:32px">' +
        '<div></div><div class="dk">Name</div><div class="dk">Kind</div>' +
        '<div class="dk hide-sm">Phone</div><div class="dk hide-sm">Used</div>' +
        '<div class="dk">On the list</div></div>');

      live.concat(gone).forEach(function (v) {
        var off = Number(v.active) !== 1;
        h.push('<div class="prow2" data-vendor="' + v.id + '"' +
          (off ? ' style="opacity:.5"' : '') + '>' +
          '<div></div>' +
          '<div><input class="dinput v-name" value="' + esc(v.name) + '"></div>' +
          '<select class="dsel v-kind"><option value="">—</option>' +
          kinds.map(function (k) {
            return '<option value="' + esc(k) + '"' + (v.kind === k ? ' selected' : '') + '>' +
              esc(k) + '</option>';
          }).join('') + '</select>' +
          '<div class="hide-sm"><input class="dinput v-phone" value="' + esc(v.phone || '') + '"></div>' +
          '<div class="scell num hide-sm" title="Part lines ever ordered from them">' +
          (Number(v.parts_lines) || 0) +
          (Number(v.on_order) ? ' · ' + v.on_order + ' out' : '') + '</div>' +
          '<button class="visbtn' + (off ? '' : ' on') + '" data-vactive="' + (off ? 0 : 1) + '">' +
          (off ? 'Retired' : 'Offered') + '</button></div>');
      });

      h.push('<div class="pad" style="padding-top:16px"><div class="row">' +
        '<button class="btn btn-solid" id="saveVendors">Save vendors</button>' +
        '<span class="sub">' + live.length + ' offered' +
        (gone.length ? ' · ' + gone.length + ' retired' : '') +
        ' · a retired vendor stays on every order that already names it</span></div></div>');

      $('mid').innerHTML = h.join('');
      detail('Vendors', '<div style="font:400 11.5px/1.6 var(--font);color:var(--muted);padding:12px 0">' +
        'One list for the whole shop. The parts desk picks from it when ordering, and it fills the ' +
        'suggestions when somebody types a sublet vendor onto a file. Kind is only a label \u2014 it groups ' +
        'the list, it does not restrict anything.</div>' +
        '<div class="sub" style="margin-top:10px">Retire rather than delete. Deleting would orphan the ' +
        'orders that name them; retiring just takes the name out of the dropdowns.</div>');

      $('addVendor').addEventListener('click', function () {
        var name = $('vName').value.trim();
        if (!name) return say('A name is required.', 'err');
        api('/api/vendors', {
          method: 'POST',
          body: JSON.stringify({
            name: name,
            kind: $('vKind').value || undefined,
            phone: $('vPhone').value.trim() || undefined,
            email: $('vEmail').value.trim() || undefined
          })
        }).then(function () {
          say('Added.', 'ok');
          renderVendors();
        }).catch(function (e) { say(e.message, 'err'); });
      });

      Array.prototype.forEach.call($('mid').querySelectorAll('[data-adopt]'), function (b) {
        b.addEventListener('click', function () {
          api('/api/vendors', {
            method: 'POST',
            body: JSON.stringify({ name: b.dataset.adopt, kind: 'Sublet' })
          }).then(renderVendors).catch(function (e) { say(e.message, 'err'); });
        });
      });

      Array.prototype.forEach.call($('mid').querySelectorAll('[data-vactive]'), function (b) {
        b.addEventListener('click', function () {
          var on = b.dataset.vactive === '1';
          b.dataset.vactive = on ? '0' : '1';
          b.classList.toggle('on', !on);
          b.textContent = on ? 'Retired' : 'Offered';
          b.closest('.prow2').style.opacity = on ? '.5' : '';
        });
      });

      $('saveVendors').addEventListener('click', function () {
        var jobs = [];
        Array.prototype.forEach.call($('mid').querySelectorAll('[data-vendor]'), function (row) {
          var id = Number(row.dataset.vendor);
          var was = d.vendors.filter(function (v) { return v.id === id; })[0];
          var body = {};
          var name = row.querySelector('.v-name').value.trim();
          var kind = row.querySelector('.v-kind').value;
          var phoneEl = row.querySelector('.v-phone');
          var phone = phoneEl ? phoneEl.value.trim() : (was.phone || '');
          var active = row.querySelector('[data-vactive]').dataset.vactive === '1';

          if (name && name !== was.name) body.name = name;
          if (kind !== (was.kind || '')) body.kind = kind || null;
          if (phone !== (was.phone || '')) body.phone = phone || null;
          if (active !== (Number(was.active) === 1)) body.active = active;
          if (Object.keys(body).length) jobs.push({ id: id, body: body });
        });

        if (!jobs.length) return say('Nothing changed.', 'ok');
        Promise.all(jobs.map(function (j) {
          return api('/api/vendors/' + j.id, { method: 'PATCH', body: JSON.stringify(j.body) });
        })).then(function () {
          say(jobs.length + (jobs.length === 1 ? ' vendor' : ' vendors') + ' saved.', 'ok');
          renderVendors();
        }).catch(function (e) { say(e.message, 'err'); });
      });
    }).catch(function (e) {
      $('mid').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }

  /* ====================================================== storage */

  function renderStorage() {
    rail('Reference', []);
    $('mid').innerHTML = '<div class="empty">Loading…</div>';

    api('/api/storage').then(function (d) {
      return api('/api/media-tools').catch(function () { return null; })
        .then(function (tools) { return { d: d, tools: tools }; });
    }).then(function (both) {
      var d = both.d, tools = both.tools;
      function bytes(n) {
        if (!n) return '0 B';
        if (n < 1048576) return Math.round(n / 1024) + ' KB';
        if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
        return (n / 1073741824).toFixed(2) + ' GB';
      }

      var max = Math.max.apply(null, d.byType.map(function (t) { return Number(t.bytes); }).concat([1]));

      $('mid').innerHTML = '<div class="kpis" style="border-top:none">' +
        '<div><div class="kpi-v">' + bytes(d.bytes) + '</div><div class="kpi-k">On disk</div></div>' +
        '<div><div class="kpi-v">' + d.files.toLocaleString('en-US') + '</div>' +
        '<div class="kpi-k">Files</div></div>' +
        '<div><div class="kpi-v">' + d.images.toLocaleString('en-US') + '</div>' +
        '<div class="kpi-k">Photos</div></div>' +
        '<div><div class="kpi-v">' + (d.files ? bytes(Math.round(d.bytes / d.files)) : '—') + '</div>' +
        '<div class="kpi-k">Average file</div></div><div class="kpi-tail"></div></div>' +

        '<div class="pad"><div class="dlbl">By kind</div>' +
        '<table style="margin-top:6px"><thead><tr><th>Kind</th><th class="num">Files</th>' +
        '<th class="num">Size</th><th></th></tr></thead><tbody>' +
        d.byType.map(function (t) {
          var pct = Math.round((Number(t.bytes) / max) * 100);
          return '<tr><td>' + esc(String(t.doc_type).replace(/_/g, ' ')) + '</td>' +
            '<td class="num">' + t.n + '</td>' +
            '<td class="num">' + bytes(Number(t.bytes)) + '</td>' +
            '<td><div style="height:6px;background:var(--whisper);border-radius:3px">' +
            '<div style="height:100%;width:' + pct + '%;background:var(--acc);border-radius:3px">' +
            '</div></div></td></tr>';
        }).join('') + '</tbody></table></div>' +

        /* Rendered PDF pages are a cache, counted apart from the records — it is
           disk you can throw away, and it reads better knowing that. */
        '<div class="pad"><div class="dlbl">Rendered PDF pages</div>' +
        '<div class="sub" style="margin-top:6px">' +
        (d.pageCache && d.pageCache.pages
          ? d.pageCache.pages.toLocaleString('en-US') + ' page' +
            (d.pageCache.pages === 1 ? '' : 's') + ' · ' + bytes(d.pageCache.bytes) +
            ' — a cache, dropped thirty days after anyone last opened them, ' +
            'and re-rendered on demand. Not part of the record.'
          : 'Nothing cached. Pages are rendered when somebody opens them.') +
        '</div></div>' +

        (d.pending || d.noThumb
          ? '<div class="pad"><div class="dlbl">Thumbnails</div><div class="sub" style="margin-top:6px">' +
            (d.pending ? d.pending + ' being made. ' : '') +
            (d.noThumb ? d.noThumb + ' could not be made — open one in the drawer to try again.' : '') +
            '</div></div>'
          : '');

      detail('Storage', '<div style="font:400 11.5px/1.6 var(--font);color:var(--muted);padding:12px 0">' +
        'Photos are shrunk before they are kept — a 2048px version and a small thumbnail — so a car ' +
        'with two hundred photos costs about 80 MB rather than 800. iPhone HEIC photos are converted ' +
        'to JPEG on upload and the HEIC is dropped, so they open anywhere later.' +
        '</div>' +
        (tools
          ? '<div class="dlbl" style="margin-top:12px">This server can make</div>' +
            '<div class="sub" style="margin-top:6px">' +
            'Photo thumbnails: ' + (tools.sharp ? 'yes' : 'no') + '<br>' +
            'iPhone HEIC: ' + (tools.heifConvert || tools.sharp ? 'yes' : 'no') + '<br>' +
            'PDF thumbnails and pages: ' + (tools.mutool ? 'yes' : 'no') + '<br>' +
            'Queue: ' + (tools.queue ? 'running' : 'not running — thumbnails are made during the upload') +
            '</div>' +
            (tools.missing && tools.missing.length
              ? '<div class="sub" style="margin-top:8px;color:var(--stopped)">Missing: ' +
                esc(tools.missing.join('; ')) + '. See INSTALL-MEDIA.md on the server.</div>'
              : '')
          : '') +
        '<div class="sub" style="margin-top:12px">Watch this against the disk on the server, not the ' +
        'database size. Photos are what grows.</div>');
    }).catch(function (e) {
      $('mid').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }

  /* ===================================================== plumbing */

  function say(t, k) {
    var m = $('dMsg');
    if (!m) return alert(t);
    m.textContent = t;
    m.className = 'msg ' + k;
  }
  function reloadConfig() { return api('/api/config').then(function (c) { CFG = c; render(); }); }
  function reloadPeople() { return api('/api/config/people').then(function (p) { PEOPLE = p; render(); }); }
  function reloadGroups() {
    return api('/api/admin/notification-groups').then(function (g) { GROUPS = g; render(); });
  }
})();
</script>
</body>
</html>
