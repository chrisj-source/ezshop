<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2740">
<title>Leads — Easy Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css">
<style>
  .pane { padding:0 18px 40px; }
  .leadrow {
    display:grid; grid-template-columns:1fr 160px 150px 130px 110px; gap:12px; align-items:center;
    padding:11px 0; border-top:1px solid var(--whisper); cursor:pointer;
  }
  .leadrow:hover { background:var(--whisper); }
  .state { font:500 9px var(--font); letter-spacing:.07em; text-transform:uppercase;
           padding:3px 7px; border-radius:3px; white-space:nowrap; }
  .newcard { border:1px solid var(--line); border-radius:6px; padding:14px; margin-top:6px; }
  .cold { color:var(--stopped); }
  @media (max-width:900px) {
    .leadrow { grid-template-columns:1fr auto; }
    .pane { padding:0 14px 40px; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><div class="mark">ES</div><div class="word">Easy Shop</div></div>
  <div class="vr"></div>
  <div class="co" id="coName">—</div>
  <div id="nav"></div>
  <div class="spacer"></div>
  <div id="bell"></div>
  <div class="who" id="who">—</div>
  <button class="ghostbtn" id="signout">Sign out</button>
</div>
<div class="hairline"></div>

<div class="head">
  <h1>Leads</h1>
  <div class="headmeta" id="headmeta">Loading…</div>
</div>

<div class="kpis" id="kpis"></div>

<div class="filters">
  <select id="fState"><option value="">Open leads</option></select>
  <input type="search" id="fSearch" placeholder="Name, phone, vehicle">
  <label class="row" style="font:400 11.5px var(--font);color:var(--dim);gap:5px">
    <input type="checkbox" id="fMine"> Mine only
  </label>
  <label class="row" style="font:400 11.5px var(--font);color:var(--dim);gap:5px">
    <input type="checkbox" id="fSettled"> Include won and lost
  </label>
  <button class="btn btn-ghost" id="refresh">Refresh</button>
  <button class="btn" id="newLead">New lead</button>
</div>

<main>
  <div class="pane">
    <div id="newBox" hidden>
      <div class="newcard">
        <div style="font:500 14px var(--font)">New lead</div>
        <div class="grid3" style="margin-top:12px">
          <div><label class="fl">First name</label><input id="nFirst"></div>
          <div><label class="fl">Last name</label><input id="nLast"></div>
          <div><label class="fl">Phone</label><input id="nPhone" type="tel"></div>
          <div><label class="fl">Email</label><input id="nEmail" type="email"></div>
          <div><label class="fl">Vehicle</label><input id="nVehicle" placeholder="2020 Silverado"></div>
          <div><label class="fl">Source</label><select id="nSource"></select></div>
        </div>
        <div style="margin-top:12px">
          <label class="fl">What they want</label>
          <textarea id="nNote" placeholder="Hail on the hood and roof, wants a quote"></textarea>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn btn-solid" id="saveLead">Create lead</button>
          <button class="btn btn-ghost" id="cancelLead">Cancel</button>
        </div>
        <div class="msg" id="nMsg"></div>
      </div>
    </div>

    <div id="list"></div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead">
    <div style="min-width:0;flex:1">
      <div style="font:500 16px var(--font)" id="dTitle">—</div>
      <div class="sub" id="dSub">—</div>
    </div>
    <button class="close" id="dClose" aria-label="Close">&times;</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

<script src="/shell.js"></script>
<script>
(function () {
  var api = Shell.api, esc = Shell.esc;
  var ME = null, LEADS = [], META = null, STAFF = [], OPEN = null;

  function $(id) { return document.getElementById(id); }
  function when(v) {
    if (!v) return '—';
    var d = new Date(v);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
           d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }
  var TONE = {
    'new': 'var(--acc)', contacted: 'var(--move)', estimate_sent: 'var(--move)',
    appraisal_booked: 'var(--move)', won: 'var(--done)', lost: 'var(--dim)'
  };
  function label(k) { return (META.states.filter(function (s) { return s.key === k; })[0] || {}).label || k; }

  api('/api/me').then(function (me) {
    ME = me;
    if (!me.company) { location.href = '/'; return null; }
    if (me.features.indexOf('leads') < 0) {
      document.body.innerHTML = '<div class="empty">Leads is not switched on for this shop.</div>';
      return null;
    }
    Shell.mount({ me: me, active: 'leads' });
    return api('/api/lead-meta');
  }).then(function (m) {
    if (!m) return;
    META = m;
    $('fState').innerHTML = '<option value="">Open leads</option>' +
      m.states.map(function (s) { return '<option value="' + s.key + '">' + esc(s.label) + '</option>'; }).join('');
    $('nSource').innerHTML = m.sources.map(function (s) {
      return '<option value="' + esc(s) + '">' + esc(s) + '</option>';
    }).join('');
    return load();
  }).catch(function (e) { if (e.message !== 'signed out') console.error(e); });

  function load() {
    var qs = [];
    if ($('fState').value) qs.push('state=' + $('fState').value);
    if ($('fMine').checked) qs.push('mine=1');
    if ($('fSettled').checked) qs.push('settled=1');

    return api('/api/leads' + (qs.length ? '?' + qs.join('&') : '')).then(function (d) {
      LEADS = d.leads;
      STAFF = d.staff;
      var s = d.summary;
      $('kpis').innerHTML = [
        { v: s.fresh, k: 'new', hot: s.fresh > 0 },
        { v: s.unanswered, k: 'unanswered', bad: s.unanswered > 0 },
        { v: s.avgReplyHours == null ? '—' : s.avgReplyHours + 'h', k: 'avg first reply' },
        { v: s.closeRate == null ? '—' : s.closeRate + '%', k: 'close rate' },
        { v: s.won, k: 'won, 90 days' },
        { v: s.lost, k: 'lost, 90 days' }
      ].map(function (i) {
        var color = i.bad ? 'var(--stopped)' : i.hot ? 'var(--acc)' : '';
        return '<div><div class="kpi-v"' + (color ? ' style="color:' + color + '"' : '') + '>' +
          esc(i.v) + '</div><div class="kpi-k">' + esc(i.k) + '</div></div>';
      }).join('');
      render();
    });
  }

  function filtered() {
    var q = $('fSearch').value.trim().toLowerCase();
    if (!q) return LEADS;
    return LEADS.filter(function (l) {
      return [l.lead_number, l.first_name, l.last_name, l.phone, l.email, l.vehicle_text]
        .join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }

  function render() {
    var rows = filtered();
    $('headmeta').textContent = rows.length + ' lead' + (rows.length === 1 ? '' : 's') +
      ($('fSettled').checked ? ' · including won and lost' : ' · open only');

    if (!rows.length) {
      $('list').innerHTML = '<div class="empty">No leads here.<br>' +
        'They arrive from the scheduler, the sales app, or <strong>New lead</strong>.</div>';
      return;
    }

    $('list').innerHTML =
      '<div class="leadrow" style="border:none;cursor:default"><div class="f-l">Who</div>' +
      '<div class="f-l">Vehicle</div><div class="f-l">Source</div>' +
      '<div class="f-l">Age</div><div class="f-l">State</div></div>' +
      rows.map(function (l) {
        var name = [l.first_name, l.last_name].filter(Boolean).join(' ') || 'Unnamed';
        var cold = !l.first_reply_at && l.state !== 'won' && l.state !== 'lost' && l.age_hours > 24;
        return '<div class="leadrow" data-id="' + l.id + '">' +
          '<div><div class="log-b">' + esc(name) +
          (l.ro_number ? ' <span class="flag" style="color:var(--done);border:1px solid var(--done)">RO ' +
            esc(l.ro_number) + '</span>' : '') + '</div>' +
          '<div class="sub">' + esc([l.lead_number, l.phone].filter(Boolean).join(' · ')) + '</div></div>' +
          '<div class="sub">' + esc(l.vehicle_text || '—') + '</div>' +
          '<div class="sub">' + esc(l.source) + '</div>' +
          '<div class="sub' + (cold ? ' cold' : '') + '">' +
          (l.age_hours < 24 ? l.age_hours + 'h' : Math.round(l.age_hours / 24) + 'd') +
          (l.first_reply_at ? '' : ' · no reply') + '</div>' +
          '<div><span class="state" style="color:' + TONE[l.state] + ';border:1px solid ' + TONE[l.state] +
          '">' + esc(label(l.state)) + '</span></div></div>';
      }).join('');

    Array.prototype.forEach.call($('list').querySelectorAll('[data-id]'), function (el) {
      el.addEventListener('click', function () { openLead(Number(el.dataset.id)); });
    });
  }

  /* ---------------------------------------------------------------- new */

  $('newLead').addEventListener('click', function () {
    $('newBox').hidden = !$('newBox').hidden;
  });
  $('cancelLead').addEventListener('click', function () { $('newBox').hidden = true; });

  $('saveLead').addEventListener('click', function () {
    var msg = $('nMsg');
    var body = {
      firstName: $('nFirst').value.trim() || undefined,
      lastName: $('nLast').value.trim() || undefined,
      phone: $('nPhone').value.trim() || undefined,
      email: $('nEmail').value.trim() || undefined,
      vehicleText: $('nVehicle').value.trim() || undefined,
      damageNote: $('nNote').value.trim() || undefined,
      source: $('nSource').value
    };
    api('/api/leads', { method: 'POST', body: JSON.stringify(body) })
      .then(function () {
        ['nFirst', 'nLast', 'nPhone', 'nEmail', 'nVehicle', 'nNote'].forEach(function (id) {
          $(id).value = '';
        });
        msg.className = 'msg';
        $('newBox').hidden = true;
        return load();
      })
      .catch(function (e) { msg.textContent = e.message; msg.className = 'msg err'; });
  });

  /* -------------------------------------------------------------- drawer */

  function openLead(id) {
    OPEN = id;
    $('scrim').classList.add('open');
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
    $('dBody').innerHTML = '<div class="empty">Loading…</div>';
    api('/api/leads/' + id).then(renderLead).catch(function (e) {
      $('dBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }

  function closeLead() {
    OPEN = null;
    $('scrim').classList.remove('open');
    $('drawer').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'true');
  }

  function field(l, v) {
    return '<div><div class="f-l">' + esc(l) + '</div><div class="f-v">' +
      esc(v == null || v === '' ? '—' : v) + '</div></div>';
  }

  function renderLead(d) {
    var l = d.lead, h = [];
    var name = [l.first_name, l.last_name].filter(Boolean).join(' ') || 'Unnamed';

    $('dTitle').textContent = name;
    $('dSub').textContent = [l.lead_number, l.vehicle_text, l.source].filter(Boolean).join(' · ');

    h.push('<div class="sec">Where it stands</div>');
    h.push('<div class="row"><span class="state" style="color:' + TONE[l.state] + ';border:1px solid ' +
      TONE[l.state] + '">' + esc(label(l.state)) + '</span>' +
      (l.ro_number ? '<a href="/board.html?ro=' + l.ro_id + '" class="sub">RO ' + esc(l.ro_number) + '</a>' : '') +
      '</div>');

    if (l.state !== 'won' && l.state !== 'lost') {
      h.push('<div class="row" style="margin-top:12px">' +
        META.states.filter(function (s) { return s.key !== 'won' && s.key !== 'lost'; })
          .map(function (s) {
            return '<button class="btn ' + (s.key === l.state ? '' : 'btn-ghost') +
              '" data-state="' + s.key + '" style="padding:6px 11px;font-size:11px">' + esc(s.label) + '</button>';
          }).join('') + '</div>');

      h.push('<div class="row" style="margin-top:10px">' +
        '<select id="lostReason" style="min-width:170px"><option value="">Lost because…</option>' +
        META.lostReasons.map(function (r) { return '<option value="' + esc(r) + '">' + esc(r) + '</option>'; }).join('') +
        '</select><button class="btn btn-ghost" id="markLost">Mark lost</button></div>');
    }

    h.push('<div class="msg" id="lMsg"></div>');

    h.push('<div class="sec">Details</div><div class="grid2">');
    h.push(field('Phone', l.phone), field('Email', l.email));
    h.push(field('Vehicle', l.vehicle_text), field('Source', l.source));
    h.push(field('Received', when(l.received_at)),
      field('First reply', l.first_reply_at ? when(l.first_reply_at) : 'not yet'));
    if (l.lost_reason) h.push(field('Lost because', l.lost_reason));
    h.push('</div>');

    if (l.damage_note) {
      h.push('<div class="sec">What they want</div><div class="log-b">' + esc(l.damage_note) + '</div>');
    }

    if (!l.ro_id && ME.caps.editRepairOrders) {
      h.push('<div class="sec">Turn into a repair order</div>' +
        '<div class="row"><input id="convRo" placeholder="RO number" style="width:150px">' +
        '<input id="convVin" placeholder="VIN — optional" style="flex:1;min-width:150px">' +
        '<button class="btn btn-solid" id="convert">Create the file</button></div>');
    }

    h.push('<div class="sec">Add a note</div>' +
      '<textarea id="noteBody" placeholder="Called, left a voicemail"></textarea>' +
      '<div class="row" style="margin-top:9px"><button class="btn btn-ghost" id="addNote">Save note</button>' +
      '<span class="sub">Saving a note counts as making contact.</span></div>');

    h.push('<div class="sec">History</div>');
    if (!d.events.length) h.push('<div class="sub">Nothing yet.</div>');
    d.events.forEach(function (e) {
      h.push('<div class="log"><div class="log-b"' + (e.kind === 'auto' ? ' style="color:var(--muted)"' : '') +
        '>' + esc(e.body) + '</div><div class="log-m">' + esc(e.user_name || 'system') + ' · ' +
        when(e.created_at) + '</div></div>');
    });

    $('dBody').innerHTML = h.join('');
    wireLead(l);
  }

  function wireLead(l) {
    var msg = $('lMsg');
    function say(t, k) { msg.textContent = t; msg.className = 'msg ' + k; }

    Array.prototype.forEach.call(document.querySelectorAll('[data-state]'), function (b) {
      b.addEventListener('click', function () {
        api('/api/leads/' + OPEN, { method: 'PATCH', body: JSON.stringify({ state: b.dataset.state }) })
          .then(function () { return load().then(function () { openLead(OPEN); }); })
          .catch(function (e) { say(e.message, 'err'); });
      });
    });

    var lost = $('markLost');
    if (lost) lost.addEventListener('click', function () {
      var reason = $('lostReason').value;
      if (!reason) return say('Pick why it was lost — that is the useful part.', 'err');
      api('/api/leads/' + OPEN, {
        method: 'PATCH', body: JSON.stringify({ state: 'lost', lostReason: reason })
      }).then(function () { return load().then(function () { openLead(OPEN); }); })
        .catch(function (e) { say(e.message, 'err'); });
    });

    var note = $('addNote');
    if (note) note.addEventListener('click', function () {
      var body = $('noteBody').value.trim();
      if (!body) return say('The note is empty.', 'err');
      api('/api/leads/' + OPEN + '/notes', { method: 'POST', body: JSON.stringify({ body: body }) })
        .then(function () { return load().then(function () { openLead(OPEN); }); })
        .catch(function (e) { say(e.message, 'err'); });
    });

    var conv = $('convert');
    if (conv) conv.addEventListener('click', function () {
      var ro = $('convRo').value.trim();
      if (!ro) return say('An RO number is required.', 'err');
      api('/api/leads/' + OPEN + '/convert', {
        method: 'POST',
        body: JSON.stringify({ roNumber: ro, vin: $('convVin').value.trim() || undefined })
      }).then(function (r) { location.href = '/board.html?ro=' + r.roId; })
        .catch(function (e) { say(e.message, 'err'); });
    });
  }

  $('fState').addEventListener('change', load);
  $('fMine').addEventListener('change', load);
  $('fSettled').addEventListener('change', load);
  $('fSearch').addEventListener('input', render);
  $('refresh').addEventListener('click', load);
  $('scrim').addEventListener('click', closeLead);
  $('dClose').addEventListener('click', closeLead);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLead(); });
})();
</script>
</body>
</html>
