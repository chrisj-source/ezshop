<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131c2e; --surf: #1c2740; --text: #e7eaf2; --muted: #aab3c4;
    --dim: #7f8ca4; --line: #2c3a55; --acc: #d9a441; --acc2: #e5bf68;
    --bad: #d07e6f; --good: #6fae8c;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--font); display: grid; place-items: center; padding: 24px;
  }
  a { color: var(--acc2); }
  a:hover { color: var(--acc); }
  .card { width: 100%; max-width: 380px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 34px; }
  .mark {
    width: 26px; height: 26px; border: 1px solid var(--acc); border-radius: 5px;
    display: grid; place-items: center; font: 600 10px var(--font); color: var(--acc);
  }
  .wordmark { font: 600 14px var(--font); letter-spacing: .14em; text-transform: uppercase; }
  h1 { font: 500 22px var(--font); margin: 0 0 6px; }
  .sub { font: 400 12.5px var(--font); color: var(--dim); margin-bottom: 26px; line-height: 1.5; }
  label {
    display: block; font: 600 8.5px var(--font); letter-spacing: .13em;
    text-transform: uppercase; color: var(--acc2); margin-bottom: 6px;
  }
  input {
    width: 100%; background: transparent; border: 1px solid var(--line); border-radius: 4px;
    color: var(--text); font: 400 13px var(--font); padding: 10px 11px; margin-bottom: 16px;
  }
  input:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; border-color: var(--acc); }
  button {
    width: 100%; font: 500 12.5px var(--font); color: var(--bg); background: var(--acc);
    border: 1px solid var(--acc); border-radius: 4px; padding: 11px; cursor: pointer;
  }
  button:hover { background: var(--acc2); border-color: var(--acc2); }
  button:disabled { opacity: .5; cursor: default; }
  .alt {
    background: none; color: var(--dim); border: none; margin-top: 14px;
    font: 400 11.5px var(--font); padding: 6px;
  }
  .alt:hover { color: var(--text); background: none; }
  .msg {
    font: 400 11.5px var(--font); line-height: 1.5; padding: 10px 12px;
    border-radius: 4px; margin-bottom: 18px; display: none;
  }
  .msg.err { display: block; color: var(--bad); border: 1px solid var(--bad); }
  .msg.ok  { display: block; color: var(--good); border: 1px solid var(--good); }
  .foot { margin-top: 30px; font: 400 10.5px var(--font); color: var(--dim); line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="mark">ES</div>
    <div class="wordmark">Easy Shop</div>
  </div>

  <h1 id="title">Sign in</h1>
  <div class="sub" id="subtitle">Your shop, its files and everything on the board.</div>

  <div class="msg" id="msg"></div>

  <form id="form" autocomplete="on">
    <div id="pwFields">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <div id="codeFields" style="display:none">
      <label for="code">Access code</label>
      <input id="code" name="code" type="text" autocomplete="off" maxlength="8" style="letter-spacing:.2em;text-transform:uppercase">
    </div>

    <button type="submit" id="submit">Sign in</button>
  </form>

  <button class="alt" id="toggle" type="button">Use an access code instead</button>

  <div class="foot" id="foot"></div>
</div>

<script>
(function () {
  var mode = 'password';
  var form = document.getElementById('form');
  var msg = document.getElementById('msg');
  var submit = document.getElementById('submit');
  var toggle = document.getElementById('toggle');

  function say(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + (kind || 'err');
  }

  toggle.addEventListener('click', function () {
    mode = mode === 'password' ? 'code' : 'password';
    document.getElementById('pwFields').style.display = mode === 'password' ? '' : 'none';
    document.getElementById('codeFields').style.display = mode === 'code' ? '' : 'none';
    document.getElementById('email').required = mode === 'password';
    document.getElementById('password').required = mode === 'password';
    toggle.textContent = mode === 'password' ? 'Use an access code instead' : 'Sign in with email and password';
    msg.className = 'msg';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    submit.disabled = true;
    msg.className = 'msg';

    var body = mode === 'password'
      ? { email: document.getElementById('email').value, password: document.getElementById('password').value }
      : { code: document.getElementById('code').value };

    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        submit.disabled = false;
        if (!res.ok) return say(res.j.error || 'Sign-in failed.');

        if (res.j.user.mustChangePassword) {
          say('Signed in. You need to set a new password.', 'ok');
          setTimeout(function () { location.href = '/set-password.html'; }, 600);
          return;
        }
        if (!res.j.companyId && res.j.companies.length > 1) {
          location.href = '/choose.html';
          return;
        }
        if (!res.j.companyId && res.j.isPlatformOwner) {
          location.href = '/platform.html';
          return;
        }
        if (!res.j.companyId) {
          return say('Your account is not attached to a shop yet.');
        }
        location.href = '/board.html';
      })
      .catch(function () {
        submit.disabled = false;
        say('Could not reach the server.');
      });
  });

  fetch('/api/me').then(function (r) {
    if (r.ok) return r.json();
    throw new Error('anon');
  }).then(function (me) {
    if (me.company) location.href = '/board.html';
    else if (me.isPlatformOwner) location.href = '/platform.html';
  }).catch(function () { /* not signed in — stay here */ });
})();
</script>
</body>
</html>
